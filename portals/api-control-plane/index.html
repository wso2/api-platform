<!doctype html>
<html lang="en">
  <head>
    <!-- Runtime environment variables, matching choreo-console bootstrap order. -->
    <script src="%BASE_URL%api-platform.env.config.js"></script>
    <script src="%BASE_URL%api-platform.common.config.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      One icon link, switched by script. Browsers differ on `media` for icon links (Firefox ignores
      it and uses the last link), so the theme is read here instead. Light browser theme: the
      dark-navy ICO (also the no-script default). Dark browser theme: the white ICO.
    -->
    <link id="app-favicon" rel="icon" href="%BASE_URL%icons/favicon-light.ico" sizes="any" />
    <script>
      (function () {
        var link = document.getElementById('app-favicon');
        var query = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (!link || !query) return;
        var light = '%BASE_URL%icons/favicon-light.ico';
        var dark = '%BASE_URL%icons/favicon.ico';
        var apply = function () {
          link.setAttribute('href', query.matches ? dark : light);
        };
        apply();
        if (query.addEventListener) query.addEventListener('change', apply);
        else if (query.addListener) query.addListener(apply);
      })();
    </script>
    <title>Choreo API Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
