[api_control_plane]

domain = '{{ env "APIP_ACP_DOMAIN" "localhost:8082" }}'

[api_control_plane.server.http]

enabled = '{{ env "APIP_ACP_SERVER_HTTP_ENABLED" "true" }}'
port    = '{{ env "APIP_ACP_SERVER_HTTP_PORT" "8082" }}'

[api_control_plane.server.https]

enabled = '{{ env "APIP_ACP_SERVER_HTTPS_ENABLED" "false" }}'


[api_control_plane.logging]

level = '{{ env "APIP_ACP_LOGGING_LEVEL" "info" }}'   # debug | info | warn | error


[api_control_plane.control_plane]

url             = '{{ env "APIP_ACP_CONTROL_PLANE_URL" "https://localhost:9243" }}'
# Secure by default: a deployment that sets a real control-plane URL keeps
# certificate verification unless it explicitly opts out. `make bff-run`
# overrides this to true for its own local-dev default (a self-signed cert),
# not this file — see the Makefile.
tls_skip_verify = '{{ env "APIP_ACP_CONTROL_PLANE_TLS_SKIP_VERIFY" "false" }}'


[api_control_plane.policy_hub]

# Public catalog URL exposed to the browser at runtime, including production builds.
base_url = '{{ env "APIP_ACP_POLICY_HUB_BASE_URL" "" }}'


[api_control_plane.session]

# Local dev runs the BFF over plain HTTP (no cert generation set up for this
# portal yet) — a Secure cookie would never be sent back by the browser.
# Never set this to false for a deployment reachable over a real network.
[api_control_plane.session.cookie]
secure = '{{ env "APIP_ACP_SESSION_COOKIE_SECURE" "false" }}'


[api_control_plane.auth]

mode = '{{ env "APIP_ACP_AUTH_MODE" "basic" }}'

# Every field below exists so the BFF stays IdP-agnostic: a standards-conformant
# IdP (Asgardeo, Keycloak) only needs enabled/authority/client_id/client_secret/
# redirect_url/scope; a non-conformant IdP (WSO2 Thunder: bare-name issuer, no
# discovery document) additionally uses the discovery/endpoint-override/
# client_auth_method knobs. See bff/internal/config/config.go's OIDCConfig.
[api_control_plane.auth.oidc]

enabled                  = '{{ env "APIP_ACP_AUTH_OIDC_ENABLED" "false" }}'
# Discovery base URL: {authority}/.well-known/openid-configuration.
authority                = '{{ env "APIP_ACP_AUTH_OIDC_AUTHORITY" "" }}'
# Expected `iss` claim. Defaults to authority when empty; deliberately never
# required to be a URL — some IdPs (Thunder) issue a bare name.
issuer                   = '{{ env "APIP_ACP_AUTH_OIDC_ISSUER" "" }}'
discovery                = '{{ env "APIP_ACP_AUTH_OIDC_DISCOVERY" "true" }}'
# Only consulted when discovery is false — every one must be set explicitly then.
authorization_endpoint   = '{{ env "APIP_ACP_AUTH_OIDC_AUTHORIZATION_ENDPOINT" "" }}'
token_endpoint           = '{{ env "APIP_ACP_AUTH_OIDC_TOKEN_ENDPOINT" "" }}'
end_session_endpoint     = '{{ env "APIP_ACP_AUTH_OIDC_END_SESSION_ENDPOINT" "" }}'
userinfo_endpoint        = '{{ env "APIP_ACP_AUTH_OIDC_USERINFO_ENDPOINT" "" }}'
jwks_uri                 = '{{ env "APIP_ACP_AUTH_OIDC_JWKS_URI" "" }}'
client_id                = '{{ env "APIP_ACP_AUTH_OIDC_CLIENT_ID" "" }}'
client_secret            = '{{ env "APIP_ACP_AUTH_OIDC_CLIENT_SECRET" "" }}'
# "client_secret_post" (default) | "client_secret_basic" | "none" for a public
# client driven server-side by this BFF (PKCE still protects the flow).
client_auth_method       = '{{ env "APIP_ACP_AUTH_OIDC_CLIENT_AUTH_METHOD" "client_secret_post" }}'
# Must equal the IdP-registered redirect URI, pointing at /api/auth/callback.
redirect_url             = '{{ env "APIP_ACP_AUTH_OIDC_REDIRECT_URL" "" }}'
post_logout_redirect_url = '{{ env "APIP_ACP_AUTH_OIDC_POST_LOGOUT_REDIRECT_URL" "" }}'
# No `scope` key here on purpose: Load overlays this file's parsed keys onto
# defaultConfig() unconditionally (mapstructure decode, not an omitempty-aware
# merge), so a present-but-empty key would silently blank out the built-in
# default (every ap:* scope Platform API authorizes against — see
# defaultOIDCScopes in bff/internal/config/config.go) for every deployment that
# doesn't set APIP_ACP_AUTH_OIDC_SCOPE. An IdP that genuinely needs a narrower
# set (and can't grant the full ap:* list) should add this key in its own
# mounted config.toml overlay, keeping offline_access in the override.

# Which claim names carry each user/org field — for BOTH auth modes (OIDC tokens
# from the configured IdP, and the JWTs Platform API's file-based login signs).
# Values may be dotted paths (e.g. "realm_access.roles") to reach a nested claim.
# Must agree with Platform API's own [auth.claim_mappings] key for key. Defaults
# below match Platform API's file-based JWT; override the ones an external IdP
# names differently (e.g. WSO2 Thunder emits ouId/ouName/ouHandle for org).
[api_control_plane.auth.claim_mappings]

username   = '{{ env "APIP_ACP_AUTH_CLAIM_MAPPINGS_USERNAME" "username" }}'
email      = '{{ env "APIP_ACP_AUTH_CLAIM_MAPPINGS_EMAIL" "email" }}'
roles      = '{{ env "APIP_ACP_AUTH_CLAIM_MAPPINGS_ROLES" "roles" }}'
scope      = '{{ env "APIP_ACP_AUTH_CLAIM_MAPPINGS_SCOPE" "scope" }}'
organization = '{{ env "APIP_ACP_AUTH_CLAIM_MAPPINGS_ORGANIZATION" "organization" }}'
org_name   = '{{ env "APIP_ACP_AUTH_CLAIM_MAPPINGS_ORG_NAME" "org_name" }}'
org_handle = '{{ env "APIP_ACP_AUTH_CLAIM_MAPPINGS_ORG_HANDLE" "org_handle" }}'

# Authorization — determines the effective scopes reported to the SPA through
# /api/session. Must match [platform_api.auth.authorization]. The Platform API
# enforces authorization; a mismatch may block permitted actions or expose
# actions that fail with 403.
[api_control_plane.auth.authorization]

# "scope" (default) reads the token's scope claim. "role" expands the roles claim
# (claim_mappings.roles above) through the grant table below — required for any IdP
# that cannot mint the platform's ap:* scopes (Microsoft Entra ID, a role-based
# WSO2 Thunder setup).
mode                  = '{{ env "APIP_ACP_AUTH_AUTHORIZATION_MODE" "scope" }}'
# Path to role-to-scope-mapping.yaml. Required when mode = "role" (startup fails
# otherwise). Mount the SAME file the Platform API reads, so the console and the API
# cannot disagree about what a role grants. Ignored in scope mode.
role_to_scope_mapping = '{{ env "APIP_ACP_AUTH_AUTHORIZATION_ROLE_TO_SCOPE_MAPPING" "" }}'

# ---------------------------------------------------------------------------
# Gateway relay
# ---------------------------------------------------------------------------
# The Test page's Swagger console sends its try-out requests through the BFF
# rather than straight at the gateway, which is what makes them work at all
# when the gateway is a different origin (every deployment), speaks plain http
# from an https portal, or sits on a cluster-internal address the browser
# cannot route to. The browser never names a URL: it names the API and the
# gateway, and the BFF resolves the address through Platform API using the
# caller's own token. See bff/internal/gatewayrelay.
#
# Each value below is a limit that lets this feature ship enabled. To turn the
# feature off, set `enabled = false` rather than relaxing them. Each default
# matches the built-in value in bff/internal/config/default_config.go. Load
# overlays the parsed keys unconditionally, so a present-but-empty key replaces
# the built-in default instead of falling back to it.
[api_control_plane.gateway_relay]

enabled            = '{{ env "APIP_ACP_GATEWAY_RELAY_ENABLED" "true" }}'
# One relayed call, end to end. The route's own write deadline sits just above
# this, so a stuck gateway is caught here rather than by the outer bound.
request_timeout    = '{{ env "APIP_ACP_GATEWAY_RELAY_REQUEST_TIMEOUT" "30s" }}'
# Bounds the decoded request body. The JSON envelope carrying it is allowed to
# be correspondingly larger, since a binary body travels base64-encoded.
max_request_bytes  = '{{ env "APIP_ACP_GATEWAY_RELAY_MAX_REQUEST_BYTES" "2097152" }}'   # 2 MiB
# Hitting this truncates the response body and says so, rather than failing the
# call — a partial response is more use to someone testing an API than an error.
max_response_bytes = '{{ env "APIP_ACP_GATEWAY_RELAY_MAX_RESPONSE_BYTES" "8388608" }}'  # 8 MiB
# Relayed calls in flight at once, and how many may queue for a slot before new
# ones are rejected with 503. The queue is bounded on purpose: an unbounded one
# in front of a bounded pool is only delayed memory growth.
max_concurrent     = '{{ env "APIP_ACP_GATEWAY_RELAY_MAX_CONCURRENT" "32" }}'
max_pending        = '{{ env "APIP_ACP_GATEWAY_RELAY_MAX_PENDING" "64" }}'
# How long a resolved target is cached before Platform API is queried again.
resolve_cache_ttl  = '{{ env "APIP_ACP_GATEWAY_RELAY_RESOLVE_CACHE_TTL" "60s" }}'
resolve_cache_size = '{{ env "APIP_ACP_GATEWAY_RELAY_RESOLVE_CACHE_SIZE" "1024" }}'
# PEM bundle to trust for gateway certificates, appended to the system roots.
ca_file            = '{{ env "APIP_ACP_GATEWAY_RELAY_CA_FILE" "" }}'
# Dev/demo only; keep this operator-controlled, not browser-selectable.
# Prefer ca_file.
tls_skip_verify    = '{{ env "APIP_ACP_GATEWAY_RELAY_TLS_SKIP_VERIFY" "false" }}'

# Where the relay may connect.
#
# Target resolution is the primary containment — the relay only ever dials a
# gateway Platform API named as this API's deployed gateway, for this caller.
# This block is the second layer, and it is what holds if the first is ever
# weakened. A gateway's endpoint is tenant-settable data, so these settings are
# how a deployment says what a gateway address is allowed to look like.
#
#Two rules, and that is the whole model:
#   1. the always-refused ranges below win over any allow_hosts entry.
#   2. nothing is reachable unless an allow_hosts entry matches; an empty
#      list refuses every target.
#
# There is deliberately no setting that re-opens something deny closed.
#
# ALWAYS REFUSED, not configurable: link-local (where the 169.254.169.254 cloud
# metadata endpoint lives), the unspecified address, multicast/broadcast, and
# the IPv6 ranges that translate onward to IPv4 (6to4 2002::/16, NAT64
# 64:ff9b::/96 — these reach an IPv4 address without matching an IPv4 denylist
# entry naming it).
[api_control_plane.gateway_relay.egress]

# "production" (default, including when omitted) or "development".
#
# Production rejects private, loopback, and carrier-grade NAT addresses, as
# well as IP-literal hosts. This ensures allow_hosts governs target selection.
#
# Development permits these addresses for gateways running on localhost or a
# ClusterIP. It does not relax the non-configurable restrictions below; the
# metadata endpoint remains unreachable.
environment = '{{ env "APIP_ACP_GATEWAY_RELAY_EGRESS_ENVIRONMENT" "production" }}'

# Complete set of targets the relay may dial. An empty list refuses all requests
# with TARGET_NOT_ALLOWED.
#
# Entries use "[scheme://]host[:port]":
#
#   gw.example.com                 any scheme/port
#   https://gw.example.com         https, any port
#   gw.example.com:8443            any scheme, port 8443
#   https://gw.example.com:8443    exact combination
#
# Hosts may contain "*" to match any run of characters:
#
#   *.gw.example.com    a.gw.example.com, a.b.gw.example.com
#                       not gw.example.com or evilgw.example.com
#   gw-*.example.com    gw-eu.example.com, gw-us.example.com
#   *                   every host; use deliberately
#
# Prefer narrow entries. Broad private-network patterns can expose other
# in-cluster services; pinning the port helps distinguish the gateway.
#
# allow_hosts = ["https://*.gw.svc.cluster.local:9443", "https://gw.api.example.com"]

# Always refused, regardless of allow_hosts: link-local, unspecified,
# multicast/broadcast, and IPv6 prefixes that embed IPv4 addresses. Checked
# against every resolved address at dial time.
allow_hosts = [ "https://localhost:8443"]
