# AI Workspace + Platform API — standalone release compose file. See README.md
# for usage. Each service's `profiles:` list names only itself — never a sibling
# pack's profile — so every profile can be enabled independently; combinations
# come from COMPOSE_PROFILES/--profile listing multiple names, not from one service
# pulling in another's profile.

services:

  platform-api:
    image: ghcr.io/wso2/api-platform/platform-api:0.14.0-SNAPSHOT
    restart: unless-stopped
    profiles: ["platform-api"]
    command: ["-config", "/etc/platform-api/config.toml"]
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    volumes:
      - ../../platform-api/config/config.toml:/etc/platform-api/config.toml:ro
      - ../../platform-api/resources/role-to-scope-mapping.yaml:/etc/platform-api/role-to-scope-mapping.yaml:ro
      - platform-api-data:/app/data
      - ./resources/certificates:/app/data/certs:ro
      - ./resources/keys:/etc/platform-api/keys:ro
    ports:
      - "9243:9243"
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:9243/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  ai-workspace:
    image: ghcr.io/wso2/api-platform/ai-workspace:1.0.0
    restart: unless-stopped
    profiles: ["ai-workspace"]
    depends_on:
      platform-api:
        condition: service_healthy
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    volumes:
      - ./configs/config.toml:/etc/ai-workspace/config.toml:ro
      - ../../platform-api/resources/role-to-scope-mapping.yaml:/etc/ai-workspace/role-to-scope-mapping.yaml:ro
      - ./resources/certificates:/etc/ai-workspace/tls:ro
    ports:
      - "9643:9643"
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:9643/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api-portal:
    image: ghcr.io/wso2/api-platform/api-portal:1.0.0-SNAPSHOT
    restart: unless-stopped
    profiles: ["api-portal"]
    depends_on:
      platform-api:
        condition: service_healthy
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
      - api-portal-data:/app/data
      - ./resources/certificates:/etc/api-portal/tls:ro
      - ./resources/keys/jwt_public.pem:/etc/api-portal/keys/jwt_public.pem:ro
      - ./resources/keys/api-portal-encryption.key:/etc/api-portal/keys/encryption.key:ro
      - ./resources/keys/api-portal-session-secret:/etc/api-portal/keys/session-secret:ro
    ports:
      - "9543:9543"
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:9543/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  platform-api-data:
    driver: local
  api-portal-data:
    driver: local
