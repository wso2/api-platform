# SQL Server fixture for the multi-tenancy REST spec only (make test-rest-api-mssql-multi-tenancy).
# It runs multi-tenancy/multi-tenancy.spec.js against the same three instances as the Postgres
# fixture — provisioning, its replica on the same database, and strict — which covers
# the SQL Server-specific paths this feature relies on: concurrent claims and
# provisioning races under row locking. The rest of the REST suite is not run here.
#
# MSSQL_IMAGE: SQL Server 2022 by default; the Makefile switches to azure-sql-edge on
# arm64 hosts, where the SQL Server image does not run.

services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: &sa-password "ApiPortal#IT2026"
    networks:
      - it-api-portal-network

  mssql-init:
    image: node:24-alpine
    depends_on:
      - mssql
    working_dir: /init
    environment:
      MSSQL_HOST: mssql
      MSSQL_SA_PASSWORD: *sa-password
    volumes:
      - ./configs/mssql-multi-tenancy-init.js:/init/init.js:ro
      - ../database/schema.sqlserver.sql:/schema/schema.sqlserver.sql:ro
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent mssql@12.7.2 >/dev/null && node init.js"]
    networks:
      - it-api-portal-network

  api-portal-multi-tenancy:
    image: ${DOCKER_REGISTRY:-ghcr.io/wso2/api-platform}/api-portal:test
    command: ["--config", "/app/configs/multi-tenancy.toml"]
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment: &multi-tenancy-env
      APIP_AP_DATABASE_HOST: mssql
      APIP_AP_DATABASE_PORT: 1433
      APIP_AP_DATABASE_DRIVER: mssql
      APIP_AP_DATABASE_USER: sa
      APIP_AP_DATABASE_PASSWORD: *sa-password
      APIP_AP_DATABASE_NAME: api_portal_multi_tenancy
      APIP_AP_AUTH_ENFORCE_ORG_VALIDATION: "false"
      APIP_AP_AUTH_IDP_SILENT_SSO: "true"
      APIP_AP_AUTH_IDP_CALLBACK_URL: "http://api-portal-multi-tenancy:9543/api-portal/default/callback"
      NODE_EXTRA_CA_CERTS: /etc/api-portal/tls-trust/idp-cert.pem
      APIP_AP_SECURITY_ENCRYPTION_KEY: "7f40672c96fd437dc33550755e218d586014232ceb5b01c9405aab575bcb1f4a"
      APIP_AP_SECURITY_SESSION_SECRET: "527948cfb2478dbd4dfcd9d466df65d8c70511236fe63dba0da0f5385676f593"
    healthcheck: &portal-health
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9543/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes: &multi-tenancy-volumes
      - ./test-config.toml:/app/configs/config.toml:ro
      - ./configs/multi-tenancy-it.toml:/app/configs/multi-tenancy.toml:ro
      - ./.certs/idp-cert.pem:/etc/api-portal/tls-trust/idp-cert.pem:ro
    networks:
      - it-api-portal-network

  api-portal-multi-tenancy-replica:
    image: ${DOCKER_REGISTRY:-ghcr.io/wso2/api-platform}/api-portal:test
    command: ["--config", "/app/configs/multi-tenancy.toml"]
    depends_on:
      api-portal-multi-tenancy:
        condition: service_healthy
    environment: *multi-tenancy-env
    healthcheck: *portal-health
    volumes: *multi-tenancy-volumes
    networks:
      - it-api-portal-network

  api-portal-multi-tenancy-strict:
    image: ${DOCKER_REGISTRY:-ghcr.io/wso2/api-platform}/api-portal:test
    command: ["--config", "/app/configs/multi-tenancy.toml"]
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment:
      <<: *multi-tenancy-env
      APIP_AP_DATABASE_NAME: api_portal_multi_tenancy_strict
      APIP_AP_AUTH_ENFORCE_ORG_VALIDATION: "true"
      APIP_AP_AUTH_IDP_SILENT_SSO: "false"
      APIP_AP_AUTH_IDP_CALLBACK_URL: "http://api-portal-multi-tenancy-strict:9543/api-portal/default/callback"
    healthcheck: *portal-health
    volumes: *multi-tenancy-volumes
    networks:
      - it-api-portal-network

  rest-api-tests:
    image: node:24-alpine
    depends_on:
      api-portal-multi-tenancy:
        condition: service_healthy
      api-portal-multi-tenancy-replica:
        condition: service_healthy
      api-portal-multi-tenancy-strict:
        condition: service_healthy
    working_dir: /rest-api
    environment:
      # global-setup.js waits on this; the multi-tenancy spec is the only one run here.
      API_PORTAL_BASE_URL: "http://api-portal-multi-tenancy:9543"
      API_PORTAL_MULTI_TENANCY_BASE_URL: "http://api-portal-multi-tenancy:9543"
      API_PORTAL_MULTI_TENANCY_REPLICA_BASE_URL: "http://api-portal-multi-tenancy-replica:9543"
      API_PORTAL_MULTI_TENANCY_STRICT_BASE_URL: "http://api-portal-multi-tenancy-strict:9543"
      MOCK_IDP_BASE_URL: "https://rest-api-tests:4510"
      MOCK_IDP_CERT_FILE: /idp-tls/idp-cert.pem
      MOCK_IDP_KEY_FILE: /idp-tls/idp-key.pem
      WEBHOOK_SINK_URL: "http://rest-api-tests:4500"
      MULTI_TENANCY_DB_DIALECT: mssql
      MULTI_TENANCY_DB_HOST: mssql
      MULTI_TENANCY_DB_PORT: 1433
      MULTI_TENANCY_DB_USERNAME: sa
      MULTI_TENANCY_DB_PASSWORD: *sa-password
      MULTI_TENANCY_DB_DATABASE: api_portal_multi_tenancy
    volumes:
      - ./rest-api:/rest-api
      - ./reports:/rest-api/reports
      - ./.certs/idp-cert.pem:/idp-tls/idp-cert.pem:ro
      - ./.certs/idp-key.pem:/idp-tls/idp-key.pem:ro
    networks:
      - it-api-portal-network
    command: ["sh", "-c", "apk add --no-cache python3 make g++ >/dev/null && npm install --no-audit --no-fund && npx jest --runInBand multi-tenancy"]

networks:
  it-api-portal-network:
    driver: bridge
