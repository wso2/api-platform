#
# The PORTAL-side role-to-scope grant table for the IT fixture
# (auth.authorization.role_to_scope_mapping). Read ONLY when the suite runs with
# AUTH_MODE=role; in scope mode the portal reads the token's scope claim instead
# and never consults this file.
#
# Two tables exist because the two components answer different questions:
#
#   roles-platform-api-it.yaml  — platform-api's. Expands each IT account's roles
#                                 into the SCOPE CLAIM of the token it mints.
#   this file                   — the portal's. In role mode the portal ignores
#                                 that scope claim and expands the token's ROLES
#                                 CLAIM through this file instead.
#
# The three real accounts are mirrored EXACTLY, so every spec in the suite holds
# in both modes — that is what lets the whole suite run twice rather than needing
# a mode-specific set of expectations. auth/grant-table-parity.spec.js fails if
# the two files ever drift apart, so this is checked rather than hoped for.
# Regenerate after changing platform-api's table; do not hand-edit these three.
#
# dp_narrow_it is the deliberate exception — see its comment below.
#
# Every dp:* scope must be declared in docs/api-portal-openapi-spec-v0.9.yaml; the
# portal validates this file against the spec at startup and refuses to boot on an
# unknown one, so a typo fails the fixture loudly.
# --------------------------------------------------------------------

