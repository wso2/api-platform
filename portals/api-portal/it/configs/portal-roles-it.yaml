  # The one role deliberately NOT mirrored, and the only reason this file can
  # prove anything scope mode cannot.
  #
  # platform-api grants dp_narrow_it the full developer scope set, including
  # dp:application:create — so its token's scope claim permits creating an
  # application. Here it gets read-only. The same account therefore succeeds in
  # scope mode and is refused in role mode, which is exactly the assertion pair in
  # auth/authorization-mode.spec.js: proof that role mode IGNORES the scope claim
  # rather than merging it, and that a caller cannot widen a role's grant by
  # obtaining extra scopes from their issuer.
  #
  # No other spec uses this account, so the divergence costs the suite nothing.
  - name: dp_narrow_it
    scopes:
      - dp:api:read
      - dp:api_content:read
      - dp:mcp_server:read
      - dp:mcp_server_content:read
      - dp:organization:read
      - dp:organization_content:read
      - dp:subscription_plan:read
      - dp:view:read
      - dp:label:read
