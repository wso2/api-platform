# Layered on top of test-config.toml (passed as a second --config) for the multi-tenancy
# portal instances: IDP mode against the suite's mock IDP (rest-api/support/mock-idp.js,
# served by the rest-api-tests container over HTTPS) and multi-tenancy mode.
# enforce_org_validation comes from the environment so the
# same file drives both the provisioning instance and the strict one.

[api_portal.auth]
mode = "idp"
idp_org_id = "default"
enforce_org_validation = '{{ env "APIP_AP_AUTH_ENFORCE_ORG_VALIDATION" "false" }}'

[api_portal.auth.claim_mappings]
organization = "org_id"
org_name = "org_name"
org_handle = "org_handle"
roles = "roles"
groups = "groups"

[api_portal.auth.idp]
issuer = "https://rest-api-tests:4510/oauth2/token"
authorization_url = "https://rest-api-tests:4510/oauth2/authorize"
token_url = "https://rest-api-tests:4510/oauth2/token"
jwks_url = "https://rest-api-tests:4510/oauth2/jwks"
client_id = "portal-it-client"
client_secret = "portal-it-secret"
audience = "portal-it-client"
callback_url = '{{ env "APIP_AP_AUTH_IDP_CALLBACK_URL" "http://api-portal-multi-tenancy:9543/api-portal/default/callback" }}'
scope = "openid profile email"
# On for the provisioning instance (the shipped default), off for the strict one.
silent_sso = '{{ env "APIP_AP_AUTH_IDP_SILENT_SSO" "false" }}'

[api_portal.auth.authorization]
mode = "role"
role_to_scope_mapping = "./resources/role-to-scope-mapping.yaml"
page_role_validation = true

[api_portal.auth.authorization.portal_roles]
admin = "ap_admin"
subscriber = "ap_subscriber"

[api_portal.multi_tenancy]
enabled = true

[api_portal.webhooks.delivery]
poll_interval_ms = 1000
