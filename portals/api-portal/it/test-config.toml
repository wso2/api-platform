# Integration Test Configuration
#
# Shared by docker-compose.test.yaml and docker-compose.test.postgres.yaml — mounted
# at /app/configs/config.toml in both. Settings that are identical across both DB
# variants live here; settings that differ (database connection, network hostnames)
# stay as APIP_AP_* env vars in each compose file's environment: block.
#
# There is no automatic APIP_AP_* environment-variable override (see
# src/config/configLoader.js / configs/config.toml) — an env var set in either
# compose file's environment: block only takes effect where a key below
# explicitly references it via a {{ env "..." "default" }} token. Every key
# that either compose file overrides MUST have a matching token here, or the
# override is silently ignored and the built-in default
# (src/config/configDefaults.js) is used instead.

[api_portal.server.https]
# Use plain HTTP inside the test network so Cypress doesn't need to trust a cert.
enabled = false

[api_portal.logging]
console_only = true

[api_portal.database]
# driver/path cover docker-compose.test.yaml (SQLite); host/port/user/password/name
# cover docker-compose.test.postgres.yaml (PostgreSQL) — each compose file only sets
# the env vars relevant to its own variant, so the other side's tokens just resolve
# to these defaults, unused.
driver   = '{{ env "APIP_AP_DATABASE_DRIVER" "sqlite" }}'
path     = '{{ env "APIP_AP_DATABASE_PATH" "./data/api-portal-it.db" }}'
host     = '{{ env "APIP_AP_DATABASE_HOST" "localhost" }}'
port     = '{{ env "APIP_AP_DATABASE_PORT" "5432" }}'
user     = '{{ env "APIP_AP_DATABASE_USER" "postgres" }}'
password = '{{ env "APIP_AP_DATABASE_PASSWORD" "" }}'
name     = '{{ env "APIP_AP_DATABASE_NAME" "api_portal" }}'

[api_portal.security]
# Required — portal fails closed at startup without these.
encryption_key = '{{ env "APIP_AP_SECURITY_ENCRYPTION_KEY" }}'
session_secret = '{{ env "APIP_AP_SECURITY_SESSION_SECRET" }}'

[api_portal.organization]
# The single organization each portal instance serves. Tokenized because the
# fixture runs a SECOND instance (api-portal-other-org) off this same file with a
# handle that deliberately does NOT match platform-api's org, to exercise the
# login-time organization-mismatch rejection.
handle       = '{{ env "APIP_AP_ORGANIZATION_HANDLE" "default" }}'
display_name = '{{ env "APIP_AP_ORGANIZATION_DISPLAY_NAME" "Default" }}'
portal_id    = '{{ env "APIP_AP_ORGANIZATION_PORTAL_ID" "default_portal_id" }}'
auto_create_subscription_plans = true

# Most of the suite authorizes against the dp:* scopes the Platform API sidecar mints
# into each token's scope claim — its own grant table (configs/roles-platform-api-it.yaml)
# is where the three IT accounts' privileges are defined. That is scope mode by
# definition, so it is the default here rather than the shipped "role": role mode would
# expand the dp_*_it role names against the PORTAL's grant table, and the table baked
# into the image does not define them, so every REST assertion would 403.
#
# Tokenized, not hardcoded, because the fixture also runs a THIRD portal instance
# (api-portal-role-mode) off this same file with mode = "role" and a grant table that
# does define those roles (configs/portal-roles-role-mode-it.yaml) — role mode is the
# shipped default in configs/config.toml, so leaving it unexercised meant the suite
# never covered the configuration most deployments actually run. Driven by
# rest-api/auth/role-mode-authorization.spec.js.
[api_portal.auth.authorization]
mode = '{{ env "APIP_AP_AUTH_AUTHORIZATION_MODE" "scope" }}'
# Only read in role mode. The default points at the copy baked into the image so the
# scope-mode instances resolve a real path; the role-mode instance overrides it with
# its mounted IT table.
role_to_scope_mapping = '{{ env "APIP_AP_AUTH_AUTHORIZATION_ROLE_TO_SCOPE_MAPPING" "./resources/role-to-scope-mapping.yaml" }}'

[api_portal.auth.local]
# File-based (local) auth against the Platform API sidecar. Host is identical in
# both DB variants; tls_skip_verify accepts its self-signed cert inside the test network.
platform_api_url = "https://platform-api:9243"
tls_skip_verify = true
# Path to the public half of the RS256 keypair `make ensure-certs` generates —
# the same file platform-api reads as its auth.jwt.private_key's counterpart.
public_key_path = "/etc/api-portal/keys/jwt_public.pem"
