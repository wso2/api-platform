# Integration test Docker Compose — PostgreSQL variant.
#
# Usage (via Makefile):
#   make test-postgres      — run Cypress headlessly against PostgreSQL (CI)
#
# The portal service uses the pre-built image tagged :test (set by make ensure-test-tag).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: api_portal
      POSTGRES_PASSWORD: api_portal
      POSTGRES_DB: api_portal
    volumes:
      # Mount only this dialect's schema file — the whole ../database directory
      # also holds schema.sqlite.sql and schema.sqlserver.sql, and Postgres's
      # docker-entrypoint-initdb.d runs every .sql file it finds there in
      # alphabetical order, so mounting the directory made it also try (and
      # fail on) schema.sqlserver.sql's T-SQL-only syntax.
      - ../database/schema.postgres.sql:/docker-entrypoint-initdb.d/schema.postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_portal -d api_portal"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - it-api-portal-network

  platform-api:
    # Overridable so CI can point this at a freshly built image (make -C platform-api
    # build) instead of the last release — this fixture's config-platform-api-it.toml
    # tracks platform-api's current config schema, which a pinned old release may not
    # understand.
    image: ${PLATFORM_API_IMAGE:-ghcr.io/wso2/api-platform/platform-api:0.14.0-SNAPSHOT}
    command: ["-config", "/etc/platform-api/config-platform-api.toml"]
    environment:
      APIP_CP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    volumes:
      - ./configs/config-platform-api-it.toml:/etc/platform-api/config-platform-api.toml:ro
      - ./configs/roles-platform-api-it.yaml:/etc/platform-api/role-to-scope-mapping.yaml:ro
      - platform-api-data:/app/data
      # TLS pair + RS256 JWT keypair generated once, host-side, by `make
      # ensure-certs` (mirrors ../../scripts/setup.sh's approach for the production
      # compose) — read-only, 644-mode so the container's non-root user can read
      # a host-owned file. Same host dir, two mount points: TLS cert/key.pem
      # under /app/data/certs, jwt_{public,private}.pem under
      # /etc/platform-api/keys (the Platform API's {{ file }} allowlist).
      - ./.certs:/app/data/certs:ro
      - ./.certs:/etc/platform-api/keys:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:9243/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - it-api-portal-network

  api-portal:
    image: ${DOCKER_REGISTRY:-ghcr.io/wso2/api-platform}/api-portal:test
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    volumes:
      - ./test-config.toml:/app/configs/config.toml:ro
      # Public half of the RS256 JWT keypair from `make ensure-certs` — the
      # portal verifies Platform API tokens with it (test-config.toml reads it
      # via {{ file }}). /etc/api-portal is on the portal's file allowlist.
      # Mount only jwt_public.pem, not the whole .certs dir, so the private key
      # (also in .certs, for platform-api) is never exposed to the portal.
      - ./.certs/jwt_public.pem:/etc/api-portal/keys/jwt_public.pem:ro
    environment:
      # DB-agnostic settings (tls/logging/api-key/org/platform-api) live in ./test-config.toml.
      APIP_AP_DATABASE_HOST: postgres
      APIP_AP_DATABASE_PORT: 5432
      APIP_AP_DATABASE_DRIVER: postgres
      APIP_AP_DATABASE_USER: api_portal
      APIP_AP_DATABASE_PASSWORD: api_portal
      APIP_AP_DATABASE_NAME: api_portal
      # portal fails closed at startup without these — fixed test-only values,
      # not meant to be reused outside this CI fixture.
      APIP_AP_SECURITY_ENCRYPTION_KEY: "7f40672c96fd437dc33550755e218d586014232ceb5b01c9405aab575bcb1f4a"
      APIP_AP_SECURITY_SESSION_SECRET: "527948cfb2478dbd4dfcd9d466df65d8c70511236fe63dba0da0f5385676f593"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9543/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - it-api-portal-network

  # A second portal whose organization deliberately does NOT match the one
  # platform-api mints tokens for (`default`, see configs/config-platform-api-it.toml).
  #
  # Every other service in this fixture is matched by construction, so the
  # login-time organization checks — authController.handleLocalLogin's org_handle
  # comparison and passportConfig's IDP equivalent — can never fire there. This
  # instance is what exercises them: admin/admin is a valid platform-api credential,
  # the returned token is correctly signed and unexpired, and it is rejected purely
  # because its org_handle names another organization. See
  # rest-api/auth/foreign-org-login.spec.js.
  #
  # Unlike the SQLite variant (where two better-sqlite3 writers would contend on one
  # file) this shares the `api_portal` database with the instance above — two portals,
  # two organizations, one database, which is the deployment shape the organization
  # pin exists for. Safe because the schema comes from postgres's initdb, not from a
  # migration either instance runs, so there is nothing for them to race on.
  api-portal-other-org:
    image: ${DOCKER_REGISTRY:-ghcr.io/wso2/api-platform}/api-portal:test
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    volumes:
      - ./test-config.toml:/app/configs/config.toml:ro
      - ./.certs/jwt_public.pem:/etc/api-portal/keys/jwt_public.pem:ro
    environment:
      APIP_AP_DATABASE_HOST: postgres
      APIP_AP_DATABASE_PORT: 5432
      APIP_AP_DATABASE_DRIVER: postgres
      APIP_AP_DATABASE_USER: api_portal
      APIP_AP_DATABASE_PASSWORD: api_portal
      APIP_AP_DATABASE_NAME: api_portal
      # The deliberate mismatch. platform-api's org is "default".
      APIP_AP_ORGANIZATION_HANDLE: other-org
      APIP_AP_ORGANIZATION_DISPLAY_NAME: Other Org
      APIP_AP_SECURITY_ENCRYPTION_KEY: "7f40672c96fd437dc33550755e218d586014232ceb5b01c9405aab575bcb1f4a"
      APIP_AP_SECURITY_SESSION_SECRET: "527948cfb2478dbd4dfcd9d466df65d8c70511236fe63dba0da0f5385676f593"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9543/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - it-api-portal-network

  # Role-mode instance — see the extended note on the same service in
  # docker-compose.test.yaml. Differs from `api-portal` only in
  # auth.authorization.mode = "role" plus the grant table that backs it.
  #
  # Runs on its own container-local SQLite database even in the Postgres leg, rather
  # than joining the shared `api_portal` database. Two reasons, and the first is not
  # optional: every portal instance runs a webhook dispatcher and delivery worker that
  # poll the events tables, so instances sharing a database steal each other's
  # deliveries — and each carries its own security.encryption_key, so the thief cannot
  # decrypt the subscriber secret the owner stored, which fails the webhook encryption
  # assertions in api-keys/ and subscriptions/. Second, what this service exists to
  # cover — how a request's effective scopes are derived — is entirely dialect-
  # independent; the Postgres leg exercises the data layer through `api-portal`.
  api-portal-role-mode:
    image: ${DOCKER_REGISTRY:-ghcr.io/wso2/api-platform}/api-portal:test
    depends_on:
      platform-api:
        condition: service_healthy
    volumes:
      - ./test-config.toml:/app/configs/config.toml:ro
      - ./configs/portal-roles-role-mode-it.yaml:/etc/api-portal/portal-roles-role-mode-it.yaml:ro
      - ./.certs/jwt_public.pem:/etc/api-portal/keys/jwt_public.pem:ro
    environment:
      APIP_AP_DATABASE_DRIVER: sqlite
      APIP_AP_DATABASE_PATH: /tmp/api-portal-it-role-mode.db
      APIP_AP_AUTH_AUTHORIZATION_MODE: role
      APIP_AP_AUTH_AUTHORIZATION_ROLE_TO_SCOPE_MAPPING: /etc/api-portal/portal-roles-role-mode-it.yaml
      APIP_AP_SECURITY_ENCRYPTION_KEY: "3d1f8a5c07b94e2d6f0a8c3b5e7d9f1a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b2d"
      APIP_AP_SECURITY_SESSION_SECRET: "9e7c5a3b1d8f6042ae2c4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b2d4f6a"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9543/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - it-api-portal-network

  cypress:
    image: cypress/included:13.17.0
    platform: ${CYPRESS_PLATFORM:-linux/amd64}
    depends_on:
      api-portal:
        condition: service_healthy
    working_dir: /e2e
    shm_size: '2gb'
    environment:
      CYPRESS_BASE_URL: "http://api-portal:9543"
    volumes:
      - ./ui:/e2e
      - ./reports:/e2e/reports
    networks:
      - it-api-portal-network
    command: ["cypress", "run", "--headless", "--browser", "electron"]

  rest-api-tests:
    image: node:24-alpine
    depends_on:
      api-portal:
        condition: service_healthy
      # Named here rather than in the Makefile's explicit `up` service list —
      # compose starts a named service's dependencies automatically, so this is
      # what brings the mismatched instance up for `make test-rest-api-postgres`
      # while keeping it out of the Cypress-only `make test-postgres`.
      api-portal-other-org:
        condition: service_healthy
      api-portal-role-mode:
        condition: service_healthy
    working_dir: /rest-api
    environment:
      API_PORTAL_BASE_URL: "http://api-portal:9543"
      # The second instance, pinned to an organization platform-api does not mint
      # tokens for. auth/foreign-org-login.spec.js skips itself when this is unset.
      API_PORTAL_OTHER_ORG_BASE_URL: "http://api-portal-other-org:9543"
      API_PORTAL_OTHER_ORG_HANDLE: "other-org"
      # The third instance, running auth.authorization.mode = "role".
      # auth/role-mode-authorization.spec.js skips itself when this is unset.
      API_PORTAL_ROLE_MODE_BASE_URL: "http://api-portal-role-mode:9543"
      API_PORTAL_ORG_HANDLE: "default"
      API_PORTAL_ADMIN_USERNAME: "admin"
      API_PORTAL_ADMIN_PASSWORD: "admin"
      API_PORTAL_PUBLISHER_USERNAME: "publisher"
      API_PORTAL_PUBLISHER_PASSWORD: "publisher"
      API_PORTAL_DEVELOPER_USERNAME: "developer"
      API_PORTAL_DEVELOPER_PASSWORD: "developer"
      API_PORTAL_DB_DIALECT: postgres
      API_PORTAL_DB_HOST: postgres
      API_PORTAL_DB_PORT: 5432
      API_PORTAL_DB_USERNAME: api_portal
      API_PORTAL_DB_PASSWORD: api_portal
      API_PORTAL_DB_DATABASE: api_portal
      # Reachable from inside the compose network by the webhook dispatcher.
      WEBHOOK_SINK_URL: "http://rest-api-tests:4500"
      MOCK_TOKEN_ENDPOINT_URL: "http://rest-api-tests:4504"
    volumes:
      - ./rest-api:/rest-api
      - ./reports:/rest-api/reports
    networks:
      - it-api-portal-network
    # better-sqlite3 (an optionalDependency used only by the SQLite variant) is the
    # sole reason this image would need a native build toolchain — skip it here with
    # --omit=optional so the Postgres run needs no apk add python3/make/g++.
    command: ["sh", "-c", "npm install --no-audit --no-fund --omit=optional && npm test"]

networks:
  it-api-portal-network:
    driver: bridge

volumes:
  platform-api-data:
