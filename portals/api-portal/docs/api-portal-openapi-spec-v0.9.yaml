      parameters:
        - $ref: "#/components/parameters/labelId"
      responses:
        "204":
          description: Label deleted successfully.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:label:delete
            - dp:label:manage
  /applications:
    get:
      tags:
        - Applications
      summary: List applications for the authenticated user
      description: Returns all applications owned by the authenticated user in the specified organization.
      operationId: listApplications
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application:read
            - dp:application:manage
    post:
      tags:
        - Applications
      summary: Create an application
      description: >-
        Creates an API Portal application in the specified organization. The request may be JSON, multipart form
        fields, or an application YAML file in the `application` multipart field. An `application.created` webhook
        event is published to the organization's configured webhook subscribers.
      operationId: saveApplication
      requestBody:
        $ref: "#/components/requestBodies/ApplicationMultipartBody"
      responses:
        "201":
          description: Application DTO.
          headers:
            Location:
              description: URL of the created application.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponse"
              example:
                id: my-weather-app
                displayName: Weather App
                description: Application used to call Weather APIs.
                appKeyMappings: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application:create
            - dp:application:manage
  /applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/applicationId"
    get:
      tags:
        - Applications
      summary: Get an application
      description: Returns the details of a single application owned by the authenticated user.
      operationId: getApplication
      responses:
        "200":
          $ref: "#/components/responses/ApplicationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application:read
            - dp:application:manage
    put:
      tags:
        - Applications
      summary: Update an application
      description: >-
        Updates an application owned by the authenticated user in the specified organization. The request may be JSON,
        multipart form fields, or an application YAML file in the `application` multipart field. An `application.updated`
        webhook event is published.
      operationId: updateApplication
      requestBody:
        $ref: "#/components/requestBodies/ApplicationMultipartBody"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application:update
            - dp:application:manage
    delete:
      tags:
        - Applications
      summary: Delete an application
      description: >-
        Deletes an application owned by the authenticated user. Before removing the application record the service will
        make a best-effort attempt to revoke registered OAuth clients with their respective key managers and deletes all
        stored key mappings; failures are logged as warnings and do not abort deletion. An `application.deleted`
        webhook event is published, plus one `apikey.application_updated` event (with a cleared association) per API
        key that was associated with the application.
      operationId: deleteApplication
      responses:
        "200":
          $ref: "#/components/responses/TextMessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application:delete
            - dp:application:manage
  /subscriptions:
    post:
      tags:
        - Subscriptions
      operationId: createSubscription
      summary: Create a subscription
      description: >-
        Creates a subscription for an API. The API must exist in the API Portal and have subscription plans
        enabled. The subscription is owned by the authenticated user.
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionCreateBody"
      responses:
        "201":
          description: Subscription DTO.
          headers:
            Location:
              description: URL of the created subscription.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
              example:
                subscriptionId: sub-12345
                artifactId: weather-api-v1
                subscriptionToken: a3f1e8b2c4d6e8f0a1b3c5d7e9f10b2c4d6e8f0a1b3c5d7e9f10b2c4d6e8f0a1
                subscriptionPlanName: Gold
                status: ACTIVE
                createdBy: alice@example.com
                createdAt: "2026-05-07T08:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription:create
            - dp:subscription:manage
    get:
      tags:
        - Subscriptions
      operationId: listSubscriptions
      summary: List subscriptions
      description: >-
        Lists subscriptions owned by the authenticated user. When `artifactId` is provided, results are additionally filtered
        by the API ID.
      parameters:
        - $ref: "#/components/parameters/artifactIdQueryOptional"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionListResponse"
        "404":
          description: Returned when `artifactId` is provided but does not match an existing API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: RESOURCE_NOT_FOUND
                message: API not found
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription:read
            - dp:subscription:manage
  /subscriptions/{subId}:
    parameters:
      - $ref: "#/components/parameters/subId"
    get:
      tags:
        - Subscriptions
      operationId: getSubscription
      summary: Get a subscription
      description: Retrieves a single subscription by subscription ID.
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription:read
            - dp:subscription:manage
    put:
      tags:
        - Subscriptions
      operationId: updateSubscription
      summary: Update a subscription
      description: Updates the subscription status. Accepts only `ACTIVE` or `INACTIVE`.
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription:update
            - dp:subscription:manage
    delete:
      tags:
        - Subscriptions
      operationId: deleteSubscription
      summary: Delete a subscription
      description: Deletes the subscription and returns a success message.
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription:delete
            - dp:subscription:manage
  /subscriptions/{subId}/change-plan:
    parameters:
      - $ref: "#/components/parameters/subId"
    post:
      tags:
        - Subscriptions
      operationId: changePlan
      summary: Change subscription plan
      description: >-
        Changes the subscription plan in-place. The subscription UUID and token remain unchanged;
        only the plan is updated. A `subscription.plan_changed` webhook event is published to
        the organization's configured webhook subscribers.
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionChangePlanBody"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription:update
            - dp:subscription:manage
  /subscriptions/{subId}/regenerate-token:
    parameters:
      - $ref: "#/components/parameters/subId"
    post:
      tags:
        - Subscriptions
      operationId: regenerateSubscriptionToken
      summary: Regenerate subscription token
      description: >-
        Regenerates the subscription token, immediately invalidating the old one. A
        `subscription.token_regenerated` webhook event is published to the organization's
        configured webhook subscribers so they can update the token at the gateway.
        The new plaintext token is returned in the response.
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription:manage
  /api-keys:
    get:
      tags:
        - API Keys
      operationId: listAllApiKeys
      summary: List all API keys for the current user
      description: >-
        Lists every API key created by the authenticated user across all APIs in the
        organization. Powers the API Portal's global "API Keys" page. Each item
        additionally carries the owning API's name, version, and type. Secret material
        is never returned.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/ApiKeyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:read
            - dp:api_key:manage
  /apis/{apiId}/api-keys/generate:
    parameters:
      - $ref: "#/components/parameters/apiId"
    post:
      tags:
        - API Keys
      operationId: generateApiKey
      summary: Generate an API key
      description: >-
        Generates an API key stored in the API Portal (devportal is source of truth). The plaintext secret is
        returned once in the response and never persisted. A `apikey.generated` webhook event is published to the
        organization's configured webhook subscribers so they can register the key (e.g. with a gateway). Key `id`
        is optional — a UUID handle is generated when it is omitted; when provided it must match
        `^[a-z0-9][a-z0-9_-]{0,127}$`. `expiresAt` must include a timezone when sent as an ISO-8601 string.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyBody"
      responses:
        "201":
          description: Generated API key. The plaintext `key` is returned exactly once.
          headers:
            Location:
              description: URL of the generated API key resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
              example:
                id: weather_prod_key
                displayName: Weather Prod Key
                key: ak_dGhpcyBpcyBub3QgYSByZWFsIGtleQ
                expiresAt: "2026-12-31T23:59:59Z"
                status: ACTIVE
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:create
            - dp:api_key:manage
  /apis/{apiId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/apiId"
    get:
      tags:
        - API Keys
      operationId: listApiKeys
      summary: List API keys
      description: Lists API keys for the given API.
      parameters:
        - $ref: "#/components/parameters/appIdQueryOptional"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/ApiKeyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:read
            - dp:api_key:manage
  /apis/{apiId}/api-keys/regenerate:
    parameters:
      - $ref: "#/components/parameters/apiId"
    post:
      tags:
        - API Keys
      operationId: regenerateApiKey
      summary: Regenerate an API key
      description: >-
        Regenerates the secret for an existing API key identified by `keyId` in the request body. An
        `apikey.regenerated` webhook event is published to the organization's configured webhook subscribers so they
        can invalidate the old secret (e.g. at a gateway). The new plaintext secret is returned once and never persisted.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyRegenerateBody"
      responses:
        "200":
          $ref: "#/components/responses/ApiKeyGenerateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has already been revoked and cannot be regenerated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: CONFLICT
                message: Cannot regenerate a revoked key
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:update
            - dp:api_key:manage
  /apis/{apiId}/api-keys/revoke:
    parameters:
      - $ref: "#/components/parameters/apiId"
    post:
      tags:
        - API Keys
      operationId: revokeApiKey
      summary: Revoke an API key
      description: >-
        Revokes an existing API key identified by `keyId` in the request body. An `apikey.revoked` webhook event is
        published to the organization's configured webhook subscribers so they can immediately reject requests
        carrying the key (e.g. at a gateway).
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyRevokeBody"
      responses:
        "204":
          description: API key revoked successfully.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has already been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: CONFLICT
                message: Key already revoked or not found
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:revoke
            - dp:api_key:manage
  /apis/{apiId}/api-keys/associate:
    parameters:
      - $ref: "#/components/parameters/apiId"
    post:
      tags:
        - API Keys
      operationId: associateApiKeyApplication
      summary: Associate an API key with an application
      description: >-
        Associates (or re-associates) an existing API key with an application, for analytics attribution only — it
        has no effect on the key's validity or authorization. An `apikey.application_updated` webhook event is
        published once for this key, with a payload of `{ key_id, application }`.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyAssociateBody"
      responses:
        "200":
          description: Association updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has already been revoked and cannot be associated with an application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: CONFLICT
                message: Cannot associate a revoked key
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:update
            - dp:api_key:manage
  /apis/{apiId}/api-keys/dissociate:
    parameters:
      - $ref: "#/components/parameters/apiId"
    post:
      tags:
        - API Keys
      operationId: removeApiKeyApplication
      summary: Remove an API key's application association
      description: >-
        Removes the application association from an API key identified by `keyId` in the request body, if any. An
        `apikey.application_updated` webhook event is published once for this key, with `application` set to `null`.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyDissociateBody"
      responses:
        "204":
          description: Association removed (or none existed).
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:update
            - dp:api_key:manage
  /mcp-servers:
    post:
      tags:
        - MCP Servers
      summary: Create MCP server metadata
      description: >-
        Creates API Portal MCP server metadata. Accepts the same metadata input formats as
        `POST /api-portal/api/v0.9/apis` (artifact ZIP, `api.yaml` / `mcp.yaml`, or `metadata` JSON),
        but the created record is always typed `MCP`. An MCP server's contract is its `definition` (tools schema) — the
        tools, resources, and prompts it exposes — not an OpenAPI-style API contract; a `definition` is
        required. Via the JSON `metadata` field, `type` must be
        explicitly `MCP`; an omitted type or any other value is rejected with a 400 (use `POST /api-portal/api/v0.9/apis`).
      operationId: createMcpServer
      requestBody:
        $ref: "#/components/requestBodies/McpServerMultipartBody"
      responses:
        "201":
          $ref: "#/components/responses/McpServerCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server:create
            - dp:mcp_server:manage
    get:
      tags:
        - MCP Servers
      summary: List MCP server metadata
      description: >-
        Lists MCP server metadata for an organization. Mirrors `GET /api-portal/api/v0.9/apis` but only returns MCP-typed
        records.
      operationId: getAllMcpServersForOrganization
      parameters:
        - $ref: "#/components/parameters/searchQuery"
        - $ref: "#/components/parameters/nameQuery"
        - $ref: "#/components/parameters/versionQuery"
        - $ref: "#/components/parameters/tagsQuery"
        - $ref: "#/components/parameters/viewQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/McpServerListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server:read
            - dp:mcp_server:manage
  /mcp-servers/{mcpServerId}:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    get:
      tags:
        - MCP Servers
      summary: Get MCP server metadata
      description: Retrieves a single MCP server metadata record by API Portal MCP server ID.
      operationId: getMcpServer
      responses:
        "200":
          $ref: "#/components/responses/McpServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server:read
            - dp:mcp_server:manage
    put:
      tags:
        - MCP Servers
      summary: Update MCP server metadata
      description: >-
        Updates API Portal MCP server metadata and, when a `definition` is supplied, its stored
        tools schema. `type` is required and immutable — it must stay `MCP`; any other value is rejected with
        `400` via the same resolveTypeOrReject check `POST /mcp-servers` uses. An MCP server's `definition`
        is its tools schema, not an OpenAPI-style API contract.
      operationId: updateMcpServer
      requestBody:
        $ref: "#/components/requestBodies/McpServerMultipartBody"
      responses:
        "200":
          $ref: "#/components/responses/McpServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server:update
            - dp:mcp_server:manage
    delete:
      tags:
        - MCP Servers
      summary: Delete MCP server metadata
      description: Deletes MCP server metadata when the MCP server has no active subscriptions.
      operationId: deleteMcpServer
      responses:
        "200":
          $ref: "#/components/responses/TextMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server:delete
            - dp:mcp_server:manage
  /mcp-servers/{mcpServerId}/assets:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    post:
      tags:
        - MCP Server Content
      summary: Upload MCP server content
