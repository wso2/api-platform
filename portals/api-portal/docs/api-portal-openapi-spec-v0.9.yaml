      operationId: replaceMcpServerContent
      requestBody:
        $ref: "#/components/requestBodies/ContentZipMultipartBody"
      responses:
        "201":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_content:update
            - dp:mcp_server_content:manage
    get:
      tags:
        - MCP Server Content
      summary: Get an MCP server content file
      description: Retrieves a single stored MCP server content file. Mirrors `GET /api-portal/api/v0.9/apis/{apiId}/assets`.
      operationId: getMcpServerContentFile
      security:
        - OAuth2Security:
            - dp:mcp_server_content:read
            - dp:mcp_server_content:manage
      parameters:
        - $ref: "#/components/parameters/contentTypeQuery"
        - $ref: "#/components/parameters/contentFileNameQuery"
      responses:
        "200":
          $ref: "#/components/responses/ContentAssetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - MCP Server Content
      summary: Delete MCP server content files
      description: >-
        Deletes stored MCP server content. Mirrors `DELETE /api-portal/api/v0.9/apis/{apiId}/assets`.
      operationId: deleteMcpServerContentFile
      parameters:
        - $ref: "#/components/parameters/contentTypeQuery"
        - $ref: "#/components/parameters/fileNameQuery"
      responses:
        "204":
          description: MCP server content deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_content:delete
            - dp:mcp_server_content:manage
  /mcp-servers/{mcpServerId}/api-keys/generate:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    post:
      tags:
        - MCP Server Keys
      operationId: generateMcpServerApiKey
      summary: Generate an MCP server API key
      description: >-
        Generates an API key for an MCP server. Mirrors `POST /api-portal/api/v0.9/apis/{apiId}/api-keys/generate`.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyBody"
      responses:
        "201":
          description: Generated API key. The plaintext `key` is returned exactly once.
          headers:
            Location:
              description: URL of the generated API key resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_key:create
            - dp:mcp_server_key:manage
  /mcp-servers/{mcpServerId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    get:
      tags:
        - MCP Server Keys
      operationId: listMcpServerApiKeys
      summary: List MCP server API keys
      description: Lists API keys for the given MCP server. Mirrors `GET /api-portal/api/v0.9/apis/{apiId}/api-keys`.
      parameters:
        - $ref: "#/components/parameters/appIdQueryOptional"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/ApiKeyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_key:read
            - dp:mcp_server_key:manage
  /mcp-servers/{mcpServerId}/api-keys/regenerate:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    post:
      tags:
        - MCP Server Keys
      operationId: regenerateMcpServerApiKey
      summary: Regenerate an MCP server API key
      description: >-
        Regenerates the secret for an existing MCP server API key identified by `keyId` in the request body. Mirrors
        `POST /api-portal/api/v0.9/apis/{apiId}/api-keys/regenerate`.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyRegenerateBody"
      responses:
        "200":
          $ref: "#/components/responses/ApiKeyGenerateResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has already been revoked and cannot be regenerated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: CONFLICT
                message: Cannot regenerate a revoked key
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_key:update
            - dp:mcp_server_key:manage
  /mcp-servers/{mcpServerId}/api-keys/revoke:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    post:
      tags:
        - MCP Server Keys
      operationId: revokeMcpServerApiKey
      summary: Revoke an MCP server API key
      description: >-
        Revokes an existing MCP server API key identified by `keyId` in the request body. Mirrors
        `POST /api-portal/api/v0.9/apis/{apiId}/api-keys/revoke`.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyRevokeBody"
      responses:
        "204":
          description: API key revoked successfully.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has already been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: CONFLICT
                message: Key already revoked or not found
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_key:revoke
            - dp:mcp_server_key:manage
  /mcp-servers/{mcpServerId}/api-keys/associate:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    post:
      tags:
        - MCP Server Keys
      operationId: associateMcpServerApiKeyApplication
      summary: Associate an MCP server API key with an application
      description: >-
        Associates (or re-associates) an existing MCP server API key with an application, for analytics attribution
        only. Mirrors `POST /api-portal/api/v0.9/apis/{apiId}/api-keys/associate`.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyAssociateBody"
      responses:
        "200":
          description: Association updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyApplicationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has already been revoked and cannot be associated with an application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                code: CONFLICT
                message: Cannot associate a revoked key
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_key:update
            - dp:mcp_server_key:manage
  /mcp-servers/{mcpServerId}/api-keys/dissociate:
    parameters:
      - $ref: "#/components/parameters/mcpServerId"
    post:
      tags:
        - MCP Server Keys
      operationId: removeMcpServerApiKeyApplication
      summary: Remove an MCP server API key's application association
      description: >-
        Removes the application association from an MCP server API key identified by `keyId` in the request body, if
        any. Mirrors `POST /api-portal/api/v0.9/apis/{apiId}/api-keys/dissociate`.
      requestBody:
        $ref: "#/components/requestBodies/ApiKeyDissociateBody"
      responses:
        "204":
          description: Association removed (or none existed).
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:mcp_server_key:update
            - dp:mcp_server_key:manage
  /applications/{applicationId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/applicationId"
    get:
      tags:
        - API Keys
      operationId: listApplicationApiKeys
      summary: List API keys associated with an application
      description: >-
        Lists all API keys (across every API) currently associated with the given application. Unlike
        `listApiKeys`, no `apiId` filter is required.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/ApiKeyListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_key:read
            - dp:api_key:manage
  /views:
    post:
      tags:
        - Views
      operationId: addView
      summary: Create a view
      description: >-
        Creates an API Portal view for an organization and associates it with the supplied label names. If
        `name` is omitted, the service stores the view's handle as its name.
      requestBody:
        $ref: "#/components/requestBodies/ViewCreateBody"
      responses:
        "201":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:view:create
            - dp:view:manage
    get:
      tags:
        - Views
      operationId: getAllViews
      summary: List views
      description: Lists all views configured for the organization. Each view includes the label names attached to it.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/ViewsResponse"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:view:read
            - dp:view:manage
  /views/{viewId}:
    parameters:
      - $ref: "#/components/parameters/viewId"
    put:
      tags:
        - Views
      operationId: updateView
      summary: Update a view
      description: >-
        Updates the view handle, display name and/or label associations. When `labels` is supplied, it fully
        replaces the view's label set — labels present in the list are attached and any others are detached.
        Supplying `id` renames the view's handle, which keeps the view's identity (labels, assets and API workflows
        follow it) but invalidates every existing URL built from the old handle. The service returns the accepted
        request payload.
      requestBody:
        $ref: "#/components/requestBodies/ViewUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/ViewUpdateEchoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:view:update
            - dp:view:manage
    get:
      tags:
        - Views
      operationId: getView
      summary: Get a view
      description: Retrieves one view by its `viewId` handle, including the label names attached to that view.
      responses:
        "200":
          $ref: "#/components/responses/ViewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:view:read
            - dp:view:manage
    delete:
      tags:
        - Views
      operationId: deleteView
      summary: Delete a view
      description: >-
        Deletes a view by its `viewId` handle. A missing view is returned as a not-found error. Any view may be
        deleted, including the one seeded as `default` — the portal resolves whichever view remains as its landing
        view. The organization's LAST view cannot be deleted (`400`), since an organization with no views has no
        page to serve. A view that still has API workflows is rejected with `409`; delete those first.
      responses:
        "204":
          description: View deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:view:delete
            - dp:view:manage
  /applications/{applicationId}/generate-keys:
    parameters:
      - $ref: "#/components/parameters/applicationId"
    post:
      tags:
        - Application Keys
      operationId: generateApplicationKeys
      summary: Map an OAuth client_id to an API Portal application
      description: >-
        Maps an OAuth client_id — created directly in the selected key manager — to the specified application. The
        portal does not create or register OAuth clients; it only stores the client_id reference and later proxies
        token requests for it.
      requestBody:
        $ref: "#/components/requestBodies/AppKeyMappingBody"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application_key:create
            - dp:application_key:manage
  /applications/{applicationId}/oauth-keys/{keyMappingId}/generate-token:
    parameters:
      - $ref: "#/components/parameters/applicationId"
      - $ref: "#/components/parameters/keyMappingId"
    post:
      tags:
        - Application Keys
      operationId: generateOAuthKeys
      summary: Generate an OAuth access token
      description: >-
        Generates an access token for an existing application OAuth key mapping. The portal calls the Authorization
        Server token endpoint directly using the client appKeyMappings supplied in `consumerSecret`.
      requestBody:
        $ref: "#/components/requestBodies/OAuthGenerateTokenBody"
      responses:
        "200":
          $ref: "#/components/responses/OAuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application_key:create
            - dp:application_key:manage
  /applications/{applicationId}/oauth-keys/{keyMappingId}:
    parameters:
      - $ref: "#/components/parameters/applicationId"
      - $ref: "#/components/parameters/keyMappingId"
    delete:
      tags:
        - Application Keys
      operationId: revokeOAuthKeys
      summary: Remove an OAuth client_id mapping
      description: >-
        Removes the local client_id mapping for an application. This does not affect the OAuth client in the key
        manager — that client is owned and managed externally.
      responses:
        "200":
          $ref: "#/components/responses/MessageOrGenericResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:application_key:revoke
  /views/{viewId}/api-workflows:
    parameters:
      - $ref: "#/components/parameters/viewId"
    post:
      tags:
        - API Workflows
      operationId: createApiWorkflow
      summary: Create an API workflow
      description: >-
        Creates an API workflow in the selected view. If `id` is omitted, the service generates one from the display name.
        `ARAZZO` content is parsed from JSON or YAML; invalid Arazzo content returns a bad request.
      requestBody:
        $ref: "#/components/requestBodies/APIWorkflowCreateBody"
      responses:
        "201":
          $ref: "#/components/responses/APIWorkflowCreateResponse"
        "400":
          $ref: "#/components/responses/MessageResponse"
        "409":
          $ref: "#/components/responses/MessageResponse"
        "500":
          $ref: "#/components/responses/MessageResponse"
      security:
        - OAuth2Security:
            - dp:api_workflow:create
            - dp:api_workflow:manage
    get:
      tags:
        - API Workflows
      operationId: getAllApiWorkflows
      summary: List API workflows
      description: Lists all API workflows for the selected organization view.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/APIWorkflowListResponse"
        "500":
          $ref: "#/components/responses/MessageResponse"
      security:
        - OAuth2Security:
            - dp:api_workflow:read
            - dp:api_workflow:manage
  /views/{viewId}/api-workflows/{apiWorkflowId}:
    parameters:
      - $ref: "#/components/parameters/viewId"
      - $ref: "#/components/parameters/apiWorkflowId"
    get:
      tags:
        - API Workflows
      operationId: getApiWorkflow
      summary: Get an API workflow
      description: Retrieves a single API workflow by ID from the selected view.
      responses:
        "200":
          $ref: "#/components/responses/APIWorkflowResponse"
        "404":
          $ref: "#/components/responses/MessageResponse"
        "500":
          $ref: "#/components/responses/MessageResponse"
      security:
        - OAuth2Security:
            - dp:api_workflow:read
            - dp:api_workflow:manage
    put:
      tags:
        - API Workflows
      operationId: updateApiWorkflow
      summary: Update an API workflow
      description: Updates API workflow metadata and content for the selected view. Duplicate handles return a conflict.
      requestBody:
        $ref: "#/components/requestBodies/APIWorkflowUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/MessageResponse"
        "404":
          $ref: "#/components/responses/MessageResponse"
        "409":
          $ref: "#/components/responses/MessageResponse"
        "500":
          $ref: "#/components/responses/MessageResponse"
      security:
        - OAuth2Security:
            - dp:api_workflow:update
            - dp:api_workflow:manage
    delete:
      tags:
        - API Workflows
      operationId: deleteApiWorkflow
      summary: Delete an API workflow
      description: Deletes an API workflow from the selected view.
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "404":
          $ref: "#/components/responses/MessageResponse"
        "500":
          $ref: "#/components/responses/MessageResponse"
      security:
        - OAuth2Security:
            - dp:api_workflow:delete
            - dp:api_workflow:manage
  /views/{viewId}/api-workflows/generate-prompt:
    parameters:
      - $ref: "#/components/parameters/viewId"
    post:
      tags:
        - API Workflows
      operationId: generatePrompt
      summary: Generate an API workflow agent prompt
      description: >-
        Generates the default agent prompt text for a proposed API workflow using the supplied name, description, APIs, and
        view context.
      requestBody:
        $ref: "#/components/requestBodies/APIWorkflowPromptBody"
      responses:
        "200":
          $ref: "#/components/responses/APIWorkflowPromptResponse"
        "500":
          $ref: "#/components/responses/MessageResponse"
      security:
        - OAuth2Security:
            - dp:api_workflow:create
            - dp:api_workflow:manage
  /key-managers:
    post:
      tags:
        - Key Managers
      summary: Create a key manager
      description: >-
        Creates a key manager configuration for the organization. If `id` is omitted, the service generates a UUID
        handle. Accepts either a `application/json` body or a `multipart/form-data` upload with a
        `keymanager` field containing the KeyManager YAML file. OAuth applications are created directly in the key
        manager itself, outside the portal — the portal only needs the token endpoint to proxy `client_appKeyMappings`
        token requests.
      operationId: createKeyManager
      requestBody:
        $ref: "#/components/requestBodies/KeyManagerBody"
      responses:
        "201":
          description: Key manager configuration response.
          headers:
            Location:
              description: URL of the created key manager.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyManagerResponseSchema"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:key_manager:create
            - dp:key_manager:manage
    get:
      tags:
        - Key Managers
      summary: List key managers
      operationId: getKeyManagers
      description: >-
        Returns key manager configurations for the organization. Admins receive the full configuration for every key
        manager, including disabled ones; other callers receive the minimal, developer-facing view of enabled key
        managers only, with no admin credentials. Admin appKeyMappings are never included in the response.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/KeyManagerListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      # dp:application_key_mapping:read lets developers list the enabled, credential-free public
      # view — they need the available key managers to map/generate application keys. The
      # handler restricts the full/admin view to admins by role. Scopes are OR-ed, so
      # admins/publishers with dp:key_manager:read still get their existing view.
      security:
        - OAuth2Security:
            - dp:key_manager:read
            - dp:application_key_mapping:read
  /key-managers/{kmId}:
    parameters:
      - $ref: "#/components/parameters/kmId"
    get:
      tags:
        - Key Managers
      summary: Get a key manager
      description: Retrieves a single key manager configuration by ID.
      operationId: getKeyManager
      responses:
        "200":
          $ref: "#/components/responses/KeyManagerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:key_manager:read
            - dp:key_manager:manage
    put:
      tags:
        - Key Managers
      summary: Update a key manager
      description: >-
        Updates an existing key manager configuration. Accepts either a `application/json` body or a
        `multipart/form-data` upload with a `keymanager` YAML file. Only supplied fields are updated; omitted fields
        retain their stored values.
      operationId: updateKeyManager
      requestBody:
        $ref: "#/components/requestBodies/KeyManagerUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/KeyManagerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:key_manager:update
            - dp:key_manager:manage
    delete:
      tags:
        - Key Managers
      summary: Delete a key manager
      description: Deletes a key manager configuration by ID.
      operationId: deleteKeyManager
      responses:
        "204":
          description: Key manager deleted successfully.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:key_manager:delete
            - dp:key_manager:manage
  /webhook-subscribers:
    post:
      tags:
        - Webhook Subscribers
      summary: Create a webhook subscriber
      description: >-
        Registers a webhook subscriber for the organization. Event deliveries (apikey.*, subscription.*, etc.)
        matching the subscriber's events filter are fanned out to its target URL. The `secret`, if provided, is
        encrypted at rest using AES-256-GCM. When `id` is omitted, the server generates a UUID handle; the
        assigned handle is returned as `id` in the response and is what later requests address.
      operationId: createWebhookSubscriber
      requestBody:
        $ref: "#/components/requestBodies/WebhookSubscriberBody"
      responses:
        "201":
          description: Webhook subscriber configuration response.
          headers:
            Location:
              description: URL of the created webhook subscriber.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriberResponseSchema"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:webhook_subscriber:create
            - dp:webhook_subscriber:manage
    get:
      tags:
        - Webhook Subscribers
      summary: List webhook subscribers
      description: Returns all webhook subscriber configurations for the organization. Secrets are never included in the response.
      operationId: getWebhookSubscribers
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/WebhookSubscriberListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:webhook_subscriber:read
            - dp:webhook_subscriber:manage
  /webhook-subscribers/{subscriberId}:
    parameters:
      - $ref: "#/components/parameters/subscriberId"
    get:
      tags:
        - Webhook Subscribers
      summary: Get a webhook subscriber
      description: Retrieves a single webhook subscriber configuration by ID.
      operationId: getWebhookSubscriber
      responses:
        "200":
          $ref: "#/components/responses/WebhookSubscriberResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:webhook_subscriber:read
            - dp:webhook_subscriber:manage
    put:
      tags:
        - Webhook Subscribers
      summary: Update a webhook subscriber
      description: >-
        Updates an existing webhook subscriber configuration. Only supplied fields are updated; omitted fields retain
        their stored values.
      operationId: updateWebhookSubscriber
      requestBody:
        $ref: "#/components/requestBodies/WebhookSubscriberUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/WebhookSubscriberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:webhook_subscriber:update
            - dp:webhook_subscriber:manage
    delete:
      tags:
        - Webhook Subscribers
      summary: Delete a webhook subscriber
      description: Deletes a webhook subscriber configuration by ID.
      operationId: deleteWebhookSubscriber
      responses:
        "204":
          description: Webhook subscriber deleted successfully.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:webhook_subscriber:delete
            - dp:webhook_subscriber:manage
  /webhook-subscribers/{subscriberId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/subscriberId"
    get:
      tags:
        - Webhook Subscribers
      summary: List recent deliveries for a webhook subscriber
      description: Returns the most recent webhook delivery attempts for a single subscriber, newest first.
      operationId: getWebhookSubscriberDeliveries
      responses:
        "200":
          description: Recent delivery attempts for this webhook subscriber.
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookSubscriberDeliverySummary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:webhook_subscriber:read
            - dp:webhook_subscriber:manage
  /webhook-events:
    get:
      tags:
        - Webhook Events
      operationId: listWebhookEvents
      summary: List webhook events
      description: >-
        Returns a paginated list of webhook events for the organization. Each event includes a summary of its delivery
        rows. Requires dp:event:read scope.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - DISPATCHED
              - ALL_DELIVERED
              - FAILED
          description: Filter events by status.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/WebhookEventListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:event:read
  /webhook-events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/eventId"
    get:
      tags:
        - Webhook Events
      operationId: getWebhookEvent
      summary: Get a webhook event
      description: Returns a single webhook event with the full details of all its delivery rows. Requires dp:event:read scope.
      responses:
        "200":
          $ref: "#/components/responses/WebhookEventResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:event:read
components:
  securitySchemes:
    OAuth2Security:
      type: oauth2
      description: >-
        OAuth2/OIDC access token with fine-grained API Portal scopes. Each operation declares the exact
        resource/action scope it requires.
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9443/oauth2/authorize
          tokenUrl: https://localhost:9443/oauth2/token
          scopes:
            dp:organization:read: Read organizations.
            dp:organization:create: Create organizations.
            dp:organization:update: Update organizations.
            dp:organization:delete: Delete organizations.
            dp:organization:manage: Manage organizations (including creating, updating, and deleting).
            dp:organization_content:read: Read organization theme assets.
            dp:organization_content:manage: Apply or reset organization theme.
            dp:api:read: Read API metadata.
            dp:api:create: Create API metadata.
            dp:api:update: Update API metadata.
            dp:api:delete: Delete API metadata.
            dp:api:manage: Manage API metadata.
            dp:api_content:read: Read API content.
            dp:api_content:create: Create API content.
            dp:api_content:update: Update API content.
            dp:api_content:delete: Delete API content.
            dp:api_content:manage: Manage API content.
            dp:mcp_server:read: Read MCP server metadata.
            dp:mcp_server:create: Create MCP server metadata.
            dp:mcp_server:update: Update MCP server metadata.
            dp:mcp_server:delete: Delete MCP server metadata.
            dp:mcp_server:manage: Manage MCP server metadata.
            dp:mcp_server_content:read: Read MCP server content.
            dp:mcp_server_content:create: Create MCP server content.
            dp:mcp_server_content:update: Update MCP server content.
            dp:mcp_server_content:delete: Delete MCP server content.
            dp:mcp_server_content:manage: Manage MCP server content.
            dp:mcp_server_key:read: Read MCP server API keys.
            dp:mcp_server_key:create: Generate MCP server API keys.
            dp:mcp_server_key:update: Regenerate MCP server API keys.
            dp:mcp_server_key:revoke: Revoke MCP server API keys.
            dp:mcp_server_key:manage: Manage MCP server API keys.
            dp:subscription_plan:read: Read subscription plans.
            dp:subscription_plan:create: Create subscription plans.
            dp:subscription_plan:update: Update subscription plans.
            dp:subscription_plan:delete: Delete subscription plans.
            dp:subscription_plan:manage: Manage subscription plans.
            dp:label:read: Read labels.
            dp:label:create: Create labels.
            dp:label:update: Update labels.
            dp:label:delete: Delete labels.
            dp:label:manage: Manage labels.
            dp:application:read: Read applications.
            dp:application:create: Create applications.
            dp:application:update: Update applications.
            dp:application:delete: Delete applications.
            dp:application:manage: Manage applications.
            dp:subscription:read: Read subscriptions.
            dp:subscription:create: Create subscriptions.
            dp:subscription:update: Update subscriptions.
            dp:subscription:delete: Delete subscriptions.
            dp:subscription:manage: Manage subscriptions.
            dp:api_key:read: Read API keys.
            dp:api_key:create: Generate API keys.
            dp:api_key:update: Regenerate API keys.
            dp:api_key:revoke: Revoke API keys.
            dp:api_key:manage: Manage API keys.
            dp:application_key_mapping:read: Read application key mappings.
            dp:application_key_mapping:create: Create application key mappings.
            dp:application_key_mapping:manage: Manage application key mappings.
            dp:view:read: Read views.
            dp:view:create: Create views.
            dp:view:update: Update views.
            dp:view:delete: Delete views.
            dp:view:manage: Manage views.
            dp:application_key:create: Generate and create application keys.
            dp:application_key:update: Update application keys.
            dp:application_key:revoke: Revoke application keys.
            dp:application_key:manage: Manage application keys.
            dp:api_workflow:read: Read API workflows.
            dp:api_workflow:create: Create or generate API workflows.
            dp:api_workflow:update: Update API workflows.
            dp:api_workflow:delete: Delete API workflows.
            dp:api_workflow:manage: Manage API workflows.
            dp:event:read: Read webhook events and delivery details.
            dp:key_manager:read: Read key manager configurations.
            dp:key_manager:create: Create key manager configurations.
            dp:key_manager:update: Update key manager configurations.
            dp:key_manager:delete: Delete key manager configurations.
            dp:key_manager:manage: Manage key manager configurations (including creating, updating, and deleting).
            dp:webhook_subscriber:read: Read webhook subscriber configurations.
            dp:webhook_subscriber:create: Create webhook subscriber configurations.
            dp:webhook_subscriber:update: Update webhook subscriber configurations.
            dp:webhook_subscriber:delete: Delete webhook subscriber configurations.
            dp:webhook_subscriber:manage: Manage webhook subscriber configurations (including creating, updating, and deleting).
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        API key authentication. Server-side authorization should bind each key to the same fine-grained permissions used
        by OAuth2 scopes.
  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        example: acme
      description: The organization's handle (also matches by name or IDP reference ID). Not the internal database uuid.
    fileType:
      name: fileType
      in: path
      required: true
      schema:
        type: string
    apiId:
      name: apiId
      in: path
      required: true
      schema:
        type: string
        example: weather-api-v1
      description: The API's handle (unique per org). Resolves only to REST/SOAP/WS/WebSub/GraphQL APIs — MCP servers are addressed via `/mcp-servers`.
    mcpServerId:
      name: mcpServerId
      in: path
      required: true
      schema:
        type: string
        example: weather-mcp-v1
      description: The MCP server's handle (unique per org).
    planId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        example: Gold
      description: The subscription plan's handle (unique per org).
    subId:
      name: subId
      in: path
      required: true
      schema:
        type: string
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
      description: Webhook event identifier.
    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        example: my-weather-app
      description: The application's handle (unique per org).
    keyMappingId:
      name: keyMappingId
      in: path
      required: true
      schema:
        type: string
    kmId:
      name: kmId
      in: path
      required: true
      schema:
        type: string
        example: Asgardeo
      description: The key manager's handle (its `id` in request/response payloads), not the internal database uuid.
    subscriberId:
      name: subscriberId
      in: path
      required: true
      schema:
        type: string
        example: production-gateway
      description: The webhook subscriber's handle (its `id` in request/response payloads), not the internal database uuid.
    viewId:
      name: viewId
      in: path
      required: true
      schema:
        type: string
        example: default
      description: The view's handle (unique per org). Not the internal database uuid.
    apiWorkflowId:
      name: apiWorkflowId
      in: path
      required: true
      schema:
        type: string
        example: workflow-12345
      description: The API workflow's handle (unique per org and view).
    contentTypeQuery:
      name: type
      in: query
      required: true
      schema:
        type: string
        example: document
      description: >-
        Stored API content type selector. Common values are `web`, `document`, `image`, and `link`, depending on how the
        uploaded ZIP content was classified.
    contentFileNameQuery:
      name: fileName
      in: query
      required: true
      schema:
        type: string
        example: getting-started.md
      description: Stored API content file name to retrieve.
    fileNameQuery:
      name: fileName
      in: query
      required: false
      schema:
        type: string
        example: getting-started.md
      description: File name selector used to delete a single stored API content file.
    orgContentFileNameQuery:
      name: fileName
      in: query
      required: true
      schema:
        type: string
      description: Stored organization content file name.
    orgContentFileTypeQuery:
      name: fileType
      in: query
      required: true
      schema:
        type: string
      description: Organization content file type, such as style, image, text, template, or partial.
    filePathQuery:
      name: filePath
      in: query
      required: false
      schema:
        type: string
      description: Optional relative content path used together with `fileType` and `fileName`.
    searchQuery:
      name: query
      in: query
      required: false
      schema:
        type: string
        example: weather
      description: Free-text API metadata search term.
    nameQuery:
      name: name
      in: query
      required: false
      schema:
        type: string
        example: Weather API
      description: Exact API name filter.
    versionQuery:
      name: version
      in: query
      required: false
      schema:
        type: string
        example: v1
      description: Exact API version filter.
    tagsQuery:
      name: tags
      in: query
      required: false
      schema:
        type: string
        example: weather,public
      description: Comma-separated tag names. Matches APIs tagged with any of the given names.
    viewQuery:
      name: view
      in: query
      required: false
      schema:
        type: string
        example: default
      description: >-
        The view's handle (unique per org), used to filter visible APIs. Not the view's
        display name, and not the internal database uuid.
    artifactIdQueryOptional:
      name: artifactId
      in: query
      required: false
      schema:
        type: string
        example: weather-api-v1
      description: Optional API ID used to filter results.
    appIdQueryOptional:
      name: appId
      in: query
      required: false
      schema:
        type: string
        example: my-weather-app
      description: Optional application ID used to filter API keys associated with that application.
    labelId:
      name: labelId
      in: path
      required: true
      schema:
        type: string
        example: premium
      description: The label's handle (its `id` in request/response payloads), not the internal database uuid.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of records to return.
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of records to skip before returning results.
  requestBodies:
    OrganizationCreateBody:
      required: true
      description: >-
        Organization creation payload. Send JSON or an organization YAML file in the `organization` multipart field.
        The JSON example below applies only to the `application/json` content type. When an organization YAML
        **file** is uploaded instead, its content must use `kind: Organization` with the nested shape
        `metadata.name` (handle, any top-level `id` is ignored) and `spec.displayName`; all other fields
        (including `cpRefId`) are read from `spec`. The YAML `spec` block additionally accepts `labels` (array of
        `{name, displayName}`) and `views` (array of `{id, displayName, labels}` — `id` becomes the view's handle) to
        bootstrap labels and views at creation time — these are not available via the `application/json` content
        type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationCreateRequest"
          example:
            displayName: Acme Corporation
            businessOwner: Jane Doe
            businessOwnerContact: +1-202-555-0147
            businessOwnerEmail: jane.doe@acme.example
            id: acme
            idpRefId: ACME
        multipart/form-data:
          schema:
            type: object
            required:
              - organization
            properties:
              organization:
                type: string
                format: binary
                description: "Organization YAML file (kind: Organization)."
          examples:
            yamlFile:
              summary: Organization YAML upload
              value:
                organization: org.yaml
    OrganizationUpdateBody:
      required: true
      description: >-
        Organization update payload. Send JSON or an organization YAML file in the `organization` multipart field.
        The JSON example below applies only to the `application/json` content type. When an organization YAML
        **file** is uploaded instead, its content must use `kind: Organization` with the nested shape
        `metadata.name` (handle, any top-level `id` is ignored) and `spec.displayName`; all other fields
        (including `cpRefId`) are read from `spec`. The YAML `spec` block additionally accepts `labels` (upserted by
        name) and `views` (upserted by `id`, which becomes the view's handle, with `labels` replacing the view's
        label set) — these are not available via the `application/json` content type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationUpdateRequest"
        multipart/form-data:
          schema:
            type: object
            required:
              - organization
            properties:
              organization:
                type: string
                format: binary
                description: "Organization YAML file (kind: Organization)."
          examples:
            yamlFile:
              summary: Organization YAML upload
              value:
                organization: org.yaml
    SubscriptionPlanBody:
      required: true
      description: >-
        Subscription plan payload. Send a single object for single create/upsert, or a non-empty array for bulk
        create/upsert; each object carries its rate/quota rules in `limits`. Alternatively, upload a YAML file in
        the `subscriptionPlan` multipart field; use `kind: SubscriptionPlan` for a single plan or
        `kind: SubscriptionPlanList` with an `items` array for bulk operations. YAML uploads may use the legacy
        `type: requestcount` or `type: eventcount` shorthand, which is converted into `limits` before storage.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/SubscriptionPlanRequest"
              - type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/SubscriptionPlanRequest"
        multipart/form-data:
          schema:
            type: object
            properties:
              subscriptionPlan:
                type: string
                format: binary
                description: >-
                  Subscription plan YAML file. Use `kind: SubscriptionPlan` for a single plan or `kind:
                  SubscriptionPlanList` (with an `items` array) for bulk operations.
          examples:
            singlePlan:
              summary: Single subscription plan YAML upload
              value:
                subscriptionPlan: plan.yaml
            planList:
              summary: Bulk subscription plan YAML upload
              value:
                subscriptionPlan: plans.yaml
    LabelBody:
      required: true
      description: Label payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LabelRequest"
          example:
            id: premium
            displayName: Premium APIs
    SubscriptionCreateBody:
      required: true
      description: Subscription creation payload. `artifactId` is the API ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionCreateRequest"
          example:
            artifactId: weather-api-v1
            subscriptionPlanId: Gold
    SubscriptionUpdateBody:
      required: true
      description: Subscription status update payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionUpdateRequest"
          example:
            status: ACTIVE
    SubscriptionChangePlanBody:
      required: true
      description: Subscription plan change payload. `planId` is the API Portal subscription plan ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscriptionChangePlanRequest"
          example:
            planId: Gold
    ApiKeyBody:
      required: true
      description: >-
        API key payload. `id` must be lowercase and may contain numbers, underscores, and hyphens. `displayName` is
        an optional human-readable label that defaults to `id` when omitted. `expiresAt` can be an ISO-8601 datetime
        with timezone, epoch seconds, or epoch milliseconds. The parent resource (API or MCP server, depending on the
        path) is identified by the corresponding path parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiKeyRequest"
          examples:
            expiringKey:
              summary: Generate an expiring key
              value:
                id: weather_prod_key
                expiresAt: "2026-12-31T23:59:59Z"
            nonExpiringKey:
              summary: Generate a key without expiry
              value:
                id: weather_sandbox_key
    ApiKeyRegenerateBody:
      required: true
      description: >-
        Identifies the API key to regenerate by its `keyId`. `expiresAt` is optional and, if provided,
        updates the key's expiry; the key's `id`/`displayName` cannot be changed by this operation.
      content:
        application/json:
          schema:
            type: object
            required:
              - keyId
            properties:
              keyId:
                type: string
                description: The key's handle — the `id` returned by generate or list.
                example: weather_prod_key
              expiresAt:
                oneOf:
                  - type: string
                    format: date-time
                  - type: number
                description: >-
                  New expiry for the key. Can be an ISO-8601 datetime with timezone, epoch seconds, or
                  epoch milliseconds. Omit to leave the current expiry unchanged.
                example: "2027-01-01T00:00:00Z"
            additionalProperties: false
          example:
            keyId: weather_prod_key
    ApiKeyRevokeBody:
      required: true
      description: Identifies the API key to revoke by its `keyId`.
      content:
        application/json:
          schema:
            type: object
            required:
              - keyId
            properties:
              keyId:
                type: string
                description: The key's handle — the `id` returned by generate or list.
                example: weather_prod_key
            additionalProperties: false
          example:
            keyId: weather_prod_key
    ApiKeyAssociateBody:
      required: true
      description: Identifies the API key and the application to associate it with.
      content:
        application/json:
          schema:
            type: object
            required:
              - keyId
              - appId
            properties:
              keyId:
                type: string
                description: The key's handle — the `id` returned by generate or list.
                example: weather_prod_key
              appId:
                type: string
                description: API Portal application ID to associate the key with.
                example: my-weather-app
            additionalProperties: false
          example:
            keyId: weather_prod_key
            appId: my-weather-app
    ApiKeyDissociateBody:
      required: true
      description: Identifies the API key to remove the application association from.
      content:
        application/json:
          schema:
            type: object
            required:
              - keyId
            properties:
              keyId:
                type: string
                description: The key's handle — the `id` returned by generate or list.
                example: weather_prod_key
            additionalProperties: false
          example:
            keyId: weather_prod_key
    AppKeyMappingBody:
      required: true
      description: >-
        Maps an OAuth client_id — created directly in the key manager — to this application. The application is
        identified by the `applicationId` path parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppKeyMappingRequest"
          examples:
            mapResidentOAuthClient:
              summary: Map an existing OAuth client_id using the resident key manager
              value:
                keyManager: Resident Key Manager
                type: PRODUCTION
                consumerKey: consumer-key-123
    ViewCreateBody:
      required: true
      description: View creation payload with the label names that should be visible in the view.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ViewCreateRequest"
          examples:
            partnerView:
              summary: Create a partner APIs view
              value:
                id: partner-apis
                displayName: Partner APIs
                labels:
                  - partner
                  - public
            internalView:
              summary: Create a view using the handle as display name
              value:
                id: internal-apis
                labels:
                  - internal
    ViewUpdateBody:
      required: true
      description: View update payload. Include only the display name or label changes that should be applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ViewUpdateRequest"
          examples:
            renameAndRelabel:
              summary: Rename a view and replace its labels
              value:
                displayName: Partner and Public APIs
                labels:
                  - partner
                  - premium
            relabelOnly:
              summary: Replace labels without renaming
              value:
                labels:
                  - beta
    OAuthGenerateTokenBody:
      required: false
      description: OAuth token generation payload. The portal calls the Authorization Server token endpoint directly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthGenerateTokenRequest"
          example:
            scopes:
              - weather.read
            validityPeriod: 3600
    KeyManagerBody:
      description: >-
        Key manager configuration payload. Submit as `application/json` or as `multipart/form-data` with a `keymanager`
        field containing a KeyManager YAML file.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KeyManagerRequest"
          example:
            displayName: Asgardeo
            id: asgardeo-prod
            enabled: true
            tokenEndpoint: https://api.asgardeo.io/t/myorg/oauth2/token
        multipart/form-data:
          schema:
            type: object
            properties:
              keymanager:
                type: string
                format: binary
                description: KeyManager YAML file.
    WebhookSubscriberBody:
      description: Webhook subscriber configuration payload.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookSubscriberRequest"
          example:
            displayName: Production Gateway
            targetUrl: https://gateway.example.com/api-portal-webhook
            secret: <shared-secret>
            events:
              - apikey.*
              - subscription.*
            enabled: true
            timeoutMs: 5000
    WebhookSubscriberUpdateBody:
      description: Webhook subscriber update payload. All fields are optional; only supplied fields are updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookSubscriberRequest"
    KeyManagerUpdateBody:
      description: >-
        Key manager update payload. All fields are optional; only supplied fields are updated. Submit as
        `application/json` or as `multipart/form-data` with a `keymanager` field containing a KeyManager YAML file.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KeyManagerUpdateRequest"
          example:
            displayName: Asgardeo
            enabled: false
            tokenEndpoint: https://api.asgardeo.io/t/myorg/oauth2/token
        multipart/form-data:
          schema:
            type: object
            properties:
              keymanager:
                type: string
                format: binary
                description: KeyManager YAML file with partial update fields.
    APIWorkflowCreateBody:
      required: true
      description: >-
        API workflow creation payload. Use `contentType` `ARAZZO` for JSON/YAML workflow content or `MD` for Markdown
        workflow content.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIWorkflowCreateRequest"
          examples:
            arazzoWorkflow:
              summary: Create an Arazzo API workflow
              value:
                displayName: Weather onboarding
                id: weather-onboarding
                description: Guides users through the Weather API onboarding workflow.
                contentType: ARAZZO
                apiWorkflowDefinition:
                  arazzo: 1.0.1
                  info:
                    title: Weather onboarding
                    version: 1.0.0
                  workflows: []
            markdownWorkflow:
              summary: Create a Markdown API workflow
              value:
                displayName: Weather guide
                description: Human-readable guide for Weather API users.
                contentType: MD
                markdownContent: |-
                  # Weather guide
                  Use this workflow to onboard Weather API users.
    APIWorkflowUpdateBody:
      required: true
      description: API workflow update payload. Include only the fields that should change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIWorkflowUpdateRequest"
          example:
            displayName: Weather onboarding v2
            status: PUBLISHED
            agentVisibility: VISIBLE
    APIWorkflowPromptBody:
      required: true
      description: API workflow prompt-generation payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIWorkflowPromptRequest"
          example:
            displayName: Weather onboarding
            description: Guides users through the Weather API onboarding workflow.
            orgHandle: acme
            viewName: default
            id: weather-onboarding
            apis:
              - name: Weather API
                version: v1
    FileUploadBody:
      required: true
      description: ZIP file upload. Organization content uploads are limited to 50 MB.
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: ZIP file containing organization theme assets.
    ApiMetadataMultipartBody:
      required: true
      description: >-
        API metadata upload. Send either `artifact`, or `metadata` with `definition`. For a GraphQL API
        the `definition` field carries the SDL schema. (MCP servers are created via `/mcp-servers` with
        the dedicated `McpServerMultipartBody`, not this body.)
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              definition:
                type: string
                format: binary
                description: >-
                  API definition file. For REST/SOAP/etc. this is the OpenAPI/WSDL/AsyncAPI contract;
                  for a GraphQL API it is the SDL schema.
              artifact:
                type: string
                format: binary
                description: Full API ZIP artifact containing metadata and definition files.
              metadata:
                type: string
                description: >-
                  API metadata, supplied either as a JSON string field or as an uploaded YAML/JSON file
                  (a k8s-style document with `kind`, `metadata.name`, and a `spec` block; file names
                  `metadata.yaml`/`.yml`/`.json`, or the legacy `api.yaml`/`mcp.yaml`).
                  As a JSON string it accepts these top-level
                  fields: `name`, `version`, `description`, `type`,
                  `agentVisibility`, `status`, `referenceId`, `id`, `tags`, `labels`,
                  `owners`, `endPoints` (productionURL, sandboxURL), and `subscriptionPlans` (array of `{
                  id }` objects — only `id` is read; the plan must already exist in the organization). `id` becomes
                  the API's stored handle; when the API is created from a YAML artifact instead, the handle is
                  always taken from `metadata.name`.
                example: >-
                  {"name":"Weather API","version":"v1","description":"Weather forecast
                  API","type":"REST","agentVisibility":"VISIBLE",
                  "status":"PUBLISHED","tags":["weather"],"labels":["default"],"endPoints":{
                  "productionURL":"https://api.example.com/weather",
                  "sandboxURL":"https://sandbox.example.com/weather"},"subscriptionPlans":[{"id":"Gold"}]}
    McpServerMultipartBody:
      required: true
      description: >-
        MCP server upload. Provide the server metadata via `metadata` (a JSON string or an uploaded
        YAML/JSON file), or a full `artifact` ZIP, together with its `definition` — the tools, resources,
        and prompts the server exposes. An MCP server has no OpenAPI-style API contract; its
        `definition` (tools schema) IS its contract, so it is required on create (and replaces the
        stored schema when supplied on update).
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              artifact:
                type: string
                format: binary
                description: Full MCP server ZIP artifact containing the metadata and the definition.
              definition:
                type: string
                format: binary
                description: >-
                  MCP tools schema (YAML or JSON) listing the tools, resources, and prompts the server
                  exposes. Required on create; when supplied on update it replaces the stored schema.
              metadata:
                type: string
                description: >-
                  MCP server metadata, supplied either as a JSON string field or as an uploaded YAML/JSON
                  file (a k8s-style document of kind `MCP`; file names `metadata.yaml`/`.yml`/`.json`, or
                  the legacy `api.yaml`/`mcp.yaml`). As a JSON string it accepts these
                  top-level fields:
                  `name`, `version`, `description`, `type` (must be `MCP`), `agentVisibility`, `status`,
                  `referenceId`, `id`, `tags`, `labels`, `owners`, `endPoints` (productionURL, sandboxURL),
                  and `subscriptionPlans` (array of `{ id }` objects — only `id` is read; the plan must already
                  exist in the organization). `id` becomes the MCP server's stored handle.
                example: >-
                  {"name":"Travel Assistant MCP","version":"v1","description":"MCP server for travel
                  planning tools","type":"MCP","agentVisibility":"VISIBLE","status":"PUBLISHED",
                  "tags":["mcp"],"labels":["default"],"endPoints":{"productionURL":"https://mcp.example.com",
                  "sandboxURL":"https://mcp.example.com"},"subscriptionPlans":[{"id":"Gold"}]}
    ContentZipMultipartBody:
      required: true
      description: |
        API content ZIP upload.

        Expected ZIP structure:
        - `web/`: optional API landing-page files and images.
        - `docs/`: optional downloadable documents.

        At least one of `web/` or `docs/` must exist at the ZIP root.
        `docMetadata` and `imageMetadata` are JSON strings because they are submitted as multipart form fields.
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                format: binary
                description: ZIP upload field named `content`.
              docMetadata:
                type: string
                description: Optional JSON string containing API document link metadata.
                example: "[{\"name\":\"External guide\",\"url\":\"https://example.com/docs/guide\",\"type\":\"LINK\"}]"
              imageMetadata:
                type: string
                description: Optional JSON string containing API image metadata.
                example: "{\"api-icon\":\"icon.png\"}"
    ApplicationMultipartBody:
      required: true
      description: >-
        Application payload. Send JSON, multipart form fields, or an application YAML file in the `application` field.
        The JSON example below (`displayName`, `id`, `description`) applies only to the `application/json` content
        type. When an application YAML **file** is uploaded instead, its content must use the nested shape
        `metadata.name` (handle) and `spec.displayName` / `spec.description` — any top-level `id` inside that YAML
        file is ignored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApplicationRequest"
          example:
            displayName: Weather App
            id: my-weather-app
            description: Application used to call Weather APIs.
        multipart/form-data:
          schema:
            type: object
            properties:
              application:
                type: string
                format: binary
                description: Application YAML file field named `application`.
              displayName:
                type: string
                description: Application display name when sending form fields instead of YAML.
              id:
                type: string
                description: >-
                  Immutable, org-scoped slug for the application, stored as its handle. Optional — defaults to
                  `displayName` when omitted.
              description:
                type: string
          examples:
            formFields:
              summary: Multipart form fields
              value:
                displayName: Weather App
                id: my-weather-app
                description: Application used to call Weather APIs.
            yamlFile:
              summary: Application YAML upload
              value:
                application: application.yaml
  responses:
    DefaultResponse:
