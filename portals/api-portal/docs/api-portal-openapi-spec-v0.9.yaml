openapi: 3.0.3
info:
  title: WSO2 API Portal & MCP Hub
  version: 0.9.0
  description: |
    Fine-grained API Portal REST API for managing organizations,
    API metadata and content, applications, subscriptions, application appKeyMappings, and API flows.

    All resources, including organization lifecycle endpoints
    (`/api-portal/api/v0.9/organizations`, `/api-portal/api/v0.9/organizations/{orgId}`), are
    served under `/api-portal/api/v0.9` — the portal mounts its whole surface, pages and REST
    API alike, beneath the `/api-portal` prefix.
    Operations declare the least-privilege OAuth2 scopes required for each resource action.
servers:
  - url: https://localhost:9543/api-portal/api/v0.9
    description: Local HTTPS server
  - url: http://localhost:9543/api-portal/api/v0.9
    description: Local development server
tags:
  - name: Organizations
  - name: Organization Content
  - name: APIs
  - name: API Content
  - name: MCP Servers
  - name: MCP Server Content
  - name: MCP Server Keys
  - name: Subscription Plans
  - name: Labels
  - name: Applications
  - name: Subscriptions
  - name: API Keys
  - name: Views
  - name: Application Keys
  - name: API Workflows
  - name: Key Managers
  - name: Webhook Events
  - name: Webhook Subscribers
paths:
  /organizations:
    post:
      tags:
        - Organizations
      summary: Create an organization (not supported)
      description: >-
        NOT SUPPORTED — always returns 405. This API Portal serves the single organization named by its
        `organization.handle` configuration, which is created on startup along with its default portal
        configuration, label, view, and subscription plans. The operation is retained for forward compatibility.
      operationId: createOrganization
      requestBody:
        $ref: "#/components/requestBodies/OrganizationCreateBody"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization:create
            - dp:organization:manage
    get:
      tags:
        - Organizations
      summary: List organizations (not supported)
      description: >-
        NOT SUPPORTED — always returns 405. Listing is inherently cross-organization, and this API Portal
        serves exactly one. Use `GET /organizations/{orgId}` with this instance's own handle instead. The
        operation is retained for forward compatibility.
      operationId: getOrganizations
      responses:
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization:read
            - dp:organization:manage
  /organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/orgId"
    put:
      tags:
        - Organizations
      summary: Update an organization
      description: >-
        Updates organization metadata, claim mappings, role mappings, and portal configuration. `orgId` must name
        this instance's own organization; any other returns 403. The `id` (handle) and `idpRefId` fields cannot be
        changed — they are what page URLs and incoming token organization claims are matched against, so a rename
        would leave the running instance unable to find its own organization. Sending a different value returns 400.
        `idpRefId` is owned by the portal's `auth.idp_org_id` configuration, which is re-applied on every
        restart; change it there rather than here.
      operationId: updateOrganization
      requestBody:
        $ref: "#/components/requestBodies/OrganizationUpdateBody"
      responses:
        "200":
          $ref: "#/components/responses/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization:update
            - dp:organization:manage
    get:
      tags:
        - Organizations
      summary: Get an organization
      description: >-
        Retrieves this instance's organization by organization name, handle, or IDP reference ID. Because the portal
        serves a single organization, `orgId` must resolve to that one; any other organization returns 403 — and so
        does an organization that does not exist, so the response cannot be used to discover which organizations the
        shared database holds.
      operationId: getOrganization
      responses:
        "200":
          $ref: "#/components/responses/OrganizationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization:read
            - dp:organization:manage
    delete:
      tags:
        - Organizations
      summary: Delete an organization (not supported)
      description: >-
        NOT SUPPORTED — always returns 405. This API Portal instance is bound to a single organization for
        its whole lifetime; deleting it would leave the instance serving nothing. The operation is retained for
        forward compatibility.
      operationId: deleteOrganization
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization:delete
            - dp:organization:manage
  /views/{viewId}/asset:
    parameters:
      - $ref: "#/components/parameters/viewId"
    get:
      tags:
        - Organization Content
      summary: Get a theme asset
      description: >-
        Retrieves a single organization theme asset (CSS, image, etc.) by `fileType` and `fileName` query parameters.
        The response content type is derived from the stored file type and extension.
      operationId: getOrgAsset
      parameters:
        - $ref: "#/components/parameters/orgContentFileTypeQuery"
        - $ref: "#/components/parameters/orgContentFileNameQuery"
        - $ref: "#/components/parameters/filePathQuery"
        - name: orgId
          in: query
          required: false
          deprecated: true
          schema:
            type: string
          description: >-
            DEPRECATED and ignored. Accepted only so existing callers (the portal's own
            style-URL rewrite appends it) are not rejected. The organization is always this
            instance's own — from the session when there is one, otherwise from
            `organization.handle` configuration. It was previously honoured on this
            unauthenticated endpoint, which made it a selector for any organization's
            branding in a shared database.
      responses:
        "200":
          $ref: "#/components/responses/OrganizationContentAssetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: []
  /views/{viewId}/apply-theme:
    parameters:
      - $ref: "#/components/parameters/viewId"
    post:
      tags:
        - Organization Content
      summary: Apply a theme
      description: >-
        Uploads a ZIP file and atomically replaces the view's theme assets. Only the assets contained in the
        uploaded ZIP are present afterward.
      operationId: applyTheme
      requestBody:
        $ref: "#/components/requestBodies/FileUploadBody"
      responses:
        "200":
          $ref: "#/components/responses/OrganizationContentUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization_content:manage
            - dp:organization:manage
  /views/{viewId}/reset-theme:
    parameters:
      - $ref: "#/components/parameters/viewId"
    post:
      tags:
        - Organization Content
      summary: Reset theme to defaults
      description: Deletes all stored theme assets for the view, reverting it to built-in defaults.
      operationId: resetTheme
      responses:
        "204":
          description: Theme reset successfully.
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization_content:manage
            - dp:organization:manage
  /views/{viewId}/export-theme:
    parameters:
      - $ref: "#/components/parameters/viewId"
    get:
      tags:
        - Organization Content
      summary: Download the current theme
      description: >-
        Bundles the view's current custom theme assets into a single ZIP archive for download.
        The archive is wrapped in a top-level folder so it can be re-uploaded via the apply-theme
        endpoint. Returns 404 when the view has no custom theme.
      operationId: exportTheme
      responses:
        "200":
          description: Theme archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:organization_content:read
            - dp:organization:manage
  /apis:
    post:
      tags:
        - APIs
      summary: Create API metadata
      description: >-
        Creates API metadata from either a full API artifact ZIP, an API metadata YAML file (`api.yaml`
        / `metadata.yaml` / `mcp.yaml`), or a `metadata` JSON string. An API definition file is required unless
        supplied by the artifact ZIP. The YAML `spec` block accepts: `displayName`, `version`, `description`, `type`,
        `status`, `agentVisibility`, `tags`, `labels`,
        `referenceId`, `endpoints` (sandboxUrl, productionUrl), `businessInformation` (owners), and `subscriptionPlans`.
        The service also stores labels, subscription plan mappings, image metadata, and schema definitions for
        GraphQL APIs when provided. Via the JSON `metadata` field, `type` is required — an omitted type is
        rejected with `400` (via YAML, an omitted `spec.type` defaults to `REST`). MCP servers must be created via
        `POST /api-portal/api/v0.9/mcp-servers` instead — a request whose resolved `type` is `MCP` is rejected with `400`.

        `subscriptionPlans` links existing org-level plans to this API by name — it does not create plans. In YAML it is
        a string array (`["Gold", "Silver"]`). In the JSON `metadata` field it is an object array where only
        `id` is used (`[{"id":"Gold"}]`); extra fields such as `planId`, `displayName`, or `requestCount`
        are ignored.
      operationId: createApiMetadata
      requestBody:
        $ref: "#/components/requestBodies/ApiMetadataMultipartBody"
      responses:
        "201":
          $ref: "#/components/responses/ApiMetadataCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api:create
            - dp:api:manage
    get:
      tags:
        - APIs
      summary: List API metadata
      description: >-
        Lists API metadata for an organization. The service supports exact filters by API name, version, and tags,
        free-text search with `query`, and view filtering. Unknown query parameters are rejected. MCP-typed records
        are never returned here — use `GET /api-portal/api/v0.9/mcp-servers`.
      operationId: getAllApiMetadataForOrganization
      parameters:
        - $ref: "#/components/parameters/searchQuery"
        - $ref: "#/components/parameters/nameQuery"
        - $ref: "#/components/parameters/versionQuery"
        - $ref: "#/components/parameters/tagsQuery"
        - $ref: "#/components/parameters/viewQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/ApiMetadataListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api:read
            - dp:api:manage
  /apis/{apiId}:
    parameters:
      - $ref: "#/components/parameters/apiId"
    get:
      tags:
        - APIs
      summary: Get API metadata
      description: Retrieves a single API metadata record by API ID.
      operationId: getApiMetadata
      responses:
        "200":
          $ref: "#/components/responses/ApiMetadataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api:read
            - dp:api:manage
    put:
      tags:
        - APIs
      summary: Update API metadata
      description: >-
        Updates API metadata and its stored definition. Accepts the same YAML spec fields and
        `metadata` JSON format as the create operation. The update flow can also adjust label mappings, subscription
        plan mappings, schema definitions, and image metadata. Status changes to unpublished are rejected when active
        subscriptions exist. `type` is required (see the create operation) and is immutable — it must match the
        API's existing type; a different value is rejected with `409`.
      operationId: updateApiMetadata
      requestBody:
        $ref: "#/components/requestBodies/ApiMetadataMultipartBody"
      responses:
        "200":
          $ref: "#/components/responses/ApiMetadataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api:update
            - dp:api:manage
    delete:
      tags:
        - APIs
      summary: Delete API metadata
      description: Deletes API metadata when the API has no active subscriptions.
      operationId: deleteApiMetadata
      responses:
        "200":
          $ref: "#/components/responses/TextMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api:delete
            - dp:api:manage
  /subscription-plans:
    get:
      tags:
        - Subscription Plans
      summary: List subscription plans
      description: >-
        Lists subscription plans for an organization. When `name` is supplied, only the matching plan (if any) is
        returned. Plan names are unique within an organization.
      operationId: listSubscriptionPlans
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Filter by exact plan name. Returns an array of zero or one items.
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionPlanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription_plan:read
            - dp:subscription_plan:manage
    post:
      tags:
        - Subscription Plans
      summary: Create subscription plans
      description: >-
        Creates one subscription plan when the request body is an object, or multiple subscription plans when the body
        is an array. Bulk creation returns a message instead of creating plans when `generateDefaultSubPlans` is
        enabled.
      operationId: addSubscriptionPlans
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionPlanBody"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "201":
          $ref: "#/components/responses/SubscriptionPlanMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription_plan:create
            - dp:subscription_plan:manage
    put:
      tags:
        - Subscription Plans
      summary: Upsert subscription plans
      description: >-
        Upserts one subscription plan when the request body is an object, or multiple plans when the body is an array. A
        single plan update returns `200` when an existing plan is updated and `201` when a new plan is created. Bulk
        updates return a message when `generateDefaultSubPlans` is enabled.
      operationId: putSubscriptionPlans
      requestBody:
        $ref: "#/components/requestBodies/SubscriptionPlanBody"
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionPlanPutResponse"
        "201":
          $ref: "#/components/responses/SubscriptionPlanMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription_plan:update
            - dp:subscription_plan:manage
  /subscription-plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/planId"
    get:
      tags:
        - Subscription Plans
      summary: Get a subscription plan
      operationId: getSubscriptionPlan
      description: Retrieves a single subscription plan by `planId`.
      responses:
        "200":
          $ref: "#/components/responses/SubscriptionPlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription_plan:read
            - dp:subscription_plan:manage
    delete:
      tags:
        - Subscription Plans
      summary: Delete a subscription plan
      operationId: deleteSubscriptionPlan
      description: Deletes a subscription plan by `planId`.
      responses:
        "204":
          description: Subscription plan deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:subscription_plan:delete
            - dp:subscription_plan:manage
  /apis/{apiId}/assets:
    parameters:
      - $ref: "#/components/parameters/apiId"
    post:
      tags:
        - API Content
      summary: Upload API content
      description: |
        Uploads the static content package for an API.

        The `content` ZIP must contain at least one of these root directories:
        - `web/` for API landing-page assets such as markdown, HTML, CSS, JavaScript, and images.
        - `docs/` for downloadable API documents.

        Use `docMetadata` to add external document links that are stored alongside uploaded documents.
        Use `imageMetadata` to map uploaded images to API image roles such as the API icon.
      operationId: createApiContent
      requestBody:
        $ref: "#/components/requestBodies/ContentZipMultipartBody"
      responses:
        "201":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_content:create
            - dp:api_content:manage
    put:
      tags:
        - API Content
      summary: Replace API content
      description: |
        Replaces or adds static content files for an existing API.

        The upload format is the same as `POST /api-portal/api/v0.9/apis/{apiId}/assets`.
        Existing files with the same stored `type` and `fileName` are updated; new files are created.
        Image metadata is updated only when image metadata can be resolved from the upload or request body.
      operationId: replaceApiContent
      requestBody:
        $ref: "#/components/requestBodies/ContentZipMultipartBody"
      responses:
        "201":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_content:update
            - dp:api_content:manage
    get:
      tags:
        - API Content
      summary: Get an API content file
      description: |
        Retrieves a single stored API content file.

        The `type` query parameter selects the stored content category and `fileName` selects the file
        within that category. Text files and external document links are returned as text. Image files are
        returned as binary content with a media type derived from the file extension.

        Image files (`type=IMAGE`) are publicly readable so that an API's icon renders on the public
        listing and landing pages without a session; the organization is then this instance's own
        configured one (mirrors `GET /views/{viewId}/asset`). All other content categories require a
        session: an anonymous request for a non-image type is rejected.
      operationId: getApiContentFile
      security: []
      parameters:
        - $ref: "#/components/parameters/contentTypeQuery"
        - $ref: "#/components/parameters/contentFileNameQuery"
        - name: orgId
          in: query
          required: false
          deprecated: true
          schema:
            type: string
          description: >-
            DEPRECATED and ignored. Accepted only so existing callers (the portal's own image-URL
            rewrite appends it) are not rejected. The organization is always this instance's own —
            from the session when there is one, otherwise from `organization.handle` configuration.
            It was previously honoured on this unauthenticated endpoint, which made it a selector
            for any organization's API icons in a shared database.
      responses:
        "200":
          $ref: "#/components/responses/ContentAssetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - API Content
      summary: Delete API content files
      description: |
        Deletes stored API content.

        Send both `type` and `fileName` to delete one file. Send only `type` to delete all stored content
        files matching that content category for the API.
      operationId: deleteApiContentFile
      parameters:
        - $ref: "#/components/parameters/contentTypeQuery"
        - $ref: "#/components/parameters/fileNameQuery"
      responses:
        "204":
          description: API content deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/TextMessageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:api_content:delete
            - dp:api_content:manage
  /labels:
    post:
      tags:
        - Labels
      summary: Create a label
      description: Creates a label for the organization.
      operationId: createLabel
      requestBody:
        $ref: "#/components/requestBodies/LabelBody"
      responses:
        "201":
          description: The created label.
          headers:
            Location:
              description: URL of the created label.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:label:create
            - dp:label:manage
    get:
      tags:
        - Labels
      summary: List labels
      description: Returns all labels configured for the organization.
      operationId: listLabels
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/LabelsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:label:read
            - dp:label:manage
  /labels/{labelId}:
    get:
      tags:
        - Labels
      summary: Get a label
      description: Retrieves a single label by handle.
      operationId: getLabel
      parameters:
        - $ref: "#/components/parameters/labelId"
      responses:
        "200":
          $ref: "#/components/responses/LabelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
            - dp:label:read
            - dp:label:manage
    put:
      tags:
        - Labels
      summary: Update a label
      description: Updates an existing label by handle.
      operationId: updateLabel
      parameters:
        - $ref: "#/components/parameters/labelId"
      requestBody:
        $ref: "#/components/requestBodies/LabelBody"
      responses:
        "200":
          $ref: "#/components/responses/LabelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - OAuth2Security:
