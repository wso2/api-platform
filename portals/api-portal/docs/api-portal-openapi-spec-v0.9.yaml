          schema:
            type: string
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
        application/javascript:
          schema:
            type: string
        image/svg+xml:
          schema:
            type: string
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    ContentAssetResponse:
      description: >-
        Stored API content asset. The concrete media type depends on the stored file extension or whether the content is
        an external document link.
      content:
        text/css:
          schema:
            type: string
          example: "body { color: #222; }"
        text/html:
          schema:
            type: string
          example: <section>API overview</section>
        text/plain:
          schema:
            type: string
          example: https://example.com/docs/guide
        application/javascript:
          schema:
            type: string
          example: console.log('API content loaded');
        application/json:
          schema:
            type: string
          example: "{\"title\":\"API overview\"}"
        image/svg+xml:
          schema:
            type: string
          example: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"></svg>
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    OrganizationContentListResponse:
      description: List of organization content records for the requested file type.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OrganizationContentListItemResponse"
    BadRequest:
      description: >-
        Bad request. Validation and other bad-request errors are returned as a standard error object
        (field-level details, when present, are carried in its `errors` array); some legacy handlers
        return a message-only object.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/MessageResponse"
          examples:
            badRequest:
              summary: Bad request error
              value:
                status: error
                code: MISSING_REQUIRED_PARAMETER
                message: Missing required parameter.
            messageOnly:
              summary: Message-only bad request
              value:
                message: Missing or invalid fields in the request payload
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: ORG_NOT_FOUND
            message: Organization not found.
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: CONFLICT
            message: Conflict
    UnsupportedMediaType:
      description: Unsupported request media type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: UNSUPPORTED_MEDIA_TYPE
            message: Content-Type must be application/json.
    MethodNotAllowed:
      description: >-
        The operation is not offered by this deployment. Returned by the organization
        lifecycle operations, which an API Portal serving a single organization does
        not expose — that organization is configured and provisioned at startup.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: METHOD_NOT_ALLOWED
            message: >-
              This API Portal serves a single organization, which is configured and
              provisioned at startup. Organizations cannot be created, listed, or deleted
              through the API.
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: INTERNAL_SERVER_ERROR
            message: An unexpected error occurred.
    MessageResponse:
      description: JSON message response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    TextMessageResponse:
      description: Plain text success response.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: >-
        Request is forbidden — because the caller lacks the required permission, because the
        current runtime mode disallows the operation (read-only mode), or because an organization
        was named that is not the single one this instance serves. In that last case an
        organization that does not exist is answered identically to one belonging to someone else,
        so the response cannot be used to discover what a shared database holds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            code: FORBIDDEN
            message: Forbidden
    ApiMetadataCreateResponse:
