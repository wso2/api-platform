    WebhookEventResponse:
      description: Single webhook event with full delivery details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WebhookEvent"
  schemas:
    Pagination:
      type: object
      description: Standard pagination metadata returned with collection responses.
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          description: Total number of records matching the query.
          example: 42
        limit:
          type: integer
          description: Maximum number of records returned in this response.
          example: 20
        offset:
          type: integer
          description: Number of records skipped before this page.
          example: 0
      additionalProperties: false
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    GenericValue:
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
    GenericObject:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          enum:
            - error
          description: Always "error" for error responses.
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Machine-readable SCREAMING_SNAKE_CASE catalog code.
          example: ORG_NOT_FOUND
        message:
          type: string
          description: Human-readable error message.
        errors:
          type: array
          description: Optional per-field validation errors.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
            additionalProperties: false
      additionalProperties: false
    OrganizationResponse:
      type: object
      properties:
        id:
          type: string
          description: The organization's handle (unique). Not the internal database uuid.
          example: acme
        displayName:
          type: string
          example: Acme Corporation
        businessOwner:
          type: string
          nullable: true
        businessOwnerContact:
          type: string
          nullable: true
        businessOwnerEmail:
          type: string
          format: email
          nullable: true
        idpRefId:
          type: string
          description: >-
            The organization claim value asserted by the configured Identity Provider at SSO login. On every login,
            the portal matches the authenticated user's org claim against this value to resolve which organization
            they belong to — it must exactly match the IDP's claim, or login fails for that org's users. Distinct
            from `cpRefId`, which is unrelated to authentication.
        cpRefId:
          type: string
          nullable: true
          description: >-
            Control Plane reference ID. Included in outbound webhook event payloads so subscribers can correlate
            this organization with its Control Plane (Platform API) counterpart. Not used for authentication or
            org resolution.
        configuration:
          type: object
          description: >-
            Free-form organization configuration set by the caller. Which artifact types the
            portal serves is operator configuration ([api_portal.artifacts]), not part of this.
          additionalProperties: true
          example: {}
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    OrganizationContentUploadResponse:
      type: object
      required:
        - id
        - fileName
      properties:
        id:
          type: string
        fileName:
          type: string
          description: Original ZIP file name uploaded in the `file` multipart field.
      additionalProperties: false
    OrganizationContentListItemResponse:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        fileContent:
          type: string
          nullable: true
          description: UTF-8 content string returned for stored organization content records.
      additionalProperties: false
    ApiMetadataCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiInfoResponse"
        - type: object
          properties:
            id:
              type: string
              description: The API's handle (unique per org). Not the internal database uuid.
            refId:
              type: string
              nullable: true
              description: >-
                Platform API (Control Plane) reference ID for this API. Used for MCP registry visibility filtering
                and included in outbound webhook event payloads. Null/absent for APIs that exist only in the
                API Portal and are not registered with the Platform API — e.g. MCP servers published via the
                registry.
            endPoints:
              $ref: "#/components/schemas/ApiEndpointsResponse"
            subscriptionPlans:
              type: array
              items:
                $ref: "#/components/schemas/SubscriptionPlanResponse"
          additionalProperties: true
    ApiMetadataResponse:
      allOf:
        - $ref: "#/components/schemas/ApiInfoResponse"
        - type: object
          properties:
            id:
              type: string
              description: The API's handle (unique per org). Not the internal database uuid.
            refId:
              type: string
              nullable: true
              description: >-
                Platform API (Control Plane) reference ID for this API. Used for MCP registry visibility filtering
                and included in outbound webhook event payloads. Null/absent for APIs that exist only in the
                API Portal and are not registered with the Platform API — e.g. MCP servers published via the
                registry.
            dataSource:
              type: string
              nullable: true
              description: >-
                Indicates which content matched the search term: `METADATA` if the match was in the API's own
                metadata, or a content type (e.g. a value from the API Content `type` field) if the match was
                inside an uploaded content file. Only computed by getAllApiMetadataForOrganization when both the
                `query` search parameter is supplied and the database is PostgreSQL — absent on SQLite (the dev
                default) and absent from every other operation (get/create/update single API).
            planId:
              type: string
            endPoints:
              $ref: "#/components/schemas/ApiEndpointsResponse"
            subscriptionPlans:
              type: array
              items:
                $ref: "#/components/schemas/SubscriptionPlanResponse"
            createdBy:
              type: string
              description: >-
                Identity of the user who created this API, or `deleted_user` if that user's IDP reference no longer
                exists. Present on single-resource GET responses and list items.
              example: alice@example.com
            updatedBy:
              type: string
              description: >-
                Identity of the user who last updated this API, or `deleted_user` if that user's IDP reference no
                longer exists. Present on single-resource GET responses only, omitted on list items.
              example: alice@example.com
            createdAt:
              type: string
              format: date-time
              example: "2026-05-07T08:30:00Z"
            updatedAt:
              type: string
              format: date-time
              example: "2026-05-07T08:30:00Z"
          additionalProperties: true
    ApiInfoResponse:
      type: object
      description: >-
        Fields are returned at the root of ApiMetadataResponse / ApiMetadataCreateResponse (not nested under an
        `apiInfo` key) — this schema exists only to share the field set between the two via `allOf`.
      properties:
        name:
          type: string
        title:
          type: string
          nullable: true
        remotes:
          type: array
          items:
            type: object
            additionalProperties: true
        version:
          type: string
        status:
          type: string
          enum:
            - PUBLISHED
            - DEPRECATED
          description: API lifecycle status.
          example: PUBLISHED
        description:
          type: string
        type:
          type: string
          description: >-
            The stored/returned type constant (src/utils/constants.js API_TYPE) — distinct
            from the request-time keyword accepted on create/update (see `type` in
            ApiMetadataMultipartBody: REST, SOAP, MCP, WS, WEBSUB, GRAPHQL). REST maps to
            `RestApi` and WEBSUB maps to `WebSubApi`; the rest are returned unchanged.
          enum:
            - RestApi
            - SOAP
            - Mcp
            - WS
            - WebSubApi
            - GRAPHQL
        referenceId:
          type: string
          nullable: true
          description: >-
            External reference ID. Present when the API was created from a YAML artifact whose `spec`
            block sets `referenceId` — the create response echoes the parsed YAML back.
        agentVisibility:
          type: string
          enum:
            - VISIBLE
            - HIDDEN
        addedLabels:
          type: array
          items:
            type: string
        removedLabels:
          type: array
          items:
            type: string
        owners:
          $ref: "#/components/schemas/ApiOwnersResponse"
        apiImageMetadata:
          $ref: "#/components/schemas/ApiImageMetadataResponse"
        tags:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
    ApiOwnersResponse:
      type: object
      properties:
        technicalOwner:
          type: string
        businessOwner:
          type: string
        businessOwnerEmail:
          type: string
        technicalOwnerEmail:
          type: string
      additionalProperties: false
    ApiEndpointsResponse:
      type: object
      properties:
        sandboxURL:
          type: string
        productionURL:
          type: string
      additionalProperties: false
    ApiImageMetadataResponse:
      type: object
      additionalProperties:
        type: string
    SubscriptionPlanResponse:
      type: object
      properties:
        id:
          type: string
          description: The plan's handle (unique per org). Not the internal database uuid.
        displayName:
          type: string
        description:
          type: string
        limits:
          type: array
          description: Rate/quota limits enforced for this plan. Empty when the plan is unlimited.
          items:
            type: object
            properties:
              limitType:
                type: string
                enum:
                  - REQUEST_COUNT
                  - EVENT_COUNT
                  - BANDWIDTH
                  - TOTAL_TOKEN_COUNT
              limitCount:
                oneOf:
                  - type: integer
                  - type: string
                example: 10000
                description: >-
                  Returned as a string when the stored count exceeds the safe integer range, otherwise a
                  number. Unlimited plans have no limit entries — the `limits` array is empty.
              timeUnit:
                type: string
                enum:
                  - MINUTE
                  - HOUR
                  - DAY
                  - MONTH
                  - null
                nullable: true
              timeAmount:
                type: integer
                example: 1
        refId:
          type: string
          nullable: true
          description: Platform API subscription plan UUID associated with this plan.
        orgId:
          type: string
        createdBy:
          type: string
          description: >-
            Identity of the user who created this subscription plan, or `deleted_user` if that user's IDP
            reference no longer exists. Present on single-resource GET responses and list items.
          example: alice@example.com
        updatedBy:
          type: string
          description: >-
            Identity of the user who last updated this subscription plan, or `deleted_user` if that user's IDP
            reference no longer exists. Present on single-resource GET responses only, omitted on list items.
          example: alice@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    LabelResponse:
      type: object
      properties:
        id:
          type: string
          example: premium
          description: The label's handle (unique per org). Not the internal database uuid.
        displayName:
          type: string
          example: Premium APIs
      additionalProperties: false
    ApplicationResponse:
      type: object
      properties:
        id:
          type: string
          example: my-weather-app
          description: The application's handle (unique per org). Not the internal database uuid.
        displayName:
          type: string
          example: Weather App
        description:
          type: string
          example: Application used to call Weather APIs.
        appKeyMappings:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationKeyMappingSummary"
        createdBy:
          type: string
          description: >-
            Identity of the user who created this application, or `deleted_user` if that user's IDP reference no
            longer exists. Present on single-resource GET responses and list items.
          example: alice@example.com
        updatedBy:
          type: string
          description: >-
            Identity of the user who last updated this application, or `deleted_user` if that user's IDP reference
            no longer exists. Present on single-resource GET responses only, omitted on list items.
          example: alice@example.com
        createdAt:
          type: string
          format: date-time
          example: "2026-05-07T08:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-07T08:30:00Z"
      additionalProperties: false
    ApplicationKeyMappingSummary:
      type: object
      description: OAuth client ID mapping entry attached to an application.
      properties:
        asClientId:
          type: string
          description: OAuth client ID, created directly in the key manager and linked to this application.
          example: asgardeo-client-abc123
        kmId:
          type: string
          description: UUID of the key manager this client ID is linked to.
          example: km-uuid-12345
        type:
          type: string
          enum:
            - PRODUCTION
            - SANDBOX
          description: Key type for this mapping.
          example: PRODUCTION
      additionalProperties: false
    ViewResponse:
      type: object
      required:
        - id
        - displayName
        - labels
      properties:
        id:
          type: string
          description: The view's handle (unique per org). Not the internal database uuid.
          example: partner-apis
        displayName:
          type: string
          example: Partner APIs
        labels:
          type: array
          items:
            type: string
          example:
            - partner
            - public
        createdBy:
          type: string
          description: >-
            Identity of the user who created this view, or `deleted_user` if that user's IDP reference no longer
            exists. Present on single-resource GET responses and list items.
          example: alice@example.com
        updatedBy:
          type: string
          description: >-
            Identity of the user who last updated this view, or `deleted_user` if that user's IDP reference no
            longer exists. Present on single-resource GET responses only, omitted on list items.
          example: alice@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    OrganizationCreateRequest:
      type: object
      required:
        - displayName
        - id
        - idpRefId
      properties:
        displayName:
          type: string
          example: Acme Corporation
        businessOwner:
          type: string
        businessOwnerContact:
          type: string
        businessOwnerEmail:
          type: string
          format: email
        id:
          type: string
          description: Desired handle for the organization (unique), stored as-is. Used in portal URLs.
          example: acme
        idpRefId:
          type: string
          description: >-
            The organization claim value asserted by the configured Identity Provider at SSO login. Must exactly
            match the IDP's org claim for that org's users, or login will fail. Distinct from `cpRefId`.
        cpRefId:
          type: string
          nullable: true
          description: >-
            Control Plane reference ID, included in outbound webhook event payloads. Not used for authentication.
        configuration:
          type: object
          description: Free-form organization configuration.
          additionalProperties: true
      additionalProperties: false
    OrganizationUpdateRequest:
      type: object
      required:
        - displayName
        - id
        - idpRefId
      properties:
        displayName:
          type: string
          example: Acme Corporation
        businessOwner:
          type: string
        businessOwnerContact:
          type: string
        businessOwnerEmail:
          type: string
          format: email
        id:
          type: string
          description: Desired handle for the organization (unique), stored as-is. Used in portal URLs.
          example: acme
        idpRefId:
          type: string
          description: >-
            The organization claim value asserted by the configured Identity Provider at SSO login. Must exactly
            match the IDP's org claim for that org's users, or login will fail. Distinct from `cpRefId`.
        cpRefId:
          type: string
          nullable: true
          description: >-
            Control Plane reference ID, included in outbound webhook event payloads. Not used for authentication.
        configuration:
          type: object
          description: Free-form organization configuration.
          additionalProperties: true
    SubscriptionPlanRequest:
      type: object
      example:
        id: Gold
        refId: string
        displayName: string
        description: string
        limits:
          - limitType: REQUEST_COUNT
            limitCount: 10000
            timeUnit: MINUTE
            timeAmount: 1
      required:
        - displayName
      properties:
        id:
          type: string
          description: >-
            Optional desired handle for the plan (unique per org), stored as-is. When omitted, the server
            generates a UUID handle. When the plan is created from a SubscriptionPlan YAML artifact instead,
            the handle is always taken from `metadata.name`.
          example: Gold
        refId:
          type: string
          description: Platform API subscription plan UUID to associate with this plan.
        displayName:
          type: string
        description:
          type: string
        limits:
          type: array
          description: >-
            Rate/quota limits enforced for this plan. Omit or leave empty for an unlimited plan. Replaces the
            whole limit set on update.
          items:
            type: object
            required:
              - limitCount
            properties:
              limitType:
                type: string
                enum:
                  - REQUEST_COUNT
                  - EVENT_COUNT
                  - BANDWIDTH
                  - TOTAL_TOKEN_COUNT
                default: REQUEST_COUNT
              limitCount:
                type: integer
                description: Use -1 for unlimited, otherwise a positive number.
                example: 10000
              timeUnit:
                type: string
                enum:
                  - MINUTE
                  - HOUR
                  - DAY
                  - MONTH
                  - null
                nullable: true
                description: Omit for a limit with no time window.
              timeAmount:
                type: integer
                default: 1
                description: Size of the time window, in `timeUnit` units.
        type:
          type: string
          enum:
            - requestcount
            - eventcount
          description: >-
            Legacy shorthand accepted only via SubscriptionPlan/SubscriptionPlanList YAML upload
            (`multipart/form-data`); converted into `limits` before storage. Ignored for JSON requests — use
            `limits` instead.
        requestCount:
          oneOf:
            - type: integer
            - type: string
          description: "Legacy YAML shorthand paired with `type: requestcount`. Use -1 for unlimited."
        eventCount:
          oneOf:
            - type: integer
            - type: string
          description: "Legacy YAML shorthand paired with `type: eventcount`. Use -1 for unlimited."
    LabelRequest:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          example: premium
          description: Desired handle for the label (unique per org), stored as-is.
        displayName:
          type: string
          example: Premium APIs
      additionalProperties: false
    ApplicationRequest:
      type: object
      required:
        - displayName
        - description
      properties:
        displayName:
          type: string
          example: Weather App
        id:
          type: string
          description: >-
            Immutable, org-scoped slug for the application, stored as its handle. Optional — defaults to the
            application's `displayName` when omitted.
          example: my-weather-app
        description:
          type: string
          example: Application used to call Weather APIs.
    SubscriptionCreateRequest:
      type: object
      required:
        - artifactId
        - subscriptionPlanId
      properties:
        artifactId:
          type: string
          description: API ID.
          example: weather-api-v1
        subscriptionPlanId:
          type: string
          description: API Portal subscription plan ID.
          example: Gold
      additionalProperties: false
    SubscriptionUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
      additionalProperties: false
    SubscriptionChangePlanRequest:
      type: object
      required:
        - planId
      properties:
        artifactId:
          type: string
          description: >-
            API ID the subscription belongs to. Optional — if provided, it is validated
            against the API derived from the existing subscription record and the request is rejected with
            400 if they don't match. It is never used as a fallback: if the API cannot be derived from the
            subscription record, the request fails with 400 regardless of this value.
          example: weather-api-v1
        planId:
          type: string
          description: API Portal subscription plan ID to switch to.
          example: Gold
      additionalProperties: false
    SubscriptionResponse:
      type: object
      description: Subscription payload.
      properties:
        subscriptionId:
          type: string
          example: sub-12345
        artifactId:
          type: string
          description: API ID.
          example: weather-api-v1
        subscriptionToken:
          type: string
          nullable: true
          description: >-
            Plaintext subscription token, decrypted on every read (not just on create). Null if decryption fails
            (e.g. the encryption key changed since the token was stored).
          example: a3f1e8b2c4d6e8f0a1b3c5d7e9f10b2c4d6e8f0a1b3c5d7e9f10b2c4d6e8f0a1
        subscriptionPlanName:
          type: string
          example: Gold
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
        createdBy:
          type: string
          description: >-
            Identity of the user who created the subscription, or `deleted_user` if that user's IDP reference no
            longer exists. Present on single-resource GET responses and list items.
          example: alice@example.com
        updatedBy:
          type: string
          description: >-
            Identity of the user who last updated the subscription, or `deleted_user` if that user's IDP reference
            no longer exists. Present on single-resource GET responses only, omitted on list items.
          example: alice@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ApiKeyRequest:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,127}$
          description: >-
            Optional handle for the key. When provided it must match the pattern and be unique
            for this API; when omitted, the server generates a UUID handle.
          example: weather_prod_key
        displayName:
          type: string
          description: Optional human-readable name for the key. Defaults to `id` when omitted.
          example: Weather Prod Key
        subscriptionId:
          type: string
          description: Optional subscription ID to associate the key with.
          example: sub-abc123
        appId:
          type: string
          description: >-
            Optional application ID to associate the key with, for analytics attribution only — it has no effect on
            the key's validity or authorization. Must belong to the same organization and be owned by the caller.
          example: my-weather-app
        expiresAt:
          oneOf:
            - type: string
              format: date-time
            - type: number
          description: Optional ISO-8601 datetime with timezone, epoch seconds, or epoch milliseconds.
          example: "2026-12-31T23:59:59Z"
      additionalProperties: false
    ApiKeyMetadataResponse:
      type: object
      description: API key metadata returned by list operations. Secret material is omitted.
      properties:
        id:
          type: string
          example: weather_prod_key
        displayName:
          type: string
          example: Weather Prod Key
        apiId:
          type: string
          description: API ID the key belongs to.
          example: weather-api-v1
        appId:
          type: string
          nullable: true
          description: ID of the application this key is associated with, if any. Analytics attribution only.
          example: my-weather-app
        appDisplayName:
          type: string
          nullable: true
          description: Display name of the associated application, if any.
          example: My Mobile App
        status:
          type: string
          enum:
            - ACTIVE
            - REVOKED
          example: ACTIVE
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    ApiKeyResponse:
      type: object
      description: >-
        API key response returned by generate/regenerate only. Unlike ApiKeyMetadataResponse, this does not include
        apiId, appId, appDisplayName, createdAt, or revokedAt — generate/regenerate return only these five fields.
      properties:
        id:
          type: string
          example: weather_prod_key
        displayName:
          type: string
          example: Weather Prod Key
        key:
          type: string
          description: One-time plaintext API key secret.
          example: ak_dGhpcyBpcyBub3QgYSByZWFsIGtleQ
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-12-31T23:59:59Z"
        status:
          type: string
          enum:
            - ACTIVE
            - REVOKED
          example: ACTIVE
      additionalProperties: false
    ApiKeyApplicationResponse:
      type: object
      properties:
        application:
          type: object
          properties:
            id:
              type: string
              example: my-weather-app
            displayName:
              type: string
              example: My Mobile App
    KeyManagerRequest:
      type: object
      required:
        - displayName
        - tokenEndpoint
      properties:
        displayName:
          type: string
          example: Asgardeo
        id:
          type: string
          description: >-
            Optional desired handle for the key manager (unique per org), stored as-is. When omitted, the
            server generates a UUID handle. A collision on a handle you supply yourself is reported as 409.
          example: asgardeo-prod
        enabled:
          type: boolean
          default: true
          example: true
        tokenEndpoint:
          type: string
          format: uri
          description: >-
            OAuth2 token endpoint. The OAuth application itself must be created directly in this key manager; the
            portal only proxies `client_appKeyMappings` token requests to this endpoint.
          example: https://api.asgardeo.io/t/myorg/oauth2/token
      additionalProperties: false
    KeyManagerUpdateRequest:
      type: object
      description: >-
        Partial update payload for a key manager. All fields are optional; only supplied fields are applied. Omitted
        fields retain their stored values.
      properties:
        displayName:
          type: string
          example: Asgardeo
        id:
          type: string
          description: Desired handle for the key manager (unique per org), stored as-is.
          example: asgardeo-prod
        enabled:
          type: boolean
          default: true
          example: true
        tokenEndpoint:
          type: string
          format: uri
          example: https://api.asgardeo.io/t/myorg/oauth2/token
      additionalProperties: false
    KeyManagerResponseSchema:
      type: object
      description: Key manager configuration.
      properties:
        id:
          type: string
          description: The key manager's handle (unique per org). Not the internal database uuid.
          example: asgardeo-prod
        displayName:
          type: string
          example: Asgardeo
        orgId:
          type: string
          example: org-12345
        enabled:
          type: boolean
          example: true
        tokenEndpoint:
          type: string
          format: uri
          example: https://api.asgardeo.io/t/myorg/oauth2/token
        createdBy:
          type: string
          description: >-
            Identity of the user who created this key manager, or `deleted_user` if that user's IDP reference no
            longer exists. Present on single-resource GET responses and list items.
          example: alice@example.com
        updatedBy:
          type: string
          description: >-
            Identity of the user who last updated this key manager, or `deleted_user` if that user's IDP reference
            no longer exists. Present on single-resource GET responses only, omitted on list items.
          example: alice@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    KeyManagerPublicResponseSchema:
      type: object
      description: Minimal developer-facing key manager view.
      properties:
        id:
          type: string
          description: The key manager's handle (unique per org). Not the internal database uuid.
          example: asgardeo-prod
        displayName:
          type: string
          example: Asgardeo
        tokenEndpoint:
          type: string
          format: uri
          example: https://api.asgardeo.io/t/myorg/oauth2/token
      additionalProperties: false
    WebhookSubscriberRequest:
      type: object
      required:
        - displayName
        - targetUrl
      properties:
        id:
          type: string
          description: >-
            Optional handle for the webhook subscriber (unique per org), stored as-is. When omitted, the
            server generates a UUID handle. Supply it only when you need a specific, stable identifier — it is
            the id used in the resource path, and a collision on a handle you supplied yourself is reported as 409.
          example: production-gateway
        displayName:
          type: string
          description: Display name for the webhook subscriber.
          example: Production Gateway
        targetUrl:
          type: string
          format: uri
          description: >-
            Target URL events are POSTed to.
          example: https://gateway.example.com/api-portal-webhook
        secret:
          type: string
          description: >-
            Shared secret, used for two purposes: signing outgoing payloads (HMAC-SHA256), and deriving the
            AES-256-GCM key that encrypts sensitive fields in secret event payloads (apikey.*, subscription.*)
            so only the subscriber can read the plaintext value. Stored encrypted; never returned in responses.
          example: <shared-secret>
        events:
          type: array
          items:
            type: string
          description: >-
            Glob-style event type allowlist (only a trailing `*` wildcard is supported, e.g. `apikey.*`). Omit or leave
            empty to receive all event types.
          example:
            - apikey.*
            - subscription.*
        enabled:
          type: boolean
          default: true
          example: true
        timeoutMs:
          type: integer
          default: 5000
          example: 5000
      additionalProperties: false
    WebhookSubscriberResponseSchema:
      type: object
      description: Webhook subscriber configuration. The secret is never included.
      properties:
        id:
          type: string
          description: The webhook subscriber's handle (unique per org). Not the internal database uuid.
          example: production-gateway
        orgId:
          type: string
          example: org-12345
        displayName:
          type: string
          example: Production Gateway
        targetUrl:
          type: string
          format: uri
          example: https://gateway.example.com/api-portal-webhook
        enabled:
          type: boolean
          example: true
        events:
          type: array
          items:
            type: string
          example:
            - apikey.*
            - subscription.*
        timeoutMs:
          type: integer
          example: 5000
        hasSecret:
          type: boolean
          description: >-
            Whether a secret is configured. The same secret both HMAC-signs outgoing payloads and encrypts
            sensitive fields in secret event payloads.
          example: true
        createdBy:
          type: string
          description: >-
            Identity of the user who created this webhook subscriber, or `deleted_user` if that user's IDP
            reference no longer exists. Present on single-resource GET responses and list items.
          example: alice@example.com
        updatedBy:
          type: string
          description: >-
            Identity of the user who last updated this webhook subscriber, or `deleted_user` if that user's IDP
            reference no longer exists. Present on single-resource GET responses only, omitted on list items.
          example: alice@example.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WebhookSubscriberDeliverySummary:
      type: object
      description: A single delivery attempt made to a webhook subscriber.
      properties:
        deliveryId:
          type: string
          example: del-abc123
        eventType:
          type: string
          nullable: true
          example: apikey.generated
        occurredAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - IN_FLIGHT
            - DELIVERED
            - FAILED
          example: DELIVERED
        lastHttpStatus:
          type: integer
          nullable: true
          example: 200
        lastError:
          type: string
          nullable: true
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
    AppKeyMappingRequest:
      type: object
      required:
        - keyManager
        - consumerKey
      properties:
        keyManager:
          type: string
          example: Resident Key Manager
        type:
          type: string
          enum:
            - PRODUCTION
            - SANDBOX
          default: PRODUCTION
          example: PRODUCTION
        consumerKey:
          type: string
          description: >-
            The OAuth client_id, created directly in the key manager. The portal does not store or persist the client
            secret — it is supplied per-request when generating a token and is only seen transiently during that request.
          example: consumer-key-123
      additionalProperties: false
    ViewCreateRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Desired handle for the view (unique per org), stored as-is.
          example: partner-apis
        displayName:
          type: string
          description: Optional display name. Defaults to the handle when omitted.
          example: Partner APIs
        labels:
          type: array
          description: >-
            Label names to attach to the view. Optional — omit or pass an empty array to create a view with no
            labels, which surfaces no APIs until labels are attached later via the update endpoint.
          items:
            type: string
          example:
            - partner
            - public
      additionalProperties: false
    ViewUpdateRequest:
      type: object
      properties:
        id:
          type: string
          description: >-
            New handle for the view (unique per org). Omit to leave the handle unchanged. The view keeps its
            identity, so its labels, assets and API workflows follow the rename — but every portal URL embeds
            the handle, so links to the old one stop resolving. Returns 409 if another view already uses it.
          example: partner-apis
        displayName:
          type: string
          example: Partner and Public APIs
        labels:
          type: array
          description: >-
            Full desired set of label names for the view. Labels present here but not currently attached are
            attached; labels currently attached but absent here are detached. Omit to leave labels unchanged.
          items:
            type: string
          example:
            - partner
            - premium
      additionalProperties: false
    OAuthGenerateTokenRequest:
      type: object
      description: >-
        OAuth access token generation payload. `consumerSecret` is required — the portal uses it to call the
        Authorization Server token endpoint directly.
      required:
        - consumerSecret
      properties:
        consumerSecret:
          type: string
          description: >-
            Client secret for the OAuth application. Not stored by the portal — the caller must supply it on each token
            generation request.
          example: my-consumer-secret
        scopes:
          type: array
          items:
            type: string
          example:
            - weather.read
        validityPeriod:
          type: integer
          example: 3600
      additionalProperties: true
    ApplicationOAuthKeyResponse:
      type: object
      description: OAuth key mapping payload.
      properties:
        keyMappingId:
          type: string
          example: km-12345
        keyManager:
          type: string
          example: Resident Key Manager
        type:
          type: string
          example: PRODUCTION
        consumerKey:
          type: string
          example: consumer-key-123
        tokenEndpoint:
          type: string
          format: uri
          example: https://api.asgardeo.io/t/myorg/oauth2/token
      additionalProperties: true
    OAuthTokenResponse:
      type: object
      description: >-
        Access token response proxied from the key manager's token endpoint. Field names are the portal's own
        camelCase, not the underlying OAuth2 token response's snake_case.
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.example
        validityTime:
          type: integer
          nullable: true
          description: Token lifetime in seconds, as reported by the key manager (`expires_in`).
          example: 3600
        tokenScopes:
          type: array
          items:
            type: string
          example:
            - weather.read
      additionalProperties: true
    APIWorkflowCreateResponse:
      type: object
      properties:
        id:
          type: string
          example: workflow-12345
        displayName:
          type: string
          example: Weather onboarding
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
          example: PUBLISHED
      additionalProperties: false
    APIWorkflowResponse:
      type: object
      properties:
        id:
          type: string
          example: workflow-12345
          description: The workflow's handle (unique per org and view). Not the internal database uuid.
        displayName:
          type: string
          example: Weather onboarding
        description:
          type: string
        agentPrompt:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
          example: PUBLISHED
        agentVisibility:
          type: string
          enum:
            - VISIBLE
            - HIDDEN
          example: VISIBLE
        contentType:
          type: string
          enum:
            - ARAZZO
            - MD
        apiWorkflowDefinition:
          type: string
          nullable: true
        markdownContent:
          type: string
          nullable: true
        createdAt:
          type: string
          example: May 7, 2026
        updatedAt:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
      additionalProperties: false
    APIWorkflowPromptResponse:
      type: object
      properties:
        agentPrompt:
          type: string
      additionalProperties: false
    APIWorkflowCreateRequest:
      type: object
      required:
        - displayName
        - description
      properties:
        displayName:
          type: string
          example: Weather onboarding
        id:
          type: string
          description: Desired handle for the workflow (unique per org and view), stored as-is.
          example: weather-onboarding
        description:
          type: string
          example: Guides users through the Weather API onboarding workflow.
        agentPrompt:
          type: string
          example: Follow this workflow to onboard a Weather API user.
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
          default: PUBLISHED
          example: PUBLISHED
        agentVisibility:
          type: string
          enum:
            - VISIBLE
            - HIDDEN
          default: VISIBLE
          example: VISIBLE
        contentType:
          type: string
          enum:
            - ARAZZO
            - MD
          default: ARAZZO
        apiWorkflowDefinition:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
          description: JSON/YAML Arazzo content when `contentType` is `ARAZZO`.
        markdownContent:
          type: string
          description: Markdown content when `contentType` is `MD`.
    APIWorkflowUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          example: Weather onboarding v2
        id:
          type: string
          description: Desired handle for the workflow (unique per org and view), stored as-is.
          example: weather-onboarding-v2
        description:
          type: string
          example: Updated Weather API onboarding workflow.
        agentPrompt:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
          example: PUBLISHED
        agentVisibility:
          type: string
          enum:
            - VISIBLE
            - HIDDEN
          example: VISIBLE
        contentType:
          type: string
          enum:
            - ARAZZO
            - MD
        apiWorkflowDefinition:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
        markdownContent:
          type: string
    APIWorkflowPromptRequest:
      type: object
      required:
        - displayName
        - description
      properties:
        displayName:
          type: string
          example: Weather onboarding
        description:
          type: string
          example: Guides users through the Weather API onboarding workflow.
        apis:
          type: array
          items:
            type: object
            additionalProperties: true
        orgHandle:
          type: string
          example: acme
        viewName:
          type: string
          default: default
          example: default
        id:
          type: string
          description: The workflow's (would-be) handle, used only to build the workflow detail URL referenced in the generated prompt.
          example: weather-onboarding
    WebhookEventDelivery:
      type: object
      description: A single webhook delivery attempt.
      properties:
        deliveryId:
          type: string
          example: del-abc123
        subscriberId:
          type: string
          example: sub-xyz789
        targetUrl:
          type: string
          nullable: true
          example: https://example.com/webhook
        status:
          type: string
          enum:
            - PENDING
            - IN_FLIGHT
            - DELIVERED
            - FAILED
          example: DELIVERED
        lastHttpStatus:
          type: integer
          nullable: true
          example: 200
        lastError:
          type: string
          nullable: true
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    WebhookEvent:
      type: object
      description: A webhook event with its delivery rows.
      properties:
        eventId:
          type: string
          example: evt-abc123
        eventType:
          type: string
          example: apikey.generated
        orgId:
          type: string
          example: org-default
        aggregateType:
          type: string
          example: apikey
        aggregateId:
          type: string
          example: key-12345
        status:
          type: string
          enum:
            - PENDING
            - DISPATCHED
            - ALL_DELIVERED
            - FAILED
          example: ALL_DELIVERED
        occurredAt:
          type: string
          format: date-time
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventDelivery"
      additionalProperties: false
