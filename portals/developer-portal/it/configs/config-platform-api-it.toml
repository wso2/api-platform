#
# Platform API file-based auth config for the developer-portal backend IT
# suite. Modeled on ../../configs/config-platform-api-template.toml, with three
# accounts (admin / publisher / developer, password == username) instead of
# just admin, so tests exercise real role-scoped authorization rather than the
# devportal-it-test-key API key bypass.
#
# Regenerate a password hash: htpasswd -bnBC 10 "" <password> | tr -d ':\n'
# --------------------------------------------------------------------

[platform_api]

[platform_api.logging]
level = '{{ env "APIP_CP_LOGGING_LEVEL" "info" }}'

[platform_api.security]
encryption_key = '{{ env "APIP_CP_ENCRYPTION_KEY" }}'

[platform_api.server.https]
enabled   = '{{ env "APIP_CP_SERVER_HTTPS_ENABLED" "true" }}'
port      = '{{ env "APIP_CP_SERVER_HTTPS_PORT" "9243" }}'
cert_file = '{{ env "APIP_CP_SERVER_HTTPS_CERT_FILE" "/app/data/certs/cert.pem" }}'
key_file  = '{{ env "APIP_CP_SERVER_HTTPS_KEY_FILE" "/app/data/certs/key.pem" }}'

[platform_api.database]
driver = '{{ env "APIP_CP_DATABASE_DRIVER" "sqlite3" }}'
path   = '{{ env "APIP_CP_DATABASE_PATH" "/app/data/platform-api-it.db" }}'

[platform_api.auth]
mode = '{{ env "APIP_CP_AUTH_MODE" "file" }}'

# Each user below names a role from this file — a role is a file-mode user's
# entire grant, so the scope lists live there, not here.
[platform_api.auth.authorization]
roles_to_scope_mapping = "/etc/platform-api/roles_to_scope_mapping.yaml"

[platform_api.auth.jwt]
issuer      = '{{ env "APIP_CP_AUTH_JWT_ISSUER" "platform-api-it" }}'
# RS256 keypair generated by `make ensure-certs` (it/Makefile) and bind-mounted
# read-only at /etc/platform-api/keys. The server reads these paths directly
# rather than inlining the PEM content into config.
public_key_file  = '{{ env "APIP_CP_AUTH_JWT_PUBLIC_KEY_FILE" "/etc/platform-api/keys/jwt_public.pem" }}'
private_key_file = '{{ env "APIP_CP_AUTH_JWT_PRIVATE_KEY_FILE" "/etc/platform-api/keys/jwt_private.pem" }}'

[platform_api.auth.file.organization]
id           = '{{ env "APIP_CP_AUTH_FILE_ORGANIZATION_ID" "default" }}'
display_name = '{{ env "APIP_CP_AUTH_FILE_ORGANIZATION_DISPLAY_NAME" "Default" }}'
region       = '{{ env "APIP_CP_AUTH_FILE_ORGANIZATION_REGION" "us" }}'

# Full access — organization management plus every resource area.
[[platform_api.auth.file.users]]
username      = "admin"
password_hash = "$2y$10$U2yKMwGamGwDoMu0hRPT7u8nCuP8z/qxHFOKV6dhIxkJN9NJ0eVQ."
roles         = ["dp_admin_it"]

# Content/config manager — APIs, MCP servers, key managers, subscription
# plans, views/labels, webhook subscribers, API workflows. No org management,
# no application ownership (that's the developer's).
[[platform_api.auth.file.users]]
username      = "publisher"
password_hash = "$2y$10$BN9I5oPs34clNmhlO0CX0uDMKMnh9xkczGGmuLiInXSe/KOF5wqFW"
roles         = ["dp_publisher_it"]

# Portal end-user — read APIs/MCP servers, own applications, subscriptions,
# and API keys. No org, key-manager, view/label, or webhook-subscriber management.
[[platform_api.auth.file.users]]
username      = "developer"
password_hash = "$2y$10$jX3o2E5jF4i3EOgoyJ0k.uegbDYmsmFNDfIxnvcZgTNJifAPjgKKK"
roles         = ["dp_developer_it"]
