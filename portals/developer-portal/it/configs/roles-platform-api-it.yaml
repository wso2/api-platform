      - dp:app_key_mapping_write
      - dp:app_key_mapping_manage
      - dp:subscription_create
      - dp:subscription_read
      - dp:subscription_update
      - dp:subscription_manage
      - dp:subscription_delete
      - dp:sub_plan_create
      - dp:sub_plan_read
      - dp:sub_plan_update
      - dp:sub_plan_manage
      - dp:sub_plan_delete
      - dp:km_create
