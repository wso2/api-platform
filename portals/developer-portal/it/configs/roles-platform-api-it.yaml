#
# Role-to-scope mapping for the developer-portal backend IT suite, named by
# auth.authorization.role_mappings in config-platform-api-it.toml. A file-mode
# user's role is its entire grant, so the three IT accounts (admin / publisher /
# developer) get one role each, defined here rather than as per-user scope lists.
#
# These are Developer Portal ("dp:") scopes throughout: the Platform API mints
# them into the tokens it issues but does not enforce them, so it checks only
# their shape. The suite's own authorization assertions are what exercise them.
# --------------------------------------------------------------------

roles:
  # Full access — organization management plus every resource area.
  - name: dp_admin_it
    scopes:
      - dp:org_read
      - dp:org_create
      - dp:org_update
      - dp:org_manage
      - dp:org_delete
      - dp:org_content_read
      - dp:org_content_write
      - dp:org_content_manage
      - dp:org_content_delete
      - dp:api_read
      - dp:api_create
      - dp:api_update
      - dp:api_manage
      - dp:api_delete
      - dp:api_content_read
      - dp:api_content_write
      - dp:api_content_manage
      - dp:api_content_delete
      - dp:mcp_read
      - dp:mcp_create
      - dp:mcp_update
      - dp:mcp_manage
      - dp:mcp_delete
      - dp:mcp_content_read
      - dp:mcp_content_create
      - dp:mcp_content_update
      - dp:mcp_content_manage
      - dp:mcp_content_delete
      - dp:api_key_create
      - dp:api_key_read
      - dp:api_key_update
      - dp:api_key_manage
      - dp:api_key_revoke
      - dp:mcp_key_create
      - dp:mcp_key_read
