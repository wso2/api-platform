# Role-to-scope mapping used by the Platform API (auth.authorization.role_to_scope_mapping).
#
# Each entry maps a role name to the scopes that role grants. Two consumers read
# this file:
#
#   * role authorization (auth.authorization.mode = "role") — the roles claim of
#     an incoming token is expanded through this file on every request.
#   * file-mode users (auth.file.users[].roles) — the login endpoint expands the
#     roles once, into the scope claim of the token it issues. Those roles are
#     such a user's entire grant, so this file is the only place their privileges
#     are defined; there is no per-user scope list to keep in sync with it.
#
# When a token — or a file-mode user's roles list — carries multiple roles, the
# effective scopes are the union of all matching entries; most-permissive wins.
#
# Naming: roles are named after the platform ("ap_") rather than after any one
# IDP's convention, because the same file serves every auth mode. Map your IDP's
# groups onto these names via auth.claim_mappings.roles; supported claim paths:
#   Asgardeo            — roles: roles
#   Keycloak            — roles: realm_access.roles  (or resource_access.<client>.roles)
#   Microsoft Entra ID  — roles: roles
#
# Scopes span the whole platform, not just this server:
#   ap:*  Platform API scopes. Every one must be declared in this server's OpenAPI
#         spec (plus any its compiled-in plugins declare) — an unknown ap: scope
#         fails startup rather than silently denying requests later. The
#         event-gateway scopes below are commented out for that reason: uncomment
#         them on a build that includes that plugin.
#
# The shipped roles grant Platform API scopes only. A scope in another
# component's namespace (the API Portal's dp:*, say) may be added to a role: this
# server mints it into the token but never enforces it, so it validates only its
# shape, not its existence.
#
# Scope convention — ap: scopes are permissions from the permission tree in
# resources/permission-tree.yaml (ThunderID model: resource -> sub-resource ->
# action, joined with ":"), e.g. ap:api:rest:deployment:manage.
#   ap:<node>:read     every side-effect-free operation on that node AND on
#                      every node below it
#   ap:<node>:manage   every operation on that node AND on every node below it
#   ap:<node>:<action> one action (create, update, delete, restore, undeploy,
#                      ...) on that node only: ap:api:rest:create creates a
#                      REST API, not its builds, deployments or keys
# Only read and manage flow DOWN the tree: ap:api:read reads every API kind with
# its builds, deployments and key listings; ap:api:llm:manage covers everything
# under LLM proxies. Grant the highest node that matches the persona and do not
# list a node already covered by an ancestor. The root is a node too: ap:manage
# admits every Platform API operation and ap:read every read, which is what
# the admin and viewer roles below grant. A token minted from a role (file
# mode) carries the role's list verbatim, so an admin token holds just those.
#   ap:credential:api_key:all:manage — ownership override (widens which users'
#                      API keys are reachable, not which actions; GO-AUTH-020).
#                      Never implied by any other permission.
#
# Pre-tree names (ap:rest_api:*, ap:llm_proxy:*, ...) are no longer declared by
# the OpenAPI spec. They stay accepted here and in tokens through
# resources/legacy-scope-mapping.yaml, which names the tree permission each one
# grants; ScopeEnforcer translates them per request. Prefer the tree names in
# this file — the shipped roles use nothing else. scripts/permission_tree.py
# generates the spec's security blocks from the tree.
#
# An event-gateway build adds the ap:api:websub and ap:api:webbroker nodes.
# ap:api:read and ap:api:manage already cover them there, so only a role that
# holds per-kind grants (the operator's deployment grants) needs the commented
# event-gateway lines below; they fail startup on a default build.
#
# There is no wildcard form: a scope grants only the operations that list it. A
# "*" in any segment is rejected as malformed at startup.
#
# This file requires a server restart to take effect.

roles:
  # Platform administrator — full access to every resource and operation.
  - name: ap_admin
    scopes:
      # Platform API — the root permission admits every operation.
      - ap:manage
      # Administrative access to every user's API keys, not just the caller's.
      # Never implied by any other permission, the root included.
      - ap:credential:api_key:all:manage

  # Platform operator / CI-CD service account — runs gateways, deployments and
  # subscription plans; reads everything else, including API Portal
  # registrations (creating and deleting portals is admin-only).
  - name: ap_operator
    scopes:
      - ap:api:read
      - ap:api:rest:build:manage
      - ap:api:rest:deployment:manage
      - ap:api:graphql:build:manage
      - ap:api:graphql:deployment:manage
      - ap:api:llm:build:manage
      - ap:api:llm:deployment:manage
      - ap:api:mcp:build:manage
      - ap:api:mcp:deployment:manage
      - ap:api:agent:build:manage
      - ap:api:agent:deployment:manage
      # - ap:api:websub:deployment:manage   # event-gateway build only
      # - ap:api:webbroker:deployment:manage   # event-gateway build only
      - ap:llm_provider:read
      - ap:llm_provider:template:manage
      - ap:llm_provider:build:manage
      - ap:llm_provider:deployment:manage
      - ap:gateway:manage
      - ap:gateway_policy:manage
      - ap:organization:read
      - ap:project:read
      - ap:application:read
      - ap:subscription:read
      - ap:subscription_plan:manage
      - ap:meter:manage
      - ap:content:read
      - ap:portal:read
      # MCP proxy publishing to a portal, kept from the pre-tree ap:api_portal:manage
      # grant (reserved: the AI Workspace gates on it ahead of the API operation).
      - ap:portal:mcp_proxy:manage
      - ap:publication:read
      - ap:credential:secret:read
      - ap:credential:api_key:read

  # API publisher — owns the full REST API, GraphQL API, MCP proxy, Agent proxy
  # and LLM proxy lifecycle and the portal drafts and publishing for it. LLM providers
  # are read-only: a publisher points proxies at an existing provider and can see
  # where it is deployed, but creating, editing, deleting and deploying providers
  # require admin access, except provider builds/deployments which operators also manage.
  # Manages secrets, which back the upstream auth values on
  # the proxies it configures. Reads applications, subscriptions and plans.
  - name: ap_publisher
    scopes:
      - ap:api:manage
      - ap:llm_provider:read
      - ap:gateway:read
      - ap:gateway_policy:read
      - ap:organization:read
      - ap:project:manage
      - ap:application:read
      - ap:subscription:read
      - ap:subscription_plan:read
      - ap:meter:read
      - ap:content:manage
      - ap:portal:read
      - ap:portal:draft:manage
      - ap:portal:rest_api:manage
      - ap:portal:graphql_api:manage
      - ap:publication:read
      - ap:credential:secret:manage
      - ap:credential:api_key:read

  # API consumer — manages its own applications, subscriptions and keys;
  # reads the API/MCP catalog and the plans it can subscribe to.
  - name: ap_subscriber
    scopes:
      # Platform API — every API kind's catalog, builds and deployments, read-only
      # (on an event-gateway build that includes WebSub and WebBroker APIs).
      - ap:api:read
      - ap:llm_provider:read
      - ap:organization:read
      - ap:project:read
      - ap:application:manage
      - ap:subscription:manage
      - ap:subscription_plan:read
      - ap:content:read
      - ap:credential:api_key:read

  # Auditor — read-only. Grants no mutating scope
  # (the two POSTs it can reach, mcp-proxies/fetch-server-info and
  # agent-proxies/fetch-agent-card, are reads the spec models as POSTs).
  - name: ap_viewer
    scopes:
      # Platform API — the root read permission admits every read.
      - ap:read
