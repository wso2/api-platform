# Pre-permission-tree scope names and the permission-tree scope each one grants.
#
# Until the permission tree (resources/permission-tree.yaml) replaced them, the
# Platform API's ap: scopes were named per resource and verb (ap:rest_api:create,
# ap:llm_proxy:deployment:read, ...). The OpenAPI spec no longer declares those
# names; this file is what keeps a token, an IDP role or a role-to-scope mapping
# that still carries them working:
#
#   * ScopeEnforcer (internal/middleware/authorization.go) translates every held
#     legacy scope into the permission listed here before matching the request's
#     accepted-scope list, so a legacy token is authorized exactly as a token
#     holding the mapped permission would be.
#   * role-to-scope-mapping.yaml validation accepts a legacy name wherever it
#     accepts a declared permission, so an operator's existing roles file loads.
#
# Each entry maps onto permissions of the node that absorbed the legacy
# resource — usually the one permission with the same action — so that a legacy
# scope reaches exactly the operations it reached before, plus only what a
# parent's :read now reaches on its sub-resources (ap:rest_api:read also lists
# builds and deployments). Where a node's :manage would reach sub-resources the
# legacy scope never governed (ap:api_portal:manage, ap:websub_api:manage,
# ap:webbroker_api:manage), the entry lists the node's own actions instead.
# internal/server/testdata/pre-tree-scopes.yaml records the pre-tree reach and
# TestLegacyNamesReachNoMoreThanBefore enforces this.
#
# The file is validated at startup against the OpenAPI spec (every permission
# here must be declared by an operation; no legacy name may still be declared)
# and by scripts/permission_tree.py --check against the tree. It is a frozen
# list: no new legacy name is ever added. Set legacy_scope_mapping_path = "" in
# config.toml to stop accepting legacy names altogether.
#
# Format: <legacy scope>: [<tree permission>, ...] — a list, so that a legacy
# scope can be mapped to more than one permission if a future tree change
# splits a node.

# A scope whose name did not change (ap:gateway:read, ap:project:create, ...)
# is still declared by the spec and needs no entry here. The event-gateway
# entries map onto permissions only that plugin's spec declares; they load on
# a build that includes the plugin.
scopes:
  # ap:agent_proxy:*
  ap:agent_proxy:create: [ap:api:agent:create]
  ap:agent_proxy:delete: [ap:api:agent:delete]
  ap:agent_proxy:manage: [ap:api:agent:manage]
  ap:agent_proxy:read: [ap:api:agent:read]
  ap:agent_proxy:update: [ap:api:agent:update]
  # ap:agent_proxy:api_key:*
  ap:agent_proxy:api_key:create: [ap:api:agent:api_key:create]
  ap:agent_proxy:api_key:delete: [ap:api:agent:api_key:delete]
  ap:agent_proxy:api_key:manage: [ap:api:agent:api_key:manage]
  ap:agent_proxy:api_key:read: [ap:api:agent:api_key:read]
  ap:agent_proxy:api_key:update: [ap:api:agent:api_key:update]
  # ap:agent_proxy:build:*
  ap:agent_proxy:build:create: [ap:api:agent:build:create]
  ap:agent_proxy:build:delete: [ap:api:agent:build:delete]
  ap:agent_proxy:build:manage: [ap:api:agent:build:manage]
