# Platform API permission tree.
#
# Every permission is a node path and an action joined with ":" (ap:api:rest:
# deployment:undeploy). All 197 pre-tree permissions keep their exact action
# names — create, update, delete, restore, undeploy, regenerate, publish,
# unpublish, deprecate — only their resource paths change; none is folded into
# manage. The four API/content
# aggregates (ap:api:read, ap:api:manage, ap:content:read, ap:content:manage)
# and the root's ap:read and ap:manage are explicit additions. Nodes marked
# `plugin: eventgateway` exist only on a build that includes that plugin; their
# permissions are declared by the plugin's own OpenAPI spec.
#
# Each `legacy` entry names a pre-tree resource prefix the node absorbed;
# legacy-scope-mapping.yaml lists the exact pre-tree scopes and the permission
# each one grants.
#
# x-operation-permissions binds every operation (by operationId, or by
# "METHOD /path" for a plugin operation that has none) to the permissions it
# accepts directly. scripts/permission_tree.py expands each binding by the
# inheritance rule below and writes the result into the operation's security
# block, so the OpenAPI specs — and the Platform API, which matches scopes by
# exact string equality — accept a parent's or the root's read and manage for
# every operation on the nodes beneath it. Run the script after editing this file;
# internal/server/permission_tree_test.go fails when the two disagree.
#
# The x-* fields are policy metadata, not executable middleware or standard
# OpenAPI semantics.
