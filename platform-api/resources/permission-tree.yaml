x-authorization-policy:
  scope_list_semantics: any
  inheritance: >-
    An operation bound to a node and action accepts that action's permission and
    :manage on the node itself, then :manage on every ancestor that defines it
    and, for a read, :read on every ancestor too. Only read and manage flow down
    the tree (ap:manage admits every operation and ap:read every read;
    ap:api:manage admits everything under ap:api; ap:api:rest:read admits every
    read under REST APIs). Every other verb applies to its own node only:
    ap:api:rest:create creates REST APIs and admits nothing on their builds,
    deployments, keys or gateways. Nothing is inferred
    from string prefixes at request time — the generator writes every admitting
    permission into each operation's security block, and the enforcer matches by
    exact string equality.
  ownership_override: ap:credential:api_key:all:manage is a separate ownership check; retain existing handler behavior.
  aggregate_members:
    ap:api:read:
    - ap:api:agent:api_key:read
    - ap:api:agent:build:read
    - ap:api:agent:deployment:read
    - ap:api:agent:read
