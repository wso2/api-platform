metadata:
  name: awsbedrock
spec:
  groupId: wso2-awsbedrock
  displayName: AWS Bedrock
  managedBy: wso2
  version: v1.0
  # This template drives the portal (auth form, logo, OpenAPI resources) and the
  # deployment that references the gateway's built-in `awsbedrock` template by
  # handle. Runtime extraction is done by the gateway's copy
  # (gateway/gateway-controller/default-llm-provider-templates/awsbedrock-template.yaml),
  # which additionally maps fallback identifiers, cache read/write tokens, the
  # per-TTL cache breakdown, cache accounting, and service tier. Those fields are
  # absent here on purpose: the Platform API template schema does not model them.
  # The fields both copies declare must stay identical.
  metadata:
    # Default upstream auth is an Amazon Bedrock API key, sent by the gateway as
    # `Authorization: Bearer <key>`; the portal prepends the `Bearer ` prefix so
    # the operator only pastes the raw key. Bedrock also accepts AWS SigV4: set
    # the upstream auth type to `none` and attach the `aws-authentication` policy
    # (service `bedrock`, the endpoint's Region, `default-credential-chain`) to
    # the Converse and ConverseStream operations. Bedrock API keys are not OAuth
    # tokens and have no token-exchange endpoint. See
    # llm-provider-specs/awsbedrock/README.md.
    #
    # endpointUrl is deliberately omitted because the Bedrock runtime host is
    # Region-specific (https://bedrock-runtime.<region>.amazonaws.com) and must
    # be supplied per provider.
    auth:
      type: apiKey
      header: Authorization
      valuePrefix: "Bearer "
    logoUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/awsbedrock/icon.png
    openapiSpecUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/awsbedrock/openapi.yaml
  promptTokens:
    location: payload
    identifier: $.usage.inputTokens
  completionTokens:
    location: payload
    identifier: $.usage.outputTokens
  totalTokens:
    location: payload
    identifier: $.usage.totalTokens
  requestModel:
    location: pathParam
    identifier: model/([A-Za-z0-9._:%-]+)/
  responseModel:
    location: pathParam
    identifier: model/([A-Za-z0-9._:%-]+)/
