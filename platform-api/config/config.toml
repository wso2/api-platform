[platform_api]

[platform_api.logging]
level = '{{ env "APIP_CP_LOGGING_LEVEL" "info" }}'

[platform_api.security]
encryption_key = '{{ file "/etc/platform-api/keys/encryption.key" }}'

[platform_api.database]
driver = "sqlite3"
path   = "./data/api_platform.db"

[platform_api.auth]
mode = "file"

[platform_api.auth.authorization]
enabled = true
mode    = "scope"
# Mounted role-to-scope mapping (resources/roles.yaml in this pack). Edit it to
# change what each role grants — it is config, not part of the image. The admin
# user below names a role from this file instead of listing platform scopes.
role_mappings = "/etc/platform-api/roles.yaml"

[platform_api.auth.jwt]
issuer            = "platform-api"
public_key_file   = "/etc/platform-api/keys/jwt_public.pem"
private_key_file  = "/etc/platform-api/keys/jwt_private.pem"

[platform_api.auth.file.organization]
id           = "default"
display_name = "Default"
region       = "us"

[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_ADMIN_USERNAME" }}'
password_hash = '{{ env "APIP_CP_ADMIN_PASSWORD_HASH" }}'
role          = '{{ env "APIP_CP_ADMIN_ROLE" "ap_admin" }}'
# Unioned with whatever the role grants. These four live here rather than in
# roles.yaml because that file's ap: scopes are validated against this server's
# OpenAPI spec: ap:devportal:manage / ap:git:read are AI Workspace BFF scopes this
# server only mints, and the event-gateway scopes are declared only on a build
# that compiles in that plugin — naming any of them in roles.yaml fails startup.
scopes        = "ap:devportal:manage ap:git:read ap:websub_api:manage ap:webbroker_api:manage"
