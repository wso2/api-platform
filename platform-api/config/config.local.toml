# Local (non-Docker) dev config: identical to config.toml except the file
# paths below point at the secrets ../portals/ai-workspace/scripts/setup.sh
# (actually ../portals/scripts/setup.sh, run from portals/ai-workspace) already
# generates — reusing the same quickstart tooling instead of hand-rolling
# openssl calls. Run `cd ../portals/ai-workspace && ../scripts/setup.sh` once
# first (it needs a docker-compose.yaml next to it to find its root, which
# platform-api doesn't have — ai-workspace is the nearest sibling that does).
# You don't need to actually run docker compose afterward.
#
# encryption_key is sourced via {{ env }}, not {{ file }}: configinterpolate's
# {{ file }} rejects any path containing ".." outright (path-traversal
# hardening) before it ever reaches the allowlist check, so a relative
# ../portals/... path can never work there regardless of
# APIP_CONFIG_FILE_SOURCE_ALLOWLIST. public_key_file/private_key_file/cert_file
# below aren't run through {{ file }} at all — the app os.ReadFile's those
# literal paths directly — so relative paths are fine for them. Export the
# setup.sh-generated key's bytes before `go run`:
#   export APIP_CP_ENCRYPTION_KEY=$(cat ../portals/ai-workspace/resources/keys/encryption.key)
#
# Not used by any docker-compose quickstart; those keep using config.toml as-is.

[platform_api]

[platform_api.logging]
level = '{{ env "APIP_CP_LOGGING_LEVEL" "info" }}'

[platform_api.security]
encryption_key = '{{ env "APIP_CP_ENCRYPTION_KEY" }}'

[platform_api.database]
driver = "sqlite3"
path   = "./data/api_platform.db"

[platform_api.auth]
mode = "file"

[platform_api.auth.authorization]
enabled = true
mode    = "scope"
role_to_scope_mapping = "./resources/role-to-scope-mapping.yaml"

[platform_api.auth.jwt]
issuer            = "platform-api"
public_key_file   = "../portals/ai-workspace/resources/keys/jwt_public.pem"
private_key_file  = "../portals/ai-workspace/resources/keys/jwt_private.pem"

[platform_api.auth.file.organization]
id           = "default"
display_name = "Default"
region       = "us"

[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_ADMIN_USERNAME" }}'
password_hash = '{{ env "APIP_CP_ADMIN_PASSWORD_HASH" }}'
roles         = ["ap_admin"]

[platform_api.server.https]
enabled   = true
cert_file = "../portals/ai-workspace/resources/certificates/cert.pem"
key_file  = "../portals/ai-workspace/resources/certificates/key.pem"
