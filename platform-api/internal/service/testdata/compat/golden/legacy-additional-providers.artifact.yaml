apiVersion: gateway.api-platform.wso2.com/v1
kind: LlmProxy
metadata:
    name: compat-additional
spec:
    displayName: Compat Additional Providers
    version: v1.0
    context: /multi
    vhost: api.example.com
    provider:
        id: openai-provider
        auth:
            header: Authorization
            type: api-key
            value: '{{ secret "openai-loopback" }}'
    additionalProviders:
        - id: anthropic-provider
          transformer:
            params:
                model: claude-sonnet-4-5
            type: openai-to-anthropic
            version: v0
        - id: gemini-provider
