# =============================================================================
# WSO2 API Platform — Feature Taxonomy
# =============================================================================
# Schema   : https://wso2.com/schemas/feature-taxonomy/v1
# Product  : WSO2 API Platform (APIP)
# =============================================================================


schema:
  version: "1.0.0"
  id: "https://wso2.com/schemas/feature-taxonomy/v1"

# -----------------------------------------------------------------------------
# PRODUCT
# -----------------------------------------------------------------------------

product:
  id: "apip"
  name: "WSO2 API Platform"
  version: "0.9.0"
  description: "AI-ready, GitOps-driven API platform for full lifecycle management across cloud, hybrid, and on-premises deployments."
  category: "api-management"
  is_active: true

# -----------------------------------------------------------------------------
# FEATURE CATEGORIES
# Hierarchy drives reporting rollups. Feature category ids must match the
# second segment of their feature.code.
# -----------------------------------------------------------------------------

categories:
  - id: "api-design"
    name: "API Design & Management"
    description: "Creating, validating, documenting, and testing APIs in the API Control Plane console, the CLI, and the Platform API."
    sub_categories:
      - id: "manage-apis"
        name: "Manage APIs"
        description: "REST and GraphQL API creation and management capabilities."

  - id: "gateway"
    name: "Gateway & Runtime"
    description: "Gateway registration, registration tokens, immutable mode, and Kubernetes resources for managed and self-hosted gateways."

  - id: "policies"
    name: "API Policies & Traffic Management"
    description: "Policy-first traffic management: authentication, rate limiting, routing, transformation, validation, and custom policies applied to APIs."

  - id: "security"
    name: "API Security"
    description: "API keys, secrets, service accounts, mutual TLS, and certificate management."

  - id: "lifecycle"
    name: "API Lifecycle Management"
    description: "Build, deployment, and publication of APIs, and their deprecation and unpublishing."

  - id: "developer-portal"
    name: "API Portal & MCP Hub"
    description: "Discovery, subscription, and consumption of APIs and MCP servers, and administration of the portal."

  - id: "key-management"
    name: "Key Management"
    description: "Key manager integration and consumer token and key provisioning."

  - id: "analytics"
    name: "Analytics & Observability"
    description: "Gateway analytics publishers, traffic logging, and tracing."

  - id: "monetization"
    name: "API Monetization"
    description: "Subscription plans, usage meters, billing configuration, and consumer checkout."

  - id: "admin"
    name: "Administration & Configuration"
    description: "Organization registration and project management."

  - id: "ai-gateway"
    name: "AI Gateway"
    description: "AI and LLM gateway features: guardrails, semantic caching, model routing, prompt management, and cost control."
    sub_categories:
      - id: "mcp"
        name: "MCP Gateway"
        description: "Model Context Protocol governance at the gateway."

  - id: "devops"
    name: "DevOps & CLI"
    description: "The ap command-line tool: GitOps apply, gateway and API Portal management, image builds, and MCP configuration generation."

# -----------------------------------------------------------------------------
# FEATURES
# code convention: apip.<category-id>.<action>
# -----------------------------------------------------------------------------

features:

  # ============================================================
  # MANAGE APIS
  # ============================================================

  - code: "apip.manage-apis.create-rest-api"
    name: "REST API Creation"
    description: "Create a REST API in the console, with the CLI, or through the Platform API, from scratch or by importing an OpenAPI contract."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.create-rest-api"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      aggregations:
        - type: "count"
          label: "REST APIs Created"
    sub_features:
      - code: "apip.manage-apis.create-rest-api.import-contract"
        name: "Contract Import"
        description: "Supply the OpenAPI contract by URL or file upload in the creation wizard."
        category: "manage-apis"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "0.9.0"
        tracking:
          event_name: "apip.manage-apis.create-rest-api.import-contract"
          event_category: "engagement"
          platforms: ["web"]
          dimensions:
            - name: "contract_source"
              type: "enum"
              values: ["url", "file"]
              required: true
              description: "How the contract was provided."
            - name: "api_type"
              type: "enum"
              values: ["rest-api", "graphql-api"]
              required: false
              description: "Which API type the wizard was creating."
          aggregations:
            - type: "count"
              label: "Contracts Imported"

  - code: "apip.manage-apis.create-graphql-api"
    name: "GraphQL API Creation"
    description: "Create a GraphQL API from an SDL schema supplied inline, by URL or file, or discovered by introspecting the backend."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.create-graphql-api"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "schema_source"
          type: "enum"
          values: ["inline", "url", "file", "introspection"]
          required: true
          description: "How the schema was supplied."
      aggregations:
        - type: "count"
          label: "GraphQL APIs Created"

  - code: "apip.manage-apis.update-api"
    name: "API Update"
    description: "Update the metadata or configuration of a REST or GraphQL API."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.update-api"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "api_type"
          type: "enum"
          values: ["rest-api", "graphql-api"]
          required: true
      aggregations:
        - type: "count"
          label: "API Updates"
    sub_features:
      - code: "apip.manage-apis.update-api.openapi-definition"
        name: "OpenAPI Definition Update"
        description: "Replace the OpenAPI definition of an existing REST API."
        category: "manage-apis"
        tier: "core"
        status: "stable"
        availability:
          introduced_in: "0.9.0"
        tracking:
          event_name: "apip.manage-apis.update-api.openapi-definition"
          event_category: "lifecycle"
          platforms: ["web", "api"]
          dimensions: []
          aggregations:
            - type: "count"
              label: "OpenAPI Definition Updates"

  - code: "apip.manage-apis.delete-api"
    name: "API Deletion"
    description: "Delete a REST or GraphQL API."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.delete-api"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "api_type"
          type: "enum"
          values: ["rest-api", "graphql-api"]
          required: true
      aggregations:
        - type: "count"
          label: "APIs Deleted"

  - code: "apip.manage-apis.validate-api-contract"
    name: "API Contract Validation"
    description: "Validate an OpenAPI document or GraphQL schema before creating or updating an API."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.validate-api-contract"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "contract_type"
          type: "enum"
          values: ["openapi", "graphql-schema"]
          required: true
        - name: "is_valid"
          type: "boolean"
          required: false
          description: "Whether the contract passed validation."
      aggregations:
        - type: "count"
          label: "Contract Validations"

  - code: "apip.manage-apis.api-documentation"
    name: "API Documentation"
    description: "Add, update, or delete documents attached to an API."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.api-documentation"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "operation"
          type: "enum"
          values: ["create", "update", "delete"]
          required: true
        - name: "api_type"
          type: "enum"
          values: ["rest-api", "graphql-api", "mcp-proxy"]
          required: false
      aggregations:
        - type: "count"
          label: "Documentation Changes"

  - code: "apip.manage-apis.api-thumbnail"
    name: "API Thumbnail"
    description: "Upload, replace, or delete the thumbnail shown for an API."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.api-thumbnail"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "operation"
          type: "enum"
          values: ["upsert", "delete"]
          required: true
      aggregations:
        - type: "count"
          label: "Thumbnail Changes"

  - code: "apip.manage-apis.api-gateway-association"
    name: "API-to-Gateway Association"
    description: "Associate an API with the gateways it can be deployed to."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.api-gateway-association"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "api_type"
          type: "enum"
          values: ["rest-api", "graphql-api"]
          required: true
      aggregations:
        - type: "count"
          label: "Gateway Associations"

  - code: "apip.manage-apis.test-console"
    name: "Test Console"
    description: "Invoke a deployed API from the console's test console, directly from the browser or relayed by the console server."
    category: "manage-apis"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.manage-apis.test-console"
      event_category: "engagement"
      platforms: ["web"]
      dimensions:
        - name: "api_type"
          type: "enum"
          values: ["rest-api", "graphql-api"]
          required: true
        - name: "call_mode"
          type: "enum"
          values: ["proxy", "direct"]
          required: false
          description: "REST only: proxy is relayed by the console server, direct is sent from the browser."
        - name: "outcome"
          type: "enum"
          values: ["success", "failure"]
          required: true
      aggregations:
        - type: "count"
          label: "Test Console Invocations"

  # ============================================================
  # GATEWAY
  # ============================================================

  - code: "apip.gateway.register-gateway"
    name: "Gateway Registration"
    description: "Register a gateway with the control plane so APIs can be deployed to it."
    category: "gateway"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.gateway.register-gateway"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "gateway_type"
          type: "enum"
          values: ["regular", "ai"]
          required: true
          description: "Regular or AI gateway."
        - name: "gateway_hosting"
          type: "enum"
          values: ["managed", "self-hosted"]
          required: false
        - name: "is_critical"
          type: "boolean"
          required: false
          description: "Whether the gateway was marked critical."
      aggregations:
        - type: "count"
          label: "Gateways Registered"
        - type: "count_distinct"
          label: "Distinct Gateway Types Registered"
          dimension: "gateway_type"

  - code: "apip.gateway.manage-gateway"
    name: "Gateway Update & Deletion"
    description: "Update or delete a registered gateway."
    category: "gateway"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.gateway.manage-gateway"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "operation"
          type: "enum"
          values: ["update", "delete"]
          required: true
        - name: "gateway_type"
          type: "enum"
          values: ["regular", "ai"]
          required: false
      aggregations:
        - type: "count"
          label: "Gateway Changes"

  - code: "apip.gateway.gateway-token"
    name: "Gateway Registration Token"
    description: "Rotate or revoke the token a gateway uses to connect to the control plane."
    category: "gateway"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.gateway.gateway-token"
      event_category: "lifecycle"
      platforms: ["web", "api"]
      dimensions:
        - name: "operation"
          type: "enum"
          values: ["rotate", "revoke"]
          required: true
      aggregations:
        - type: "count"
          label: "Token Changes"

  - code: "apip.gateway.download-manifest"
    name: "Gateway Manifest Download"
    description: "Download the installation manifest of a registered gateway."
    category: "gateway"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.gateway.download-manifest"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions: []
      aggregations:
        - type: "count"
          label: "Manifest Downloads"

  - code: "apip.gateway.immutable-gateway"
    name: "Immutable Gateway Mode"
    description: "Run a gateway in immutable mode, with its artifacts loaded from a directory at start-up."
    category: "gateway"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.gateway.immutable-gateway"
      event_category: "engagement"
      platforms: ["api"]
      dimensions: []
      aggregations:
        - type: "count"
          label: "Immutable Gateways Started"

  - code: "apip.gateway.kubernetes-operator"
    name: "Kubernetes Gateway Resources"
    description: "Manage gateway configuration with the Kubernetes operator's custom resources."
    category: "gateway"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.gateway.kubernetes-operator"
      event_category: "lifecycle"
      platforms: ["api"]
      dimensions:
        - name: "resource_kind"
          type: "enum"
          values: ["agent", "api-gateway", "api-key", "api-policy", "certificate", "llm-provider", "llm-provider-template", "llm-proxy", "managed-secret", "mcp", "rest-api", "subscription-plan", "subscription"]
          required: true
          description: "The custom resource kind that was applied."
      aggregations:
        - type: "count"
          label: "Custom Resources Applied"
        - type: "count_distinct"
          label: "Distinct Resource Kinds Used"
          dimension: "resource_kind"

  # ============================================================
  # POLICIES
  # ============================================================

  - code: "apip.policies.client-authentication"
    name: "Client Authentication"
    description: "Authenticate API clients with API keys, basic credentials, JWTs, client certificates, or opaque-token introspection."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.client-authentication"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "policy_name"
          type: "string"
          required: true
          description: "Name of the policy as declared in its definition. An open set: custom policies can be added."
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Authentication Policies Applied"
        - type: "count_distinct"
          label: "Distinct Policies Used"
          dimension: "policy_name"

  - code: "apip.policies.backend-authentication"
    name: "Backend Authentication"
    description: "Authenticate the gateway to backends with a generated JWT, AWS request signing, OAuth2 client credentials, or token exchange."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.backend-authentication"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "policy_name"
          type: "string"
          required: true
          description: "Name of the policy as declared in its definition. An open set: custom policies can be added."
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Backend Authentication Policies Applied"
        - type: "count_distinct"
          label: "Distinct Policies Used"
          dimension: "policy_name"

  - code: "apip.policies.access-control"
    name: "Subscription Validation"
    description: "Authorize calls by validating the caller's subscription."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.access-control"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Subscription Validation Applied"

  - code: "apip.policies.rate-limiting"
    name: "Rate Limiting"
    description: "Limit request rates with the basic or advanced rate-limit policy."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.rate-limiting"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "policy_name"
          type: "string"
          required: true
          description: "Name of the policy as declared in its definition. An open set: custom policies can be added."
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Rate Limit Policies Applied"
        - type: "count_distinct"
          label: "Distinct Policies Used"
          dimension: "policy_name"

  - code: "apip.policies.traffic-routing"
    name: "Traffic Routing"
    description: "Route requests to a dynamic endpoint or redirect them."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.traffic-routing"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "policy_name"
          type: "string"
          required: true
          description: "Name of the policy as declared in its definition. An open set: custom policies can be added."
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Routing Policies Applied"
        - type: "count_distinct"
          label: "Distinct Policies Used"
          dimension: "policy_name"

  - code: "apip.policies.transformation"
    name: "Request & Response Transformation"
    description: "Set or remove headers, rewrite requests and hosts, convert between JSON and XML, or return a fixed response."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.transformation"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "policy_name"
          type: "string"
          required: true
          description: "Name of the policy as declared in its definition. An open set: custom policies can be added."
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Transformation Policies Applied"
        - type: "count_distinct"
          label: "Distinct Policies Used"
          dimension: "policy_name"

  - code: "apip.policies.content-validation"
    name: "Content Validation"
    description: "Validate message content by JSON schema, regular expression, length, URL, word, or sentence count."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.content-validation"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "policy_name"
          type: "string"
          required: true
          description: "Name of the policy as declared in its definition. An open set: custom policies can be added."
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Validation Policies Applied"
        - type: "count_distinct"
          label: "Distinct Policies Used"
          dimension: "policy_name"

  - code: "apip.policies.cors"
    name: "CORS"
    description: "Apply cross-origin resource sharing rules to an API."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.cors"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "CORS Policies Applied"

  - code: "apip.policies.interception"
    name: "Interception & Logging"
    description: "Call an external interceptor service or log messages as they pass through the gateway."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.interception"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "policy_name"
          type: "string"
          required: true
          description: "Name of the policy as declared in its definition. An open set: custom policies can be added."
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
          description: "The kind of API the policy was attached to."
      aggregations:
        - type: "count"
          label: "Interception Policies Applied"
        - type: "count_distinct"
          label: "Distinct Policies Used"
          dimension: "policy_name"

  - code: "apip.policies.analytics-filtering"
    name: "Analytics Header Filtering"
    description: "Exclude chosen headers from analytics events."
    category: "policies"
    tier: "core"
    status: "stable"
    availability:
      introduced_in: "0.9.0"
    tracking:
      event_name: "apip.policies.analytics-filtering"
      event_category: "engagement"
      platforms: ["web", "api"]
      dimensions:
        - name: "artifact_kind"
          type: "enum"
          values: ["rest-api", "graphql-api", "llm-provider", "llm-proxy", "mcp-proxy", "agent-proxy"]
          required: false
