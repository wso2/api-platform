# Combined platform-api + gateway end-to-end stack for cross-database
# integration testing. The real platform-api (control plane) and the real
# gateway (gateway-controller + gateway-runtime data plane) run against the same
# database engine, so a single scenario exercises both products together.
#
# This is the PostgreSQL variant (one server, two logical databases). SQLite and
# SQL Server variants follow the same shape; see README.md.
#
# Images (override via env to use locally built tags):
#   PLATFORM_API_IMAGE       (build: cd platform-api && make build, or the it-e2e tag)
#   GATEWAY_CONTROLLER_IMAGE  GATEWAY_RUNTIME_IMAGE
#
# The gateway-controller's control-plane token is injected at run time after the
# scenario creates a gateway + registration token in platform-api (see README,
# "Bootstrap"). Until then the gateway-controller stays in its reconnect loop.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=apip
      - POSTGRES_PASSWORD=apip
      - POSTGRES_DB=postgres
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      # platform-api no longer auto-provisions its schema on external databases,
      # so init-db.sql applies it from here (mounted from the source tree).
      - ../../platform-api/internal/database/schema.postgres.sql:/schema/schema.postgres.sql:ro
      # The API Portal likewise pre-loads its schema on postgres (it does
      # not sequelize.sync() on external DBs); init-db.sql applies it too.
      - ../../portals/api-portal/database/schema.postgres.sql:/api-portal-schema/schema.postgres.sql:ro
      # The gateway-controller no longer auto-migrates its schema on external
      # databases either; init-db.sql applies it to gateway_test / gateway_test2.
      - ../../gateway/gateway-controller/pkg/storage/gateway-controller-db.postgres.sql:/gw-schema/schema.postgres.sql:ro
    ports:
      - "55433:5432"
    healthcheck:
      # Probe over TCP (-h 127.0.0.1), not the unix socket: while the entrypoint
      # runs init-db.sql the temporary server listens on the socket only, so a
      # socket probe reports healthy mid-init and platform-api (which pings once
      # and exits, no retry) hits a refused TCP connection. The TCP probe only
      # passes once the real, post-init server is accepting connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U apip -d gateway_test"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [e2e]

  # One-shot init container: generates the TLS pair the platform-api HTTPS
  # listener requires (the server no longer generates a self-signed fallback).
  platform-api-certgen:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -f /certs/cert.pem ] && [ -f /certs/key.pem ] && exit 0
        openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes \
          -keyout /certs/key.pem -out /certs/cert.pem \
          -subj "/O=WSO2 API Platform/CN=platform-api" \
          -addext "subjectAltName=DNS:localhost,DNS:platform-api,IP:127.0.0.1"
        # certgen runs as root; platform-api runs as uid 10001, so the key must be
        # owned by that uid, not made world-readable.
        chown 10001 /certs/key.pem
        chmod 0600 /certs/key.pem
    volumes:
      - platform-api-certs:/certs
    networks: [e2e]

  # One-shot init container: generates the RS256 keypair platform-api's
  # auth.jwt config requires (platform-api-config.toml reads it via {{ file }}).
  # Tokens are signed asymmetrically — there is no shared HMAC secret anymore.
  platform-api-jwtkeygen:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -f /keys/jwt_private.pem ] && [ -f /keys/jwt_public.pem ] && exit 0
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
          -out /keys/jwt_private.pem 2>/dev/null
        openssl rsa -in /keys/jwt_private.pem -pubout \
          -out /keys/jwt_public.pem 2>/dev/null
        # jwtkeygen runs as root; platform-api runs as uid 10001, so the private
        # key must be owned by that uid, not made world-readable.
        chown 10001 /keys/jwt_private.pem
        chmod 0600 /keys/jwt_private.pem
        chmod 0644 /keys/jwt_public.pem
    volumes:
      - platform-api-jwt-keys:/keys
    networks: [e2e]

  platform-api:
    image: ${PLATFORM_API_IMAGE:-platform-api:it-e2e}
    command: ["-config", "/etc/platform-api/config.toml"]
    environment:
      - APIP_CP_DATABASE_DRIVER=postgres
      - APIP_CP_DATABASE_HOST=postgres
      - APIP_CP_DATABASE_PORT=5432
      - APIP_CP_DATABASE_NAME=platform_api
      - APIP_CP_DATABASE_USER=apip
      - APIP_CP_DATABASE_PASSWORD=apip
      - APIP_CP_DATABASE_SSL_MODE=disable
      - APIP_CP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Stable org identity so the scenario's org handle/UUID are fixed across runs.
      # These names are the {{ env }} tokens platform-api-config.toml reads; the
      # server has no env-override layer, so a name not spelled in that file is inert.
      - APIP_CP_AUTH_FILE_ORGANIZATION_ID=default
      - APIP_CP_AUTH_FILE_ORGANIZATION_UUID=99089a17-72e0-4dd8-a2f4-c8dfbb085295
      - APIP_CP_AUTH_FILE_ORGANIZATION_DISPLAY_NAME=Default
      - APIP_CP_AUTH_FILE_ORGANIZATION_REGION=us
      # API Portal webhook receiver (only the postgres stack runs the devportal).
      # Enabled via env so the sqlite/sqlserver stacks — which have no devportal —
      # leave it off. The secret both verifies request signatures and decrypts the
      # encrypted key/token fields, so the suite registers the devportal subscriber
      # with this exact same value (see registerWebhookSubscriber).
      - APIP_CP_WEBHOOK_ENABLED=true
      - APIP_CP_WEBHOOK_SECRET=${E2E_WEBHOOK_SECRET:?set E2E_WEBHOOK_SECRET (the suite sets it automatically; export one to run compose by hand)}
    volumes:
      - ./platform-api-config.toml:/etc/platform-api/config.toml:ro
      # Role-to-scope mapping named by auth.authorization.role_to_scope_mapping — the
      # shipped file, so the suite runs against the same grants operators get.
      - ../../platform-api/resources/role-to-scope-mapping.yaml:/etc/platform-api/role-to-scope-mapping.yaml:ro
      - platform-api-certs:/app/data/certs
      - platform-api-jwt-keys:/etc/platform-api/keys:ro
    ports:
      - "${PA_HOST_PORT:-9243}:9243"
    depends_on:
      postgres:
        condition: service_healthy
      platform-api-certgen:
        condition: service_completed_successfully
      platform-api-jwtkeygen:
        condition: service_completed_successfully
    networks: [e2e]

  gateway-controller:
    image: ${GATEWAY_CONTROLLER_IMAGE:-ghcr.io/wso2/api-platform/gateway-controller:it-e2e}
    command: ["-config", "/etc/gateway-controller/config.toml"]
    environment:
      - APIP_GW_CONTROLLER_STORAGE_TYPE=postgres
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_HOST=postgres
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_PORT=5432
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_DATABASE=gateway_test
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_USER=apip
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_PASSWORD=apip
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_SSLMODE=disable
      - APIP_GW_CONTROLLER_LOGGING_LEVEL=debug
      # Control plane = the real platform-api. The token is created by the
      # scenario and injected via GATEWAY_REGISTRATION_TOKEN before this starts.
      - APIP_GW_CONTROLLER_CONTROLPLANE_HOST=platform-api:9243
      - APIP_GW_CONTROLLER_CONTROLPLANE_TOKEN=${GATEWAY_REGISTRATION_TOKEN:-}
      - APIP_GW_CONTROLLER_CONTROLPLANE_INSECURE_SKIP_VERIFY=true
      # test-config.toml enables server.xds_tls/policy_server.tls by default;
      # explicit here for clarity. Certs come from listener-certs, mounted a second
      # time below at the default cert_file/key_file/client_ca_file path.
      - XDS_TLS_ENABLED=true
    ports:
      - "${GW_REST_PORT:-9090}:9090"   # REST API
      - "${GW_ADMIN_PORT:-9092}:9092"   # Admin API
      - "${GW_XDS_PORT:-18000}:18443" # xDS gRPC mTLS (Router) -- host port kept at the old
                                       # default; only the container-side port moved to the
                                       # dedicated mTLS listener (18443, was plaintext 18000)
      - "${GW_POLICY_XDS_PORT:-18001}:18444" # xDS gRPC mTLS (Policy Engine) -- same, was 18001
    volumes:
      - ../../gateway/it/test-config.toml:/etc/gateway-controller/config.toml:ro
      - ../../gateway/it/it-aesgcm-keys/default-aesgcm256-v1.bin:/app/data/aesgcm-keys/default-aesgcm256-v1.bin:ro
      - ../../gateway/gateway-controller/certificates:/app/certificates
      # File-level mounts (not the whole listener-certs directory): this
      # service only needs its own listener cert/key and its own xDS server
      # cert/key plus the CA cert -- never the CA's private key.
      - ../../gateway/gateway-controller/listener-certs/default-listener.crt:/app/listener-certs/default-listener.crt:ro
      - ../../gateway/gateway-controller/listener-certs/default-listener.key:/app/listener-certs/default-listener.key:ro
      - ../../gateway/gateway-controller/listener-certs/ca.crt:/app/xds-certs/ca.crt:ro
      - ../../gateway/gateway-controller/listener-certs/server.crt:/app/xds-certs/server.crt:ro
      - ../../gateway/gateway-controller/listener-certs/server.key:/app/xds-certs/server.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_started
    networks: [e2e]

  gateway-runtime:
    image: ${GATEWAY_RUNTIME_IMAGE:-ghcr.io/wso2/api-platform/gateway-runtime:it-e2e}
    command: ["--pol.config", "/etc/policy-engine/config.toml"]
    environment:
      - GATEWAY_CONTROLLER_HOST=gateway-controller
      - LOG_LEVEL=info
      # Client cert/key paths for mutual TLS to gateway-controller's xDS servers --
      # Envoy and the policy-engine present distinct client identities, so each leg
      # gets its own cert/key, checked against the shared dev CA mounted below.
      - XDS_TLS_ENABLED=true
      - XDS_CLIENT_CERT_PATH=/etc/xds-certs/envoy-client.crt
      - XDS_CLIENT_KEY_PATH=/etc/xds-certs/envoy-client.key
      - XDS_CLIENT_CA_PATH=/etc/xds-certs/ca.crt
      - POLICY_ENGINE_XDS_CLIENT_CERT_PATH=/etc/xds-certs/policy-engine-client.crt
      - POLICY_ENGINE_XDS_CLIENT_KEY_PATH=/etc/xds-certs/policy-engine-client.key
      - POLICY_ENGINE_XDS_CLIENT_CA_PATH=/etc/xds-certs/ca.crt
    ports:
      - "${GW_HTTP_PORT:-18080}:8080"   # HTTP ingress (data plane)
      - "${GW_HTTPS_PORT:-18443}:8443"  # HTTPS ingress
      - "${GW_POLICY_ADMIN_PORT:-9002}:9002" # Policy engine admin
    volumes:
      - ../../gateway/it/test-config.toml:/etc/policy-engine/config.toml:ro
      # File-level mounts: only the CA cert plus this service's own
      # Envoy/policy-engine client cert/key pairs -- never the CA's private
      # key or the controller's own server cert/key.
      - ../../gateway/gateway-controller/listener-certs/ca.crt:/etc/xds-certs/ca.crt:ro
      - ../../gateway/gateway-controller/listener-certs/envoy-client.crt:/etc/xds-certs/envoy-client.crt:ro
      - ../../gateway/gateway-controller/listener-certs/envoy-client.key:/etc/xds-certs/envoy-client.key:ro
      - ../../gateway/gateway-controller/listener-certs/policy-engine-client.crt:/etc/xds-certs/policy-engine-client.crt:ro
      - ../../gateway/gateway-controller/listener-certs/policy-engine-client.key:/etc/xds-certs/policy-engine-client.key:ro
    depends_on:
      gateway-controller:
        condition: service_started
    networks: [e2e]

  sample-backend:
    image: ghcr.io/wso2/api-platform/sample-service:latest
    command: ["-addr", ":9080", "-pretty"]
    ports:
      - "${SAMPLE_BACKEND_HOST_PORT:-9080}:9080"
    networks: [e2e]

  # Second gateway (own controller + runtime + DB) for the multi-gateway
  # scenario: the same API is deployed to both gateways, and undeploying from one
  # must not affect the other. Started on demand by the godog suite.
  gateway-controller-2:
    image: ${GATEWAY_CONTROLLER_IMAGE:-ghcr.io/wso2/api-platform/gateway-controller:it-e2e}
    command: ["-config", "/etc/gateway-controller/config.toml"]
    environment:
      - APIP_GW_CONTROLLER_STORAGE_TYPE=postgres
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_HOST=postgres
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_PORT=5432
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_DATABASE=gateway_test2
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_USER=apip
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_PASSWORD=apip
      - APIP_GW_CONTROLLER_STORAGE_POSTGRES_SSLMODE=disable
      - APIP_GW_CONTROLLER_LOGGING_LEVEL=debug
      - APIP_GW_CONTROLLER_CONTROLPLANE_HOST=platform-api:9243
      - APIP_GW_CONTROLLER_CONTROLPLANE_TOKEN=${GATEWAY_REGISTRATION_TOKEN_2:-}
      - APIP_GW_CONTROLLER_CONTROLPLANE_INSECURE_SKIP_VERIFY=true
      # test-config.toml enables server.xds_tls/policy_server.tls by default;
      # explicit here for clarity. Shares the server cert/CA with gateway-controller
      # above -- that cert's SAN list does not include "gateway-controller-2" (this
      # service's own compose name), so gateway-runtime-2 below reaches it via the
      # "it-gateway-controller-xds" network alias instead, which the cert already
      # covers -- see the network alias on this service and GATEWAY_CONTROLLER_HOST
      # on gateway-runtime-2.
      - XDS_TLS_ENABLED=true
    ports:
      - "9190:9090"
      - "9192:9092"
      - "18100:18443" # xDS gRPC mTLS (Router) -- host port kept at the old default
      - "18101:18444" # xDS gRPC mTLS (Policy Engine)
    volumes:
      - ../../gateway/it/test-config.toml:/etc/gateway-controller/config.toml:ro
      - ../../gateway/it/it-aesgcm-keys/default-aesgcm256-v1.bin:/app/data/aesgcm-keys/default-aesgcm256-v1.bin:ro
      - ../../gateway/gateway-controller/certificates:/app/certificates
      # File-level mounts (not the whole listener-certs directory): this
      # service only needs its own listener cert/key and its own xDS server
      # cert/key plus the CA cert -- never the CA's private key.
      - ../../gateway/gateway-controller/listener-certs/default-listener.crt:/app/listener-certs/default-listener.crt:ro
      - ../../gateway/gateway-controller/listener-certs/default-listener.key:/app/listener-certs/default-listener.key:ro
      - ../../gateway/gateway-controller/listener-certs/ca.crt:/app/xds-certs/ca.crt:ro
      - ../../gateway/gateway-controller/listener-certs/server.crt:/app/xds-certs/server.crt:ro
      - ../../gateway/gateway-controller/listener-certs/server.key:/app/xds-certs/server.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_started
    networks:
      e2e:
        # Existing SAN on the shared server cert (see
        # gateway/scripts/setup.sh's gen_xds_certs) -- lets gateway-runtime-2 verify
        # this controller's mTLS cert without a hostname it wasn't issued for.
        aliases:
          - it-gateway-controller-xds

  gateway-runtime-2:
    image: ${GATEWAY_RUNTIME_IMAGE:-ghcr.io/wso2/api-platform/gateway-runtime:it-e2e}
    command: ["--pol.config", "/etc/policy-engine/config.toml"]
    environment:
      # Dials gateway-controller-2 via its "it-gateway-controller-xds" network alias
      # (not the compose service name) so both Envoy's and the policy-engine's xDS
      # TLS clients verify the shared server cert against a SAN it actually carries.
      # xDS is the only thing this host name is used for (see
      # gateway/gateway-runtime/docker-entrypoint.sh); nothing else resolves it.
      - GATEWAY_CONTROLLER_HOST=it-gateway-controller-xds
      - LOG_LEVEL=info
      # Client cert/key paths for mutual TLS to gateway-controller-2's xDS servers.
      - XDS_TLS_ENABLED=true
      - XDS_CLIENT_CERT_PATH=/etc/xds-certs/envoy-client.crt
      - XDS_CLIENT_KEY_PATH=/etc/xds-certs/envoy-client.key
      - XDS_CLIENT_CA_PATH=/etc/xds-certs/ca.crt
      - POLICY_ENGINE_XDS_CLIENT_CERT_PATH=/etc/xds-certs/policy-engine-client.crt
      - POLICY_ENGINE_XDS_CLIENT_KEY_PATH=/etc/xds-certs/policy-engine-client.key
      - POLICY_ENGINE_XDS_CLIENT_CA_PATH=/etc/xds-certs/ca.crt
    ports:
      - "${GW2_HTTP_PORT:-18081}:8080"
      - "${GW2_HTTPS_PORT:-18444}:8443"
      - "9102:9002"
    volumes:
      - ../../gateway/it/test-config.toml:/etc/policy-engine/config.toml:ro
      # File-level mounts: only the CA cert plus this service's own
      # Envoy/policy-engine client cert/key pairs -- never the CA's private
      # key or the controller's own server cert/key.
      - ../../gateway/gateway-controller/listener-certs/ca.crt:/etc/xds-certs/ca.crt:ro
      - ../../gateway/gateway-controller/listener-certs/envoy-client.crt:/etc/xds-certs/envoy-client.crt:ro
      - ../../gateway/gateway-controller/listener-certs/envoy-client.key:/etc/xds-certs/envoy-client.key:ro
      - ../../gateway/gateway-controller/listener-certs/policy-engine-client.crt:/etc/xds-certs/policy-engine-client.crt:ro
      - ../../gateway/gateway-controller/listener-certs/policy-engine-client.key:/etc/xds-certs/policy-engine-client.key:ro
    depends_on:
      gateway-controller-2:
        condition: service_started
    networks: [e2e]

  # API Portal — the consumer-facing plane. Credentials (subscriptions,
  # API keys) generated here are fired as signed webhooks to platform-api's
  # receiver (…/api/internal/v0.9/webhook/events), which persists them and
  # propagates to the gateway data plane over its existing WebSocket sync. 
  # Started on demand by the godog suite (postgres stack only).
  api-portal:
    image: ${API_PORTAL_IMAGE:-api-portal:it-e2e}
    depends_on:
      postgres:
        condition: service_healthy
      platform-api:
        condition: service_started
      # cert.pem must exist in the certs volume before the subpath mount below and
      # before Node reads NODE_EXTRA_CA_CERTS at startup.
      platform-api-certgen:
        condition: service_completed_successfully
      platform-api-jwtkeygen:
        condition: service_completed_successfully
    volumes:
      # The devportal has no automatic APIP_AP_* env override (see
      # src/config/configLoader.js) — an APIP_AP_* var only applies where this
      # config.toml references it via {{ env "..." }}. It replaces the image's
      # shipped configs/config.toml, which fails closed on the security secrets
      # and wires only the SQLite path key (ignoring APIP_AP_DATABASE_DRIVER etc.).
      - ./devportal-config.toml:/app/configs/config.toml:ro
      # Same RS256 keypair volume platform-api signs with — the devportal reads
      # only jwt_public.pem to verify those tokens. A subpath mount exposes just
      # that one file, so the private key is never mounted into this container
      # (defence in depth on top of its 0600/uid-10001 permissions).
      - type: volume
        source: platform-api-jwt-keys
        target: /etc/api-portal/keys/jwt_public.pem
        read_only: true
        volume:
          subpath: jwt_public.pem
      # platform-api's self-signed TLS cert, trusted via NODE_EXTRA_CA_CERTS below so
      # both the auth client and the webhook delivery worker verify it instead of
      # skipping verification. Subpath mount exposes only the public cert.pem, never
      # the private key.pem — same pattern as jwt_public.pem above.
      - type: volume
        source: platform-api-certs
        target: /etc/api-portal/certs/cert.pem
        read_only: true
        volume:
          subpath: cert.pem
    environment:
      # Its own database on the shared postgres server (created by init-db.sql).
      # Postgres, not the devportal's default SQLite: the org-update path needs
      # UPDATE ... RETURNING, which SQLite doesn't support. Schema auto-migrates.
      - APIP_AP_DATABASE_DRIVER=postgres
      - APIP_AP_DATABASE_HOST=postgres
      - APIP_AP_DATABASE_PORT=5432
      - APIP_AP_DATABASE_NAME=api_portal
      - APIP_AP_DATABASE_USER=apip
      - APIP_AP_DATABASE_PASSWORD=apip
      # Plain HTTP to avoid the self-signed cert dance in tests (TLS disabled).
      - APIP_AP_SERVER_HTTPS_ENABLED=false
      # The single org this devportal serves; seeded on startup. Must match the
      # platform-api org handle — the webhook resolves the control-plane org by
      # handle via org.ref_id, and a login whose token names another org is rejected.
      - APIP_AP_ORGANIZATION_HANDLE=default
      - APIP_AP_LOGGING_CONSOLE_ONLY=true
      # platform-api signs its tokens with RS256; the devportal verifies them
      # against jwt_public.pem from the shared keypair volume mounted above
      # (auth.local.public_key_path in devportal-config.toml). There is no shared
      # HMAC secret.
      - APIP_AP_AUTH_LOCAL_PLATFORM_API_URL=https://platform-api:9243
      # Trust platform-api's self-signed cert at Node's trust-store level rather than
      # disabling TLS verification. This *appends* to Node's built-in CAs and applies
      # process-wide, so it covers BOTH the auth login client AND the webhook delivery
      # worker (which POSTs over Node's default TLS and has no tls_skip_verify hatch,
      # the reason this used to set NODE_TLS_REJECT_UNAUTHORIZED=0). Verified TLS —
      # not a global bypass — even in the throwaway test container. The cert's SAN
      # includes DNS:platform-api, matching the https://platform-api:9243 host used
      # for both the auth call and the control-plane webhook subscriber.
      - NODE_EXTRA_CA_CERTS=/etc/api-portal/certs/cert.pem
      # Stable AES-256-GCM key (64 hex) for encrypting the webhook subscriber
      # secret at rest; must not change across restarts or the stored secret
      # becomes undecryptable and outbound requests go unsigned.
      - APIP_AP_SECURITY_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # express-session signing secret (64 hex). Required — the devportal fails
      # closed at startup if it doesn't resolve. Fixed test-only value.
      - APIP_AP_SECURITY_SESSION_SECRET=fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
    ports:
      - "${AP_HOST_PORT:-9543}:9543"
    networks: [e2e]

networks:
  e2e:
    driver: bridge

volumes:
  platform-api-certs:
  platform-api-jwt-keys:
