# API Portal configuration for the Go integration-e2e stack.
#
# Mounted at /app/configs/config.toml in the API Portal container. It replaces
# the image's shipped configs/config.toml, which fails closed at startup on the
# required security secrets and only wires the SQLite `path` key — neither of
# which suits this postgres-backed e2e stack.
#
# Every key lives under the single [api_portal] table; configLoader.js
# unwraps it and IGNORES anything outside it, so a section at the top level is
# silently dropped and its defaults (src/config/configDefaults.js) win instead.
#
# There is NO automatic APIP_AP_* environment-variable override — an env var set
# in docker-compose.yaml's `API Portal.environment` block only takes effect where
# a key below explicitly references it via a {{ env "..." }} token. Every
# APIP_AP_* var the compose file relies on MUST have a matching token here.

[api_portal.server]
port = '{{ env "APIP_AP_SERVER_PORT" "9543" }}'

[api_portal.server.https]
# Plain HTTP inside the compose network — the e2e client talks to it over http.
enabled = '{{ env "APIP_AP_SERVER_HTTPS_ENABLED" "false" }}'

[api_portal.logging]
console_only = '{{ env "APIP_AP_LOGGING_CONSOLE_ONLY" "true" }}'

[api_portal.database]
# Postgres, not the API Portal's default SQLite: the org-update path needs
# UPDATE ... RETURNING, which SQLite doesn't support. Connection comes from the
# APIP_AP_DATABASE_* vars in the compose file.
driver   = '{{ env "APIP_AP_DATABASE_DRIVER" "postgres" }}'
host     = '{{ env "APIP_AP_DATABASE_HOST" "postgres" }}'
port     = '{{ env "APIP_AP_DATABASE_PORT" "5432" }}'
name     = '{{ env "APIP_AP_DATABASE_NAME" "api_portal" }}'
user     = '{{ env "APIP_AP_DATABASE_USER" "apip" }}'
password = '{{ env "APIP_AP_DATABASE_PASSWORD" "apip" }}'

[api_portal.organization]
# The single organization this API Portal instance serves; seeded on startup.
# Must match platform-api's org handle — both because the webhook resolves the
# control-plane org by handle via org.ref_id, and because the API Portal rejects a
# login whose token names any other organization.
handle       = '{{ env "APIP_AP_ORGANIZATION_HANDLE" "default" }}'
display_name = '{{ env "APIP_AP_ORGANIZATION_DISPLAY_NAME" "Default" }}'
portal_id    = '{{ env "APIP_AP_ORGANIZATION_PORTAL_ID" "default" }}'
auto_create_subscription_plans = false

[api_portal.auth]
mode = "local"

[api_portal.auth.local]
# platform-api signs its tokens with RS256; the API Portal verifies them against
# the public half of that keypair. The keypair is generated by the stack's
# platform-api-certgen step and bind-mounted read-only at /etc/api-portal/keys —
# only jwt_public.pem is exposed here, and the API Portal reads it from that path.
platform_api_url = '{{ env "APIP_AP_AUTH_LOCAL_PLATFORM_API_URL" "https://platform-api:9243" }}'
public_key_path  = '{{ env "APIP_AP_AUTH_LOCAL_PUBLIC_KEY_PATH" "/etc/api-portal/keys/jwt_public.pem" }}'
# platform-api's cert is self-signed inside the compose network.
tls_skip_verify  = '{{ env "APIP_AP_AUTH_LOCAL_TLS_SKIP_VERIFY" "true" }}'

[api_portal.security]
# Required — API Portal fails closed at startup if either doesn't resolve to a
# 64-char hex string. Fixed test-only values set in the compose file.
encryption_key = '{{ env "APIP_AP_SECURITY_ENCRYPTION_KEY" }}'
session_secret = '{{ env "APIP_AP_SECURITY_SESSION_SECRET" }}'
