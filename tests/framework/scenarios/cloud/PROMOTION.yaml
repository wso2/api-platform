# Scenario list: APIP Cloud Promotion Along a Deployment Pipeline (PROMOTION).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: PROMOTION
title: APIP Cloud Promotion Along a Deployment Pipeline
scenarios:
  - id: ID_APIP_PROMOTION_001
    title: "Promoting into an environment that has no active gateway is refused."
    priority: P1
    cloud:
      status: exempt
      reason: "Needs a pipeline target environment that has no active gateway. Environments are managed in the WSO2 Cloud console, so the suite cannot create one, and it must not remove the gateways of the organization's existing environments."
  - id: ID_APIP_PROMOTION_002
    title: "An API promoted along a pipeline is served by the gateway of the target environment."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_promotion.feature
          scenario: "An API promoted along a pipeline is served by the gateway of the target environment"
  - id: ID_APIP_PROMOTION_003
    title: "Deploying directly to an environment a promotion path leads to is refused."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_promotion.feature
          scenario: "Deploying directly to an environment a promotion path leads to is refused"
  - id: ID_APIP_PROMOTION_004
    title: "A promotion that names no build carries the build the source environment is running."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_promotion.feature
          scenario: "A promotion that names no build carries the build the source environment is running"
  - id: ID_APIP_PROMOTION_005
    title: "Promoting a build that is not deployed in the source environment is refused."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_promotion.feature
          scenario: "Promoting a build that is not deployed in the source environment is refused"
  - id: ID_APIP_PROMOTION_006
    title: "Promotion follows the environment chain of the pipeline in order."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_promotion.feature
          scenario: "Promotion follows the environment chain of the pipeline in order"
  - id: ID_APIP_PROMOTION_007
    title: "A promoted deployment can be undeployed in the target environment alone."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_promotion.feature
          scenario: "A promoted deployment can be undeployed in the target environment alone"
  - id: ID_APIP_PROMOTION_008
    title: "Which environments can be deployed to directly follows the pipeline as it is now."
    priority: P1
    cloud:
      status: exempt
      reason: "Needs the promotion paths of a pipeline to change during the scenario. Deployment pipelines are managed in the WSO2 Cloud console, not through the platform API the suite drives."
