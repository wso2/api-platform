# Scenario list: APIP Cloud Managed Gateway Runtime (GATEWAY-RUNTIME).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: GATEWAY-RUNTIME
title: APIP Cloud Managed Gateway Runtime
scenarios:
  - id: ID_APIP_GATEWAY_RUNTIME_001
    title: "The managed gateway's runtime readiness route answers 200, no-store, with the policy engine and the control-plane connection up."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises HEALTH-006.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "Runtime readiness reports the policy engine and its control-plane connection"
  - id: ID_APIP_GATEWAY_RUNTIME_002
    title: "The managed gateway's runtime liveness route answers healthy and depends on no dependency check."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises HEALTH-007.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "Runtime liveness depends on no dependency check"
  - id: ID_APIP_GATEWAY_RUNTIME_003
    title: "A path under the runtime health namespace that is not a health route answers 404 without health detail, while the readiness route answers 200."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises HEALTH-009.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A path under the runtime health namespace that is not a health route is not answered as one"
  - id: ID_APIP_GATEWAY_RUNTIME_004
    title: "POST and DELETE on the runtime health routes answer 405 with Allow: GET, HEAD and no health detail, while GET answers 200."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises HEALTH-033.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "Runtime health routes refuse the <method> method on <path>"
  - id: ID_APIP_GATEWAY_RUNTIME_005
    title: "An API whose context or operation falls in the reserved health namespace fails to deploy with a status reason, and the readiness route still answers ready."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises HEALTH-010.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "An API cannot claim a route in the reserved health namespace (<case>)"
  - id: ID_APIP_GATEWAY_RUNTIME_006
    title: "A successful data-plane response carries a request ID the gateway generated."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "A successful response carries the generated request ID
      # and the upstream receives the same ID"; the upstream half cannot be observed, since the
      # cloud's testbench sits behind another gateway that gives every request a new ID.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A successful response carries a request ID the gateway generated"
  - id: ID_APIP_GATEWAY_RUNTIME_007
    title: "A request ID the client sends is returned unchanged and reaches the upstream."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "A request ID sent by the client is returned
      # unchanged".
      status: known-issue
      issue: "WSO2 Cloud: the cloud's edge in front of the managed gateway replaces a request ID the client sends with a new one, so a client's X-Request-Id is not returned (the gateway itself keeps it: PreserveExternalRequestId in gateway-controller pkg/xds/translator.go). Seen on development on 2026-11-27 for a 200, a 404 and the gateway's own 405. No tracker link yet."
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A request ID sent by the client is returned unchanged"
  - id: ID_APIP_GATEWAY_RUNTIME_008
    title: "A request the policy engine rejects with 401 still carries a request ID the gateway generated."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "A request rejected by the policy engine still carries
      # the request ID"; its client-sent ID half is ID_APIP_GATEWAY_RUNTIME_007.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A request rejected by the policy engine still carries the request ID"
  - id: ID_APIP_GATEWAY_RUNTIME_009
    title: "A request to an unknown route answers 404 with a request ID the gateway generated."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "A request to an unknown route still carries the
      # request ID".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A request to an unknown route still carries the request ID"
  - id: ID_APIP_GATEWAY_RUNTIME_010
    title: "A deployment whose upstream cannot be reached answers 503 with a request ID the gateway generated."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "A gateway error for an unreachable upstream still
      # carries the request ID".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A gateway error for an unreachable upstream still carries the request ID"
  - id: ID_APIP_GATEWAY_RUNTIME_011
    title: "An X-Request-ID header a policy sets is replaced by the request ID the gateway generated."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "The gateway request ID replaces an X-Request-ID header
      # set by a policy".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "The gateway request ID replaces an X-Request-ID header set by a policy"
  - id: ID_APIP_GATEWAY_RUNTIME_012
    title: "The managed gateway serves its JWK Set as application/jwk-set+json with public caching and CORS, and a request with its current ETag answers 304 with no body."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "A conditional request with the current ETag is
      # answered without a body".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A conditional request for the JWK Set with the current ETag is answered without a body"
  - id: ID_APIP_GATEWAY_RUNTIME_013
    title: "A HEAD request for the JWK Set answers 200 with its ETag and content type and no body."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "A HEAD request returns the JWK Set headers".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A HEAD request returns the JWK Set headers"
  - id: ID_APIP_GATEWAY_RUNTIME_014
    title: "POST on the JWK Set answers 405 with Allow: GET, HEAD, while GET answers 200."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Methods other than GET and HEAD are rejected".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "Methods other than GET and HEAD on the JWK Set are rejected"
  - id: ID_APIP_GATEWAY_RUNTIME_015
    title: "A REST API with the /.well-known context is refused with VALIDATION_FAILED and not created, and the JWK Set is still served."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "An API cannot claim the JWKS path while the endpoint
      # is enabled"; the platform refuses the context before the gateway sees it.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "An API cannot claim the JWKS path while the endpoint is enabled"
  - id: ID_APIP_GATEWAY_RUNTIME_016
    title: "A buffered request body above the gateway's listener buffer limit is refused with the gateway's 413."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "A buffered request body above the listener buffer
      # limit is rejected", a known issue there too.
      # Passed three consecutive runs on development; on-premises the outcome depends on timing
      # (wso2/api-platform#4061).
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway_runtime.feature
          scenario: "A buffered request body above the listener buffer limit is rejected"
