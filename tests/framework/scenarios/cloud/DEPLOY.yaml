# Scenario list: APIP Cloud Builds and Deployments (DEPLOY).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: DEPLOY
title: APIP Cloud Builds and Deployments
scenarios:
  - id: ID_APIP_DEPLOY_001
    title: "A build can be prepared for an API and is listed."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A build can be prepared for an API and is listed"
  - id: ID_APIP_DEPLOY_002
    title: "The builds of an API are listed newest first."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "The builds of an API are listed newest first"
  - id: ID_APIP_DEPLOY_003
    title: "A build that already exists can be deployed to a gateway in an environment."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A build that already exists can be deployed to a gateway in an environment"
  - id: ID_APIP_DEPLOY_004
    title: "The deployments of an API list one stage per environment of its pipeline."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "The deployments of an API list one stage per environment of its pipeline"
  - id: ID_APIP_DEPLOY_005
    title: "An undeployed API is no longer served by the gateway."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "An undeployed API is no longer served by the gateway"
  - id: ID_APIP_DEPLOY_006
    title: "Deploying to an environment that does not exist is rejected."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying to an environment that does not exist is rejected"
  - id: ID_APIP_DEPLOY_007
    title: "Deploying a build that does not exist is rejected."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying a build that does not exist is rejected"
  - id: ID_APIP_DEPLOY_008
    title: "A deployment the gateway refuses is reported as failed with a reason."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A deployment the gateway refuses is reported as failed with a reason"
  - id: ID_APIP_DEPLOY_009
    title: "A per-deployment endpoint override reaches the gateway in the form the upstream expects."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A per-deployment endpoint override reaches the gateway in the form the upstream expects"
  - id: ID_APIP_DEPLOY_010
    title: "Deploying to a gateway that does not exist is refused and leaves the API undeployed."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying to a gateway that does not exist is refused and leaves the API undeployed"
  - id: ID_APIP_DEPLOY_011
    title: "Deploying to a gateway that belongs to another environment is refused and leaves the API undeployed."
    priority: P1
    cloud:
      status: known-issue
      issue: "The project delete endpoint of the cloud API answers 501 and the ap token does not carry the cloud:project:delete scope, so a scenario cannot delete the project it creates. The project scenarios are skipped until the endpoint is fixed and the scope is added to the ap token."
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying to a gateway that belongs to another environment is refused and leaves the API undeployed"
  - id: ID_APIP_DEPLOY_012
    title: "Deploying a build serves that build and not a later edit, and the edit is served once it is built and deployed."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying a build serves that build and not a later edit, and the edit is served once it is built and deployed"
  - id: ID_APIP_DEPLOY_013
    title: "Deploying an earlier build again serves it again."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying an earlier build again serves it again"
  - id: ID_APIP_DEPLOY_014
    title: "A build a gateway is serving cannot be deleted, and once it is undeployed it can be."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A build a gateway is serving cannot be deleted, and once it is undeployed it can be"
  - id: ID_APIP_DEPLOY_015
    title: "Preparing builds past the limit removes the oldest free build, keeps the one a gateway serves, and never reuses an identifier."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Preparing builds past the limit removes the oldest free build, keeps the one a gateway serves, and never reuses an identifier"
  - id: ID_APIP_DEPLOY_016
    title: "Undeploying from an environment the deployment is not in, or a second time, is refused and changes nothing."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Undeploying from an environment the deployment is not in, or a second time, is refused and changes nothing"
  - id: ID_APIP_DEPLOY_017
    title: "A build is deleted only through its own API and kind, and through another it is not found and stays listed."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A build is deleted only through its own API and kind, and through another it is not found and stays listed"
  - id: ID_APIP_DEPLOY_018
    title: "A build or deployment request that is not JSON, or a deployment that names no environment, is refused and creates nothing."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A build or deployment request that is not JSON, or a deployment that names no environment, is refused and creates nothing"
  - id: ID_APIP_DEPLOY_019
    title: "Deploying with a production endpoint at the cloud metadata address is refused, while a permitted endpoint deploys."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises NETAC-PA-014.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying with a production endpoint at the cloud metadata address is refused, while a permitted endpoint deploys"
  - id: ID_APIP_DEPLOY_020
    title: "Deploying with an invalid virtual host (an underscore, a leading hyphen, a 64-character label) is refused naming vhostMain and deploys nothing, while the gateway-default placeholder deploys and is reported on the gateway's public host."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises SVR-020; written, not yet run against a cloud environment.
      status: planned
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "Deploying with an invalid virtual host is refused and deploys nothing, while the gateway-default placeholder deploys"
  - id: ID_APIP_DEPLOY_021
    title: "A deployment that names no virtual host is reported on its gateway's public host with no sandbox host and is served there, and a deployment that names its own main and sandbox hosts reports them."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises SVR-018; written, not yet run against a cloud environment.
      status: planned
      refs:
        - feature: suites/cloud/features/apip_deploy.feature
          scenario: "A deployment that names no virtual host is reported and served on its gateway's public host, and one that names its own hosts reports them"
