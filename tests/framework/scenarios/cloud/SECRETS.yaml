# Scenario list: APIP Cloud Secrets (SECRETS).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: SECRETS
title: APIP Cloud Secrets
scenarios:
  - id: ID_APIP_SECRETS_001
    title: "A secret created in the console is sent by the gateway to the upstream of a deployed API."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_secrets.feature
          scenario: "A secret created in the console is sent by the gateway to the upstream of a deployed API"
  - id: ID_APIP_SECRETS_003
    title: "A secret in use cannot be deleted, and once deleted it can no longer be used."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_secrets.feature
          scenario: "A secret in use cannot be deleted, and once deleted it can no longer be used"
  - id: ID_APIP_SECRETS_005
    title: "A REST API that references a secret that does not exist is refused when it is created."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_secrets.feature
          scenario: "A REST API that references a secret that does not exist is refused when it is created"
