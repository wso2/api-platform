# Scenario list: APIP Cloud Routes (ROUTES).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: ROUTES
title: APIP Cloud Routes
scenarios:
  - id: ID_APIP_ROUTES_001
    title: "An API with a GET /* operation routes a request with one or several path segments to the backend with its path."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "Wildcard path /* matches requests with a subpath".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Wildcard path /* matches requests with a subpath"
  - id: ID_APIP_ROUTES_002
    title: "An API with only a GET /* operation answers a POST to a path under it with 404."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "Wildcard path /* enforces HTTP method".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Wildcard path /* enforces HTTP method"
  - id: ID_APIP_ROUTES_003
    title: "An API with a GET / operation routes a request to its context with a trailing slash."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Root path / matches request with trailing slash".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Root path / matches a request with a trailing slash"
  - id: ID_APIP_ROUTES_004
    title: "An API with a GET / operation routes a request to its context without a trailing slash."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Root path / matches request without trailing slash".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Root path / matches a request without a trailing slash"
  - id: ID_APIP_ROUTES_005
    title: "A GET /* operation does not match a request to a sibling context that only shares the prefix (v1beta beside v1): 404."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "Wildcard /* does not match a sibling context prefix".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Wildcard /* does not match a sibling context prefix"
  - id: ID_APIP_ROUTES_006
    title: "An exact GET /weather operation routes a request with and without a trailing slash."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Exact path matches both with and without trailing
      # slash".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Exact path matches both with and without a trailing slash"
  - id: ID_APIP_ROUTES_007
    title: "An exact operation forwards a trailing slash to the upstream unchanged."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Exact path preserves trailing slash to upstream".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Exact path preserves a trailing slash to the upstream"
  - id: ID_APIP_ROUTES_008
    title: "A /forecast/* operation forwards /forecast and any path below it, and a PUT /put/* operation forwards PUT /put, with the path and method unchanged."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "Wildcard /foo/* preserves the matched prefix (and
      # method) on the upstream path".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Wildcard /foo/* preserves the matched prefix and method on the upstream path"
  - id: ID_APIP_ROUTES_009
    title: "A case variant of an exact operation's path answers 404 rather than reaching the API's /* operation, while other paths reach it."
    priority: P0
    cloud:
      # The cloud counterpart of on-premises PATHV-001.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "A case variant of an operation's path gets 404 instead of reaching the wildcard operation"
  - id: ID_APIP_ROUTES_010
    title: "Case variants of several exact and parameterised operations answer 404, while a parameter's value keeps any case."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises PATHV-002.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Case variants of several operations are all refused while their parameters keep any case"
  - id: ID_APIP_ROUTES_011
    title: "An operation spelt with capitals keeps its own route next to the lowercase one, and a third spelling answers 404."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises PATHV-003.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "An operation spelt with capitals keeps its own route next to a lowercase one"
  - id: ID_APIP_ROUTES_012
    title: "A case variant answers 404 only for the methods of the operation it names; another method reaches its own wildcard operation."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises PATHV-004.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "A case variant is refused only for the methods of the operation it names"
  - id: ID_APIP_ROUTES_013
    title: "A case variant of a nested API's operation answers 404 rather than reaching an enclosing API's /* operation."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises PATHV-005; the nested API is created as a new version
      # of the enclosing one.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "A case variant is refused when another API's wildcard operation would catch it"
  - id: ID_APIP_ROUTES_014
    title: "Dot-segments and duplicate slashes are normalized, so the request matches the exact operation and the backend gets the clean path."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises "Default normalization resolves dot-segments and merges
      # duplicate slashes".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "Default normalization resolves dot-segments and merges duplicate slashes"
  - id: ID_APIP_ROUTES_015
    title: "An escaped slash (%2F) in a path segment is kept and matches one {name} segment, while the unescaped path answers 404."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Escaped slash (%2F) in a resource path segment is kept
      # unchanged and is not treated as a path separator".
      status: known-issue
      issue: "WSO2 Cloud: the cloud's edge in front of the managed gateway answers a path containing %2F with its own 307 to the unescaped path (no request ID, so not the gateway, whose default is KEEP_UNCHANGED), so the gateway never sees the escaped slash. Seen on development on 2026-11-27. No tracker link yet."
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "An escaped slash in a path segment is kept and is not a path separator"
  - id: ID_APIP_ROUTES_016
    title: "A literal dot in a path segment is kept, and a ./ segment before it is normalized away."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "A path segment containing a literal dot is preserved
      # by normalization".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "A path segment containing a literal dot is preserved by normalization"
  - id: ID_APIP_ROUTES_017
    title: "A REST API whose sandbox upstream URL is not http or https is refused naming upstream.sandbox.url, and is not created."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Deploy API with invalid URL scheme in direct sandbox
      # url should fail"; the cloud's destination guard refuses it, with DESTINATION_NOT_ALLOWED.
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "A REST API whose sandbox upstream URL is not http or https is refused"
  - id: ID_APIP_ROUTES_018
    title: "An API that sets no timeout waits for a backend that answers after 2 s, within the gateway default."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "Missing resilience configuration uses the gateway
      # default timeout".
      status: automated
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "A backend slower than an API sets no timeout for is waited for up to the gateway default"
  - id: ID_APIP_ROUTES_019
    title: "An upstream that never accepts a connection gets the gateway's 503 once its 5 s default connect timeout has passed."
    priority: P2
    cloud:
      # The cloud counterpart of on-premises "RestApi backend timeout uses the gateway global
      # default".
      status: known-issue
      issue: "WSO2 Cloud: on development an upstream that never accepts a connection (192.0.2.1:8080) gets the cloud edge's 504 \"upstream request timeout\" after 15 s, with no request ID, instead of the gateway's 503 after its 5 s default connect timeout. Seen on 2026-11-27. No tracker link yet."
      refs:
        - feature: suites/cloud/features/apip_routes.feature
          scenario: "An upstream that cannot be connected to times out after the gateway default and answers 503"
