# Scenario list: APIP Cloud Self-Hosted Gateway Lifecycle (SELF-HOSTED-GATEWAY).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: SELF-HOSTED-GATEWAY
title: APIP Cloud Self-Hosted Gateway Lifecycle
scenarios:
  - id: ID_APIP_SELF_HOSTED_GATEWAY_001
    title: "A self-hosted gateway is registered inactive with only the pending endpoint, is issued exactly one active registration token, and is gone once it is deleted."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_self_hosted_gateway.feature
          scenario: "A self-hosted gateway is registered awaiting connection, issued a token, and deleted"
  - id: ID_APIP_SELF_HOSTED_GATEWAY_002
    title: "Reconfiguring a self-hosted gateway's registration token revokes every active token and leaves exactly one new active token."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_self_hosted_gateway.feature
          scenario: "Reconfiguring a self-hosted gateway's registration token revokes the previous one"
  - id: ID_APIP_SELF_HOSTED_GATEWAY_003
    title: "A gateway started with a self-hosted gateway's registration token and the cloud console's /api-management/connect host connects and is reported active, serves an API deployed to it and stops serving it once undeployed, and is reported inactive once it stops."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_self_hosted_gateway_runtime.feature
          scenario: "A local gateway connects with its registration token and serves the API deployed to it"
  - id: ID_APIP_SELF_HOSTED_GATEWAY_004
    title: "A self-hosted gateway connected through the cloud console's /api-management/connect host reports its policies in its manifest: a custom policy with its definition, a built-in one without."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_self_hosted_gateway_custom_policies.feature
          scenario: "A connected self-hosted gateway's manifest reports its custom policies with their definitions"
  - id: ID_APIP_SELF_HOSTED_GATEWAY_005
    title: "A custom policy synced from a self-hosted gateway's manifest is added to the organisation with its display name and definition, is listed, and is no longer listed once deleted."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_self_hosted_gateway_custom_policies.feature
          scenario: "A custom policy synced from a self-hosted gateway is added to the organisation and can be deleted"
  - id: ID_APIP_SELF_HOSTED_GATEWAY_006
    title: "Syncing a policy the self-hosted gateway reports as built in is refused with POLICY_INVALID_STATE and adds nothing to the organisation."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_self_hosted_gateway_custom_policies.feature
          scenario: "Syncing a policy the self-hosted gateway does not report as custom is refused"
