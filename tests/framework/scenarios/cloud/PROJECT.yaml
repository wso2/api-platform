# Scenario list: APIP Cloud Project Lifecycle (PROJECT).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: PROJECT
title: APIP Cloud Project Lifecycle
scenarios:
  - id: ID_APIP_PROJECT_001
    title: "The default project of the organisation is resolved and active."
    priority: P1
    cloud:
      status: known-issue
      issue: "The project delete endpoint of the cloud API answers 501 and the ap token does not carry the cloud:project:delete scope, so a scenario cannot delete the project it creates. The project scenarios are skipped until the endpoint is fixed and the scope is added to the ap token."
      refs:
        - feature: suites/cloud/features/apip_project.feature
          scenario: "The default project of the organisation is resolved and active"
      note: "The runner that hosts this feature is commented out in suites/cloud/cloud-suite.yaml until the issue is fixed."
