# Scenario list: APIP Cloud REST API Lifecycle (BASIC).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: BASIC
title: APIP Cloud REST API Lifecycle
scenarios:
  - id: ID_APIP_BASIC_001
    title: "A REST API can be deployed and invoked through the gateway."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "A REST API can be deployed and invoked through the gateway"
  - id: ID_APIP_BASIC_002
    title: "Creating an API whose name and version are already in use is rejected."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "Creating an API whose name and version are already in use is rejected"
  - id: ID_APIP_BASIC_003
    title: "Creating an API with an invalid context or version is rejected."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "Creating an API with an invalid context or version is rejected"
  - id: ID_APIP_BASIC_004
    title: "An API deployed with security enabled refuses an unauthenticated call."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "An API deployed with security enabled refuses an unauthenticated call"
  - id: ID_APIP_BASIC_005
    title: "An API deployed with security enabled accepts a valid API key."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "An API deployed with security enabled accepts a valid API key"
  - id: ID_APIP_BASIC_006
    title: "A request to a path the API does not expose is answered with not found by the gateway."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "A request to a path the API does not expose is answered with not found by the gateway"
  - id: ID_APIP_BASIC_007
    title: "A new version of an API routes independently of the previous version."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "A new version of an API routes independently of the previous version"
  - id: ID_APIP_BASIC_008
    title: "Undeploying an API stops the gateway serving it."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "Undeploying an API stops the gateway serving it"
  - id: ID_APIP_BASIC_009
    title: "Redeploying an API serves the updated definition without interrupting traffic."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_basic.feature
          scenario: "Redeploying an API serves the updated definition without interrupting traffic"
