# Scenario list: APIP Cloud Managed API Portal and Consumer Sign-in (PORTAL).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
#
# Each entry also names its portal layer (`layer`), the same value the scenario carries as a
# `@layer:<name>` tag. The three layers separate what the cloud wrapper owns from what it only
# passes through:
#   cloud-owned   behaviour the cloud adds around the API Portal: managed-portal create, read,
#                 update, rotate-key and delete, provisioning, the control plane's publication
#                 routes, token checks, and what a portal serves for a published API
#   inherited     behaviour the portal product has on its own, checked once through the cloud
#                 so the wrapper does not break it: draft validation and limits, publish,
#                 republish, deprecate and unpublish rules, definitions and thumbnails
#   core-smoke    a light check that the provisioned portal's own pages and routes answer
#                 (AI discovery file, not-found pages, no internals in headers)
#
# The scenarios share one portal per runner and run in feature-file order: the refusals first,
# while the runner holds no portal, then the creation scenario, which builds the portal, and
# last the deletion scenarios. The portal consumer is created once and reused.
code: PORTAL
title: APIP Cloud Managed API Portal and Consumer Sign-in
