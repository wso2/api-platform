# Scenario list: APIP Cloud GraphQL API Lifecycle (GRAPHQL).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: GRAPHQL
title: APIP Cloud GraphQL API Lifecycle
scenarios:
  - id: ID_APIP_GRAPHQL_001
    title: "A GraphQL API created with its schema and deployed answers a query with the backend's data."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "A GraphQL API created with its schema and deployed answers a query with the backend's data"
  - id: ID_APIP_GRAPHQL_002
    title: "A mutation goes through the same route as a query and reaches the backend unchanged."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "A mutation goes through the same route as a query and reaches the backend unchanged"
  - id: ID_APIP_GRAPHQL_003
    title: "After its upstream changes and it is redeployed, the gateway sends a GraphQL API's requests to the new upstream."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "After its upstream changes and it is redeployed, the gateway sends a GraphQL API's requests to the new upstream"
  - id: ID_APIP_GRAPHQL_004
    title: "Replacing a GraphQL API's schema stores it, and the API returns the new schema."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "Replacing a GraphQL API's schema stores it, and the API returns the new schema"
  - id: ID_APIP_GRAPHQL_005
    title: "Schema validation resolves a valid schema and reports an invalid one as unresolved with its errors."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "Schema validation resolves a valid schema and reports an invalid one as unresolved with its errors"
  - id: ID_APIP_GRAPHQL_006
    title: "A GraphQL API whose schema does not match its schema source or does not parse is refused and not created, and one whose schema URL cannot be fetched is created with no schema."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "A GraphQL API whose schema does not match its schema source or does not parse is refused and not created, and one whose schema URL cannot be fetched is created with no schema"
  - id: ID_APIP_GRAPHQL_007
    title: "Deploying a GraphQL API's build serves it, deploying an earlier build serves that one again, and undeploying stops it."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "Deploying a GraphQL API's build serves it, deploying an earlier build serves that one again, and undeploying stops it"
  - id: ID_APIP_GRAPHQL_008
    title: "A GraphQL API with API key security refuses a request without a key, accepts its keys, and refuses a revoked key while another key still works."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "A GraphQL API with API key security refuses a request without a key, accepts its keys, and refuses a revoked key while another key still works"
  - id: ID_APIP_GRAPHQL_009
    title: "A GraphQL API whose SDL URL is the cloud metadata address is refused before the SDL is fetched, while one with an inline SDL is created."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises NETAC-PA-016; written, not yet run against a cloud environment.
      status: planned
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "A GraphQL API whose SDL URL is the cloud metadata address is refused before the SDL is fetched, while one with an inline SDL is created"
  - id: ID_APIP_GRAPHQL_010
    title: "Validating a GraphQL schema from a refused SDL URL or introspection endpoint is refused, while a permitted SDL URL is fetched."
    priority: P1
    cloud:
      # The cloud counterpart of on-premises NETAC-PA-020; written, not yet run against a cloud environment.
      status: planned
      refs:
        - feature: suites/cloud/features/apip_graphql.feature
          scenario: "Validating a GraphQL schema from a refused SDL URL or introspection endpoint is refused, while a permitted SDL URL is fetched"
