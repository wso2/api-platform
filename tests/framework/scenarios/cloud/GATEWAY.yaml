# Scenario list: APIP Cloud Managed Gateway Lifecycle (GATEWAY).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. The single layer (cloud) records how the suite covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but the product does not meet it yet, `issue` says why
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: GATEWAY
title: APIP Cloud Managed Gateway Lifecycle
scenarios:
  - id: ID_APIP_GATEWAY_001
    title: "The organisation's managed gateways are listed with their status."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "The organisation's managed gateways are listed with their status"
  - id: ID_APIP_GATEWAY_002
    title: "An existing environment can be selected to host a managed gateway."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "An existing environment can be selected to host a managed gateway"
  - id: ID_APIP_GATEWAY_003
    title: "A managed gateway cannot be created in an environment that does not exist."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A managed gateway cannot be created in an environment that does not exist"
  - id: ID_APIP_GATEWAY_004
    title: "A version that is neither major.minor nor CalVer is refused."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A version that is neither major.minor nor CalVer is refused"
  - id: ID_APIP_GATEWAY_005
    title: "Reading a managed gateway that does not exist returns not found."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "Reading a managed gateway that does not exist returns not found"
  - id: ID_APIP_GATEWAY_006
    title: "A gateway requested with only a name and an environment is built, connects and reports its version, and the name can be used in another environment."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A gateway requested with only a name and an environment is built, connects and reports its version, and the name can be used in another environment"
  - id: ID_APIP_GATEWAY_007
    title: "A gateway created in a new environment is built and connects, and handles at the length limit still receive a routable service."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A gateway created in a new environment is built and connects, and handles at the length limit still receive a routable service"
  - id: ID_APIP_GATEWAY_008
    title: "A gateway name already used in the environment is refused."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A gateway name already used in the environment is refused"
  - id: ID_APIP_GATEWAY_009
    title: "Updating a gateway's metadata is reflected when it is read."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "Updating a gateway's metadata is reflected when it is read"
  - id: ID_APIP_GATEWAY_010
    title: "A deployment that names fewer gateways than the environment already runs the API on is refused."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A deployment that names fewer gateways than the environment already runs the API on is refused"
  - id: ID_APIP_GATEWAY_011
    title: "The default gateway of an environment cannot be deleted while others exist."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "The default gateway of an environment cannot be deleted while others exist"
  - id: ID_APIP_GATEWAY_012
    title: "A gateway is deployed to and deleted on its own, and it is gone from the list once it is deleted."
    priority: P0
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A gateway is deployed to and deleted on its own, and it is gone from the list once it is deleted"
  - id: ID_APIP_GATEWAY_013
    title: "A deleted gateway's name is free again in its environment."
    priority: P1
    cloud:
      status: automated
      refs:
        - feature: suites/cloud/features/apip_gateway.feature
          scenario: "A deleted gateway's name is free again in its environment"
