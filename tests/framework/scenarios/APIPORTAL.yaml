# Scenario list: API Portal (APIPORTAL).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
#
# IDs are APIP-NNN, one per product flow. An ID has one IT scenario, except where its steps need
# different blocks or a @known-issue scenario must stand alone; every scenario then carries the
# same ID.
code: APIPORTAL
title: API Portal
scenarios:
  - id: APIP-001
    title: "REST API lifecycle"
    priority: P0
    ui:
      status: planned
    it:
      status: automated
      refs:
        - feature: suites/it/features/apiportal/core/rest_apis.feature
