# Scenario list: APIP Console End-to-End Journeys (CONSOLE).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
#
# These are browser journeys in the Management Portal (the api-control-plane console). Several
# IDs share a journey; 007 is split between a passing journey and a known-issue one.
code: CONSOLE
title: APIP Console End-to-End Journeys
scenarios:
  - id: CONSOLE-001
    title: "Create a REST API from scratch with a backend endpoint; the API appears in the list, and its overview shows the name, version, context and upstream entered."
    priority: P0
    ui:
      status: automated
      refs:
        - feature: suites/ui/features/management_portal/create_api.feature
          scenario: "Journey: a publisher creates a REST API from scratch with a backend endpoint"
    it:
      status: exempt
      reason: "Browser journey; the control-plane and gateway behaviour underneath is covered by the APIDEF, DEPLC, gateway and API Portal integration features (decided 2026-11-09)."
  - id: CONSOLE-002
    title: "Create a REST API by importing an OpenAPI contract from a URL; the Configure step is filled with the name, version and description from the contract, and after Create the overview lists every resource in the contract."
