# Scenario list: Health and readiness endpoints (HEALTH).
#
# The liveness and readiness endpoints of the gateway controller, gateway runtime, Platform API and
# API Portal, which orchestrators and uptime monitors probe.
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: HEALTH
title: Health and readiness endpoints
scenarios:
  - id: HEALTH-001
    title: Probe the gateway controller liveness and readiness endpoints; each answers 200 with every check up.
    priority: P0
    ui:
      status: exempt
      reason: Health endpoints are probed by orchestrators and monitors; no UI shows or calls them.
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/core/health_endpoints.feature
          scenario: "The controller <role> endpoint reports every check up"
