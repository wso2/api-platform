# Scenario list: API Key Values (APIKEY).
#
# A caller may supply its own API key value instead of having one generated. A supplied value
# must be 36 to 128 characters long, so a short, guessable key is never stored. Prefixes:
# APIKEY-PA (Platform API), APIKEY-GW (gateway management API).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: APIKEY
title: API Key Values
scenarios:
  - id: APIKEY-PA-001
    title: "Create an API key on a deployed REST API through the control plane with a 4-character supplied value; 400 VALIDATION_FAILED, and a call with that value gets 401, while a supplied key of 36 or more characters on the same API and subscription is accepted and its calls succeed."
    priority: P0
    ui:
      status: exempt
      reason: "Refusing a short key value is the control plane's validation, checked at the API; the console only shows the error it returns."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/subscriptions/secured_api_invocation.feature
          scenario: "A weak custom API key is refused by platform-api and cannot invoke the API"
  - id: APIKEY-GW-001
    title: "Create, and then update, an API key on a gateway REST API through the gateway management API with a 4-character supplied value; both get 400, and a call with that value gets 401, while a supplied key of 36 or more characters is created and its calls succeed."
    priority: P0
    ui:
      status: exempt
      reason: "The gateway management API has no console; the console manages keys through the control plane (APIKEY-PA-001)."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/security/api_key_value_length.feature
          scenario: "A custom API key value shorter than the minimum is refused"
