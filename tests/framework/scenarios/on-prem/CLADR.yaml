# Scenario list: Client Address (CLADR).
#
# With router.http_listener.xff_num_trusted_hops set, the gateway resolves the client address from
# the connection, or from the X-Forwarded-For entries appended by that many proxies in front of it,
# and replaces X-Forwarded-For with that one address before any policy runs. A caller-set value
# never reaches the access log or an IP-keyed policy, and X-Forwarded-For is not sent to the
# backend. Unset, X-Forwarded-For passes through unchanged.
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: CLADR
title: Client Address
scenarios:
  - id: CLADR-001
    title: "With xff_num_trusted_hops set to 0, deploy a REST API on the echo backend, call it without X-Forwarded-For, then with X-Forwarded-For set to one and to two made-up addresses; the backend receives no X-Forwarded-For on any of the three calls."
    priority: P0
    ui:
      status: exempt
      reason: "Resolving the client address is gateway traffic handling, checked with gateway traffic; the console has no control for it."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/security/client_address.feature
          scenario: "X-Forwarded-For does not reach the backend"
  - id: CLADR-002
    title: "With xff_num_trusted_hops set to 0, deploy a REST API with an advanced-ratelimit quota of 3 requests keyed by ip, then send four requests, three of them with a different made-up X-Forwarded-For; the first three get 200 and the fourth gets 429."
    priority: P0
    ui:
      status: exempt
      reason: "Resolving the client address is gateway traffic handling, checked with gateway traffic; the console has no control for it."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/security/client_address.feature
          scenario: "A per-IP rate limit holds when each request sets a different X-Forwarded-For"
  - id: CLADR-003
    title: "With xff_num_trusted_hops unset, deploy a REST API on the echo backend and call it with X-Forwarded-For set to two made-up addresses; the backend receives X-Forwarded-For exactly as sent."
    priority: P1
    ui:
      status: exempt
      reason: "Resolving the client address is gateway traffic handling, checked with gateway traffic; the console has no control for it."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/security/client_address.feature
          scenario: "X-Forwarded-For passes through unchanged when no trusted hops are set"
  - id: CLADR-004
    title: "With xff_num_trusted_hops unset, deploy a REST API with an advanced-ratelimit quota of 2 requests keyed by ip, then send two requests with X-Forwarded-For 198.51.100.41, one with 198.51.100.41 followed by another address, and one with a different first entry; the first two get 200, the third 429 (same first entry, same bucket) and the fourth 200 (new first entry, new bucket)."
    priority: P1
    ui:
      status: exempt
      reason: "Resolving the client address is gateway traffic handling, checked with gateway traffic; the console has no control for it."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/security/client_address.feature
          scenario: "An ip-keyed quota follows the first X-Forwarded-For entry when no trusted hops are set"
