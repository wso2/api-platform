# Scenario list: Client Address (CLADR).
#
# The gateway resolves the client address from the connection, or from the X-Forwarded-For
# entries appended by the router.http_listener.xff_num_trusted_hops proxies in front of it, and
# replaces X-Forwarded-For with that one address before any policy runs. A caller-set value
# never reaches the backend, the access log or an IP-keyed policy.
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: CLADR
title: Client Address
scenarios:
  - id: CLADR-001
    title: "Deploy a REST API on the echo backend, call it without X-Forwarded-For, then with X-Forwarded-For set to one and to two made-up addresses; the backend receives one address in X-Forwarded-For, the same for all three calls, and never a made-up one."
    priority: P0
    ui:
      status: exempt
      reason: "Resolving the client address is gateway traffic handling, checked with gateway traffic; the console has no control for it."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/security/client_address.feature
          scenario: "A caller-set X-Forwarded-For does not reach the backend"
  - id: CLADR-002
    title: "Deploy a REST API with an advanced-ratelimit quota of 3 requests keyed by ip, then send four requests, three of them with a different made-up X-Forwarded-For; the first three get 200 and the fourth gets 429."
    priority: P0
    ui:
      status: exempt
      reason: "Resolving the client address is gateway traffic handling, checked with gateway traffic; the console has no control for it."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/security/client_address.feature
          scenario: "A per-IP rate limit holds when each request sets a different X-Forwarded-For"
