# Scenario list: Control Plane Request Limits (CPLIM).
#
# server.max_request_body_bytes caps every request body platform-api accepts, on both
# listeners, so a handler that decodes without a limit of its own cannot be made to buffer an
# unbounded body. A route's own lower limit still applies.
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: CPLIM
title: Control Plane Request Limits
scenarios:
  - id: CPLIM-001
    title: "With server.max_request_body_bytes set to 64 KiB, create a REST API whose body is under the cap, then one whose body is over it; the first is created (201), the second is refused with 400 VALIDATION_FAILED, and only the first API exists in the project."
    priority: P0
    ui:
      status: exempt
      reason: "The cap is server configuration enforced at the API; the console sends no body near it and only shows the error the API returns."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/request-limits/request_body_limit.feature
          scenario: "A REST API create over the request body cap is refused, and one under it is created"
