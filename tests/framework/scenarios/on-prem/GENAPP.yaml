# Scenario list: Application Key Mappings and LLM Associations (GENAPP).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: GENAPP
title: Application Key Mappings and LLM Associations
scenarios:
  - id: GENAPP-001
    title: "Map an LLM provider's API key to an application as its creator, then list the mappings; the key is listed under the application, and the gateway attributes the key's calls to the application."
    priority: P1
    ui:
      status: exempt
      reason: "The Management Portal has no application page. The AI Workspace, the only console that maps keys and associations, is being discontinued."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/applications/key_mappings.feature
          scenario: "A key mapped to an application is listed under it, and the gateway attributes the key's calls to the application"
  - id: GENAPP-002
    title: "As user B, who is neither the key's creator nor a key admin, map user A's key to an application, then repeat as a key admin; user B gets 403 APPLICATION_API_KEY_FORBIDDEN and nothing is mapped, and the key admin succeeds."
    priority: P0
    ui:
      status: exempt
      reason: "The Management Portal has no application page. The AI Workspace, the only console that maps keys and associations, is being discontinued."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/applications/key_mappings.feature
          scenario: "Only the key's creator or a key admin can map the key to an application"
  - id: GENAPP-003
    title: "Remove a key's mapping from an application; the key is no longer listed, and the gateway stops attributing the key's calls to the application."
    priority: P1
    ui:
      status: exempt
      reason: "The Management Portal has no application page. The AI Workspace, the only console that maps keys and associations, is being discontinued."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/applications/key_mappings.feature
          scenario: "A removed mapping is no longer listed, and the gateway stops attributing the key's calls to the application"
  - id: GENAPP-004
    title: "Associate an LLM provider and an LLM proxy in the application's project with an application, adding the provider twice, list the associations, then remove one; both are listed, the provider once, and after the removal only the other remains."
    priority: P1
    ui:
      status: exempt
      reason: "The Management Portal has no application page. The AI Workspace, the only console that maps keys and associations, is being discontinued."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/applications/associations.feature
          scenario: "An associated provider and proxy are listed once each, and a removed association is no longer listed"
  - id: GENAPP-005
    title: "Associate an LLM proxy in another project, then a REST API, with an application; both are refused with 400 and nothing is associated."
    priority: P2
    ui:
      status: exempt
      reason: "The Management Portal has no application page. The AI Workspace, the only console that maps keys and associations, is being discontinued."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/applications/associations.feature
          scenario: "A proxy in another project and a REST API cannot be associated with an application"
  - id: GENAPP-006
    title: "With an application associated with LLM provider X, and two of X's keys and one key of another provider mapped to it, list the keys for the association with X; only X's two keys are returned."
    priority: P2
    ui:
      status: exempt
      reason: "The Management Portal has no application page. The AI Workspace, the only console that maps keys and associations, is being discontinued."
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/applications/associations.feature
          scenario: "The keys listed for an association are only the associated provider's keys"
