# Scenario list: Gateway Fault Policies (FAULT).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: FAULT
title: Gateway Fault Policies
scenarios:
  - id: FAULT-001
    title: "Send a request that a guardrail rejects to a REST API with fault policies; 422 rendered by the API's error-response-formatter entry with the guardrail's fault code and type, while a request the guardrail accepts reaches the backend."
    priority: P0
    ui:
      status: exempt
      reason: Fault policies are declared on the gateway API definition; no portal journey invokes gateway traffic.
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/core/fault_policies.feature
          scenario: "A guardrail rejection runs the API's fault policies"
  - id: FAULT-002
    title: "Send a successful request to a REST API with fault policies; 200 from the backend with no header or body change made by a fault policy, while a failing request on the same API gets them."
    priority: P0
    ui:
      status: exempt
      reason: Fault policies are declared on the gateway API definition; no portal journey invokes gateway traffic.
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/core/fault_policies.feature
          scenario: "A successful request runs no fault policy"
  - id: FAULT-003
    title: "Send a request without credentials to a REST API whose operation requires an API key and that has fault policies; 401 rendered with fault code 900902 and type authentication."
    priority: P1
    ui:
      status: exempt
      reason: Fault policies are declared on the gateway API definition; no portal journey invokes gateway traffic.
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/core/fault_policies.feature
          scenario: "An authentication rejection runs the API's fault policies"
  - id: FAULT-004
