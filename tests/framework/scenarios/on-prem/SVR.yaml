# Scenario list: Sandbox and VHost Routing (SVR).
#
# A gateway routes each request to an API's main or sandbox upstream by its Host header. Default
# vhosts come from the gateway's config.toml; an API can override them in its spec or when it is
# deployed through platform-api, and defaults are fixed when the API is deployed
# (https://github.com/wso2/api-platform/discussions/369).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
#
# SVR-015 is planned: the framework has no event-gateway component yet.
code: SVR
title: Sandbox and VHost Routing
scenarios:
  - id: SVR-001
    title: "Deploy an API with vhosts.main and vhosts.sandbox and main and sandbox upstreams, then call it on each host; the main host reaches the main upstream and the sandbox host the sandbox upstream."
    priority: P0
    ui:
      status: exempt
      reason: "The Management Portal has no vhost controls; its deployments send no vhosts, which SVR-018 covers at the API level."
    it:
      status: automated
      refs:
        - feature: suites/it/features/gateway/routes/sandbox_routing.feature
          scenario: "Route requests to different upstreams using main and sandbox vhosts"
  - id: SVR-002
    title: "Deploy an API with no vhosts.main, an explicit vhosts.sandbox and only a main upstream, then call it on the sandbox host; the request is rejected and does not reach the main upstream."
    priority: P0
    ui:
      status: exempt
      reason: "The Management Portal has no vhost controls; its deployments send no vhosts, which SVR-018 covers at the API level."
    it:
      status: known-issue
      issue: https://github.com/wso2/api-platform/issues/4286
      refs:
        - feature: suites/it/features/gateway/routes/sandbox_routing.feature
          scenario: "A request on the API's sandbox vhost is rejected when the API has no sandbox upstream"
  - id: SVR-003
    title: "Deploy an API with no vhosts block and only a main upstream, then call it on a host matching the gateway's default sandbox vhost; the request is rejected."
