# Scenario list: Gateway budgets (BUDGET).
#
# One entry per scenario, kept by hand. A scenario that automates an entry carries its ID
# as a tag. Each layer (ui, it) records how it covers the ID:
#   automated    the refs assert the expected result and run in CI
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
code: BUDGET
title: Gateway budgets
scenarios:
  - id: BUDGET-001
    title: "Create a budget on one LLM provider; 201, the defaults are filled in (status active, currency USD, blockAt 100) and status.id is the name."
    priority: P1
    ui:
      status: exempt
      reason: The gateway has no UI; budgets are managed through its management API.
    it:
      status: automated
      refs:
        - feature: suites/it/suites/it/features/gateway/core/budget_management.feature
          scenario: "A budget on one provider is created with defaults, read, listed, updated and deleted"
