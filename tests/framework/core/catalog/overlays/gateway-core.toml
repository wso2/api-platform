# Gateway signing keys for blocks wired with signingKeys: true, which copies the fixed test keys
# to these paths. The active key's kid is its RFC 7638 thumbprint; the previous key is
# verify-only and still published.
[signing]
jwks_cache_max_age = "5m"

[[signing.keys]]
path = "/secrets/gateway-runtime/signing/active.pem"
active = true

[[signing.keys]]
path = "/secrets/gateway-runtime/signing/previous.pem"
kid = "it-gateway-previous"

[controller.metrics]
enabled = true

[policy_engine.metrics]
enabled = true

# Raise the downstream buffer limit from its 1 MiB default so the request-body-size runner can
# send buffered bodies above gRPC's 4 MiB default message size, and raise the policy engine's body
# ceiling with it, as operators are told to: the ext_proc message limits are sized from it.
[router.http_listener]
per_connection_buffer_limit_bytes = 16777216

[router.http_listener.timeouts]
request_headers_timeout = "5s"

[policy_engine.request_body]
max_decompressed_bytes = 16777216

# The controller propagates a change to the runtime when it next polls the event hub.
[controller.event_hub]
poll_interval = "200ms"

[router.vhosts.main]
default = "*.wso2.com"

[router.vhosts.sandbox]
default = "*-sandbox.wso2.com"

# Mutual TLS scenarios. The key manager lets a scenario require a client certificate and a
# token on the same API. Outbound scenarios assert what a backend sees from an API that names
# no identity: nothing, which also satisfies the default-identity-off scenario since it is the
# same setting. JSON access logs carry the upstream TLS failure of each request.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

[router.upstream.tls]
present_default_identity = false

[router.access_logs]
enabled = true
format = "json"
