# Gateway network access control in deny mode with private networks refused, for templated
# Backends (GWBE-009). One domain is denied by name, so a template in it is refused when it is
# saved; every private address is refused, so the router drops the addresses a templated host
# resolves to inside the container network.
[controller.server.network_security.access_control]
enabled = true
mode = "deny"
hostnames = ['[a-z0-9-]+\.blocked\.example']
deny_private_networks = true
