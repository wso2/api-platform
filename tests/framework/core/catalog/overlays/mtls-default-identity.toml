# Present a default client certificate to HTTPS backends whose upstream definition names no
# identity: the gateway identity with role default, else the HTTPS listener certificate.
[router.upstream.tls]
present_default_identity = true

# JSON access logs carry the TLS fields of each request.
[router.access_logs]
enabled = true
format = "json"

# The controller propagates a change to the runtime when it next polls the event hub.
[controller.event_hub]
poll_interval = "200ms"
