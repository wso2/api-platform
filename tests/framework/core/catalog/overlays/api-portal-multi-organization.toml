# API Portal in IDP mode against the testbench identity provider, in multi-organization
# mode: it serves every organization under its portal_id, and provisions the
# organization an unknown org claim names (api-portal-multi-organization-strict.toml
# turns that off). The provider is reached over HTTPS, which provisioning requires.
[api_portal.auth]
mode = "idp"
idp_org_id = "default"
enforce_org_validation = false

[api_portal.auth.claim_mappings]
organization = "org_id"
org_name     = "org_name"
org_handle   = "org_handle"
roles        = "roles"
groups       = "groups"

[api_portal.auth.idp]
issuer            = "https://testbench:3013/oauth2/token"
authorization_url = "https://testbench:3013/oauth2/authorize"
token_url         = "https://testbench:3013/oauth2/token"
jwks_url          = "https://testbench:3013/oauth2/jwks"
client_id         = "api-portal-it-client"
client_secret     = "api-portal-it-secret"
audience          = "api-portal-it-client"
callback_url      = '{{ env "APIP_AP_AUTH_IDP_CALLBACK_URL" }}'
scope             = "openid profile email"
silent_sso        = true

[api_portal.auth.authorization.portal_roles]
admin      = "ap_admin"
subscriber = "ap_subscriber"

[api_portal.multi_organization]
enabled = true

# The sha256 of the shared key the API Portal steps publish with, as platform-api would.
[api_portal.internal_auth]
hash = "861d88e4600b4e7dfc353957475af8db3970bbe7f43a8a36fbb34a7c00de886c"

[api_portal.webhooks.delivery]
poll_interval_ms = 1000
