# Mutual TLS observability: JSON access logs carry the TLS fields of each request, and the
# controller and policy engine publish the certificate gauges and policy counters.
[router.access_logs]
enabled = true
format = "json"

[controller.metrics]
enabled = true

[policy_engine.metrics]
enabled = true

# The controller propagates a change to the runtime when it next polls the event hub.
[controller.event_hub]
poll_interval = "200ms"
