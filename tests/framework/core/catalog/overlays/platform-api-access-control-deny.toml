# Outbound network access control in deny mode with private networks refused (NETAC). One public
# documentation address is denied by name, and every private address is refused: testbench, which
# resolves into the container network, included.
[platform_api.server.network_security.access_control]
enabled = true
mode = "deny"
hostnames = ['203\.0\.113\.7']
deny_private_networks = true
