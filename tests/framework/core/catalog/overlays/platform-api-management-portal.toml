# The Management Portal's journeys (APIDEF and CONSOLE).

# The definition settings of platform-api-openapi-import.toml, which the integration suite uses:
# trust the testbench specs service, and cap a definition at 64 KiB.
[platform_api.http_client.tls]
root_ca_file = "/app/data/certs/specs-ca.pem"

[platform_api]
openapi_spec_max_fetch_bytes = 65536

# Let the Test page's relay reach the suite's gateway, which the control plane registers at this
# endpoint.
[platform_api.gateway_relay.egress]
allow_hosts = ["http://gateway-runtime:8080"]

# The suite's users, as in platform-api-storage.toml (a block overlay replaces that list), and a
# read-only viewer for the console's permission journey.
[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_ADMIN_USERNAME" "admin" }}'
password_hash = '{{ env "APIP_CP_ADMIN_PASSWORD_HASH" }}'
roles         = ["ap_admin"]

[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_DEVELOPER_USERNAME" "developer" }}'
password_hash = '{{ env "APIP_CP_DEVELOPER_PASSWORD_HASH" }}'
roles         = ["ap_subscriber"]

[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_PUBLISHER_USERNAME" "publisher" }}'
password_hash = '{{ env "APIP_CP_PUBLISHER_PASSWORD_HASH" }}'
roles         = ["ap_publisher"]

[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_VIEWER_USERNAME" "viewer" }}'
password_hash = '{{ env "APIP_CP_VIEWER_PASSWORD_HASH" }}'
roles         = ["ap_viewer"]
