# Database and HTTPS configuration for platform-api.

[platform_api.database]
driver   = '{{ env "APIP_CP_DATABASE_DRIVER" "sqlite3" }}'
path     = '{{ env "APIP_CP_DATABASE_PATH" "./data/api_platform.db" }}'
host     = '{{ env "APIP_CP_DATABASE_HOST" "" }}'
port     = '{{ env "APIP_CP_DATABASE_PORT" "5432" }}'
name     = '{{ env "APIP_CP_DATABASE_NAME" "" }}'
user     = '{{ env "APIP_CP_DATABASE_USER" "" }}'
password = '{{ env "APIP_CP_DATABASE_PASSWORD" "" }}'
ssl_mode = '{{ env "APIP_CP_DATABASE_SSL_MODE" "disable" }}'

# HTTPS uses the certificate and key mounted by the framework.
[platform_api.server.https]
enabled   = true
port      = 9243
cert_file = "/app/data/certs/cert.pem"
key_file  = "/app/data/certs/key.pem"

# The test suite uses HTTPS only.
[platform_api.server.http]
enabled = false

# Test administrator credentials.
[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_ADMIN_USERNAME" "admin" }}'
password_hash = '{{ env "APIP_CP_ADMIN_PASSWORD_HASH" }}'
roles         = ["ap_admin"]
