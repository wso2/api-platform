# Mutual TLS blocks. The key manager lets a scenario require a client certificate and a
# token on the same API. Also covers the outbound block: JSON access logs carry the upstream
# TLS failure of each request, and outbound scenarios assert what a backend sees from an API
# that names no identity: nothing. This also satisfies the default-identity-off scenario,
# since it is the same setting.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

[router.upstream.tls]
present_default_identity = false

[router.access_logs]
enabled = true
format = "json"

# The controller propagates a change to the runtime when it next polls the event hub.
[controller.event_hub]
poll_interval = "200ms"
