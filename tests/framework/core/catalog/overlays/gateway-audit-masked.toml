# gateway-audit.toml with mask_sensitive_fields, so the outputs show "****" for the user while
# the audit table keeps it.
[controller.audit]
enabled = true
mask_sensitive_fields = true
outputs = ["stdout", "http"]

[controller.audit.http]
endpoint = "http://testbench:3012/${BLOCK}/webhook"
allow_insecure_transport = true
content_type = "application/json"
batch_max_events = 1
flush_interval = "200ms"
