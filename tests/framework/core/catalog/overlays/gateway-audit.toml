# Audit records of management API changes, written to the controller's stdout and posted one
# record per request to the block's testbench webhook service, which accepts a single JSON
# document per request.
[controller.audit]
enabled = true
outputs = ["stdout", "http"]

[controller.audit.http]
endpoint = "http://testbench:3012/${BLOCK}/webhook"
allow_insecure_transport = true
content_type = "application/json"
batch_max_events = 1
flush_interval = "200ms"
