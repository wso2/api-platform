# Platform Gateway integration-test stack.
# The framework supplies generated files, the environment file, and the external network.

services:
  gateway-controller:
    image: ${PG_CONTROLLER_IMAGE:-ghcr.io/wso2/api-platform/gateway-controller:1.2.0-SNAPSHOT}
    command: ["-config", "/etc/gateway-controller/config.toml"]
    env_file:
      - api-platform.env
    environment:
      - IT_TEMPLATE_PATH=/anything
      - IT_RATE_LIMIT=5
      - IT_ALLOW_CREDENTIALS=true
    volumes:
      - ./config.toml:/etc/gateway-controller/config.toml:ro
      - ./aesgcm-keys/default-aesgcm256-v1.bin:/app/data/aesgcm-keys/default-aesgcm256-v1.bin:ro
      - ./listener-certs:/app/listener-certs:ro
      - ./certificates:/app/certificates
    ports:
      - "9090"
      - "9092"
      - "9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway

  gateway-runtime:
    image: ${PG_RUNTIME_IMAGE:-ghcr.io/wso2/api-platform/gateway-runtime:1.2.0-SNAPSHOT}
    command: ["--pol.config", "/etc/policy-engine/config.toml"]
    stop_grace_period: 30s
    env_file:
      - api-platform.env
    environment:
      - GATEWAY_CONTROLLER_HOST=gateway-controller
      - LOG_LEVEL=info
      - ROUTER_ADMIN_ENABLED=true
      - ROUTER_ADMIN_HOST=0.0.0.0
      - ROUTER_DRAIN_TIME_SECONDS=2
      - AWS_ENDPOINT_URL_BEDROCK_RUNTIME=http://testbench:3006
    volumes:
      - ./config.toml:/etc/policy-engine/config.toml:ro
    ports:
      - "8080"
      - "8443"
      - "9901"
      - "9002"
      - "9003"
    depends_on:
      - gateway-controller
    networks:
      - gateway

networks:
  gateway:
    external: true
    name: ${PG_NETWORK}
