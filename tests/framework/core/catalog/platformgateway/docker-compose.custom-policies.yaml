# Integration-test custom policies, merged over docker-compose.yaml. The controller loads every
# definition under /app/default-policies, and marks one custom when /app/build-manifest.yaml
# lists its name and version with a filePath.

services:
  gateway-controller${INSTANCE:-}:
    volumes:
      - ./custom-policies/definitions:/app/default-policies/it-custom-policies:ro
      - ./custom-policies/build-manifest.yaml:/app/build-manifest.yaml:ro
