# Gateway signing keys, merged over docker-compose.yaml. Compose copies an environment-sourced
# config into the container with the given owner and mode, which a bind mount cannot set: the
# policy engine accepts a key file only when it is not group-writable or readable by others, and
# the runtime runs as uid 10001.

services:
  gateway-runtime${INSTANCE:-}:
    configs:
      - source: gateway-signing-key-active
        target: /secrets/gateway-runtime/signing/active.pem
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: gateway-signing-key-previous
        target: /secrets/gateway-runtime/signing/previous.pem
        uid: "10001"
        gid: "10001"
        mode: 0400

configs:
  gateway-signing-key-active:
    environment: GATEWAY_SIGNING_KEY_ACTIVE
  gateway-signing-key-previous:
    environment: GATEWAY_SIGNING_KEY_PREVIOUS
