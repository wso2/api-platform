# Integration-test policy definition. The runtime has no implementation for it, so an API that
# attaches it cannot be deployed; tests only read and sync the definition.
name: it-custom-downgrade
version: v1.1.0
displayName: IT Custom Downgrade
description: Sets a named header on each upstream request.
parameters:
  type: object
  additionalProperties: false
  properties:
    headerValue:
      type: string
      description: Value of the header.
    headerName:
      type: string
      description: Name of the header.
  required:
    - headerValue
systemParameters:
  type: object
  additionalProperties: false
  properties: {}
