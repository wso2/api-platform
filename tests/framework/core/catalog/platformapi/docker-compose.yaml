# Platform API integration-test stack.
# The framework supplies generated configuration, credentials, certificates, and the network.

services:
  platform-api:
    image: ${PA_IMAGE:-ghcr.io/wso2/api-platform/platform-api:0.17.0-SNAPSHOT}
    command: ["-config", "/etc/platform-api/config.toml"]
    env_file:
      - api-platform.env
    environment:
      - GOCOVERDIR=${GOCOVERDIR:-}
    volumes:
      - ./config.toml:/etc/platform-api/config.toml:ro
      - ./role-to-scope-mapping.yaml:/etc/platform-api/role-to-scope-mapping.yaml:ro
      - ./certs:/app/data/certs:ro
      - ./keys:/etc/platform-api/keys:ro
    ports:
      - "9243"
    networks:
      - gateway

networks:
  gateway:
    external: true
    name: ${PG_NETWORK}
