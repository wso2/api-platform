# API Portal integration-test stack.
# The framework supplies generated configuration, certificates, keys, and the network.

services:
  api-portal:
    image: ${AP_IMAGE:-ghcr.io/wso2/api-platform/api-portal:1.0.0-SNAPSHOT}
    env_file:
      - api-platform.env
    environment:
      - NODE_EXTRA_CA_CERTS=/etc/api-portal/certs/cert.pem
      - NODE_V8_COVERAGE=${NODE_V8_COVERAGE:-}
    volumes:
      - ./config.toml:/app/configs/config.toml:ro
      - ./keys/jwt_public.pem:/etc/api-portal/keys/jwt_public.pem:ro
      - ./certs/cert.pem:/etc/api-portal/certs/cert.pem:ro
    ports:
      - "9543"
    networks:
      - gateway

networks:
  gateway:
    external: true
    name: ${PG_NETWORK}
