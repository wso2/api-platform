# Copy this file to environments.toml and set each cloud environment's base domain.
# Select an environment with -cloud-env.

[environments.development]
cloud_base_domain = "development.example"

# Gateways outside wso2.com: set CLOUD_IT_DATA_PLANE_DOMAINS to their domains, comma-separated.

# A cloud that runs on the developer's machine. platform_api_endpoint replaces the endpoint
# derived from cloud_base_domain; plain http is accepted only on a .localhost host. Run the
# suite with -cloud-env=local and CLOUD_IT_LOCAL_DATA_PLANE=true so the gateway URLs the
# platform returns (http on a .localhost host and a port) are approved.
#
# [environments.local]
# cloud_base_domain = "openchoreoapis.localhost"
# platform_api_endpoint = "http://development-wso2cloud.openchoreoapis.localhost:19080/apip-platform-api-apip-platform-api-endpoint/api/v0.9"
