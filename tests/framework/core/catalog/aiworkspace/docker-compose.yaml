# AI Workspace integration-test stack.
# The framework supplies generated configuration, certificates, keys, and the network.

services:
  ai-workspace:
    image: ${AIW_IMAGE:-ghcr.io/wso2/api-platform/ai-workspace:1.1.0-SNAPSHOT}
    env_file:
      - api-platform.env
    environment:
      - APIP_AIW_CONTROL_PLANE_URL=https://platform-api:9243
      - APIP_AIW_GATEWAY_CONTROLPLANE_HOST=platform-api:9243
      - APIP_AIW_DOMAIN=ai-workspace:9643
      - GOCOVERDIR=${GOCOVERDIR:-}
    volumes:
      - ./config.toml:/etc/ai-workspace/config.toml:ro
      - ./tls/cert.pem:/etc/ai-workspace/tls/cert.pem:ro
      - ./tls/key.pem:/etc/ai-workspace/tls/key.pem:ro
      - ./tls/cp-cert.pem:/etc/ai-workspace/tls/cp-cert.pem:ro
      - ./role-to-scope-mapping.yaml:/etc/ai-workspace/role-to-scope-mapping.yaml:ro
    ports:
      - "9643"
    networks:
      - gateway

networks:
  gateway:
    external: true
    name: ${PG_NETWORK}
