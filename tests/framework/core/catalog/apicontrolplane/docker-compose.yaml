# Management Portal integration-test stack.
# The framework supplies generated configuration, certificates, and the network.

services:
  api-control-plane:
    image: ${ACP_IMAGE:-ghcr.io/wso2/api-platform/api-control-plane:0.1.0-SNAPSHOT}
    env_file:
      - api-platform.env
    environment:
      - APIP_ACP_CONTROL_PLANE_URL=https://platform-api:9243
      - GOCOVERDIR=${GOCOVERDIR:-}
    volumes:
      - ./config.toml:/etc/api-control-plane/config.toml:ro
      - ./tls/cp-cert.pem:/etc/api-control-plane/tls/cp-cert.pem:ro
    ports:
      - "8082"
    networks:
      - gateway

networks:
  gateway:
    external: true
    name: ${PG_NETWORK}
