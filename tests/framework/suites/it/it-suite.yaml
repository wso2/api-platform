  # Platform-api working with an API Portal and a gateway: publishing a REST API to the portal.
  # Platform-api registers the portal over HTTPS and trusts its certificate, so the block overlays
  # the portal's own certificate onto platform-api's outbound trust and gives the portal the hash
  # of the key platform-api publishes with. The portal stages its product role file, which grants
  # the platform-api-system role the publishing calls are authorized as; the shared IT role files
  # do not. The outage runner stops the portal, so runners must not overlap: keep parallel at 1.
  - name: platform-api-gateway-api-portal
    parallel: 1
    components:
      - name: platform-api
        overlay: tests/framework/core/catalog/overlays/platform-api-portal-publishing.toml
        db: postgres
      - name: api-portal
        dependsOn: [platform-api]
        db: postgres
        overlay: tests/framework/core/catalog/overlays/api-portal-publishing.toml
        stagedFiles:
          role-to-scope-mapping.yaml: portals/api-portal/resources/role-to-scope-mapping.yaml
      - name: platform-gateway
        dependsOn: [platform-api]
        db: postgres
      - name: testbench
    runners:
      - name: publication-lifecycle
        features:
          - features/apiportal/publishing/publication_lifecycle.feature
      - name: publication-monetization
        features:
          - features/apiportal/publishing/publication_monetization.feature
      - name: publication-failures
        features:
          - features/apiportal/publishing/publication_failures.feature
      - name: publication-content
        # Excludes the scenarios for content that stays on the portal after it is unselected.
        features:
          - features/apiportal/publishing/publication_content.feature
        tags: "~@known-issue"
      - name: publication-outage
        features:
          - features/apiportal/publishing/publication_outage.feature
      # Bills through the testbench's Stripe and Moesif services, which hold one account per block.
      - name: api-portal-billing
        features:
          - features/apiportal/monetization/billing_setup.feature
          - features/apiportal/monetization/paid_checkout.feature
          - features/apiportal/monetization/usage_billing.feature

  # Policy error compatibility: every migrated policy's main rejection, held to the error
  # response the policy returned before the change. The policies come from the adjacent
  # gateway-controllers checkout — in that repository's CI, the pull request under test — and
  # the expected responses live in resources/expected-error-responses/, one file per scenario
  # for every Gateway version.
  # Runners are tagged by the first Gateway release that ships their policies; select a release
  # with -gateway-version, or omit it for the current source build. On a release, only the
  # policies it ships are built (releasedPoliciesOnly). See the "Policy error compatibility"
  # section of tests/framework/README.md.
  - name: policy-compat
    parallel: 3
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/policy-compat.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
        addPoliciesFrom: ../gateway-controllers/policies
        releasedPoliciesOnly: true
      - name: testbench
    runners:
      - name: policy-errors-from-1-1-0
        tags: "gateway-version>=1.1.0"
        features:
          - features/gateway/policy-errors/policy_errors_from_1_1_0.feature
      - name: policy-errors-from-1-2-0
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/policy-errors/policy_errors_from_1_2_0.feature
      - name: policy-errors-latest
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/policy-errors/policy_errors_latest.feature

  # semantic-cache needs the semantic-ai overlay and Redis, which the block above does not
  # carry. Same policy source, same expected responses.
  - name: policy-compat-semantic-ai
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/semantic-ai.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
        dependsOn: [redis]
        addPoliciesFrom: ../gateway-controllers/policies
        releasedPoliciesOnly: true
      - name: testbench
      - name: redis
