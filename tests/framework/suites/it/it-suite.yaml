suite: it-suite

defaults:
  parallel: 6
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: api-portal-core
    parallel: 9
    components:
      - name: platform-api
        db: postgres
      - name: api-portal
        db: postgres
        dependsOn: [platform-api]
      - name: testbench
    runners:
      - name: security
        features:
          - features/apiportal/security/security.feature
      - name: auth
        features:
          - features/apiportal/security/auth.feature
      - name: rest-apis
        features:
          - features/apiportal/core/rest_apis.feature
      - name: rest-api-versions
        features:
          - features/apiportal/core/rest_api_versions.feature
      - name: resources
        features:
          - features/apiportal/core/resources.feature
      - name: mcp-servers
        features:
          - features/apiportal/ai/mcp_servers.feature
      - name: monetization-meters
        features:
          - features/apiportal/monetization/meters.feature
      - name: monetization-priced-plans
        features:
          - features/apiportal/monetization/priced_plans.feature
      - name: monetization-paid-plans-without-billing
        features:
          - features/apiportal/monetization/paid_plans_without_billing.feature
      - name: api-types
        features:
          - features/apiportal/core/api_types.feature
      - name: subscriptions
        features:
          - features/apiportal/subscriptions/subscriptions.feature
      - name: views-labels
        features:
          - features/apiportal/content/views_labels_advanced.feature
      - name: views-pages
        features:
          - features/apiportal/content/views_pages.feature
      - name: workflows
        features:
          - features/apiportal/ai/workflows.feature
      - name: content
        features:
          - features/apiportal/content/content.feature
      - name: organization-content
        features:
          - features/apiportal/content/organization_content.feature
      - name: api-keys
        features:
          - features/apiportal/subscriptions/api_keys.feature
      - name: discovery
        features:
          - features/apiportal/ai/discovery.feature
      - name: organizations
        features:
          - features/apiportal/organizations/organizations.feature
      - name: organization-isolation
        features:
          - features/apiportal/organizations/organization_isolation.feature
      - name: artifact-uploads
        features:
          - features/apiportal/core/artifact_upload.feature

  # Webhook subscribers are organization-wide. Keep their intentionally failing
  # delivery targets isolated from every other API Portal runner.
  - name: api-portal-webhooks
    parallel: 1
    components:
      - name: platform-api
        db: postgres
      - name: api-portal
        db: postgres
        dependsOn: [platform-api]
      - name: testbench
    runners:
      - name: webhook-subscribers
        features:
          - features/apiportal/webhooks/webhook_subscribers.feature
      - name: application-webhooks
        features:
          - features/apiportal/webhooks/application_webhooks.feature
      - name: api-key-webhooks
        features:
          - features/apiportal/webhooks/api_key_webhooks.feature
      - name: subscription-webhooks
        features:
          - features/apiportal/webhooks/subscription_webhooks.feature
      - name: webhook-delivery
        features:
          - features/apiportal/webhooks/webhook_delivery.feature
      - name: monetization-events
        features:
          - features/apiportal/monetization/events.feature

  - name: api-portal-auth-scope
    parallel: 1
    components:
      - name: platform-api
        db: postgres
        overlay: tests/framework/core/catalog/overlays/platform-api-auth-users.toml
        stagedFiles:
          role-to-scope-mapping.yaml: tests/framework/core/catalog/platformapi/resources/api-portal-auth-roles.yaml
      - name: api-portal
        db: postgres
        stagedFiles:
          role-to-scope-mapping.yaml: tests/framework/core/catalog/apiportal/resources/api-portal-auth-roles.yaml
        overlay: tests/framework/core/catalog/overlays/api-portal-auth-scope.toml
        dependsOn: [platform-api]
    runners:
      - name: authorization
        features:
          - features/apiportal/security/auth_scope.feature

  - name: api-portal-auth-role
    parallel: 1
    components:
      - name: platform-api
        db: postgres
        overlay: tests/framework/core/catalog/overlays/platform-api-auth-users.toml
        stagedFiles:
          role-to-scope-mapping.yaml: tests/framework/core/catalog/platformapi/resources/api-portal-auth-roles.yaml
      - name: api-portal
        db: postgres
        stagedFiles:
          role-to-scope-mapping.yaml: tests/framework/core/catalog/apiportal/resources/api-portal-auth-roles.yaml
        overlay: tests/framework/core/catalog/overlays/api-portal-auth-role.toml
        dependsOn: [platform-api]
    runners:
      - name: authorization
        features:
          - features/apiportal/security/auth_role.feature

  - name: api-portal-grant-table
    parallel: 1
    components:
      - name: platform-api
        db: postgres
      - name: api-portal
        db: postgres
        dependsOn: [platform-api]
    runners:
      - name: grant-table-parity
        features:
          - features/apiportal/security/grant_table_parity.feature

  # Multi-organization mode: IDP sign-in through the testbench identity provider, every
  # organization under the portal's portal_id served.
  - name: api-portal-multi-organization
    parallel: 3
    components:
      - name: testbench
      - name: api-portal-multi-organization
        db:
          matrix: [postgres, sqlserver]
    runners:
      - name: claims
        features:
          - features/apiportal_multi_organization_claims.feature
      - name: isolation
        features:
          - features/apiportal_multi_organization_isolation.feature
      - name: login
        features:
          - features/apiportal_multi_organization_login.feature
      - name: webhooks
        features:
          - features/apiportal_multi_organization_webhooks.feature
      - name: publishing
        features:
          - features/apiportal_multi_organization_publishing.feature
      - name: portals
        features:
          - features/apiportal_multi_organization_portals.feature

  - name: api-portal-foreign-org
    parallel: 1
    components:
      - name: platform-api
        db: postgres
      - name: api-portal
        db: postgres
        dependsOn: [platform-api]
      - name: api-portal-other-org
        db: postgres
        dependsOn: [platform-api]
    runners:
      - name: foreign-org-login
        features:
          - features/apiportal/organizations/foreign_org_login.feature

  # Which hostnames the HTTPS listener asks for a client certificate. What it asks is state of
  # the whole gateway, so runners take turns, and each block sets its own downstream_tls
  # settings. The settings do not depend on the database, so only the default block repeats
  # on every engine.
  - name: gateway-mtls-hostnames
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-event-hub.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: mtls-hostnames
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_hostnames.feature

  - name: gateway-mtls-hostnames-required
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-dedicated-hostname.toml
        db: sqlite
      - name: testbench
    runners:
      - name: mtls-hostnames-required
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_hostnames_required.feature

  - name: gateway-mtls-hostnames-all-connections
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-all-connections.toml
        db: sqlite
      - name: testbench
    runners:
      - name: mtls-hostnames-all-connections
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_hostnames_all_connections.feature

  - name: gateway-mtls-hostnames-all-connections-required
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-all-connections-dedicated-hostname.toml
        db: sqlite
      - name: testbench
    runners:
      - name: mtls-hostnames-all-connections-required
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_hostnames_all_connections_required.feature

  # Mutual TLS scenarios change the client authority pool and whether the HTTPS listener
  # asks for a certificate, which is state of the whole gateway, so runners take turns.
  - name: gateway-mtls
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: mtls-auth
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_auth.feature
      - name: mtls-client-ca-pool
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_client_ca_pool.feature
      - name: mtls-pool-references
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_pool_references.feature
      - name: mtls-listener
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_listener.feature
      - name: mtls-header-relay
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_header_relay.feature

  # The relayed client certificate header is believed from any connection here, a gateway-wide
  # setting the other mutual TLS blocks must not see.
  - name: gateway-mtls-trust-any
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-header-trust-any.toml
        db: sqlite
      - name: testbench
    runners:
      - name: mtls-header-bypass
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_header_bypass.feature

  # Mutual TLS outcomes in the access log, analytics and metrics. The block reads gateway-wide
  # certificate gauges and its own JSON access log lines, so runners take turns.
  - name: gateway-mtls-observability
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-observability.toml
        db: sqlite
      - name: testbench
      - name: tls-backend
    runners:
      - name: mtls-observability
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_observability.feature

  # Outbound mutual TLS adds gateway identities and trust certificates and never a client
  # authority, so it has its own gateway and runs beside the inbound block.
  - name: gateway-mtls-outbound
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-outbound.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
      - name: tls-backend
    runners:
      - name: mtls-outbound
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_outbound.feature

  # The mutual TLS scenarios on a gateway with two controllers sharing one PostgreSQL
  # database. One serves the management API; the other alone feeds the runtime, so every
  # certificate and API change reaches the runtime through the event path between them.
  - name: gateway-mtls-ha
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-ha.toml
        db: postgres
      - name: testbench
      - name: tls-backend
    wiring:
      platform-gateway:
        controllers: 2
    runners:
      - name: mtls-auth
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_auth.feature
      - name: mtls-client-ca-pool
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_client_ca_pool.feature
      - name: mtls-pool-references
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_pool_references.feature
      - name: mtls-listener
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_listener.feature
      - name: mtls-header-relay
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_header_relay.feature
      - name: mtls-observability
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_observability.feature
      - name: mtls-outbound
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_outbound.feature

  # The default client certificate to backends. The switch is gateway configuration (on by
  # default; the off block sets it false) and the default identity is gateway-wide state, so
  # each block runs its scenarios one at a time.
  - name: gateway-mtls-default-identity-off
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-default-identity-off.toml
        db: sqlite
      - name: testbench
      - name: tls-backend
    runners:
      - name: mtls-default-identity-off
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_default_identity_off.feature

  - name: gateway-mtls-default-identity-on
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-default-identity.toml
        db: sqlite
      - name: testbench
      - name: tls-backend
    runners:
      - name: mtls-default-identity-on
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_default_identity.feature

  - name: gateway-core
    parallel: 7
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/gateway-signing.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    wiring:
      platform-gateway:
        signingKeys: true
    runners:
      - name: gateway-jwks
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/security/jwks.feature
      - name: api-error-responses
        features:
          - features/gateway/core/api_error_responses.feature
      - name: request-id-response
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/core/request_id_response.feature
      - name: health
        features:
          - features/gateway/core/health.feature
      - name: api-management
        features:
          - features/gateway/core/api_management.feature
      - name: api-deploy
        features:
          - features/gateway/core/api_deploy.feature
      - name: upstream-url-validation
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/routes/upstream_url_validation.feature
      - name: api-keys
        features:
          - features/gateway/security/api_keys.feature
      - name: subscription-management
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/core/subscription_management.feature
      - name: subscription-plan-management
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/core/subscription_plan_management.feature
      # The ap CLI built from this checkout, driving the gateway through its management and
      # admin APIs. The CLI follows the current contracts, so it is not run against 1.1.0.
      - name: ap-cli-gateway
        tags: "gateway-version>1.1.0"
        features:
          - features/cli/gateway/management.feature
          - features/cli/gateway/apply.feature
          - features/cli/gateway/rest_api.feature
          - features/cli/gateway/mcp.feature
          - features/cli/gateway/image_build.feature
      - name: ap-cli-subscription
        tags: "gateway-version>1.2.0"
        features:
          - features/cli/gateway/subscription.feature
      - name: api-with-policies
        features:
          - features/gateway/core/api_with_policies.feature
      - name: search-deployments
        features:
          - features/gateway/core/search_deployments.feature
      - name: lazy-resources-xds
        features:
          - features/gateway/core/lazy_resources_xds.feature
      - name: route-path-matching
        features:
          - features/gateway/routes/route_path_matching.feature
      - name: route-path-matching-prefix
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/routes/route_path_matching_prefix.feature
      - name: path-normalization
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/routes/path_normalization.feature
      - name: header-routing
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/routes/header_routing.feature
      - name: redirect
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/routes-policies/redirect.feature
      - name: request-rewrite
        features:
          - features/gateway/routes-policies/request_rewrite.feature
      - name: respond
        features:
          - features/gateway/routes-policies/respond.feature
      - name: sandbox-routing
        features:
          - features/gateway/routes/sandbox_routing.feature
      - name: sandbox-upstream-first-url
        tags: "gateway-version<1.2.0"
        features:
          - features/gateway/routes/sandbox_upstream_first_url.feature
      - name: sandbox-upstream-url-validation
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/routes/sandbox_upstream_url_validation.feature
      - name: word-count-guardrail
        features:
          - features/gateway/guardrails-policies/word_count_guardrail.feature
      - name: url-guardrail
        features:
          - features/gateway/guardrails-policies/url_guardrail.feature
      - name: cel-conditions
        features:
          - features/gateway/core/cel_conditions.feature
      - name: certificates
        tags: "gateway-version>1.2.0;~@certificate-refusal-1.2.0"
        features:
          - features/gateway/security/certificates.feature
      - name: certificates-1.2.0
        tags: "gateway-version<=1.2.0;~@certificate-refusal-current"
        features:
          - features/gateway/security/certificates.feature
      - name: secrets
        features:
          - features/gateway/security/secrets.feature
      - name: llm-cost-calculation-providers
        tags: "gateway-version>=1.2.0"
        features:
          - features/ai-workspace-gateway/ratelimit-policies/llm_cost_calculation_providers.feature
      - name: llm-provider-global-ratelimit
        tags: "gateway-version>=1.2.0"
        features:
          - features/ai-workspace-gateway/ratelimit-policies/llm_provider_global_ratelimit.feature
      - name: llm-provider-management
        features:
          - features/ai-workspace-gateway/llm/llm_provider.feature
      - name: llm-provider-policy-validation
        tags: "gateway-version>=1.2.0"
        features:
          - features/ai-workspace-gateway/llm/llm_provider_policy_validation.feature
      - name: llm-provider-template-management
        features:
          - features/ai-workspace-gateway/llm/llm_provider_template.feature
      - name: llm-proxy-management
        features:
          - features/ai-workspace-gateway/llm/llm_proxy.feature
      - name: llm-proxy-policy-validation
        tags: "gateway-version>=1.2.0"
        features:
          - features/ai-workspace-gateway/llm/llm_proxy_policy_validation.feature
      - name: model-round-robin
        features:
          - features/ai-workspace-gateway/llm-policies/model_round_robin.feature
      - name: model-round-robin-multi-provider
        tags: "gateway-version>=1.2.0"
        features:
          - features/ai-workspace-gateway/llm-policies/model_round_robin_multi_provider.feature
      - name: model-weighted-round-robin
        features:
          - features/ai-workspace-gateway/llm-policies/model_weighted_round_robin.feature
      - name: model-weighted-round-robin-multi-provider
        tags: "gateway-version>=1.2.0"
        features:
          - features/ai-workspace-gateway/llm-policies/model_weighted_round_robin_multi_provider.feature
      - name: llm-policy-path-specificity
        tags: "gateway-version>=1.2.0"
        features:
          - features/ai-workspace-gateway/llm/llm_policy_path_specificity.feature
      - name: prompt-template
        features:
          - features/ai-workspace-gateway/llm-policies/prompt_template.feature
      - name: prompt-decorator
        features:
          - features/ai-workspace-gateway/llm-policies/prompt_decorator.feature
      - name: mcp-deploy
        features:
          - features/ai-workspace-gateway/mcp/mcp_deploy.feature
      - name: mcp-spec-versions
        tags: "gateway-version>1.2.0"
        features:
          - features/ai-workspace-gateway/mcp/mcp_spec_versions.feature
      - name: mcp-resolver
        tags: "gateway-version>1.2.0"
        features:
          - features/ai-workspace-gateway/mcp/mcp_resolver.feature
      # No version gate: a session surviving the gateway is behaviour every supported release
      # has, and the era a proxy declares is what these scenarios vary instead.
      - name: mcp-legacy-upstream
        features:
          - features/ai-workspace-gateway/mcp/mcp_legacy_upstream.feature
      # Gated where its sibling above is not: this feature deploys a 2026-07-28 proxy, and 1.2.0
      # rejects that specVersion outright, so the era comparison is unreachable on that release.
      - name: mcp-legacy-upstream-modern-client
        tags: "gateway-version>1.2.0"
        features:
          - features/ai-workspace-gateway/mcp/mcp_legacy_upstream_modern_client.feature
      - name: mcp-upstream-auth
        tags: "gateway-version>1.2.0"
        features:
          - features/ai-workspace-gateway/mcp/mcp_upstream_auth.feature
      - name: graphql-deploy
        tags: "gateway-version>1.2.0"
        features:
          - features/graphql_deploy.feature
      - name: graphql-api-keys
        tags: "gateway-version>1.2.0"
        features:
          - features/graphql_api_keys.feature
      - name: policy-engine-admin
        features:
          - features/gateway/core/policy_engine_admin.feature
        tags: "~@known-issue"
      - name: template-functions
        features:
          - features/gateway/core/template_functions.feature
      - name: template-functions-typed
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/core/template_functions_typed.feature

  - name: config-dump
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: config-dump
        features:
          - features/gateway/core/config_dump.feature

  # Restart-behavior isolation: every runner here restarts gateway-controller mid-scenario, so
  # this block hosts them alone rather than alongside runners that expect it continuously
  # reachable - see dp-to-cp-reconnect's own comment for the flake that mixing them caused.
  - name: gateway-restart
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
      - name: platform-gateway
        dependsOn: [platform-api]
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: startup-db-bootstrap
        features:
          - features/gateway/core/startup_db_bootstrap.feature
      - name: dp-to-cp-reconnect
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/control-plane/dp_to_cp_reconnect.feature

  - name: gateway-metrics
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/metrics.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
