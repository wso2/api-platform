# The integration suite. A block starts a set of products (components) and runs its runners
# (feature files) against them. The blocks live in the files under blocks/, one per
# combination of products the tests check (helper services such as testbench, tls-backend
# and a2a-trip-planner do not count):
#   blocks/gateway.yaml                          gateway
#   blocks/platform-api.yaml                     Platform API
#   blocks/platform-api-gateway.yaml             Platform API + gateway
#   blocks/api-portal.yaml                       API Portal
#   blocks/platform-api-gateway-api-portal.yaml  Platform API + API Portal + gateway
#
# Adding a test:
#   1. Pick the file by the products your test checks.
#   2. Follow the guideline at the top of that file: add a runner to an existing block that
#      fits the test; a new block is the last resort.
#   3. A new combination of products (a new file under blocks/, listed in blockFiles) is an
#      even worse last resort: first check whether the test fits an existing combination.
#
# This file keeps the settings shared by every block.

suite: it-suite

defaults:
  parallel: 6
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blockFiles:
  - blocks/gateway.yaml
  - blocks/platform-api.yaml
  - blocks/platform-api-gateway.yaml
  - blocks/api-portal.yaml
  - blocks/platform-api-gateway-api-portal.yaml
