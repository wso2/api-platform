# Platform API and gateway blocks: the control plane managing gateways, with no API Portal.
#
# Adding a test:
#   1. Add a runner to an existing block below that fits the test: one whose product settings
#      (overlay) and isolation the test can run with. Most tests fit the generic platform-api-core block.
#   2. Only if no block fits, add a new block. This is the last resort: the test needs a
#      product setting (an overlay) the other runners must not see, or must run alone (it
#      restarts a product, counts metrics, or expects an empty product). Say why in a comment
#      above the block.
#   3. A test that needs a different set of products is not added here. A new combination
#      (a new file) is an even worse last resort; see it-suite.yaml.
# Feature paths are relative to suites/it, as in it-suite.yaml.

blocks:
  # The generic Platform API block: Platform API managing a gateway. Most control plane tests fit
  # here; one that needs its own settings or must run alone goes in a block that has them.
  - name: platform-api-core
    parallel: 2
    components:
      - name: platform-api
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: tests/framework/core/catalog/overlays/platform-api-agent-card-cache.toml
      - name: platform-gateway
        dependsOn: [platform-api]
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
      - name: a2a-trip-planner
    runners:
      # Version-gated only, not database-gated, so this runs across the full db.matrix above.
      - name: ai-workspace-cli
        tags: "gateway-version>1.1.0"
        features:
          - features/ai-workspace-gateway/cli/ai_workspace_cli.feature
      - name: dp-to-cp
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/control-plane/dp_to_cp.feature
      - name: platform-api-secret-deploy
        tags: "gateway-version>=1.2.0"
        features:
          - features/management-portal/deployments/platform_api_secret_deploy.feature
      - name: platform-api-deployment
        features:
          - features/management-portal/deployments/api_deployment.feature
      - name: platform-api-build-deployment
        features:
          - features/management-portal/builds/build_deployment.feature
      - name: platform-api-resource-search
        features:
          - features/management-portal/resources/resource_search.feature
      - name: platform-api-artifact-management
        features:
          - features/management-portal/resources/artifact_management.feature
      - name: platform-api-gateway-management
        features:
          - features/management-portal/resources/gateway_management.feature
      - name: platform-api-subscription-management
        features:
          - features/management-portal/resources/subscription_management.feature
      - name: platform-api-paid-subscription-access
        features:
          - features/management-portal/monetization/paid_subscription_access.feature
        tags: "~@known-issue"
      - name: platform-api-paid-subscription-suspension
        features:
          - features/management-portal/monetization/paid_subscription_suspension.feature
        tags: "gateway-version>1.2.0;~@known-issue"
      - name: platform-api-monetization-meters
        features:
          - features/management-portal/monetization/meters.feature
      - name: platform-api-monetization-priced-plans
        features:
          - features/management-portal/monetization/priced_plans.feature
      - name: platform-api-monetization-portal-events
        features:
          - features/management-portal/monetization/portal_events.feature
      - name: platform-api-publication-drafts
        features:
          - features/management-portal/resources/publication_drafts.feature
      # Webhook secrets: issuing, rotating and removing an organization's portal secrets, and the
      # receiver finding a portal's secret from the organization and the hash its events carry.
      # Only platform-api is involved; this block's overlay already enables the webhook receiver
      # with legacy_shared_secret = true, which is everything these runners need.
      - name: webhook-secret-lifecycle
        features:
          - features/management-portal/webhook-secrets/webhook_secret_lifecycle.feature
      - name: webhook-secret-authorization
        features:
          - features/management-portal/webhook-secrets/webhook_secret_authorization.feature
      - name: webhook-secret-validation
        features:
          - features/management-portal/webhook-secrets/webhook_secret_validation.feature
      - name: webhook-secret-portal-events
        features:
          - features/management-portal/webhook-secrets/webhook_secret_portal_events.feature
      - name: platform-api-service-accounts
        features:
          - features/management-portal/resources/service_accounts.feature
      - name: platform-api-builds
        features:
          - features/management-portal/builds/build_lifecycle.feature
      # Deployment lifecycle once per artifact kind. GraphQL deployments need a gateway newer
      # than 1.2.0, so gateways up to 1.2.0 skip the @graphql Examples rows.
      - name: deployment-lifecycle
        tags: "gateway-version>1.2.0"
        features:
          - features/management-portal/deployments/lifecycle/undeploy.feature
          - features/management-portal/deployments/lifecycle/restore.feature
          - features/management-portal/deployments/lifecycle/delete.feature
      - name: deployment-lifecycle-1.2.0
        tags: "gateway-version<=1.2.0;~@graphql"
        features:
          - features/management-portal/deployments/lifecycle/undeploy.feature
          - features/management-portal/deployments/lifecycle/restore.feature
          - features/management-portal/deployments/lifecycle/delete.feature
      - name: platform-api-secured-invocation
        features:
          - features/management-portal/subscriptions/secured_api_invocation.feature
        tags: "~@known-issue"
      - name: platform-api-mcp-server
        features:
          - features/management-portal/resources/mcp_server.feature
      - name: agent-proxy-management
        features:
          - features/ai-workspace-gateway/agent/agent_proxy_management.feature
      - name: agent-proxy-cards
        features:
          - features/ai-workspace-gateway/agent/agent_proxy_cards.feature
        tags: "gateway-version>1.2.0"
      - name: agent-proxy-deployment
        features:
          - features/ai-workspace-gateway/agent/agent_proxy_deployment.feature
        tags: "gateway-version>1.2.0"
      - name: agent-proxy-api-keys
        features:
          - features/ai-workspace-gateway/agent/agent_proxy_api_keys.feature
        tags: "gateway-version>1.2.0"
      - name: agent-proxy-import
        features:
          - features/ai-workspace-gateway/agent/agent_proxy_import.feature
        tags: "gateway-version>1.2.0"
      # Scenarios AIW-LLM (scenarios/AIW-LLM.yaml), AI Workspace provider creation through the control plane. Runs on
      # every platform-api database: the generated provider ID is stored in a bounded column.
      - name: aiw-llm-provider-create
        features:
          - features/ai-workspace/llm-providers/create.feature
        tags: "~@known-issue"
      - name: aiw-llm-provider-inspect
        features:
          - features/ai-workspace/llm-providers/inspect.feature
        tags: "~@known-issue"
      - name: aiw-llm-provider-configure
        features:
          - features/ai-workspace/llm-providers/configure.feature
        tags: "~@known-issue"
      - name: aiw-llm-provider-policies
        features:
          - features/ai-workspace/llm-providers/policies.feature
        tags: "~@known-issue"
      - name: aiw-llm-provider-templates
        features:
          - features/ai-workspace/llm-providers/templates.feature
        tags: "~@known-issue"
      - name: aiw-llm-provider-deploy
        features:
          - features/ai-workspace/llm-providers/deploy.feature
        tags: "~@known-issue"

  # Restart-behavior isolation: every runner here restarts gateway-controller mid-scenario, so
  # this block hosts them alone rather than alongside runners that expect it continuously
  # reachable.
  - name: gateway-restart
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
        # A 30s deployment timeout keeps the deployment-sync wait for a timed-out deployment short.
        overlay: tests/framework/core/catalog/overlays/platform-api-deployment-timeout.toml
      - name: platform-gateway
        dependsOn: [platform-api]
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
      - name: a2a-trip-planner
    runners:
      - name: startup-db-bootstrap
        features:
          - features/gateway/core/startup_db_bootstrap.feature
      # Agents are served by Gateways newer than 1.2.0.
      - name: startup-db-bootstrap-agent
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/core/startup_db_bootstrap_agent.feature
      - name: dp-to-cp-reconnect
        tags: "gateway-version>=1.2.0"
        features:
          - features/gateway/control-plane/dp_to_cp_reconnect.feature
      # Deployment sync with a disconnected gateway.
      - name: deployment-sync
        tags: "~@known-issue"
        features:
          - features/management-portal/deployments/sync/deployment_sync.feature

  # REST API definition import and update. platform-api trusts the testbench specs service, so
  # a definition is imported over HTTPS, caps a definition at 64 KiB, and adds a user with no
  # ap: scope (overlays/platform-api-openapi-import.toml). Stored definitions are per engine.
  - name: rest-api-definition
    parallel: 2
    components:
      - name: platform-api
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: tests/framework/core/catalog/overlays/platform-api-openapi-import.toml
      - name: platform-gateway
        dependsOn: [platform-api]
        db: sqlite
      - name: testbench
    runners:
      - name: api-definitions
        tags: "~@known-issue"
        features:
          - features/management-portal/api-definitions/import.feature
          - features/management-portal/api-definitions/update.feature
          - features/management-portal/api-definitions/validate.feature
          - features/management-portal/api-definitions/limits.feature
          - features/management-portal/api-definitions/authz.feature
      # A gateway-originated API needs gateway-to-control-plane sync, from gateway 1.2.0.
      - name: api-definitions-read-only
        tags: "gateway-version>=1.2.0;~@known-issue"
        features:
          - features/management-portal/api-definitions/update_read_only.feature

  # Agent proxy recovery isolation: every scenario stops or restarts gateway-controller,
  # gateway-runtime or platform-api mid-scenario, so the feature runs alone here, as the
  # gateway-restart block does for its own restart runners.
  - name: agent-proxy-recovery
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
        overlay: tests/framework/core/catalog/overlays/platform-api-agent-card-cache.toml
      - name: platform-gateway
        dependsOn: [platform-api]
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
      - name: a2a-trip-planner
    runners:
      - name: agent-proxy-recovery
        features:
          - features/ai-workspace-gateway/agent/agent_proxy_recovery.feature
        tags: "gateway-version>1.2.0"

  # The gateway does not push its artifacts to the control plane (dp-to-cp-sync-disabled.toml),
  # which every other block here relies on.
  - name: dp-to-cp-sync-disabled
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
      - name: platform-gateway
        dependsOn: [platform-api]
        overlay: tests/framework/core/catalog/overlays/dp-to-cp-sync-disabled.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: dp-to-cp-sync-disabled
        features:
          - features/gateway/control-plane/dp_to_cp_sync_disabled.feature

  # Two gateways (replicas: 2) connected to one Platform API.
  - name: multigateway
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
      - name: platform-gateway
        dependsOn: [platform-api]
        replicas: 2
        db: sqlite
      - name: testbench
    runners:
      - name: multigateway
        features:
          - features/management-portal/deployments/multigateway.feature
      - name: deployment-list
        tags: "gateway-version>1.2.0"
        features:
          - features/management-portal/deployments/lifecycle/list.feature
      - name: deployment-list-1.2.0
        tags: "gateway-version<=1.2.0;~@graphql"
        features:
          - features/management-portal/deployments/lifecycle/list.feature

  # Control-plane tenant isolation: a second organization registered next to the default one,
  # with the second gateway connected to it. One runner at a time, so the window in which the
  # second organization's gateway must receive nothing sees no other deployment.
  - name: tenant-isolation
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
      - name: platform-gateway
        dependsOn: [platform-api]
        replicas: 2
        db: sqlite
      - name: testbench
    wiring:
      platform-gateway:
        secondOrganizationReplicas: [2]
    runners:
      - name: tenant-read
        features:
          - features/management-portal/tenant-isolation/read.feature
      - name: tenant-list
        features:
          - features/management-portal/tenant-isolation/list.feature
      - name: tenant-write
        features:
          - features/management-portal/tenant-isolation/write.feature
      - name: tenant-deploy
        features:
          - features/management-portal/tenant-isolation/deploy.feature
      - name: tenant-gateway-connection
        features:
          - features/management-portal/tenant-isolation/gateway_connection.feature
