# Platform API blocks: the control plane on its own, with no gateway or API Portal.
#
# Adding a test: add it to an existing runner below that fits it, or else add a runner to the
# block below. A new block is the last resort (a product setting the other runners must not
# see, or a test that must run alone); say why in a comment above it. A new combination (a
# new file) is an even worse last resort; see it-suite.yaml.
# Feature paths are relative to suites/it, as in it-suite.yaml.

blocks:
  # Audit with every output on (stdout, a file and the testbench webhook): the overlay would make
  # every other runner write audit records too, so each gets its own instance. The masked block
  # also sets mask_sensitive_fields, which the unmasked checks must not see.
  - name: platform-api-audit
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
        overlay: tests/framework/core/catalog/overlays/platform-api-audit.toml
      - name: testbench
    runners:
      - name: platform-api-audit
        features:
          - features/management-portal/resources/audit.feature

  - name: platform-api-audit-masked
    parallel: 1
    components:
      - name: platform-api
        db: sqlite
        overlay: tests/framework/core/catalog/overlays/platform-api-audit-masked.toml
      - name: testbench
    runners:
      - name: platform-api-audit-masked
        features:
          - features/management-portal/resources/audit_masked.feature

  # The deny-by-default posture of platform-api-core's shared-secret fallback (its overlay sets
  # legacy_shared_secret = true, see the webhook-secret-* runners there): a platform-api with the
  # webhook receiver enabled but legacy_shared_secret left at its default must still refuse a
  # hash-less delivery outright, so this gets its own instance rather than reusing that block
  # (which turns the fallback on). A single engine is enough — the setting is HTTP-layer config,
  # not storage-engine-specific.
  - name: platform-api-webhook-legacy-disabled
    components:
      - name: platform-api
        db: sqlite
        overlay: tests/framework/core/catalog/overlays/platform-api-webhook-legacy-disabled.toml
    runners:
      - name: webhook-legacy-disabled
        features:
          - features/management-portal/webhook-secrets/webhook_secret_legacy_disabled.feature

  # The request body cap (CPLIM): a 64 KiB server.max_request_body_bytes, so a scenario can cross
  # it without a 10 MiB body. Every route is capped, so the lowered cap would refuse bodies the
  # shared blocks' scenarios send; it gets its own instance. A single engine is enough: the cap is
  # on the listener, not storage-engine-specific.
  - name: platform-api-request-body-limit
    components:
      - name: platform-api
        db: sqlite
        overlay: tests/framework/core/catalog/overlays/platform-api-request-body-limit.toml
    runners:
      - name: request-body-limit
        features:
          - features/management-portal/request-limits/request_body_limit.feature

  # Network access control in allow mode (NETAC): the platform-api only reaches testbench through a
  # tenant- or user-supplied URL. That setting would refuse every other host the shared blocks'
  # scenarios use, so it gets its own instance. A single engine is enough: the check is on the
  # outbound HTTP client, not storage-engine-specific.
  - name: platform-api-access-control-allow
    components:
      - name: platform-api
        db: sqlite
        overlay: tests/framework/core/catalog/overlays/platform-api-access-control-allow.toml
      - name: testbench
    runners:
      - name: network-access-control-allow
        features:
          - features/management-portal/network-access-control/allow_mode.feature

  # Network access control in deny mode with deny_private_networks on (NETAC): every private
  # address is refused, testbench included, which no other runner could work with. A single engine
  # is enough, for the same reason as the allow-mode block.
  - name: platform-api-access-control-deny
    components:
      - name: platform-api
        db: sqlite
        overlay: tests/framework/core/catalog/overlays/platform-api-access-control-deny.toml
      - name: testbench
    runners:
      - name: network-access-control-deny
        features:
          - features/management-portal/network-access-control/deny_mode.feature
