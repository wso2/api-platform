# Platform API, API Portal and gateway blocks: the three working together, such as
# publishing from the control plane to the portal and portal credentials reaching
# the gateway.
#
# Adding a test: add it to an existing runner below that fits it, or else add a runner to the
# block below. A new block is the last resort (a product setting the other runners must not
# see, or a test that must run alone); say why in a comment above it. A new combination (a
# new file) is an even worse last resort; see it-suite.yaml.
# Feature paths are relative to suites/it, as in it-suite.yaml.

blocks:
  # Platform-api working with an API Portal and a gateway: publishing an API to the portal.
  # Platform-api registers the portal over HTTPS and trusts its certificate, so the block overlays
  # the portal's own certificate onto platform-api's outbound trust and gives the portal the hash
  # of the key platform-api publishes with. The portal stages its product role file, which grants
  # the platform-api-system role the publishing calls are authorized as. The outage runner stops
  # the portal, so runners must not overlap: keep parallel at 1.
  - name: platform-api-gateway-api-portal
    parallel: 1
    components:
      - name: platform-api
        overlay: tests/framework/core/catalog/overlays/platform-api-portal-publishing.toml
        db: postgres
      - name: api-portal
        dependsOn: [platform-api]
        db: postgres
        overlay: tests/framework/core/catalog/overlays/api-portal-publishing.toml
        stagedFiles:
          role-to-scope-mapping.yaml: portals/api-portal/resources/role-to-scope-mapping.yaml
      - name: platform-gateway
        dependsOn: [platform-api]
        db: postgres
      - name: testbench
    runners:
      - name: publication-lifecycle
        features:
          - features/management-portal/publishing/publication_lifecycle.feature
      - name: publication-monetization
        features:
          - features/management-portal/publishing/publication_monetization.feature
      - name: publication-failures
        features:
          - features/management-portal/publishing/publication_failures.feature
      - name: publication-content
        features:
          - features/management-portal/publishing/publication_content.feature
        tags: "~@known-issue"
      - name: publication-outage
        features:
          - features/management-portal/publishing/publication_outage.feature

  # The health endpoints answer only loopback here, while the suite calls them from the host, so
  # every probe is a refused client. Booting is unaffected: the framework waits for the router
  # through the Envoy admin endpoint and for the portal through its root page.
  - name: health-restricted-clients
    parallel: 2
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/health-clients-loopback.toml
        db: sqlite
      - name: testbench
      - name: platform-api
        db: sqlite
      - name: api-portal
        dependsOn: [platform-api]
        db: postgres
        overlay: tests/framework/core/catalog/overlays/api-portal-health-clients-loopback.toml
    runners:
      - name: gateway-health-access
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/security/health_access.feature
      - name: api-portal-health-access
        features:
          - features/apiportal/security/health_access.feature

  # These scenarios take the block's shared Postgres server and the gateway controller down, so
  # the block runs them one at a time and no other runner shares it.
  - name: health-dependency-outage
    parallel: 1
    components:
      - name: platform-api
        db: postgres
      - name: api-portal
        dependsOn: [platform-api]
        db: postgres
      - name: platform-gateway
        db: postgres
      - name: testbench
    runners:
      - name: health-database-outage
        tags: "gateway-version>1.2.0"
        features:
          - features/health/database_outage.feature
      - name: health-controller-outage
        tags: "gateway-version>1.2.0"
        features:
          - features/gateway/core/health_controller_outage.feature
