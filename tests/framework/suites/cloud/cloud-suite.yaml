suite: cloud

defaults:
  parallel: 1
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: apip-cloud
    parallel: 1
    components:
      - name: cloud-console
    runners:
      - name: apip-basic
        tags: "~@known-issue"
        features:
          - features/apip_basic.feature
      - name: apip-project
        tags: "~@known-issue"
        features:
          - features/apip_project.feature
      - name: apip-auth
        tags: "~@known-issue"
        features:
          - features/apip_auth.feature
      - name: apip-deploy
        tags: "~@known-issue"
        features:
          - features/apip_deploy.feature
