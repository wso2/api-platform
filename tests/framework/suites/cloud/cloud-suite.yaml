suite: cloud

defaults:
  parallel: 1
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: apip-cloud
    parallel: 1
    components:
      - name: cloud-console
    runners:
      - name: apip-basic
        features:
          - features/apip_basic.feature
      # This test skipped until fix the issue of stale data while project creation.
      # - name: apip-project
      #   features:
      #     - features/apip_project.feature
      - name: apip-auth
        features:
          - features/apip_auth.feature
      - name: apip-deploy
        tags: "~@known-issue"
        features:
          - features/apip_deploy.feature
      - name: apip-gateway
        features:
          - features/apip_gateway.feature
      - name: apip-gateway-config
        tags: "~@known-issue"
        features:
          - features/apip_gateway_config.feature
      # This test skipped until fix the issue of stale data while project creation.
      # - name: apip-promotion
      #   features:
      #     - features/apip_promotion.feature
      - name: apip-secrets
        features:
          - features/apip_secrets.feature
      - name: apip-portal
        tags: "~@known-issue"
        features:
          - features/apip_portal.feature
