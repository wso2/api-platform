suite: cloud

defaults:
  parallel: 1
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: apip-cloud
    parallel: 1
    components:
      - name: cloud-console
    runners:
      - name: apip-basic
        features:
          - features/apip_basic.feature
      - name: apip-project
        tags: "~@known-issue"
        features:
          - features/apip_project.feature
      - name: apip-auth
        features:
          - features/apip_auth.feature
      - name: apip-deploy
        features:
          - features/apip_deploy.feature
      - name: apip-environment
        features:
          - features/apip_environment.feature
      - name: apip-gateway
        tags: "~@known-issue"
        features:
          - features/apip_gateway.feature
      - name: apip-gateway-config
        features:
          - features/apip_gateway_config.feature
      - name: apip-promotion
        features:
          - features/apip_promotion.feature
      - name: apip-secrets
        tags: "~@known-issue"
        features:
          - features/apip_secrets.feature
