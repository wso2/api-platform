suite: cloud

defaults:
  parallel: 1
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: apip-cloud
    parallel: 1
    components:
      - name: cloud-console
    runners:
      - name: apip-basic
        features:
          - features/apip_basic.feature
          - features/apip_graphql.feature
      # This test skipped until fix the issue of stale data while project creation.
      # - name: apip-project
      #   features:
      #     - features/apip_project.feature
      - name: apip-auth
        features:
          - features/apip_auth.feature
      - name: apip-deploy
        tags: "~@known-issue"
        features:
          - features/apip_deploy.feature
      - name: apip-gateway
        features:
          - features/apip_gateway.feature
      - name: apip-gateway-config
        tags: "~@known-issue"
        features:
          - features/apip_gateway_config.feature
      - name: apip-self-hosted-gateway
        features:
          - features/apip_self_hosted_gateway.feature
      - name: apip-promotion
        features:
          - features/apip_promotion.feature
      - name: apip-secrets
        features:
          - features/apip_secrets.feature
      - name: apip-portal
        tags: "~@known-issue && ~@skip"
        features:
          - features/apip_portal.feature

  # Runs self-hosted gateway containers against the cloud control plane; requires Docker and
  # gateway images. Kept separate from the Docker-less apip-cloud job.
  - name: apip-cloud-self-hosted
    parallel: 1
    components:
      - name: cloud-console
      - name: platform-gateway
        db: sqlite
    # The gateway loads the integration-test policy definitions and reports all but it-builtin as
    # custom. They have fixed names, so one runner syncs them at a time.
    wiring:
      platform-gateway:
        customPolicies: true
    runners:
      - name: apip-self-hosted-gateway-runtime
        features:
          - features/apip_self_hosted_gateway_runtime.feature
      - name: apip-self-hosted-gateway-custom-policies
        features:
          - features/apip_self_hosted_gateway_custom_policies.feature
