# Scenario sheet: Control Plane Tenant Isolation (TENANT).
#
# One entry per sheet row. Each layer (ui, it) records how it covers the ID:
#   automated    the refs run in CI and assert the sheet's expected result
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
# `make standards-check` keeps this file, the scenario tags and the `sheet check`
# steps in agreement; `go run ./cmd/sheetreport` turns a run into sheet columns.
sheet: TENANT
title: Control Plane Tenant Isolation
scenarios:
  - id: TENANT-001
    title: As org B, get each of org A's REST API, gateway, application and secret; each returns 404, the same as a resource that does not exist.
    priority: P0
    ui:
      status: planned
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/tenant-isolation/read.feature
          scenario: Another organization gets not found for a REST API, gateway, application and secret
  - id: TENANT-002
    title: As org B, list REST APIs, gateways, applications, secrets, LLM providers and MCP proxies; no list contains any of org A's resources.
    priority: P0
    ui:
      status: planned
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/tenant-isolation/list.feature
          scenario: Another organization lists REST APIs, gateways, applications, secrets, LLM providers and MCP proxies without any of the organization's
  - id: TENANT-003
    title: As org B, update and delete org A's REST API, rotate org A's gateway token and delete org A's secret; each returns 404 and nothing changes.
    priority: P0
    ui:
      status: planned
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/tenant-isolation/write.feature
          scenario: Another organization's update, delete, token rotation and secret delete are refused and change nothing
  - id: TENANT-004
    title: As org A, deploy an API to org B's connected gateway; refused with 404 (gateway not found) and nothing reaches org B's gateway.
    priority: P0
    ui:
      status: planned
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/tenant-isolation/deploy.feature
          scenario: "Deploying to another organization's connected gateway is refused as not found and nothing reaches it"
  - id: TENANT-005
    title: With org B's gateway token, fetch org A's API, its subscriptions and the secrets from the gateway internal API; 404, 404, and none of org A's secrets.
    priority: P0
    ui:
      status: exempt
      reason: Gateway-to-control-plane traffic only; the Management Portal has no screen for it (decided 2026-10-30).
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/tenant-isolation/gateway_connection.feature
          scenario: "Another organization's gateway token gets not found for the API and its subscriptions, and none of the secrets"
  - id: TENANT-006
    title: One organization with gateways G1 and G2 and an API deployed to G1 only; with G2's token the API returns 404 and the secret list is empty.
    priority: P1
    ui:
      status: exempt
      reason: Gateway-to-control-plane traffic only; the Management Portal has no screen for it (decided 2026-10-30).
    it:
      status: automated
      refs:
        - feature: suites/it/features/management-portal/deployments/multigateway.feature
          scenario: "A gateway gets only what is deployed to it, so another gateway of the organization gets neither the API nor its secret"
