# Scenario sheet: AI Workspace — LLM Providers and Proxies (AIW-LLM).
#
# One entry per sheet row. Each layer (ui, it) records how it covers the ID:
#   automated    the refs run in CI and assert the sheet's expected result
#   known-issue  the refs assert it but carry @known-issue until `issue` is fixed
#   exempt       the layer deliberately does not test the ID, for `reason`
#   planned      not automated in this layer yet
# Refs are feature paths relative to tests/framework plus the exact scenario name.
# `make standards-check` keeps this file, the scenario tags and the `sheet check`
# steps in agreement; `go run ./cmd/sheetreport` turns a run into sheet columns.
sheet: AIW-LLM
title: LLM Providers and Proxies
scenarios:
  - id: AIW-PRV-001
    title: Create a provider with name, template, endpoint and API key.
    priority: P1
    ui:
      status: automated
      refs:
        - feature: suites/ui/features/aiw_llm/provider_creation.feature
          scenario: "Journey: an administrator creates LLM providers from a template"
    it:
      status: automated
      refs:
        - feature: suites/it/features/ai-workspace/llm-providers/create.feature
          scenario: "A provider created from a template with an endpoint and an API key is stored and listed"
  - id: AIW-PRV-002
    title: Submit the create-provider form with required fields empty.
    priority: P1
    ui:
      status: known-issue
      issue: https://github.com/wso2/api-platform/issues/3964
      refs:
        - feature: suites/ui/features/aiw_llm/provider_creation.feature
          scenario: "Submitting the add-provider form with its required fields empty shows inline errors and creates nothing"
    it:
      status: automated
      refs:
        - feature: suites/it/features/ai-workspace/llm-providers/create.feature
          scenario: "A provider with its required fields empty is rejected and nothing is created"
  - id: AIW-PRV-003
    title: Enter an invalid endpoint URL when creating a provider.
    priority: P2
    ui:
      status: known-issue
      issue: https://github.com/wso2/api-platform/issues/3962
      refs:
        - feature: suites/ui/features/aiw_llm/provider_creation.feature
          scenario: "An invalid endpoint URL on the add-provider form shows a URL validation error"
    it:
      status: known-issue
      issue: https://github.com/wso2/api-platform/issues/3962
      refs:
        - feature: suites/it/features/ai-workspace/llm-providers/create.feature
          scenario: "A provider whose endpoint is not a valid URL is rejected and nothing is created"
  - id: AIW-PRV-004
    title: Create another provider with the same name or ID as an existing one.
    priority: P2
    sheetUpdate: "Creating a provider whose ID already exists is a conflict and no duplicate is created. The AI Workspace derives the ID from the name, so the same name conflicts in the UI; through the API only the ID must be unique, and a repeated display name with no ID gets a new, suffixed ID. (Decided 2026-10-28.)"
    ui:
      status: automated
      refs:
        - feature: suites/ui/features/aiw_llm/provider_creation.feature
          scenario: "Journey: an administrator creates LLM providers from a template"
    it:
      status: automated
      refs:
        - feature: suites/it/features/ai-workspace/llm-providers/create.feature
          scenario: "Creating a provider with an ID that already exists is a conflict and leaves the original unchanged"
  - id: AIW-PRV-005
    title: Use a provider name with spaces or special characters.
    priority: P2
    # The product accepting any characters is the intended behaviour (decided 2026-10-28);
    # the OpenAPI displayName pattern is out of date: https://github.com/wso2/api-platform/issues/3963
    ui:
      status: automated
      refs:
        - feature: suites/ui/features/aiw_llm/provider_creation.feature
          scenario: "Journey: an administrator creates LLM providers from a template"
    it:
      status: automated
      refs:
        - feature: suites/it/features/ai-workspace/llm-providers/create.feature
          scenario: "A display name with spaces and special characters yields a valid generated ID"
