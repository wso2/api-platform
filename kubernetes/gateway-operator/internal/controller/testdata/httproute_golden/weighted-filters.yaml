      version: v1
    - name: dynamic-endpoint
      params:
        targetUpstream: rule-0-weighted
      version: v1
  - match:
      headers:
      - name: x-canary
        type: Exact
        value: "yes"
      method: DELETE
      path:
        type: PathPrefix
        value: /weighted/*
    policies:
    - name: set-headers
      params:
        request:
          headers:
          - name: x-route
            value: weighted
      version: v1
    - name: dynamic-endpoint
      params:
        targetUpstream: rule-0-weighted
