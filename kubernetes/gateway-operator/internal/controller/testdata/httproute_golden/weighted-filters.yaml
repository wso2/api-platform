        value: "yes"
      method: OPTIONS
      path:
        type: PathPrefix
        value: /weighted/*
    policies:
    - name: set-headers
      params:
        request:
          headers:
          - name: x-route
            value: weighted
      version: v1
    - name: dynamic-endpoint
      params:
        targetUpstream: rule-0-weighted
      version: v1
  - match:
      method: GET
      path:
        type: PathPrefix
        value: /*
    policies:
    - name: dynamic-endpoint
      params:
        targetUpstream: golden-apps-echo-v2-8080
      version: v1
