apiVersion: gateway.api-platform.wso2.com/v1
kind: RestApi
metadata:
  name: golden-apps-weighted-filters
spec:
  context: /
  displayName: weighted-filters
  operations:
  - match:
      headers:
      - name: x-canary
        type: Exact
        value: "yes"
      method: GET
      path:
        type: PathPrefix
        value: /weighted/*
    policies:
    - name: set-headers
      params:
        request:
          headers:
          - name: x-route
            value: weighted
      version: v1
    - name: dynamic-endpoint
      params:
        targetUpstream: rule-0-weighted
      version: v1
  - match:
      headers:
      - name: x-canary
        type: Exact
        value: "yes"
      method: POST
      path:
        type: PathPrefix
        value: /weighted/*
    policies:
    - name: set-headers
      params:
        request:
          headers:
          - name: x-route
            value: weighted
      version: v1
    - name: dynamic-endpoint
      params:
        targetUpstream: rule-0-weighted
      version: v1
  - match:
      headers:
      - name: x-canary
        type: Exact
        value: "yes"
      method: PUT
      path:
        type: PathPrefix
        value: /weighted/*
    policies:
    - name: set-headers
      params:
        request:
