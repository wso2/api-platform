apiVersion: gateway.api-platform.wso2.com/v1
kind: RestApi
metadata:
  name: golden-apps-basic
spec:
  context: /
  displayName: basic
  operations:
  - match:
      method: GET
      path:
        type: PathPrefix
        value: /*
  - match:
      method: POST
      path:
        type: PathPrefix
        value: /*
  - match:
      method: PUT
      path:
        type: PathPrefix
        value: /*
  - match:
      method: PATCH
      path:
        type: PathPrefix
        value: /*
  - match:
      method: DELETE
      path:
        type: PathPrefix
        value: /*
  - match:
      method: HEAD
      path:
        type: PathPrefix
        value: /*
  - match:
      method: OPTIONS
      path:
        type: PathPrefix
        value: /*
  upstream:
    main:
      hostRewrite: manual
      url: http://echo-v1.golden-apps.svc.cluster.local:8080
  upstreamDefinitions:
  - name: golden-apps-echo-v1-8080
    upstreams:
    - url: http://echo-v1.golden-apps.svc.cluster.local:8080
  version: v1.0
