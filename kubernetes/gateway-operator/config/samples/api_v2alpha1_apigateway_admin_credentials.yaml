# APIGateway whose gateway-controller admin password comes from a Kubernetes Secret.
#
# Create the Secret first, without writing the password to a file:
#   kubectl create secret generic gateway-1-admin -n gw1 \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# The operator configures the gateway's basic-auth admin user from this Secret and
# uses the same credentials to call the gateway's management API. The password never
# enters the Helm values or the gateway ConfigMap. Changing the Secret rolls the
# gateway-controller pod.
#
# The Secret key is mounted read-only into the gateway-controller, which reads the
# password from the file, so it never enters the pod environment.
#
# Without adminCredentials (and without basic-auth users in configRef), the operator
# generates the admin password into the Secret <gateway>-admin-credentials on the
# gateway's first deployment.
#
# Requires a gateway Helm chart that supports
# gateway.config.controller.auth.basic.users[].passwordSecretRef.
#
# spec.adminCredentials is served by v2alpha1 only. The gateway is stored as v1, with
# the field kept in the gateway.api-platform.wso2.com/conversion-data annotation by
# the operator's conversion webhook; read it back with
#   kubectl get apigateways.v2alpha1.gateway.api-platform.wso2.com gateway-1 -n gw1 -o yaml
apiVersion: gateway.api-platform.wso2.com/v2alpha1
kind: APIGateway
metadata:
  name: gateway-1
  namespace: gw1
spec:
  apiSelector:
    scope: LabelSelector
    matchLabels:
      gateway.api-platform.wso2.com/target: gateway-1
  adminCredentials:
    username: gw1-admin
    passwordSecretRef:
      name: gateway-1-admin
      key: password
