# APIGateway whose gateway-controller admin password comes from a Kubernetes Secret.
#
# Create the Secret first, without writing the password to a file:
#   kubectl create secret generic gateway-1-admin -n gw1 \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# The operator configures the gateway's basic-auth admin user from this Secret and
# uses the same credentials to call the gateway's management API. The password never
# enters the Helm values or the gateway ConfigMap. Changing the Secret rolls the
# gateway-controller pod.
#
# source: file mounts the Secret key read-only into the gateway-controller and reads it
#         from the file, so the password never enters the pod environment.
# source: env  (the default) injects it as an environment variable from the Secret.
#
# Requires a gateway Helm chart that supports
# gateway.config.controller.auth.basic.users[].passwordSecretRef.
apiVersion: gateway.api-platform.wso2.com/v1
kind: APIGateway
metadata:
  name: gateway-1
  namespace: gw1
spec:
  apiSelector:
    scope: LabelSelector
    matchLabels:
      gateway.api-platform.wso2.com/target: gateway-1
  adminCredentials:
    username: gw1-admin
    source: file
    passwordSecretRef:
      name: gateway-1-admin
      key: password
