{{- $unified := .Values.gateway.gatewayRuntime -}}
{{- $deployment := $unified.deployment -}}
{{- $policies := $unified.policies -}}
{{- $config := .Values.gateway.config -}}
{{- if $deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway-operator.fullname" . }}-gateway-runtime
  labels:
    {{- include "gateway-operator.componentLabels" (list . "gateway-runtime" $deployment.labels) | nindent 4 }}
  {{- with (include "gateway-operator.annotations" (list . $deployment.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $unified.hpa.enabled }}
  replicas: {{ $deployment.replicaCount }}
  {{- end }}
  {{- with $deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gateway-operator.componentSelectorLabels" (list . "gateway-runtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway-operator.componentPodLabels" (list . "gateway-runtime" $deployment.podLabels) | nindent 8 }}
      {{- $podAnnotations := omit (merge (dict) (default (dict) $deployment.podAnnotations) (default (dict) .Values.commonAnnotations)) "checksum/config" }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway/gateway-config.yaml") . | sha256sum }}
        {{- with $podAnnotations }}
        {{- include "gateway-operator.renderStringMap" . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gateway-operator.serviceAccountName" . }}
      {{- with (include "gateway-operator.componentImagePullSecretsBlock" (dict "root" . "componentPullSecrets" $unified.imagePullSecrets)) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with $deployment.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deployment.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deployment.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if hasKey $deployment "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $deployment.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with $deployment.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $deployment.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with $deployment.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if hasKey $deployment "automountServiceAccountToken" }}
      automountServiceAccountToken: {{ $deployment.automountServiceAccountToken }}
      {{- end }}
      containers:
        - name: gateway-runtime
          image: {{ include "gateway-operator.componentImage" (dict "root" . "repository" $unified.image.repository "defaultRepository" "ghcr.io/wso2/api-platform/gateway-runtime" "tag" $unified.image.tag) | quote }}
          imagePullPolicy: {{ $unified.image.pullPolicy }}
          args: ["--pol.config", "/etc/policy-engine/config.toml"]
          {{- with $deployment.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GATEWAY_CONTROLLER_HOST
              value: {{ default (printf "%s-controller" (include "gateway-operator.fullname" .)) $deployment.env.gatewayControllerHost | quote }}
            - name: LOG_LEVEL
              value: {{ default "info" $deployment.env.logLevel | quote }}
            {{- if $deployment.env.moesifKey }}
            - name: MOESIF_KEY
              value: {{ $deployment.env.moesifKey | quote }}
            {{- end }}
            {{- range $deployment.extraEnv }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- with $deployment.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $unified.service.ports.http }}
              protocol: TCP
            - name: https
              containerPort: {{ $unified.service.ports.https }}
              protocol: TCP
            - name: router-admin
              containerPort: {{ $unified.service.ports.routerAdmin }}
              protocol: TCP
            - name: pe-admin
              containerPort: {{ $unified.service.ports.policyEngineAdmin }}
              protocol: TCP
            - name: pe-metrics
              containerPort: {{ $unified.service.ports.policyEngineMetrics }}
              protocol: TCP
          {{- /*
          Health-check probes must dial the router's actual bound port/scheme,
          sourced directly from gateway.config.router (listener_port/https_port/
          https_enabled) — the same values the router itself binds to in
          gateway-config.yaml. They must NOT be derived from the "http"/"https"
          named container ports below: those come from the independently
          configurable gatewayRuntime.service.ports.*, which nothing forces to
          stay in sync with gateway.config.router's actual bind ports, and a
          Kubernetes httpGet probe's "port" is a raw dial target that need not
          match any declared containerPort anyway.
          */}}
          {{- $httpsEnabled := $config.router.https_enabled }}
          {{- $healthPort := $config.router.listener_port }}
          {{- $healthScheme := "HTTP" }}
          {{- if $httpsEnabled }}
            {{- $healthPort = $config.router.https_port }}
            {{- $healthScheme = "HTTPS" }}
          {{- end }}
          {{- $livenessProbe := deepCopy $deployment.livenessProbe }}
          {{- if hasKey $livenessProbe "httpGet" }}
            {{- $_ := set $livenessProbe.httpGet "port" $healthPort }}
            {{- $_ := set $livenessProbe.httpGet "scheme" $healthScheme }}
          {{- end }}
          livenessProbe:
            {{- toYaml $livenessProbe | nindent 12 }}
          {{- with $deployment.startupProbe }}
          {{- $startupProbe := deepCopy . }}
          {{- if hasKey $startupProbe "httpGet" }}
            {{- $_ := set $startupProbe.httpGet "port" $healthPort }}
            {{- $_ := set $startupProbe.httpGet "scheme" $healthScheme }}
          {{- end }}
          startupProbe:
            {{- toYaml $startupProbe | nindent 12 }}
          {{- end }}
          {{- $readinessProbe := deepCopy $deployment.readinessProbe }}
          {{- if hasKey $readinessProbe "httpGet" }}
            {{- $_ := set $readinessProbe.httpGet "port" $healthPort }}
            {{- $_ := set $readinessProbe.httpGet "scheme" $healthScheme }}
          {{- end }}
          readinessProbe:
            {{- toYaml $readinessProbe | nindent 12 }}
          resources:
            {{- toYaml ($deployment.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/policy-engine/config.toml
              subPath: config.toml
            {{- if $policies.llmPricing.enabled }}
            - name: llm-pricing
              mountPath: /etc/policy-engine/llm-pricing/model_prices.json
              subPath: model_prices.json
              readOnly: true
            {{- end }}
            {{- with $deployment.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: gateway-config
          configMap:
            name: {{ include "gateway-operator.fullname" . }}-config
        {{- if $policies.llmPricing.enabled }}
        - name: llm-pricing
          configMap:
            name: {{ default (printf "%s-llm-pricing" (include "gateway-operator.fullname" .)) $policies.llmPricing.configMapName }}
        {{- end }}
        {{- with $deployment.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}

