{{- /*
The admin credential the chart generates when basic auth is enabled with no users and
no existingSecret (gateway.controller.adminCredentials). Generated once, on install, and
reused on every upgrade: the value is read back from this Secret before rendering. It is
kept on helm uninstall so a reinstall keeps the same credential. The controller reads the
password from this Secret mounted as a file. See gateway-operator.adminCredentials.
*/ -}}
{{- $ac := include "gateway-operator.adminCredentials" . | fromYaml -}}
{{- if eq $ac.mode "generated" }}
{{- if $ac.offline }}
# WARNING: rendered without cluster access (helm template, Argo CD, --dry-run=client),
# so the existing admin credential could not be read and a NEW one was generated. Every
# such render generates another one and replaces the previous one. Set
# gateway.controller.adminCredentials.existingSecret to keep a fixed credential.
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ac.secretName }}
  labels:
    {{- include "gateway-operator.componentLabels" (list . "controller" dict) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- if $ac.offline }}
    gateway.api-platform.wso2.com/admin-credentials-notice: "Generated without cluster access: every render without cluster access (helm template, Argo CD) generates a new admin credential. Set gateway.controller.adminCredentials.existingSecret to keep a fixed one."
    {{- end }}
type: Opaque
data:
  username: {{ $ac.username | b64enc | quote }}
  password: {{ $ac.password | b64enc | quote }}
{{- end }}
