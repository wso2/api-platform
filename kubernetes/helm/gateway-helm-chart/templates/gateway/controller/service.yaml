{{- $controller := .Values.gateway.controller -}}
{{- $service := $controller.service -}}
{{- $nodePorts := default (dict) $service.nodePorts -}}
{{- $isNodePortCapable := or (eq $service.type "NodePort") (eq $service.type "LoadBalancer") -}}
{{- /*
  server.xds_tls / policy_server.tls, when enabled, make the controller listen
  on their own dedicated TLS port instead of the plaintext server.xds_port /
  policy_server.port (see cmd/controller/main.go and gateway-config.yaml) --
  this is an either/or relationship: enabling TLS replaces the plaintext
  listener rather than adding a second one, so the plaintext "xds"/"policy"
  Service ports below are omitted while the corresponding TLS mode is
  enabled (nothing would be listening behind them), and the "xds-tls"/
  "policy-tls" port is added in its place, pointing at the controller's
  actual TLS listener port.
*/ -}}
{{- $xdsTLS := .Values.gateway.config.controller.server.xds_tls -}}
{{- $policyTLS := .Values.gateway.config.controller.policy_server.tls -}}
{{- if $controller.deployment.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway-operator.fullname" . }}-controller
  labels:
    {{- include "gateway-operator.componentLabels" (list . "controller" $service.labels) | nindent 4 }}
  {{- with (include "gateway-operator.annotations" (list . $service.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type }}
  {{- with $service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- if and $service.externalTrafficPolicy $isNodePortCapable }}
  externalTrafficPolicy: {{ $service.externalTrafficPolicy }}
  {{- end }}
  {{- if eq $service.type "LoadBalancer" }}
  {{- with $service.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with $service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "gateway-operator.componentSelectorLabels" (list . "controller") | nindent 4 }}
  ports:
    - name: rest
      port: {{ $service.ports.rest }}
      targetPort: rest
      protocol: TCP
      {{- if and $isNodePortCapable $nodePorts.rest }}
      nodePort: {{ $nodePorts.rest }}
      {{- end }}
    {{- if not $xdsTLS.enabled }}
    - name: xds
      port: {{ $service.ports.xds }}
      targetPort: xds
      protocol: TCP
      {{- if and $isNodePortCapable $nodePorts.xds }}
      nodePort: {{ $nodePorts.xds }}
      {{- end }}
    {{- end }}
    {{- if $xdsTLS.enabled }}
    - name: xds-tls
      port: {{ $xdsTLS.port }}
      targetPort: xds-tls
      protocol: TCP
      {{- if and $isNodePortCapable $nodePorts.xds_tls }}
      nodePort: {{ $nodePorts.xds_tls }}
      {{- end }}
    {{- end }}
    {{- if not $policyTLS.enabled }}
    - name: policy
      port: {{ $service.ports.policy }}
      targetPort: policy
      protocol: TCP
      {{- if and $isNodePortCapable $nodePorts.policy }}
      nodePort: {{ $nodePorts.policy }}
      {{- end }}
    {{- end }}
    {{- if $policyTLS.enabled }}
    - name: policy-tls
      port: {{ $policyTLS.port }}
      targetPort: policy-tls
      protocol: TCP
      {{- if and $isNodePortCapable $nodePorts.policy_tls }}
      nodePort: {{ $nodePorts.policy_tls }}
      {{- end }}
    {{- end }}
    {{- if $service.expose.admin }}
    - name: admin
      port: {{ $service.ports.admin }}
      targetPort: admin
      protocol: TCP
      {{- if and $isNodePortCapable $nodePorts.admin }}
      nodePort: {{ $nodePorts.admin }}
      {{- end }}
    {{- end }}
    - name: metrics
      port: {{ $service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
      {{- if and $isNodePortCapable $nodePorts.metrics }}
      nodePort: {{ $nodePorts.metrics }}
      {{- end }}
{{- end }}
