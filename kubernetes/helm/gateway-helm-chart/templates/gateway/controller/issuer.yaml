{{- $controller := .Values.gateway.controller -}}
{{- $tls := $controller.tls -}}
{{- $restApiTls := $controller.restApiTls -}}
{{- $listenerNeedsIssuer := and $tls.enabled (eq $tls.certificateProvider "cert-manager") (eq $tls.certManager.issuerRef.kind "Issuer") $tls.certManager.createIssuer -}}
{{- $restApiNeedsIssuer := and (dig "server" "tls" "enabled" false .Values.gateway.config.controller) (eq $restApiTls.certificateProvider "cert-manager") $restApiTls.certManager.create (not $restApiTls.certManager.issuerRef.name) -}}
{{- if and $controller.deployment.enabled (or $listenerNeedsIssuer $restApiNeedsIssuer) }}
---
# This is a sample self-signed Issuer for development/testing purposes
# In production, replace this with a proper CA issuer (Let's Encrypt, corporate CA, etc.)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "gateway-operator.fullname" . }}-selfsigned-issuer
  labels:
    {{- include "gateway-operator.componentLabels" (list . "controller" dict) | nindent 4 }}
  {{- with (include "gateway-operator.annotations" (list . dict)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selfSigned: {}
{{- end }}
