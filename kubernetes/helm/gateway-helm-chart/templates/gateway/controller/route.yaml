{{- $route := .Values.openshift.routes.managementApi -}}
{{- if and .Values.openshift.enabled $route.enabled .Values.gateway.controller.deployment.enabled }}
{{- $tls := default (dict) $route.tls -}}
{{- $termination := default "edge" $tls.termination -}}
{{- if ne $termination "edge" -}}
{{- fail (printf "openshift.routes.managementApi: the management API serves plain HTTP, so tls.termination must be edge (got %q)" $termination) -}}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "gateway-operator.fullname" . }}-management-api
  labels:
    {{- include "gateway-operator.componentLabels" (list . "controller" $route.labels) | nindent 4 }}
  {{- with (include "gateway-operator.annotations" (list . $route.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.hostname }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "gateway-operator.fullname" . }}-controller
    weight: 100
  port:
    targetPort: rest
  tls:
    termination: edge
    {{- with $tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ . }}
    {{- end }}
    {{- with $tls.certificate }}
    certificate: {{ . | toJson }}
    {{- end }}
    {{- with $tls.key }}
    key: {{ . | toJson }}
    {{- end }}
    {{- with $tls.caCertificate }}
    caCertificate: {{ . | toJson }}
    {{- end }}
  wildcardPolicy: None
{{- end }}
