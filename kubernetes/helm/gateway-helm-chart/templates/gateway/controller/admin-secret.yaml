{{- /*
Generated admin credential of the controller REST API. The password is created once and kept:
on upgrade the existing Secret is read back (lookup), so neither the password nor its hash
changes and nothing restarts. The controller receives only "password-hash" (through an env var
referenced by config.toml); the gateway operator reads "password" to call the API.
Without cluster access (helm template, --dry-run=client) lookup finds nothing and a new password
is rendered every time; use gateway.config.controller.auth.basic.existingSecret there.
*/ -}}
{{- $basic := dig "auth" "basic" (dict) (default (dict) .Values.gateway.config.controller) -}}
{{- $name := include "gateway-operator.controllerAdminSecretName" . -}}
{{- if and .Values.gateway.controller.deployment.enabled $name (not $basic.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data (index $existing.data "password") (index $existing.data "password-hash") -}}
{{- $data = dict "password" (index $existing.data "password") "password-hash" (index $existing.data "password-hash") -}}
{{- else -}}
{{- $password := randAlphaNum 32 -}}
{{- $data = dict "password" ($password | b64enc) "password-hash" (bcrypt $password | b64enc) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-operator.componentLabels" (list . "controller-admin" nil) | nindent 4 }}
  {{- with (include "gateway-operator.annotations" (list . nil)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  password: {{ index $data "password" | quote }}
  password-hash: {{ index $data "password-hash" | quote }}
{{- end }}
