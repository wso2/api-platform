apiVersion: v2
name: gateway
kubeVersion: ">=1.24.0-0"
description: Helm chart for deploying the Gateway Operator components
version: 2026.11.19-r1
appVersion: "2026.09.24"
type: application
home: https://github.com/wso2/api-platform
sources:
  - https://github.com/wso2/api-platform
keywords:
  - gateway
  - envoy
  - wso2
  - api-platform
maintainers:
  - name: ap-gateway-operator-maintainers
    email: contact@wso2.com
annotations:
  # Operator-facing features this chart supports, comma-separated. The gateway operator
  # is released separately and checks this list before deploying values that need a
  # feature, so an older chart fails clearly instead of rendering a broken gateway.
  # Append to it, never remove from it, when the chart gains such a feature.
  gateway.api-platform.wso2.com/features: "basicAuthPasswordSecretRef"
