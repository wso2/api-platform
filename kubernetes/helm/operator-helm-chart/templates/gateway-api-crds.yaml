{{- if .Values.gatewayApi.installStandardCRDs }}
{{- $paths := list
  "files/gateway-api-standard/standard-crds.yaml"
}}
{{- range $p := $paths }}
{{- /* The bundle holds several documents; check each one, so objects that already
       exist and belong to someone else (another release, a cloud add-on) are skipped
       individually instead of failing the whole install. */}}
{{- range $doc := regexSplit "(?m)^---\\s*$" ($.Files.Get $p) -1 }}
{{- $obj := fromYaml $doc }}
{{- if and $obj $obj.kind $obj.metadata }}
{{- $existing := lookup $obj.apiVersion $obj.kind "" $obj.metadata.name }}
{{- $ownedByThisRelease := false }}
{{- if $existing }}
  {{- $annotations := default (dict) $existing.metadata.annotations }}
  {{- $labels := default (dict) $existing.metadata.labels }}
  {{- $relName := index $annotations "meta.helm.sh/release-name" }}
  {{- $relNs := index $annotations "meta.helm.sh/release-namespace" }}
  {{- $managedBy := index $labels "app.kubernetes.io/managed-by" }}
  {{- if and (eq $relName $.Release.Name) (eq $relNs $.Release.Namespace) (eq $managedBy "Helm") }}
    {{- $ownedByThisRelease = true }}
  {{- end }}
{{- end }}
{{- if or (not $existing) $ownedByThisRelease }}
{{- /* keep: Helm must never delete the bundle's CRDs (and with them every Gateway API resource), or
       the policy that guards them, when a later upgrade leaves them out, for example after a
       takeover or installStandardCRDs=false. Uninstall leaves them in place too. */}}
{{- $annotations := default (dict) $obj.metadata.annotations }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- $_ := set $obj.metadata "annotations" $annotations }}
---
{{ toYaml $obj }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
