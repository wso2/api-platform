apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway-operator.fullname" . }}-gateway-values
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gateway-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  gateway_values.yaml: |
{{- $gatewayValues := deepCopy (default (dict) .Values.gateway.values) }}
{{- if include "gateway-operator.isOpenShift" . }}
{{- /* Turn on the gateway chart's OpenShift support unless gateway.values sets it. */}}
{{- $gwOpenShift := default (dict) $gatewayValues.openshift }}
{{- if not (hasKey $gwOpenShift "enabled") }}
{{- $_ := set $gwOpenShift "enabled" true }}
{{- $_ := set $gatewayValues "openshift" $gwOpenShift }}
{{- end }}
{{- end }}
{{ toYaml $gatewayValues | indent 4 }}
