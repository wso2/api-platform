apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "gateway-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gateway-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      control-plane: controller-manager
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/gateway-values: {{ include (print $.Template.BasePath "/gateway-values-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "gateway-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        control-plane: controller-manager
        # Selected by the conversion webhook Service. Operator pods from releases
        # without the webhook lack it, so during a rolling upgrade the Service never
        # sends conversion requests to an old pod that does not listen on the port.
        {{ include "gateway-operator.conversionWebhookPodLabel" . }}
    spec:
      {{- if .Values.debug.enabled }}
      securityContext:
        runAsUser: 0
      {{- else }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "gateway-operator.image" . | quote }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          {{ if .Values.debug.enabled }}
          # run under delve in headless mode for remote debugging
          command:
            - ./dlv
          args:
            - exec
            - ./manager
            - "--headless"
            - "--listen=:2345"
            - "--api-version=2"
            - "--accept-multiclient"
            - "--log"
            - --
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            {{- include "gateway-operator.conversionWebhookArgs" . | nindent 12 }}
          {{ else }}
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            {{- include "gateway-operator.conversionWebhookArgs" . | nindent 12 }}
          {{ end }}
          ports:
            - name: webhook-server
              containerPort: {{ .Values.conversionWebhook.port }}
              protocol: TCP
          env:
            # The conversion webhook keeps its certificate Secret and points the
            # APIGateway CRD at its Service in this namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACES
              value: {{ join "," (default (list) .Values.watchNamespaces) | quote }}
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
            # client-go discovery cache; defaults under $HOME, which is not writable
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          {{ if .Values.debug.enabled }}
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
            allowPrivilegeEscalation: true
          {{ end }}
          {{ if not .Values.debug.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{ end }}
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
            - name: gateway-values
              mountPath: /config/gateway_values.yaml
              subPath: gateway_values.yaml
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "gateway-operator.fullname" . }}-config
        - name: gateway-values
          configMap:
            name: {{ include "gateway-operator.fullname" . }}-gateway-values
        - name: tmp-volume
          emptyDir: {}