# ============================================================================
# api-portal — component chart values
# ============================================================================
# The API Portal (Node.js app). It has its OWN database (separate from the
# Platform API's) and authenticates users against the Platform API. Released on
# its own; used as an umbrella subchart or standalone.
#
#   global.*   Cross-cutting settings. Under an umbrella these come from the
#              umbrella; the block below is the STANDALONE default, overridden
#              when nested.
#   (rest)     This component's own settings. Structured config here is rendered
#              into APIP_AP_* environment variables on the container.
#
# `enabled` is read by the umbrella's dependency condition (ignored standalone).

# ----------------------------------------------------------------------------
# global — STANDALONE defaults only (an umbrella's global.* overrides these)
# ----------------------------------------------------------------------------
global:
  nameOverride: ""
  fullnameOverride: ""
  commonLabels: {}
  commonAnnotations: {}
  imagePullSecrets: []
  serviceAccount:
    # Standalone default is `false` → pods use the namespace "default" SA (this
    # component ships no ServiceAccount template; the umbrella creates one).
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  wso2:
    subscription:
      imagePullSecret: ""
  platformApi:
    port: 9243
    tlsEnabled: true

# ----------------------------------------------------------------------------
# Component toggle + container image
# ----------------------------------------------------------------------------
# Install the API Portal. Opt in per install (the umbrella sets this).
enabled: false
image:
  repository: ghcr.io/wso2/api-platform/api-portal
  tag: "1.0.0"
  pullPolicy: IfNotPresent
# Pull secrets for THIS component only (merged with global.imagePullSecrets).
imagePullSecrets: []

# ----------------------------------------------------------------------------
# config — rendered into /app/configs/config.toml under [api_portal.*]
# (portals/api-portal/configs/config-template.toml). Non-secret values are
# literals; secrets come from the referenced Secret via APIP_AP_* env tokens.
# ----------------------------------------------------------------------------
config:
  server:
    # Public URL browsers use to reach the portal (scheme follows the TLS setting).
    # Leave "" to derive it from the service + TLS; set it when fronting with a
    # real hostname so login redirects and asset URLs are correct.
    baseUrl: ""
  logging:
    level: info                  # debug | info | warn | error
    format: text                 # text | json
    consoleOnly: true            # log to stdout only (no file)

  # --- Database (the portal's OWN store, separate from the Platform API's) ---
  database:
    # sqlite   → file on the PVC; single replica; HPA unavailable.
    # postgres → external PostgreSQL (configured below); enables multi-replica + HPA.
    # mssql    → external SQL Server (configured below); enables multi-replica + HPA.
    #
    # Aliases are accepted and normalized by the portal at startup, so you can use
    # the same spelling here as in the platform-api values block:
    #   sqlite3 → sqlite,  postgresql/pgx → postgres,  sqlserver → mssql
    driver: sqlite
    # SQLite file (driver=sqlite). Must sit under the mounted data volume.
    file: /app/data/devportal.db
    # Server connection — used by BOTH postgres and mssql. The password is NOT
    # here; it comes from the Secret key secrets.keys.databasePassword. Leave host
    # empty for sqlite.
    host: ""
    port: 5432                   # 1433 for SQL Server
    database: devportal          # database (schema) name → rendered as `name`
    user: postgres               # login role; password from the Secret
    # TLS to the database. Only these two values are supported:
    #   disable      → no TLS
    #   verify-full  → encrypt AND verify the certificate chain + hostname
    # On SQL Server, anything other than verify-full connects UNENCRYPTED with
    # certificate verification off, so there is no partial mode — use verify-full.
    sslmode: disable             # disable | verify-full
    sslRootCert: ""              # CA cert — used by verify-full
    # Connection-pool tuning (postgres / mssql only).
    maxOpenConns: 50
    minOpenConns: 2
    poolIdleTimeoutMs: 10000
    poolConnectionTimeoutMs: 30000
    poolRequestTimeoutMs: 30000

  # --- How the portal reaches the Platform API ---
  platformApi:
    # Leave "" to derive the in-cluster Platform API URL automatically. Set to
    # target an external Platform API.
    baseUrl: ""
    # Skip TLS verification on the portal → Platform API hop. Secure by default;
    # enable only for local dev against a self-signed Platform API cert
    # (values-local.yaml sets this true). In production supply a real/trusted cert.
    insecure: false

  # --- Authentication ---
  auth:
    # Filesystem path where the Platform API's RS256 public key PEM is mounted;
    # used (auth.local mode) to verify Platform API-issued tokens. The key is
    # supplied via the Secret (secrets.keys.publicKey) when secrets.hasPublicKey
    # is true, and mounted at this path.
    publicKeyPath: /etc/devportal/keys/jwt_public.pem
    # Your IdP's identifier for this organization — the VALUE expected in the
    # claim named by claimMappings.organization. Leave "" to default to
    # organization.handle (the common case). Seeded once and re-applied on every
    # restart; set it only when your IdP's org claim differs from the handle.
    idpOrgId: ""
    # JWT claim-name mappings — which token claim carries each field.
    claimMappings:
      organization: org_name     # claim carrying the org ID
      roles: roles               # claim carrying the user's roles
      groups: groups
    # OIDC login (optional). Rendered as auth.mode=idp when idp.clientId is set;
    # otherwise the portal uses local (Platform API) login. The client secret
    # comes from the Secret (secrets.keys.idpClientSecret), wired only when
    # secrets.hasIdpClientSecret=true.
    idp:
      issuer: ""
      authorizationUrl: ""
      tokenUrl: ""
      userInfoUrl: ""
      jwksUrl: ""
      clientId: ""
      callbackUrl: ""
      logoutUrl: ""
      scope: "openid profile email"
      audience: ""
      certificate: ""            # PEM to pin the IDP's signing cert (optional)
      signUpUrl: ""
      logoutRedirectUri: ""
      orgCallback: false         # redirect to the org's own landing page after login
      silentSso: true
      tokenRefreshTimeoutMs: 10000

    # --- Authorization: what a verified token may do ---
    # Outside auth.local/auth.idp on purpose — a token carries the same roles claim
    # whichever way the portal verified it, so these apply in every auth mode.
    authorization:
      # Enforce each REST operation's declared dp:* scopes. Secure by default;
      # false lets any authenticated caller through (development only).
      enabled: true
      # "role" (the default) expands the token's roles claim through
      # roleToScopeMapping. "scope" reads the token's own scope claim instead — use
      # it when the issuer mints dp:* scopes directly (an Asgardeo tenant registered
      # via production/scripts/register_asgardeo_scopes.sh, or the Platform API in
      # local auth mode).
      mode: role
      # Path to the role-to-scope grant table inside the container. REQUIRED in role
      # mode — the chart refuses to render without it, since the portal would refuse
      # to start. Defaults to the table baked into the image (WORKDIR /app). To change
      # what a role grants, mount your own copy from a ConfigMap and point this at it.
      roleToScopeMapping: ./resources/role-to-scope-mapping.yaml
      # Gate portal pages on the caller's role tier (portalRoles below). Distinct
      # from `enabled`, which governs the REST API — one switch for both would mean
      # turning page gating off also silently turned REST enforcement off.
      # This replaced config.security.roleValidation.
      pageRoleValidation: false
      # Which role name in the token's roles claim grants each page tier. Was
      # auth.idp.roles, despite being read in local auth mode too. There were three
      # tiers; the superAdmin one gated pages this portal does not serve and is gone.
      # These name roles from roleToScopeMapping rather than an IDP's own role names,
      # so page gating and REST authorization are driven by the same roles — and
      # ap_admin is the one role the sibling platform-api chart grants its file-mode
      # admin, so local-auth logins match. Point them at your IDP's role names when
      # running in idp mode with roles that differ.
      portalRoles:
        admin: ap_admin
        subscriber: ap_subscriber

  organization:
    handle: default                         # URL slug: /{handle}/views/{viewName}; required
    displayName: ""                         # seed-time only; empty means "use the handle"
    autoCreateSubscriptionPlans: true       # auto-create Bronze/Silver/Gold/Unlimited/AsyncUnlimited

  # --- Artifacts: which types this portal serves (allowlist) ---
  # A type left out gets no nav entry, no landing-page section, and 404s on its
  # routes. An unrecognised entry aborts startup, so a typo can't silently drop
  # a type. Valid entries: apis | mcp-servers | api-workflows.
  artifacts:
    enabledTypes:
      - apis
      - mcp-servers
      - api-workflows

  # --- Webhook delivery tuning (global) ---
  webhooksDelivery:
    pollIntervalMs: 2000
    batchSize: 50
    signatureToleranceSec: 300

  # --- Upload and archive-extraction limits ---
  uploads:
    maxBytes: 10485760          # 10 MiB — single upload / single archive entry
    maxTotalBytes: 52428800     # 50 MiB — total extracted per archive
    maxZipEntries: 500
    maxDepth: 10

  # --- "Try It" console (calls user-supplied endpoints; SSRF-sensitive) ---
  tryout:
    enabled: true
    # false → only https:// endpoints may be called.
    allowHttpEndpoints: true
    # Deny-by-default: allow the portal to call private/internal addresses only
    # when the gateway legitimately sits on a private address, after confirming
    # only intended services are reachable. Link-local/cloud-metadata addresses
    # are refused regardless.
    allowPrivateEndpoints: false
    tlsSkipVerify: false         # development only
    timeoutMs: 15000
    maxRequestBytes: 1048576     # 1 MiB
    maxResponseBytes: 5242880    # 5 MiB

# Escape hatch: raw config.toml appended verbatim (env vars still override it).
configToml: ""

# ----------------------------------------------------------------------------
# secrets — reference to a pre-created Kubernetes Secret (REQUIRED)
# ----------------------------------------------------------------------------
# The chart never creates or embeds secret values. Point existingSecret at a
# Secret made by ./generate-secrets.sh. Render FAILS if it's unset. Required keys:
# ENCRYPTION_KEY and SESSION_SECRET (both 64-char hex; the portal fails closed at
# startup without them). Optional keys — DB password (postgres), OIDC client
# secret, and the Platform API RS256 public key PEM (to verify Platform
# API-issued tokens; tokens are asymmetric, so there is no shared HMAC secret) —
# are wired only when the matching has* flag below is true.
# `keys` maps each logical name to the key inside that Secret.
secrets:
  existingSecret: ""
  # Each key inside the Secret is named EXACTLY like the env var the container
  # receives and the {{ env "..." }} token in config.toml that reads it — one name
  # for the whole chain (Secret key = env var = config token = generate-secrets.sh
  # input), so there is nothing to map in your head. publicKey is the exception: it
  # mounts as a FILE, so it keeps a filename — the config references its path.
  keys:
    encryptionKey: APIP_AP_SECURITY_ENCRYPTION_KEY
    sessionSecret: APIP_AP_SECURITY_SESSION_SECRET
    databasePassword: APIP_AP_DATABASE_PASSWORD        # postgres only
    idpClientSecret: APIP_AP_AUTH_IDP_CLIENT_SECRET    # idp mode only
    publicKey: jwt_public.pem                          # mounted file → config.auth.publicKeyPath
  # Flip to true ONLY if the referenced Secret actually carries that optional key,
  # so the deployment wires it. generate-secrets.sh sets these for you in the
  # values-secrets.yaml it writes.
  hasPublicKey: true
  hasIdpClientSecret: false

# ----------------------------------------------------------------------------
# service — how the portal is exposed
# ----------------------------------------------------------------------------
service:
  type: LoadBalancer            # LoadBalancer | NodePort | ClusterIP
  annotations: {}
  labels: {}
  port: 9543
  clusterIP: ""
  externalTrafficPolicy: ""
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  ipFamilyPolicy: ""
  ipFamilies: []
  nodePort: ""

# Port the portal process listens on (matches the image's native default/EXPOSE).
containerPort: 9543

# ----------------------------------------------------------------------------
# tls — certificate for the portal's HTTPS listener (APIP_AP_TLS_*)
# ----------------------------------------------------------------------------
tls:
  # How the portal's HTTPS listener gets its certificate. The image does NOT
  # self-generate one, so supply a working certificate (or disable TLS):
  #   secret       → mount an existing Secret's tls.crt / tls.key.
  #   cert-manager → provision a Certificate via cert-manager and mount it.
  #   none         → serve plain HTTP (no TLS) — only behind a TLS-terminating proxy.
  # NOTE: "selfSigned" is NOT supported — the image has no in-container cert
  # generation, so the chart rejects it at render time (fail-fast, like platform-api).
  certificateProvider: cert-manager
  # Where certs are mounted / read from (matches APIP_AP_TLS_CERTFILE etc.).
  mountPath: /app/certs
  certManager:
    create: true
    createIssuer: true
    issuerRef:
      name: selfsigned-issuer
      kind: Issuer
    commonName: devportal.localhost
    dnsNames:
      - devportal.localhost
      - "*.localhost"
    duration: 2160h
    renewBefore: 720h
  secret:
    name: devportal-tls          # used when certificateProvider=secret
    certKey: tls.crt
    keyKey: tls.key

# ----------------------------------------------------------------------------
# persistence — the PVC backing SQLite
# ----------------------------------------------------------------------------
persistence:
  enabled: true                 # required for database.driver=sqlite
  existingClaim: ""             # reuse a PVC you created yourself instead
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""              # "" = cluster default StorageClass
  labels: {}
  # Annotations for the PVC ONLY (rendered only when persistence.enabled). The
  # resource-policy=keep annotation makes the PVC — and its data — SURVIVE
  # `helm uninstall`; a later `helm install` with the SAME release name re-adopts
  # it. To intentionally wipe it:
  #   kubectl delete pvc <release>-api-portal-data
  # Set to {} if you'd rather the PVC be deleted on uninstall.
  annotations:
    helm.sh/resource-policy: keep

# ----------------------------------------------------------------------------
# deployment — the pod/Deployment spec
# ----------------------------------------------------------------------------
deployment:
  enabled: true
  replicaCount: 1               # >1 requires an external DB (postgres/mssql)
  volumeMountPath: /app/data
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  livenessProbe:
    httpGet: { path: /, port: http, scheme: HTTPS }
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet: { path: /, port: http, scheme: HTTPS }
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  # Set CPU requests if you enable the HPA, so it can compute utilization.
  resources: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  strategy: {}
  hostAliases: []
  dnsPolicy: ""
  dnsConfig: {}

# ----------------------------------------------------------------------------
# Autoscaling & disruption budget
# ----------------------------------------------------------------------------
# HorizontalPodAutoscaler. REQUIRES an external database — config.database.driver
# of postgres or mssql. On sqlite the chart refuses to render it (SQLite is a
# per-pod file, so it is single-replica). Enable only after switching to an
# external database, and set deployment.resources.requests.cpu.
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80    # 0 or "" to disable CPU-based scaling
  targetMemoryUtilizationPercentage: "" # set a number to also scale on memory
  customMetrics: []                     # extra autoscaling/v2 MetricSpec entries
  behavior: {}                          # autoscaling/v2 scaleUp/scaleDown tuning

# PodDisruptionBudget. Only meaningful at replicaCount >= 2 (with one replica
# minAvailable: 1 blocks node drains). Set exactly ONE of the two below.
podDisruptionBudget:
  enabled: false
  minAvailable: 1               # integer or percentage string, e.g. "50%"
  maxUnavailable: ""            # integer or percentage string, e.g. "25%"

# Extra metadata for the generated ConfigMap.
configMap:
  annotations: {}
  labels: {}
