# Local development values for the api-portal-ui chart.
# Usage (standalone, from kubernetes/helm/):
#   helm install api-portal-ui ./api-portal-ui-helm-chart \
#     -f api-portal-ui-helm-chart/values.yaml -f api-portal-ui-helm-chart/values-local.yaml
#
# Overrides the defaults for local development:
# - locally-built image (latest tag, IfNotPresent pull policy)
# - debug logging; skip TLS verification to the Platform API's self-signed cert
image:
  tag: "latest"
  pullPolicy: IfNotPresent

config:
  logging:
    level: debug
  platformApi:
    insecure: true
  auth:
    authorization:
      # Relax page role-tier gating for local dev. REST scope enforcement
      # (authorization.enabled) stays on — it is a separate switch.
      pageRoleValidation: false
