# Local development values for the developer-portal umbrella chart.
# Usage:
#   helm install developer-portal ./developer-portal-helm-chart -f values-secrets.yaml -f values-local.yaml
#
# Overrides the defaults for local development, per component:
# - locally-built images (latest tag, IfNotPresent pull policy)
# - debug logging
# - the portal skips TLS verification to the Platform API and relaxes role checks
#
# NOTE: the components have no self-signed TLS fallback. For a local install,
# provide a TLS Secret (tls.certificateProvider=secret) or install cert-manager.
platform-api:
  image:
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    logging:
      level: debug

developer-portal-ui:
  image:
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    logging:
      level: debug
    platformApi:
      insecure: true
    auth:
      authorization:
        # Relax page role-tier gating for local dev. REST scope enforcement
        # (authorization.enabled) stays on — it is a separate switch.
        pageRoleValidation: false
