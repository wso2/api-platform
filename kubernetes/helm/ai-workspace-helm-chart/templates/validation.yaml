{{/*
Render-time guardrails for the umbrella. Renders no Kubernetes objects; only
fails the install early with an actionable message on misconfiguration.
*/}}
{{- $pa := index .Values "platform-api" -}}
{{- $aiw := index .Values "ai-workspace-ui" -}}
{{- if not $aiw.enabled }}
{{- fail "ai-workspace-ui.enabled=false leaves this umbrella with no UI to install (the shared platform-api alone serves none). Set ai-workspace-ui.enabled=true." }}
{{- end }}
{{- if and (not $pa.enabled) (not (dig "config" "controlPlane" "url" "" (default (dict) $aiw))) }}
{{- fail "ai-workspace-ui.enabled=true but platform-api.enabled=false and no external Platform API URL is set. Set platform-api.enabled=true, or set ai-workspace-ui.config.controlPlane.url to an external control plane." }}
{{- end }}
{{/*
The UI mirrors the Platform API's own authorization mode key-for-key (it only
decides what the UI believes it may do; the Platform API is what actually
enforces it) — a mismatch means the UI reports the wrong effective permissions.
Only checkable when the local platform-api is enabled; an external Platform API's
mode is outside this chart's visibility, so ai-workspace-ui.config.auth.authorization.mode
must be set to match it manually in that case (documented in ai-workspace-ui's values.yaml).
*/}}
{{- if and $pa.enabled $aiw.enabled }}
{{- $paAuthzMode := dig "config" "auth" "authorization" "mode" "scope" (default (dict) $pa) }}
{{- $uiAuthzMode := dig "config" "auth" "authorization" "mode" "scope" (default (dict) $aiw) }}
{{- if ne $paAuthzMode $uiAuthzMode }}
{{- fail (printf "platform-api.config.auth.authorization.mode is %q but ai-workspace-ui.config.auth.authorization.mode is %q — both must match. Set ai-workspace-ui.config.auth.authorization.mode to %q." $paAuthzMode $uiAuthzMode $paAuthzMode) }}
{{- end }}
{{- end }}
