# ============================================================================
# ai-workspace — component chart values
# ============================================================================
# The AI Workspace UI: a React single-page app served by a small Go BFF (backend
# for frontend). It is stateless (no database) and talks only to the Platform API.
# Released on its own; used as an umbrella subchart or standalone.
#
# The app is served under the /ai-workspace path prefix (baked into the SPA bundle at
# image build time, so it is not a chart value): the UI is at
# https://<host>:<port>/ai-workspace/, its API hop at /ai-workspace/proxy/... . Route a
# single `path: /ai-workspace, pathType: Prefix` ingress rule here — no rewriting — and
# several portals can share one host without their routes colliding. The probes below
# use /healthz, which the BFF serves at the origin root precisely so they work without
# going through that ingress.
#
#   global.*   Cross-cutting settings. Under an umbrella these come from the
#              umbrella; the block below is the STANDALONE default, overridden
#              when nested.
#   (rest)     This component's own settings.
#
# `enabled` is read by the umbrella's dependency condition (ignored standalone).

# ----------------------------------------------------------------------------
# global — STANDALONE defaults only (an umbrella's global.* overrides these)
# ----------------------------------------------------------------------------
global:
  nameOverride: ""
  fullnameOverride: ""
  commonLabels: {}
  commonAnnotations: {}
  imagePullSecrets: []
  serviceAccount:
    # Standalone default is `false` → pods use the namespace "default" SA (this
    # component ships no ServiceAccount template; the umbrella creates one).
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  wso2:
    subscription:
      imagePullSecret: ""
  platformApi:
    port: 9243
    tlsEnabled: true

# ----------------------------------------------------------------------------
# Component toggle + container image
# ----------------------------------------------------------------------------
# Install the AI Workspace UI. Opt in per install (the umbrella sets this).
enabled: false
image:
  repository: ghcr.io/wso2/api-platform/ai-workspace
  tag: "1.0.0"
  pullPolicy: IfNotPresent
# Pull secrets for THIS component only (merged with global.imagePullSecrets).
imagePullSecrets: []

# ----------------------------------------------------------------------------
# config — rendered into /etc/ai-workspace/config.toml under [ai_workspace.*]
# (portals/ai-workspace/configs/config-template.toml). Non-secret values are
# literals; the OIDC client secret comes from the referenced Secret via an
# APIP_AIW_* env token.
# ----------------------------------------------------------------------------
config:
  # Region assigned to a new organization the first time someone logs in.
  defaultOrgRegion: us

  server:
    # Externally-reachable host[:port] for this deployment, used ONLY in the BFF's
    # startup log banner ("Visit https://..."). Not sent to the browser — the SPA
    # knows its own address from window.location. Set it when a proxy/ingress
    # fronts the BFF on a different host:port than the listener binds to, so the
    # banner shows an address an operator can actually reach. Leave "" to fall
    # back to localhost:<containerPort>.
    domain: ""
    # Optional plain-HTTP listener — enable only behind a TLS-terminating
    # proxy/ingress. The HTTPS listener always runs on containerPort.
    http:
      enabled: false
      port: 9080

  logging:
    level: info                 # debug | info | warn | error
    format: text                # text | json
    browserDebug: false         # verbose console logging in the SPA

  # How the BFF reaches the Platform API (server-to-server hop). The scheme in
  # `url` decides whether the hop uses TLS.
  controlPlane:
    # Leave "" to auto-derive the in-cluster Service URL from global.platformApi.
    # Set only to point at an external Platform API.
    url: ""
    # Skip TLS verification on the BFF → Platform API hop (needed while the
    # Platform API uses a self-signed cert). Prefer caFile in production.
    tlsSkipVerify: false
    # CA file to verify the Platform API's certificate instead of skipping
    # verification (mount it via deployment.extraVolumes/extraVolumeMounts).
    caFile: ""

  gateway:
    # Public host:port that DEPLOYED GATEWAYS dial to reach the Platform API.
    # Shown verbatim in the in-UI "add a gateway" instructions (must be
    # externally reachable, not a proxy path).
    controlplaneHost: ""
    # Gateway build options offered in the create-gateway dropdown (JSON string).
    # Each entry: version (helm chart minor), latestVersion (image/chart tag, used
    # in the helm --version flag and the download URL's release-tag path), channel
    # ("LTS" | "STS"); the first entry is the default. distVersion overrides the
    # version segment of the distribution zip name when the published asset differs
    # from the release tag, and distFolderVersion the directory it unpacks into —
    # both default sensibly from latestVersion, so set them only when a tag ships an
    # asset named differently (e.g. v1.2.0-rc → wso2apip-ai-gateway-1.2.0-rc.zip).
    # Kept in lockstep with portals/ai-workspace/configs/config-template.toml.
    platformGatewayVersions: '[{"version":"1.2","latestVersion":"v1.2.0-rc","distVersion":"1.2.0-rc","distFolderVersion":"1.2.0","channel":"LTS"}]'

  session:
    # Server-side session store. Only "memory" is supported today.
    store: memory
    idleTimeout: 30m            # sliding inactivity window
    absoluteTtl: 8h             # hard session lifetime regardless of activity

  auth:
    # How users sign in:
    #   basic → the Platform API's file-based login
    #   oidc  → an external OIDC provider (fill in auth.oidc below + the secret)
    mode: basic
    # Token claim-name mappings — must agree with the Platform API's own
    # claim_mappings (basic mode signs tokens using these names).
    claimMappings:
      organization: organization
      orgName: org_name
      orgHandle: org_handle
      username: username
      email: email
      scope: scope
      roles: roles
    # How the BFF derives the effective scopes it reports to the SPA. Mirrors
    # the Platform API's own auth.authorization config.auth.mode key-for-key —
    # both MUST be set to the same mode, since the Platform API enforces
    # authorization and this only decides what the UI believes it may do.
    authorization:
      mode: scope               # scope | role
      # Path to role-to-scope-mapping.yaml. REQUIRED when mode=role — mount the
      # same file the Platform API reads, so the UI and API cannot disagree.
      roleToScopeMapping: ""
    # OIDC settings — used only when mode=oidc. The client secret is NOT here;
    # it comes from the Secret (secrets.keys.oidcClientSecret).
    # Both URLs must include the /ai-workspace prefix — that is where the BFF serves
    # the callback route and the SPA's login page — and must match what is registered
    # on the IDP application, e.g.
    #   redirectUrl: https://<host>/ai-workspace/api/auth/callback
    #   postLogoutRedirectUrl: https://<host>/ai-workspace/login
    oidc:
      authority: ""             # issuer / discovery base URL
      clientId: ""
      redirectUrl: ""           # login callback URL
      postLogoutRedirectUrl: ""
      scope: ""                 # e.g. "openid profile email"

# Escape hatch: raw TOML appended verbatim to the generated config.toml.
configToml: ""

# ----------------------------------------------------------------------------
# secrets — OIDC client secret (REQUIRED only in OIDC mode)
# ----------------------------------------------------------------------------
# The BFF is a confidential OIDC client, so it needs a client secret when
# authMode=oidc. In basic mode this is unused. Point existingSecret at a Secret
# created by ./generate-secrets.sh; the chart never embeds the value.
secrets:
  existingSecret: ""
  # The key inside the Secret is named EXACTLY like the env var the container
  # receives and the {{ env "..." }} token in config.toml that reads it — one name
  # for the whole chain (Secret key = env var = config token = generate-secrets.sh
  # input), so there is nothing to map in your head.
  keys:
    oidcClientSecret: APIP_AIW_AUTH_OIDC_CLIENT_SECRET

# ----------------------------------------------------------------------------
# service — how the UI is exposed
# ----------------------------------------------------------------------------
service:
  type: LoadBalancer            # LoadBalancer | NodePort | ClusterIP
  annotations: {}
  labels: {}
  port: 9643
  clusterIP: ""
  externalTrafficPolicy: ""
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  ipFamilyPolicy: ""
  ipFamilies: []
  nodePort: ""

# Port the BFF process listens on (the BFF's native default).
containerPort: 9643

# ----------------------------------------------------------------------------
# tls — certificate for the BFF's HTTPS listener
# ----------------------------------------------------------------------------
tls:
  # How the BFF's HTTPS listener gets its certificate. The BFF does NOT
  # self-generate one, so a working certificate must be supplied:
  #   secret       → mount an existing Secret's tls.crt / tls.key.
  #   cert-manager → provision a Certificate via cert-manager and mount it.
  # NOTE: "selfSigned" is NOT supported — the image has no in-container cert
  # generation, so the chart rejects it at render time (fail-fast, similar to platform-api).
  certificateProvider: cert-manager
  certManager:
    create: true
    createIssuer: true
    issuerRef:
      name: selfsigned-issuer
      kind: Issuer
      # group: cert-manager.io
    commonName: ai-workspace.localhost
    dnsNames:
      - ai-workspace.localhost
      - "*.localhost"
    duration: 2160h
    renewBefore: 720h
  secret:
    name: ai-workspace-tls      # used when certificateProvider=secret
    certKey: tls.crt
    keyKey: tls.key

# ----------------------------------------------------------------------------
# deployment — the pod/Deployment spec
# ----------------------------------------------------------------------------
deployment:
  enabled: true
  replicaCount: 1
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTPS
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTPS
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  # Optional startup probe for slow first starts (uncomment to enable):
  # startupProbe:
  #   httpGet:
  #     path: /healthz
  #     port: http
  #     scheme: HTTPS
  #   periodSeconds: 5
  #   failureThreshold: 30
  # Set CPU requests if you enable the HPA, so it can compute utilization.
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  strategy: {}
  # terminationGracePeriodSeconds: 30
  hostAliases: []
  dnsPolicy: ""
  dnsConfig: {}
  # automountServiceAccountToken: false

# ----------------------------------------------------------------------------
# Autoscaling & disruption budget
# ----------------------------------------------------------------------------
# HorizontalPodAutoscaler. The UI is stateless (no database), so — unlike the
# Platform API / API Portal — there is NO postgres requirement; it can scale
# freely. Off by default.
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80    # 0 or "" to disable CPU-based scaling
  targetMemoryUtilizationPercentage: "" # set a number to also scale on memory
  customMetrics: []                     # extra autoscaling/v2 MetricSpec entries
  behavior: {}                          # autoscaling/v2 scaleUp/scaleDown tuning

# PodDisruptionBudget. Only meaningful at replicaCount >= 2 (with one replica
# minAvailable: 1 blocks node drains). Set exactly ONE of the two below.
podDisruptionBudget:
  enabled: false
  minAvailable: 1                # integer or percentage string, e.g. "50%"
  maxUnavailable: ""             # integer or percentage string, e.g. "25%"

# Extra metadata for the generated ConfigMap.
configMap:
  annotations: {}
  labels: {}
