{{- $route := .Values.openshift.routes.aiWorkspace -}}
{{- if and .Values.openshift.enabled $route.enabled .Values.deployment.enabled }}
{{- $tls := merge (dict) (default (dict) $route.tls) (default (dict) .Values.openshift.routes.tls) -}}
{{- $termination := default "passthrough" $tls.termination -}}
{{- if not (has $termination (list "passthrough" "reencrypt")) -}}
{{- fail (printf "openshift.routes.aiWorkspace: tls.termination must be passthrough or reencrypt (got %q); the AI Workspace Service serves HTTPS only, so edge termination cannot reach it" $termination) -}}
{{- end }}
{{- /* A reencrypt Route must trust the backend certificate. Without destinationCACertificate the router
       trusts only the OpenShift service CA, which can sign only a certificate supplied as a Secret. */}}
{{- $provider := toString (default "" (dig "certificateProvider" "" (default (dict) .Values.tls))) -}}
{{- if and (eq $termination "reencrypt") (not $tls.destinationCACertificate) (ne $provider "secret") -}}
{{- fail (printf "openshift.routes.aiWorkspace: reencrypt termination needs tls.destinationCACertificate, because the AI Workspace certificate (tls.certificateProvider=%s) is not signed by the OpenShift service CA. Set openshift.routes.tls.destinationCACertificate to the CA that issued it (with cert-manager, the ca.crt key of the %s-tls Secret), or use passthrough termination" $provider (include "apip.aiWorkspace.fullname" .)) -}}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "apip.aiWorkspace.fullname" . }}
  labels:
    {{- include "apip.componentLabels" (list . "ai-workspace" $route.labels) | nindent 4 }}
  {{- with (include "apip.annotations" (list . $route.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.hostname }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "apip.aiWorkspace.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ $termination }}
    {{- with $tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ . }}
    {{- end }}
    {{- if eq $termination "reencrypt" }}
    {{- with $tls.certificate }}
    certificate: {{ . | toJson }}
    {{- end }}
    {{- with $tls.key }}
    key: {{ . | toJson }}
    {{- end }}
    {{- with $tls.caCertificate }}
    caCertificate: {{ . | toJson }}
    {{- end }}
    {{- with $tls.destinationCACertificate }}
    destinationCACertificate: {{ . | toJson }}
    {{- end }}
    {{- end }}
  wildcardPolicy: None
{{- end }}
