apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: echo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: sample-backend
          image: ghcr.io/wso2/api-platform/sample-service:latest
          args: ["-addr", ":9080", "-pretty"]
          ports:
            - name: http
              containerPort: 9080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: echo-backend
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 9080
      targetPort: 9080
