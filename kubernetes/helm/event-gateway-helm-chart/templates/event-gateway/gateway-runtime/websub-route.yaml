{{- $route := .Values.openshift.routes.websub -}}
{{- if and .Values.openshift.enabled $route.enabled .Values.eventGateway.gatewayRuntime.deployment.enabled }}
{{- $tls := merge (dict) (default (dict) $route.tls) (default (dict) .Values.openshift.routes.tls) -}}
{{- $termination := default "passthrough" $tls.termination -}}
{{- $targetPort := default "websub-https" $route.targetPort -}}
{{- if not (has $targetPort (list "websub-http" "websub-https")) -}}
{{- fail (printf "openshift.routes.websub.targetPort must be websub-http or websub-https (got %q)" $targetPort) -}}
{{- end -}}
{{- if not (has $termination (list "passthrough" "edge" "reencrypt")) -}}
{{- fail (printf "openshift.routes.websub: tls.termination must be passthrough, edge or reencrypt (got %q)" $termination) -}}
{{- end -}}
{{- if and (eq $targetPort "websub-https") (eq $termination "edge") -}}
{{- fail "openshift.routes.websub: edge termination forwards plain HTTP, but target port \"websub-https\" serves TLS. Use passthrough or reencrypt, or set targetPort to websub-http." -}}
{{- end -}}
{{- if and (eq $targetPort "websub-http") (ne $termination "edge") -}}
{{- fail (printf "openshift.routes.websub: %s termination needs a TLS backend, but target port \"websub-http\" serves plain HTTP. Use edge termination." $termination) -}}
{{- end }}
{{- /* The runtime opens no WebSub listener without websubEnabled, and no TLS listener without websubTlsEnabled. */}}
{{- $rtServer := default (dict) (dig "config" "runtime" "server" (dict) (default (dict) .Values.eventGateway)) -}}
{{- if eq (toString (dig "websubEnabled" true $rtServer)) "false" -}}
{{- fail "openshift.routes.websub: eventGateway.config.runtime.server.websubEnabled is false, so the runtime opens no WebSub listener and the Route would return 503. Enable websubEnabled, or set openshift.routes.websub.enabled to false." -}}
{{- end -}}
{{- if and (eq $targetPort "websub-https") (eq (toString (dig "websubTlsEnabled" true $rtServer)) "false") -}}
{{- fail "openshift.routes.websub: target port \"websub-https\" has no listener, because eventGateway.config.runtime.server.websubTlsEnabled is false. Enable websubTlsEnabled, or set targetPort to websub-http with edge termination." -}}
{{- end }}
{{- /* A reencrypt Route must trust the backend certificate. Without destinationCACertificate the router
       trusts only the OpenShift service CA, which can sign only a certificate supplied as a Secret. */}}
{{- $provider := toString (default "" (dig "tls" "certificateProvider" "" (default (dict) .Values.eventGateway.gatewayRuntime))) -}}
{{- if and (eq $termination "reencrypt") (not $tls.destinationCACertificate) (ne $provider "secret") -}}
{{- fail (printf "openshift.routes.websub: reencrypt termination needs tls.destinationCACertificate, because the gateway runtime certificate (eventGateway.gatewayRuntime.tls.certificateProvider=%s) is not signed by the OpenShift service CA. Set openshift.routes.tls.destinationCACertificate to the CA that issued it (with cert-manager, the ca.crt key of the %s-runtime-tls Secret), or use passthrough termination" $provider (include "event-gateway.fullname" .)) -}}
{{- end }}
{{- $annotations := merge (dict) (default (dict) $route.annotations) (default (dict) .Values.commonAnnotations) }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "event-gateway.fullname" . }}-websub
  labels:
    {{- include "event-gateway.componentLabels" (list . "gateway-runtime" $route.labels) | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.hostname }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "event-gateway.fullname" . }}-gateway-runtime
    weight: 100
  port:
    targetPort: {{ $targetPort }}
  tls:
    termination: {{ $termination }}
    {{- with $tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ . }}
    {{- end }}
    {{- if ne $termination "passthrough" }}
    {{- with $tls.certificate }}
    certificate: {{ . | toJson }}
    {{- end }}
    {{- with $tls.key }}
    key: {{ . | toJson }}
    {{- end }}
    {{- with $tls.caCertificate }}
    caCertificate: {{ . | toJson }}
    {{- end }}
    {{- end }}
    {{- if eq $termination "reencrypt" }}
    {{- with $tls.destinationCACertificate }}
    destinationCACertificate: {{ . | toJson }}
    {{- end }}
    {{- end }}
  wildcardPolicy: None
{{- end }}
