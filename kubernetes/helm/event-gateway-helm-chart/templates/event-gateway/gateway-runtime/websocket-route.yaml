{{- $route := .Values.openshift.routes.websocket -}}
{{- if and .Values.openshift.enabled $route.enabled .Values.eventGateway.gatewayRuntime.deployment.enabled }}
{{- $tls := merge (dict) (default (dict) $route.tls) (default (dict) .Values.openshift.routes.tls) -}}
{{- $termination := default "passthrough" $tls.termination -}}
{{- $targetPort := default "websocket-https" $route.targetPort -}}
{{- if not (has $targetPort (list "websocket" "websocket-https")) -}}
{{- fail (printf "openshift.routes.websocket.targetPort must be websocket or websocket-https (got %q)" $targetPort) -}}
{{- end -}}
{{- if not (has $termination (list "passthrough" "edge" "reencrypt")) -}}
{{- fail (printf "openshift.routes.websocket: tls.termination must be passthrough, edge or reencrypt (got %q)" $termination) -}}
{{- end -}}
{{- if and (eq $targetPort "websocket-https") (eq $termination "edge") -}}
{{- fail "openshift.routes.websocket: edge termination forwards plain HTTP, but target port \"websocket-https\" serves TLS. Use passthrough or reencrypt, or set targetPort to websocket." -}}
{{- end -}}
{{- if and (eq $targetPort "websocket") (ne $termination "edge") -}}
{{- fail (printf "openshift.routes.websocket: %s termination needs a TLS backend, but target port \"websocket\" serves plain HTTP. Use edge termination." $termination) -}}
{{- end }}
{{- $annotations := merge (deepCopy (default (dict) .Values.commonAnnotations)) (default (dict) $route.annotations) }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "event-gateway.fullname" . }}-websocket
  labels:
    {{- include "event-gateway.componentLabels" (list . "gateway-runtime" $route.labels) | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.hostname }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "event-gateway.fullname" . }}-gateway-runtime
    weight: 100
  port:
    targetPort: {{ $targetPort }}
  tls:
    termination: {{ $termination }}
    {{- with $tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ . }}
    {{- end }}
    {{- if ne $termination "passthrough" }}
    {{- with $tls.certificate }}
    certificate: {{ . | toJson }}
    {{- end }}
    {{- with $tls.key }}
    key: {{ . | toJson }}
    {{- end }}
    {{- with $tls.caCertificate }}
    caCertificate: {{ . | toJson }}
    {{- end }}
    {{- end }}
    {{- if eq $termination "reencrypt" }}
    {{- with $tls.destinationCACertificate }}
    destinationCACertificate: {{ . | toJson }}
    {{- end }}
    {{- end }}
  wildcardPolicy: None
{{- end }}
