{{- $route := .Values.openshift.routes.managementApi -}}
{{- if and .Values.openshift.enabled $route.enabled .Values.eventGateway.controller.deployment.enabled }}
{{- $tls := merge (dict) (default (dict) $route.tls) (default (dict) .Values.openshift.routes.tls) -}}
{{- if ne (default "edge" $tls.termination) "edge" -}}
{{- fail (printf "openshift.routes.managementApi: the management API serves plain HTTP, so tls.termination must be edge (got %q)" $tls.termination) -}}
{{- end }}
{{- /* The Route publishes the management API outside the cluster, so refuse it while the API would
       accept the chart's default password, or every request (no basic auth users and no IDP). */}}
{{- $auth := default (dict) .Values.eventGateway.config.controller.auth -}}
{{- $basic := default (dict) $auth.basic -}}
{{- $basicUsers := list -}}
{{- if $basic.enabled -}}
{{- $basicUsers = default (list) $basic.users -}}
{{- end -}}
{{- if not (or $basicUsers (dig "idp" "enabled" false $auth)) -}}
{{- fail "openshift.routes.managementApi: the management API would accept every request, because basic auth has no users and IDP auth is off. Configure eventGateway.config.controller.auth before enabling this Route." -}}
{{- end -}}
{{- range $user := $basicUsers -}}
{{- if and (not $user.password_hashed) (eq (toString $user.password) "admin") -}}
{{- fail (printf "openshift.routes.managementApi: basic auth user %q still has the chart's default password. Set a new one before enabling this Route, preferably a bcrypt hash with password_hashed: true, or a password read from a Secret through a file or env token." (toString $user.username)) -}}
{{- end -}}
{{- end }}
{{- $annotations := merge (dict) (default (dict) $route.annotations) (default (dict) .Values.commonAnnotations) }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "event-gateway.fullname" . }}-management-api
  labels:
    {{- include "event-gateway.componentLabels" (list . "controller" $route.labels) | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.hostname }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "event-gateway.fullname" . }}-controller
    weight: 100
  port:
    targetPort: rest
  tls:
    termination: edge
    {{- with $tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ . }}
    {{- end }}
    {{- with $tls.certificate }}
    certificate: {{ . | toJson }}
    {{- end }}
    {{- with $tls.key }}
    key: {{ . | toJson }}
    {{- end }}
    {{- with $tls.caCertificate }}
    caCertificate: {{ . | toJson }}
    {{- end }}
  wildcardPolicy: None
{{- end }}
