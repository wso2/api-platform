name: API Portal Integration Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'portals/api-portal/**'
      - '.github/workflows/devportal-integration-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rest-api-test:
    name: REST API tests (${{ matrix.db }}, ${{ matrix.mode }} mode)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        # auth.authorization.mode — the whole suite runs in each. "role" is the
        # shipped default; "scope" is what an issuer minting dp:* scopes directly
        # uses. A matrix dimension rather than the both-modes `make test-rest-api`
        # target so the four combinations run in parallel and CI wall-clock stays
        # where it was. See portals/api-portal/it/README.md "Authorization modes".
        mode: [scope, role]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build platform-api image
        run: make -C platform-api build IMAGE_NAME=platform-api VERSION=it-api-portal

      # Instrumented, so the suite below produces V8 coverage. The flag affects
      # this test image only — the published image is built by another workflow,
      # without it.
      - name: Build API Portal image
        run: make -C portals/api-portal build ENABLE_COVERAGE=true

      - name: Run REST API integration tests (${{ matrix.db }}, ${{ matrix.mode }} mode)
        env:
          PLATFORM_API_IMAGE: platform-api:it-api-portal
          # Adds the compose overlay that points NODE_V8_COVERAGE at a mounted
          # directory. Without it this is the run it has always been.
          IT_COVERAGE: '1'
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then
            make -C portals/api-portal/it test-rest-api-postgres-${{ matrix.mode }}
          else
            make -C portals/api-portal/it test-rest-api-${{ matrix.mode }}
          fi

      # The suite writes raw V8 profiles carrying container paths; this rewrites
      # them to the checkout and renders lcov. It exits 0 when there is nothing
      # to convert, so it cannot fail a build over a run that produced none.
      - name: Render REST API coverage
        if: always()
        run: make -C portals/api-portal/it rest-api-lcov

      # One flag for the whole REST suite. Every matrix leg uploads under it and
      # Codecov unions them, so the sqlite/postgres and role/scope legs add up
      # rather than overwrite one another.
      - name: Upload API Portal REST integration coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: portals/api-portal/it/reports/lcov.info
          flags: api-portal-rest-integration

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-api-test-reports-${{ matrix.db }}-${{ matrix.mode }}
          path: portals/api-portal/it/reports/
          retention-days: 7

      - name: Debug on failure - dump container logs
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a

  ui-test:
    name: UI E2E tests (Cypress)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build platform-api image
        run: make -C platform-api build IMAGE_NAME=platform-api VERSION=it-api-portal

      - name: Build API Portal image
        run: make -C portals/api-portal build

      - name: Run Cypress integration tests
        env:
          PLATFORM_API_IMAGE: platform-api:it-api-portal
        run: make -C portals/api-portal/it test

      - name: Upload Cypress reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-reports
          path: portals/api-portal/it/reports/
          retention-days: 7

      - name: Debug on failure - dump container logs
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
