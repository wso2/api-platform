# Runs the integration suite from the test framework.

name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit tests gate every suite leg.
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: '**/go.sum'

      - name: Ensure C compiler is available
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Gateway-controller unit tests
        run: cd gateway/gateway-controller && make test

      - name: Policy-engine unit tests
        run: cd gateway/gateway-runtime && make test

      - name: Platform-API unit tests
        run: cd platform-api && make test

      - name: Upload gateway-controller unit coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: gateway/gateway-controller/unit-test-coverage.txt
          flags: gateway-controller-unit

      - name: Upload policy-engine unit coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: gateway/gateway-runtime/policy-engine/unit-test-coverage.txt
          flags: policy-engine-unit

      - name: Upload platform-api unit coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: platform-api/unit-test-coverage.txt
          flags: platform-api-unit

  integration:
    name: Integration suite (${{ matrix.leg }})
    needs: unit
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
    strategy:
      # Each leg is an independent compatibility verdict
      fail-fast: false
      matrix:
        include:
          # The source-built coverage instrumented Gateway.
          - leg: gateway-latest
            suite_flags: '-coverage'
          # The released 1.2.0 Gateway.
          - leg: gateway-1.2.0
            suite_flags: '-gateway-version=1.2.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: '**/go.sum'

      - name: Ensure C compiler is available
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # The suite's own concurrency (it-suite.yaml) boots many short-lived containers and
      # published ports across the run. Under enough concurrent connection churn the default
      # conntrack table fills, and the kernel silently drops new NAT'd connections to an
      # otherwise healthy, unaffected container - surfacing as an intermittent
      # "connection refused" to a container that never actually crashed or restarted.
      - name: Raise the conntrack table limit
        run: sudo sysctl -w net.netfilter.nf_conntrack_max=524288

      - name: Build testbench image
        run: make -C tests/framework testbench

      - name: Run the integration suite
        working-directory: tests/framework
        env:
          IT_COVERAGE_OUT: ${{ github.workspace }}/tests/framework/suites/it/coverage-out
          IT_LOG_OUT: ${{ github.workspace }}/tests/framework/suites/it/logs-out
        # The gateway-controller policy block requires a sibling gateway-controllers repo
        # checkout and is exercised by that repository's workflow.
        run: |
          go test -v ./suites/it -count=1 -timeout=60m -logs \
            ${{ matrix.suite_flags }} \
            -skip-blocks=gateway-controller-policies

      # always(), and per leg: a failing run is exactly when the container logs are needed,
      # and each leg's artifact name must be unique or upload-artifact rejects the second.
      - name: Upload container log captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-logs-${{ matrix.leg }}
          path: tests/framework/suites/it/logs-out/**/*.log
          if-no-files-found: warn
          include-hidden-files: true

      # Coverage belongs to the source-built leg only.
      - name: Generate integration coverage report
        if: matrix.leg == 'gateway-latest'
        run: make -C tests/framework coverage-report

      - name: Upload coverage HTML reports
        if: matrix.leg == 'gateway-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-${{ matrix.leg }}
          # The whole report tree: splitting by extension dropped the LCOV files Codecov
          # actually consumes and the CSS/JS/images the HTML reports need to render. The
          # raw per-run inputs live under a dot-prefixed .run-* directory, which
          # upload-artifact excludes while include-hidden-files stays unset.
          path: tests/framework/suites/it/coverage-out/**
          if-no-files-found: warn

      # Integration flags. Same component paths as codecov.yml's component_management, so
      # unit and integration uploads for one component roll up into one component view.
      # Gated on the report above having been generated from a clean run; continue-on-error
      # keeps Codecov's availability from failing an otherwise green suite.
      - name: Upload gateway-controller integration coverage to Codecov
        if: matrix.leg == 'gateway-latest'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tests/framework/suites/it/coverage-out/platform-gateway/controller/coverage.txt
          flags: gateway-controller-integration

      - name: Upload policy-engine integration coverage to Codecov
        if: matrix.leg == 'gateway-latest'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tests/framework/suites/it/coverage-out/platform-gateway/runtime/coverage.txt
          flags: policy-engine-integration

      - name: Upload platform-api integration coverage to Codecov
        if: matrix.leg == 'gateway-latest'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tests/framework/suites/it/coverage-out/platform-api/coverage.txt
          flags: platform-api-integration
