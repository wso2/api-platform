name: Platform API Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      next_dev_version:
        description: 'Next development version (with -SNAPSHOT suffix, e.g. 0.15.0-SNAPSHOT)'
        required: true
        type: string

env:
  DOCKER_REGISTRY: ghcr.io/wso2/api-platform

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          make -C platform-api version-set "VERSION=${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver: docker-container


      - name: Run tests
        run: make test-platform-api

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_PLATFORM_BOT_TOKEN }}

      - name: Build and push multi arch Docker images
        run: make build-and-push-platform-api-multiarch

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release platform-api version ${VERSION}"
          git tag -a "platform-api/v${VERSION}" -m "Platform API ${VERSION}"
          git push origin "platform-api/v${VERSION}"

      # The binary zip `make build-and-push-platform-api-multiarch` built (the published
      # images come from it). Attached here so the API Portal release can pick up the
      # zip of the Platform API version it bundles.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platform-api/v${{ inputs.version }}
          name: Platform API ${{ inputs.version }}
          body: |
            ## Platform API Release ${{ inputs.version }}

            ### Docker Image
            ```bash
            docker pull ${{ env.DOCKER_REGISTRY }}/platform-api:${{ inputs.version }}
            ```

            ### Supported Platforms
            - `linux/amd64`
            - `linux/arm64`

            ### Binary zip
            The attached `wso2apip-platform-api-binary-${{ inputs.version }}.zip` holds the prebuilt
            Platform API binaries for linux/amd64 and linux/arm64 and the files they read at runtime,
            which the image above is built from.
          files: platform-api/target/wso2apip-platform-api-binary-${{ inputs.version }}.zip
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(inputs.version, '-') }}
          token: ${{ secrets.API_PLATFORM_BOT_TOKEN }}


      - name: Set next dev version
        env:
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
        run: |
          if [ -z "${NEXT_DEV_VERSION}" ]; then
            echo "Error: next_dev_version input is required"
            exit 1
          fi
          if [[ "${NEXT_DEV_VERSION}" != *-SNAPSHOT ]]; then
            echo "Error: next_dev_version must end with -SNAPSHOT (e.g. 0.15.0-SNAPSHOT)"
            exit 1
          fi
          echo "Setting platform-api to next dev version: ${NEXT_DEV_VERSION}"
          make -C platform-api version-set "VERSION=${NEXT_DEV_VERSION}"

      - name: Commit version bump
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git commit -am "Bump platform-api to next dev version"
          else
            echo "No changes to commit"
          fi

      - name: Create PR for version bump
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Bump platform-api to next dev version"
          title: "chore: Bump platform-api to next dev version"
          body: |
            Automated version bump after release `platform-api/v${{ inputs.version }}`

            This PR bumps the platform-api version to the next development version `${{ inputs.next_dev_version }}`.
          branch: platform-api-version-bump-${{ github.run_id }}
          base: main
          delete-branch: true
          assignees: renuka-fernando
          labels: |
            automated
            version-bump
