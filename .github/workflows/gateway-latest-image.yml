# Publishes the gateway images built from the latest code on main.
#
# Every day at 03:00 UTC, and whenever it is started by hand, this builds the gateway-controller,
# gateway-runtime and gateway-builder images from main and pushes them to the registry that holds
# the released images, under two tags:
#   latest          moves to the newest build
#   main-<sha>      the newest commit that changed the gateway, never moved
# Other repositories, such as gateway-controllers, pull the latest tag the same way they pull a
# release, so they never build gateway source themselves.
#
# The images are pushed and verified under main-<sha> first. latest is moved to them afterwards,
# for all three images together. A run that finds main-<sha> already published and latest already
# on it does nothing, so a day without gateway changes builds nothing; a manual run can set force
# to rebuild anyway. If moving latest fails partway, re-run the failed job: it moves latest again.
#
# It runs only from main, so a manual run from another branch never publishes an image. There is
# no pull request context, so no pull request code is ever checked out with the registry secret
# in reach.

name: Gateway Latest Image

on:
  schedule:
    # 03:00 UTC every day.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and push the images even if main-<sha> is already published.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io/wso2/api-platform
  # The paths whose changes make a new gateway image. main-<sha> names the newest commit that
  # touched any of them.
  GATEWAY_PATHS: gateway common httpkit sdk sdk-python .github/workflows/gateway-latest-image.yml

jobs:
  publish:
    name: Build and push the latest gateway images
    # A manual run from another branch must not move latest.
    if: github.ref == 'refs/heads/main'
    # Runs queue instead of cancelling, so a scheduled run and a manual run never overlap and the
    # three images never end up from different builds.
    concurrency:
      group: gateway-latest-image
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The history lets the next steps find the newest commit that changed the gateway.
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_PLATFORM_BOT_TOKEN }}

      # Decides what this run has to do. build: some image is missing under the tag, or force is
      # set. promote: latest is not yet on the tag's images, for example after a release moved it.
      - name: Plan the publish
        id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # GATEWAY_PATHS is a fixed list of repository paths, so it is expanded unquoted.
          # shellcheck disable=SC2086
          source_sha="$(git log -1 --format=%H -- $GATEWAY_PATHS)"
          if [[ -z "$source_sha" ]]; then
            echo "::error::no commit found for the gateway paths"
            exit 1
          fi
          tag="main-${source_sha::7}"
          build=false
          promote=false
          if [[ "${FORCE:-false}" == "true" ]]; then
            build=true
          fi
          for name in gateway-controller gateway-runtime gateway-builder; do
            image="$DOCKER_REGISTRY/$name"
            if ! tag_digest="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              build=true
              continue
            fi
            latest_digest="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ "$latest_digest" != "$tag_digest" ]]; then
              promote=true
            fi
          done
          {
            echo "tag=$tag"
            echo "build=$build"
            echo "promote=$promote"
          } >> "$GITHUB_OUTPUT"
          if [[ "$build" == "false" && "$promote" == "false" ]]; then
            echo "latest is already on $tag for all three images; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up QEMU
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          install: true
          driver: docker-container

      # PUSH_LATEST=false makes the gateway Makefile push only <registry>/<image>:<VERSION>, so no
      # latest tag moves until all three images have been built and verified.
      - name: Build and push the multi-arch gateway images
        if: steps.plan.outputs.build == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: make -C gateway build-and-push-multiarch VERSION="$TAG" DOCKER_REGISTRY="$DOCKER_REGISTRY" PUSH_LATEST=false

      - name: Verify the pushed images
        if: steps.plan.outputs.build == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Gateway images"
            echo
            echo "| Image | Tag | Platforms |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in gateway-controller gateway-runtime gateway-builder; do
            image="$DOCKER_REGISTRY/$name"
            platforms="$(docker buildx imagetools inspect "$image:$TAG" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            for platform in linux/amd64 linux/arm64; do
              if [[ " $platforms" != *" $platform "* ]]; then
                echo "::error::$name is missing $platform (has: $platforms)"
                exit 1
              fi
            done
            echo "| \`$image\` | \`$TAG\` | $platforms |" >> "$GITHUB_STEP_SUMMARY"
          done

      # imagetools create points latest at the already-pushed manifest, so the three tags move
      # within seconds of each other and nothing is rebuilt. The step can be repeated safely.
      - name: Move latest to the verified images
        if: steps.plan.outputs.build == 'true' || steps.plan.outputs.promote == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          for name in gateway-controller gateway-runtime gateway-builder; do
            image="$DOCKER_REGISTRY/$name"
            docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
          done
          for name in gateway-controller gateway-runtime gateway-builder; do
            image="$DOCKER_REGISTRY/$name"
            latest_digest="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
            tag_digest="$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')"
            if [[ "$latest_digest" != "$tag_digest" ]]; then
              echo "::error::$name: latest ($latest_digest) is not $TAG ($tag_digest)"
              exit 1
            fi
          done
          echo "latest now points at \`$TAG\` for all three images." >> "$GITHUB_STEP_SUMMARY"
