# Publishes the gateway images built from the latest merged code.
#
# Each merge to main that changes the gateway builds the gateway-controller, gateway-runtime and
# gateway-builder images and pushes them to the registry that holds the released images, under
# two tags:
#   latest          moves with every merge
#   main-<sha>      the merged commit, never moved
# Other repositories, such as gateway-controllers, pull the latest tag the same way they pull a
# release, so they never build gateway source themselves.

name: Gateway Latest Image

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - 'common/**'
      - 'httpkit/**'
      - 'sdk/**'
      - 'sdk-python/**'
      - '.github/workflows/gateway-latest-image.yml'
  workflow_dispatch:

# Runs queue instead of cancelling, so a push that has started finishes and the three images
# never end up from different commits. Only the newest queued run is kept.
concurrency:
  group: gateway-latest-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io/wso2/api-platform

jobs:
  publish:
    name: Build and push the latest gateway images
    # A manual run from another branch must not move latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          install: true
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_PLATFORM_BOT_TOKEN }}

      - name: Resolve the image tag
        id: tag
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The gateway Makefile pushes <registry>/<image>:<VERSION> and, unless PUSH_LATEST=false,
      # <registry>/<image>:latest in the same build, so one run publishes both tags.
      - name: Build and push the multi-arch gateway images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: make -C gateway build-and-push-multiarch VERSION="$TAG" DOCKER_REGISTRY="$DOCKER_REGISTRY"

      - name: Verify the pushed images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Gateway images"
            echo
            echo "| Image | Tags | Platforms |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in gateway-controller gateway-runtime gateway-builder; do
            image="$DOCKER_REGISTRY/$name"
            latest_digest="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
            tag_digest="$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')"
            if [[ "$latest_digest" != "$tag_digest" ]]; then
              echo "::error::$name: latest ($latest_digest) is not $TAG ($tag_digest)"
              exit 1
            fi
            platforms="$(docker buildx imagetools inspect "$image:latest" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            for platform in linux/amd64 linux/arm64; do
              if [[ " $platforms" != *" $platform "* ]]; then
                echo "::error::$name is missing $platform (has: $platforms)"
                exit 1
              fi
            done
            echo "| \`$image\` | \`latest\`, \`$TAG\` | $platforms |" >> "$GITHUB_STEP_SUMMARY"
          done
