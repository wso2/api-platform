name: AI Workspace Release

on:
  workflow_dispatch:
    inputs:
      platform_api_version:
        description: 'Platform API version to bundle (e.g. 0.10.0). If empty, uses platform-api/VERSION. When set, db-scripts are fetched from tag platform-api/v<version> and docker-compose is pinned to it.'
        required: true
        type: string
        default: ''
      api_portal_version:
        description: 'API Portal version to pin for the optional "api-portal" Compose profile (e.g. 1.0.0). Need not be released yet — the image tag is pinned regardless, and its config template is taken from tag api-portal/v<version> if that tag exists, otherwise from the working tree.'
        required: true
        type: string
        default: ''
      next_dev_version:
        description: 'Next development version (with -SNAPSHOT suffix, e.g. 1.1.0-SNAPSHOT)'
        required: true
        type: string

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}/api-platform
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker registry (lowercase owner)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_REGISTRY=ghcr.io/${OWNER}/api-platform" >> $GITHUB_ENV

      - name: Determine version from VERSION file
        id: version
        run: |
          VERSION=$(make -C portals/ai-workspace version-get-release --no-print-directory)
          echo "Releasing ai-workspace version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Validate release tag is available
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/portals/ai-workspace/v${VERSION}" >/dev/null 2>&1; then
            echo "Release tag portals/ai-workspace/v${VERSION} already exists"
            exit 1
          fi

      - name: Set version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          make -C portals/ai-workspace version-set VERSION=${VERSION}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_PLATFORM_BOT_TOKEN }}

      - name: Build Docker image for testing
        run: make -C portals/ai-workspace build

      - name: Run tests
        env:
          PLATFORM_API_VERSION: ${{ inputs.platform_api_version }}
        run: |
          echo "Running E2E against released platform-api:${PLATFORM_API_VERSION} (no build)"
          make test-ai-workspace PLATFORM_API_VERSION="${PLATFORM_API_VERSION}"

      - name: Build and push multi arch Docker image
        run: make -C portals/ai-workspace build-and-push-multiarch

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git commit -am "Release ai-workspace version ${{ steps.version.outputs.version }}"
          fi
          git tag -a portals/ai-workspace/v${{ steps.version.outputs.version }} -m "AI Workspace ${{ steps.version.outputs.version }}"
          git push origin portals/ai-workspace/v${{ steps.version.outputs.version }}

      - name: Build distribution zip
        env:
          PLATFORM_API_VERSION: ${{ inputs.platform_api_version }}
          API_PORTAL_VERSION: ${{ inputs.api_portal_version }}
        run: |
          echo "Bundling platform-api db-scripts from tag platform-api/v${PLATFORM_API_VERSION}"
          echo "Pinning optional API Portal image to ${API_PORTAL_VERSION}"
          make -C portals/ai-workspace dist \
            PLATFORM_API_VERSION="${PLATFORM_API_VERSION}" \
            API_PORTAL_VERSION="${API_PORTAL_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portals/ai-workspace/v${{ steps.version.outputs.version }}
          name: AI Workspace ${{ steps.version.outputs.version }}
          body: |
            ## AI Workspace Release ${{ steps.version.outputs.version }}

            ### Docker Image
            ```bash
            docker pull ${{ env.DOCKER_REGISTRY }}/ai-workspace:${{ steps.version.outputs.version }}
            ```

            ### Supported Platforms
            - `linux/amd64`
            - `linux/arm64`

            ### Distribution
            The attached `wso2apip-ai-workspace-${{ steps.version.outputs.version }}.zip` contains the
            standalone AI Workspace + Platform API distribution (docker-compose and configs).
          files: portals/ai-workspace/target/wso2apip-ai-workspace-${{ steps.version.outputs.version }}.zip
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          token: ${{ secrets.API_PLATFORM_BOT_TOKEN }}

      - name: Set next dev version
        env:
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
        run: |
          if [ -z "${NEXT_DEV_VERSION}" ]; then
            echo "Error: next_dev_version input is required"
            exit 1
          fi
          if [[ "${NEXT_DEV_VERSION}" != *-SNAPSHOT ]]; then
            echo "Error: next_dev_version must end with -SNAPSHOT (e.g. 1.1.0-SNAPSHOT)"
            exit 1
          fi
          echo "Setting ai-workspace to next dev version: ${NEXT_DEV_VERSION}"
          make -C portals/ai-workspace version-set "VERSION=${NEXT_DEV_VERSION}"

      - name: Commit version bump
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git commit -am "Bump ai-workspace to next dev version"
          else
            echo "No changes to commit"
          fi

      - name: Create PR for version bump
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.API_PLATFORM_BOT_TOKEN }}
          add-paths: |
            portals/ai-workspace/VERSION
            portals/ai-workspace/docker-compose.yaml
          commit-message: "Bump ai-workspace to next dev version"
          title: "chore: Bump ai-workspace to next dev version"
          body: |
            Automated version bump after release `portals/ai-workspace/v${{ steps.version.outputs.version }}`

            This PR bumps the ai-workspace version to the next development version `${{ inputs.next_dev_version }}`.
          branch: ai-workspace-version-bump-${{ github.run_id }}
          base: main
          delete-branch: true
          labels: |
            automated
            version-bump
