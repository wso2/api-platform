# Releases the integration-test framework as a Go module.
#
# Other repositories import github.com/wso2/api-platform/tests/framework at the version this
# workflow tags, and run against the testbench image published with that same version. The
# module lives in a subdirectory, so its tag carries the directory prefix: tests/framework/vX.Y.Z.

name: Tests Framework Release

on:
  # Releasing is manual-only so a merge never publishes a version by accident.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH, e.g. 0.1.0).'
        required: true
        type: string

env:
  TESTBENCH_REPOSITORY: ghcr.io/wso2/api-platform/testbench

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: tests/framework
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the version
        id: version
        env:
          # The input is untrusted: it is read from the environment, never interpolated into the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: '$INPUT_VERSION' is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi
          if git rev-parse "tests/framework/v${VERSION}" >/dev/null 2>&1; then
            echo "Error: tag tests/framework/v${VERSION} already exists"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: tests/framework/go.sum

      # A consumer has no checkout to read these files from, so the snapshots the module
      # embeds must equal the gateway files they copy at the commit being released.
      - name: Check the embedded snapshots match the repository
        run: go run ./cmd/syncassets -check

      - name: Run the framework unit tests
        run: go test ./core/... ./cmd/... -count=1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_PLATFORM_BOT_TOKEN }}

      # The image is published before the tag, so a tag never points at a version whose
      # testbench image does not exist.
      - name: Build and push the testbench image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f testbench/Dockerfile \
            -t "${TESTBENCH_REPOSITORY}:${VERSION}" \
            --push .

      - name: Create and push the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "tests/framework/v${VERSION}" -m "Tests framework ${VERSION}"
          git push origin "tests/framework/v${VERSION}"
