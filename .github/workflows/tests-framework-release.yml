name: Tests Framework Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (MAJOR.MINOR.PATCH, e.g. 0.1.0). Leave empty to just replace the :latest testbench image without cutting a module release.'
        required: false
        type: string

env:
  TESTBENCH_REPOSITORY: ghcr.io/wso2/api-platform/testbench

# Serializes releases: two in-flight runs could otherwise both pass the staleness check below
# against a moving main, then race to publish.
concurrency:
  group: tests-framework-release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: tests/framework
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate the version
        id: version
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: '$INPUT_VERSION' is not a MAJOR.MINOR.PATCH version"
            exit 1
          fi
          if git rev-parse "tests/framework/v${VERSION}" >/dev/null 2>&1; then
            echo "Error: tag tests/framework/v${VERSION} already exists"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Always evaluated, so a version release skips moving :latest instead of being rejected
      # outright — a version input may deliberately target an older commit for a backport.
      - name: Check whether this commit is main's current head
        id: freshness
        run: |
          set -euo pipefail
          main_head="$(git ls-remote --heads origin main | cut -f1)"
          if [ "${main_head}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${GITHUB_SHA} is not main's current head (${main_head})"
          fi

      - name: Reject a stale commit for a :latest-only release
        if: inputs.version == '' && steps.freshness.outputs.current != 'true'
        run: |
          echo "Error: refusing to replace :latest from a stale commit. Re-dispatch from the current main."
          exit 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: tests/framework/go.sum

      - name: Generate the embedded snapshots
        run: go run ./cmd/syncassets

      # Skipped: it checks the gateway's own version files, which disagree on main.
      - name: Run the framework unit tests
        run: go test ./core/... ./cmd/... -count=1 -skip '^TestGatewayBuildYAMLAgreesWithVERSION$'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.API_PLATFORM_BOT_TOKEN }}

      # :latest only moves when this commit is current (see the freshness check above) — a
      # version release from a stale commit still publishes its own immutable :VERSION tag.
      - name: Build and push the testbench image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT: ${{ steps.freshness.outputs.current }}
        run: |
          set -euo pipefail
          tags=()
          if [ "${CURRENT}" = "true" ]; then
            tags+=(-t "${TESTBENCH_REPOSITORY}:latest")
          fi
          if [ -n "${VERSION}" ]; then
            tags+=(-t "${TESTBENCH_REPOSITORY}:${VERSION}")
          fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "Error: nothing to publish — a stale commit with no version given"
            exit 1
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f testbench/Dockerfile \
            "${tags[@]}" \
            --push .

      # Only when a version is given — that's what makes `go get .../tests/framework@vX.Y.Z`
      # resolve a real, reproducible module release. A plain :latest replace needs no tag.
      - name: Create and push the release tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --detach
          git add -f snapshots
          if [ "$(git ls-files -- snapshots | wc -l)" -lt 2 ]; then
            echo "Error: the generated snapshots were not added to the release commit"
            exit 1
          fi
          git commit -m "Tests framework ${VERSION}: embed the generated snapshots"
          git tag -a "tests/framework/v${VERSION}" -m "Tests framework ${VERSION}"
          git push origin "tests/framework/v${VERSION}"
