name: Codecov Code Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  codecov_test:
    name: Run Unit and Integration Tests with Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: '**/go.sum'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Gateway Unit Tests
        continue-on-error: true
        run: |
          cd gateway
          make test

      - name: CLI Unit Tests
        continue-on-error: true
        run: |
          cd cli/src
          make test

      - name: Build coverage-instrumented images
        run: |
          cd gateway
          make build-coverage

      - name: Build sample-service
        run: |
          cd samples/sample-service
          make build

      - name: Run Gateway integration tests
        continue-on-error: true
        run: |
          cd gateway
          make test-integration

      - name: Build CLI binary
        run: |
          cd cli/it
          make build-cli-coverage

      - name: Run CLI integration tests
        continue-on-error: true
        run: |
          cd cli/it
          make test

      - name: List generated coverage files
        run: |
          echo "=== Finding all coverage.txt files ==="
          find . -name "*coverage.txt" -type f

      # Listed explicitly rather than by glob: `files` only ADDS to the files the action
      # discovers on its own, so with search left on this flag also absorbed platform-api
      # and event-gateway profiles that this job never builds. These four are exactly what
      # `gateway/make test` and `cli/src/make test` above produce. The test steps are
      # continue-on-error, so a failed suite leaves its profile missing; that is reported
      # rather than silently backfilled by whatever else is lying around the workspace.
      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: gateway/gateway-controller/unit-test-coverage.txt,gateway/gateway-builder/unit-test-coverage.txt,gateway/gateway-runtime/policy-engine/unit-test-coverage.txt,cli/src/unit-test-coverage.txt
          flags: unit

      - name: Upload Gateway integration test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: gateway/it/coverage/output/txt
          flags: integration

      - name: Upload CLI integration test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: cli/it/coverage/output/txt
          flags: cli-integration
