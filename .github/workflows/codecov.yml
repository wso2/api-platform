name: Codecov Code Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  codecov_test:
    name: Run Unit and Integration Tests with Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Gateway Unit Tests
        continue-on-error: true
        run: |
          cd gateway
          make test

      - name: CLI Unit Tests
        continue-on-error: true
        run: |
          cd cli/src
          make test

      - name: Build coverage-instrumented images
        run: |
          cd gateway
          make build-coverage

      - name: Build sample-service
        run: |
          cd samples/sample-service
          make build

      - name: Build CLI binary
        run: |
          cd cli/it
          make build-cli-coverage

      - name: Run CLI integration tests
        continue-on-error: true
        run: |
          cd cli/it
          make test

      # The integration framework's coverage run for main. These steps mirror the source-built
      # (-coverage) leg of it.yml, which uploads the same flags for pull requests; keep the two in
      # step.
      - name: Ensure C compiler is available
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Raise the conntrack table limit
        run: sudo sysctl -w net.netfilter.nf_conntrack_max=524288

      - name: Build integration framework images
        run: |
          make -C tests/framework testbench
          make -C tests/framework a2a-trip-planner
          make -C tests/framework ap-cli

      - name: Run the integration framework suite with coverage
        continue-on-error: true
        working-directory: tests/framework
        env:
          IT_COVERAGE_OUT: ${{ github.workspace }}/tests/framework/suites/it/coverage-out
        # The policy-compat blocks require a sibling gateway-controllers checkout and are
        # exercised by that repository's workflow.
        run: |
          go test ./suites/it -count=1 -timeout=60m -coverage \
            -skip-blocks=policy-compat,policy-compat-semantic-ai

      - name: Generate integration coverage report
        continue-on-error: true
        run: make -C tests/framework coverage-report

      - name: List generated coverage files
        run: |
          echo "=== Finding all coverage.txt files ==="
          find . -name "*coverage.txt" -type f

      # Listed explicitly rather than by glob: `files` only ADDS to the files the action
      # discovers on its own, so with search left on this flag also absorbed platform-api
      # and event-gateway profiles that this job never builds. These four are exactly what
      # `gateway/make test` and `cli/src/make test` above produce. The test steps are
      # continue-on-error, so a failed suite leaves its profile missing; that is reported
      # rather than silently backfilled by whatever else is lying around the workspace.
      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: gateway/gateway-controller/unit-test-coverage.txt,gateway/gateway-builder/unit-test-coverage.txt,gateway/gateway-runtime/policy-engine/unit-test-coverage.txt,cli/src/unit-test-coverage.txt
          flags: unit

      # Integration flags, the same as it.yml's, so main and pull requests report into one view.
      - name: Upload gateway-controller integration coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tests/framework/suites/it/coverage-out/platform-gateway/controller/coverage.txt
          flags: gateway-controller-integration

      - name: Upload policy-engine integration coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tests/framework/suites/it/coverage-out/platform-gateway/runtime/coverage.txt
          flags: policy-engine-integration

      - name: Upload platform-api integration coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tests/framework/suites/it/coverage-out/platform-api/coverage.txt
          flags: platform-api-integration

      - name: Upload API Portal server integration coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: tests/framework/suites/it/coverage-out/api-portal/server/lcov.info
          flags: api-portal-server-it

      - name: Upload CLI integration test coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: cli/it/coverage/output/txt
          flags: cli-integration
