name: Codecov Code Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  codecov_test:
    name: Run Unit and Integration Tests with Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: '**/go.sum'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Gateway Unit Tests
        continue-on-error: true
        run: |
          cd gateway
          make test

      - name: CLI Unit Tests
        continue-on-error: true
        run: |
          cd cli/src
          make test

      - name: Build coverage-instrumented images
        run: |
          cd gateway
          make build-coverage

      - name: Build sample-service
        run: |
          cd samples/sample-service
          make build

      # Gateway integration coverage comes from the v2 suite; the old gateway/it lane's
      # reporter never merged across services and wiped prior runs, so its numbers were
      # partial. See tests/v2-framework/docs/coverage-architecture.md.
      - name: Build testbench image
        run: make -C tests/v2-framework testbench

      - name: Run Gateway v2 integration tests with coverage
        continue-on-error: true
        working-directory: tests/v2-framework
        run: go test ./suites/it -count=1 -timeout=45m -blocks=gateway-core -block-parallel=3 -coverage

      - name: Generate v2 coverage report
        continue-on-error: true
        run: make -C tests/v2-framework coverage-report

      - name: Build CLI binary
        run: |
          cd cli/it
          make build-cli-coverage

      - name: Run CLI integration tests
        continue-on-error: true
        run: |
          cd cli/it
          make test

      - name: List generated coverage files
        run: |
          echo "=== Finding all coverage.txt files ==="
          find . -name "*coverage.txt" -type f

      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/unit-test-coverage.txt'
          flags: unit

      # Per-component uploads (monorepo): each component's slice under its own flag.
      - name: Upload gateway-controller integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/v2-framework/suites/it/coverage-out/coverage-controller.txt
          flags: gateway-controller-integration

      - name: Upload policy-engine integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/v2-framework/suites/it/coverage-out/coverage-policyengine.txt
          flags: policy-engine-integration
          flags: integration

      - name: Upload CLI integration test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: cli/it/coverage/output/txt
          flags: cli-integration
