name: SDK Integration Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-integration-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The gateway modules pin a published sdk/core; point them at this checkout's so the
      # gateway is built and tested against the SDK under review.
      - name: Inject local SDK into gateway modules
        run: |
          cd gateway/gateway-runtime/policy-engine
          go mod edit -replace github.com/wso2/api-platform/sdk/core=../../../sdk/core

          cd ../../gateway-builder
          go mod edit -replace github.com/wso2/api-platform/sdk/core=../../sdk/core

          cd ../gateway-controller
          go mod edit -replace github.com/wso2/api-platform/sdk/core=../../sdk/core

      - name: Build testbench image
        run: make -C tests/framework testbench

      # The gateway-core block also runs the ap CLI scenarios, which drive this checkout's CLI.
      - name: Build ap CLI binary
        run: make -C tests/framework ap-cli

      # The integration framework builds the gateway images from source, with the injected SDK.
      - name: Run gateway integration tests
        env:
          IT_LOG_OUT: ${{ github.workspace }}/tests/framework/suites/it/logs-out
        run: make -C gateway test-integration INTEGRATION_TEST_FLAGS=-logs

      - name: Upload container log captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-logs
          path: tests/framework/suites/it/logs-out/**/*.log
          if-no-files-found: warn
          include-hidden-files: true
