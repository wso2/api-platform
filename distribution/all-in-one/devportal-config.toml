# API Portal configuration for the all-in-one (build-from-source) compose
# stack. Mounted at /app/configs/config.toml — replaces the image's shipped
# configs/config.toml, which fails closed at startup on the required security
# secrets and only wires the SQLite `path` key (this stack shares one Postgres
# server with platform-api).
#
# Every key lives under the single [api_portal] table; configLoader.js
# unwraps it and IGNORES anything outside it, so a section at the top level is
# silently dropped and its defaults (src/config/configDefaults.js) win instead.
#
# There is NO automatic APIP_AP_* environment-variable override — an env var set
# in docker-compose.yaml's `API Portal.environment` block only takes effect where
# a key below explicitly references it via a {{ env "..." }} token.

[api_portal.server]
port = '{{ env "APIP_AP_SERVER_PORT" "9543" }}'

[api_portal.server.https]
# Plain HTTP — nothing in this stack talks to API Portal over TLS.
enabled = '{{ env "APIP_AP_SERVER_HTTPS_ENABLED" "false" }}'

[api_portal.logging]
console_only = '{{ env "APIP_AP_LOGGING_CONSOLE_ONLY" "true" }}'

[api_portal.database]
driver   = '{{ env "APIP_AP_DATABASE_DRIVER" "postgres" }}'
host     = '{{ env "APIP_AP_DATABASE_HOST" "postgres" }}'
port     = '{{ env "APIP_AP_DATABASE_PORT" "5432" }}'
name     = '{{ env "APIP_AP_DATABASE_NAME" "api_portal" }}'
user     = '{{ env "APIP_AP_DATABASE_USER" "postgres" }}'
password = '{{ env "APIP_AP_DATABASE_PASSWORD" "postgres" }}'

[api_portal.organization]
handle       = '{{ env "APIP_AP_ORGANIZATION_HANDLE" "default" }}'
display_name = '{{ env "APIP_AP_ORGANIZATION_DISPLAY_NAME" "Default" }}'

[api_portal.auth]
mode = "local"

[api_portal.auth.local]
# platform-api signs its tokens with RS256; the API Portal verifies them against
# the public half of that keypair, bind-mounted read-only at /etc/api-portal/keys.
# Only jwt_public.pem is exposed here (the private key stays with platform-api);
# the API Portal reads it from that path.
platform_api_url = '{{ env "APIP_AP_AUTH_LOCAL_PLATFORM_API_URL" "https://platform-api:9243" }}'
public_key_path  = '{{ env "APIP_AP_AUTH_LOCAL_PUBLIC_KEY_PATH" "/etc/api-portal/keys/jwt_public.pem" }}'
# platform-api's cert is self-signed (platform-api-certgen).
tls_skip_verify  = '{{ env "APIP_AP_AUTH_LOCAL_TLS_SKIP_VERIFY" "true" }}'

[api_portal.security]
# Required — API Portal fails closed at startup if either doesn't resolve to a
# 64-char hex string. Set APIP_AP_SECURITY_ENCRYPTION_KEY / APIP_AP_SECURITY_SESSION_SECRET
# in the environment before `docker compose up` (e.g. `openssl rand -hex 32` each).
encryption_key = '{{ env "APIP_AP_SECURITY_ENCRYPTION_KEY" }}'
session_secret = '{{ env "APIP_AP_SECURITY_SESSION_SECRET" }}'
