# Event Gateway Integration Test Configuration
#
# Mounted into the gateway-controller container by the docker-compose stacks in
# event-gateway/. Keeps test-only values out of the shipped
# gateway/configs/config.toml.

# =============================================================================
# GATEWAY CONTROLLER CONFIGURATION
# =============================================================================

[controller.storage]
type = '{{ env "APIP_GW_CONTROLLER_STORAGE_TYPE" "sqlite" }}'

[controller.storage.sqlite]
path = '{{ env "APIP_GW_CONTROLLER_STORAGE_SQLITE_PATH" "./data/gateway.db" }}'

[controller.storage.postgres]
host     = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_HOST" "" }}'
port     = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_PORT" "5432" }}'
database = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_DATABASE" "" }}'
user     = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_USER" "" }}'
password = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_PASSWORD" "" }}'
sslmode  = '{{ env "APIP_GW_CONTROLLER_STORAGE_POSTGRES_SSLMODE" "disable" }}'

[controller.storage.database]
# SQL Server DSN (used only when type = "sqlserver").
dsn = '{{ env "APIP_GW_CONTROLLER_STORAGE_DATABASE_DSN" "" }}'

[controller.logging]
level = '{{ env "APIP_GW_CONTROLLER_LOGGING_LEVEL" "info" }}'

[controller.event_hub]
# Faster poll interval for test responsiveness (default: 3s).
poll_interval = "200ms"

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username        = '{{ env "APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_USERNAME" "" }}'
password        = '{{ env "APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_PASSWORD_HASH" "" }}'
password_hashed = true
roles           = ["admin"]

# =============================================================================
# ROUTER CONFIGURATION
# =============================================================================

# router.event_gateway is read by a loader that does not interpolate
# {{ env }} tokens, so these values are literal.
[router.event_gateway]
enabled                  = true
websub_hub_url           = "http://event-gateway:8080"
websub_hub_port          = 8080
websub_hub_listener_port = 8080
timeout_seconds          = 30

[router.access_logs]
enabled = true

# =============================================================================
# POLICY ENGINE CONFIGURATION
# =============================================================================

[policy_engine.logging]
level = "info"
