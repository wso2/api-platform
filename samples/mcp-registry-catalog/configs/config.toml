# Platform API + API Portal configuration for the MCP Registry Catalog sample.
# Each service reads only its own top-level table ([platform_api] / [api_portal])
# and ignores the other. Secrets are read from files generated by setup.sh --
# never written here as literals. See the WSO2 API Platform docs
# (https://wso2.com/api-platform/docs/) for the full config reference.

# #############################################################################
# #  PLATFORM API  (the "Management API" -- publish.sh talks to this)
# #############################################################################

[platform_api]

[platform_api.logging]
level = "info"

[platform_api.security]
encryption_key = '{{ file "/etc/platform-api/keys/encryption.key" }}'

[platform_api.database]
driver = "sqlite3"
path   = "./data/api_platform.db"

[platform_api.auth]
mode = "file"

[platform_api.auth.authorization]
enabled = true
mode    = "scope"
role_to_scope_mapping = "/etc/platform-api/role-to-scope-mapping.yaml"

[platform_api.auth.jwt]
issuer           = "platform-api"
public_key_file  = "/etc/platform-api/keys/jwt_public.pem"
private_key_file = "/etc/platform-api/keys/jwt_private.pem"

[platform_api.auth.file.organization]
id           = "default"
display_name = "Default"
region       = "us"

[[platform_api.auth.file.users]]
username      = '{{ env "APIP_CP_ADMIN_USERNAME" }}'
password_hash = '{{ env "APIP_CP_ADMIN_PASSWORD_HASH" }}'
roles         = ["ap_admin"]

# #############################################################################
# #  API PORTAL & MCP HUB  (discover.sh queries its MCP Registry API)
# #############################################################################

[api_portal.server]
base_url = "https://localhost:9543"
port     = 9543

[api_portal.server.https]
enabled   = true
cert_file = "/etc/api-portal/tls/cert.pem"
key_file  = "/etc/api-portal/tls/key.pem"

[api_portal.logging]
level = "info"

[api_portal.database]
driver = "sqlite"
path   = "./data/api-portal.db"

[api_portal.security]
encryption_key = '{{ file "/etc/api-portal/keys/encryption.key" }}'
session_secret = '{{ file "/etc/api-portal/keys/session-secret" }}'

[api_portal.auth]
mode = "local"

[api_portal.auth.local]
platform_api_url = "https://platform-api:9243"
public_key_path  = "/etc/api-portal/keys/jwt_public.pem"
tls_skip_verify  = true

[api_portal.organization]
handle       = "default"
display_name = "Default"

# This portal exists to be an MCP catalog -- restrict it to that one artifact
# type so every landing page and nav entry is MCP-focused.
[api_portal.artifacts]
enabled_types = ["mcp-servers"]
