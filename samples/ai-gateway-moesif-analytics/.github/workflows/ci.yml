name: AI Gateway Moesif Analytics Sample PR Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'samples/ai-gateway-moesif-analytics/**'

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: samples/ai-gateway-moesif-analytics
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Shell syntax check
        run: bash -n setup.sh load.sh test.sh teardown.sh

      - name: Validate mappings and resource definitions
        run: |
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('wiremock/mappings/*.json')]"
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('*.yaml')]"

      # The steps below need a Moesif account, so they run only where the
      # secret is configured. Forks still get the checks above.
      - name: Check for a Moesif Application ID
        id: moesif
        env:
          MOESIF_APPLICATION_ID: ${{ secrets.MOESIF_APPLICATION_ID }}
        run: |
          if [ -n "${MOESIF_APPLICATION_ID}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MOESIF_APPLICATION_ID is not configured; live gateway checks were skipped."
          fi

      - name: Start the gateway
        if: steps.moesif.outputs.available == 'true'
        env:
          MOESIF_APPLICATION_ID: ${{ secrets.MOESIF_APPLICATION_ID }}
        run: ./setup.sh

      - name: Generate traffic
        if: steps.moesif.outputs.available == 'true'
        run: ./load.sh 45

      - name: Verify the analytics pipeline
        if: steps.moesif.outputs.available == 'true'
        run: ./test.sh

      - name: Dump container logs on failure
        if: failure() && steps.moesif.outputs.available == 'true'
        env:
          MOESIF_APPLICATION_ID: ${{ secrets.MOESIF_APPLICATION_ID }}
        run: |
          docker ps -a
          (cd wso2apip-ai-gateway-1.2.0 && docker compose logs --tail 200) || true

      - name: Teardown
        if: always() && steps.moesif.outputs.available == 'true'
        env:
          MOESIF_APPLICATION_ID: ${{ secrets.MOESIF_APPLICATION_ID }}
        run: ./teardown.sh --clean
