02a1 1 0 0 0-.553-.894l-6.002-3a1 1 0 0 0-.932.022l-9 5A1 1 0 0 0 16 16v7.382l-5.447 2.723c-.339.17-.553.516-.553.895v10a1 1 0 0 0 .485.857L15 40.566V47a1 1 0 0 0 .521.878l11 6a1 1 0 0 0 .994-.021l5-3A1 1 0 0 0 33 50v-7h6v2.184A3 3 0 0 0 37 48c0 1.654 1.346 3 3 3s3-1.346 3-3a3 3 0 0 0-2-2.816V42a1 1 0 0 0-1-1h-7l.001-4h10.585l1.715 1.715A2.95 2.95 0 0 0 45 40c0 1.654 1.346 3 3 3s3-1.346 3-3-1.346-3-3-3a2.95 2.95 0 0 0-1.285.3l-2.008-2.007A1 1 0 0 0 44 35H33.001v-4h15.183A3 3 0 0 0 51 33c1.654 0 3-1.346 3-3s-1.346-3-3-3"/></g></svg><text x="960" y="487.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">Amazon Bedrock Guardrails</text><text x="960" y="504.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">ApplyGuardrail</text><path d="M300 125 V245" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 285 V305" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 355 V475" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 515 V535" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 585 V605" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 655 V830 H406" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M454 830 H560 V585" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M560 535 V355" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M560 305 V70 H324" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M420 340 H430 V380 H820 V330" fill="none" stroke="#545B64" stroke-width="2" stroke-dasharray="6 5"/><path d="M420 570 H430 V610 H820 V560" fill="none" stroke="#545B64" stroke-width="2" stroke-dasharray="6 5"/><path d="M680 330 H820 V430 H936" fill="none" stroke="#545B64" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><path d="M680 560 H820 V460 H936" fill="none" stroke="#545B64" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="160" y="225" font-size="1" font-weight="normal" text-anchor="middle" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif"></text><circle cx="322" cy="132" r="12" fill="#232F3E"/><text x="322" y="137" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">1</text><circle cx="160" cy="330" r="12" fill="#232F3E"/><text x="160" y="335" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">2</text><circle cx="160" cy="560" r="12" fill="#232F3E"/><text x="160" y="565" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">3</text><circle cx="160" cy="630" r="12" fill="#232F3E"/><text x="160" y="635" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">4</text><circle cx="582" cy="412" r="12" fill="#232F3E"/><text x="582" y="417" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">5</text><circle cx="582" cy="100" r="12" fill="#232F3E"/><text x="582" y="105" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">6</text><text x="300" y="905" font-size="1" font-weight="normal" text-anchor="middle" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif"></text><circle cx="60" cy="915" r="12" fill="#232F3E"/><text x="60" y="920" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">1</text><text x="82" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The application sends a Converse request with its gateway API key as a bearer token.</text><circle cx="60" cy="947" r="12" fill="#232F3E"/><text x="60" y="952" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">2</text><text x="82" y="952" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The proxy checks the key, then calls ApplyGuardrail with the app-specific guardrail.</text><circle cx="60" cy="979" r="12" fill="#232F3E"/><text x="60" y="984" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">3</text><text x="82" y="984" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The provider checks the internal key, then calls ApplyGuardrail with the baseline and redacts PII.</text><circle cx="60" cy="1011" r="12" fill="#232F3E"/><text x="60" y="1016" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">4</text><text x="82" y="1016" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The provider signs the final body with SigV4, using the assumed IAM role, and calls Converse.</text><circle cx="60" cy="1043" r="12" fill="#232F3E"/><text x="60" y="1048" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">5</text><text x="82" y="1048" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The response passes the baseline, then the app-specific guardrail, in reverse order.</text><circle cx="60" cy="1075" r="12" fill="#232F3E"/><text x="60" y="1080" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">6</text><text x="82" y="1080" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">If any guardrail intervenes, the application gets HTTP 422. On input, nothing after it runs.</text></svg>