# Replaces the distribution's observability/prometheus/prometheus.yml.
#
# The policy engine and the Envoy router both run inside the `gateway-runtime`
# container, so that is the hostname Prometheus scrapes them at.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Gateway controller — the control plane you register proxies with.
  - job_name: 'gateway-controller'
    static_configs:
      - targets: ['gateway-controller:9091']
    metrics_path: /metrics

  # Policy engine — where auth, rate limiting and the other policies run.
  - job_name: 'policy-engine'
    static_configs:
      - targets: ['gateway-runtime:9003']
    metrics_path: /metrics

  # Envoy router — the data plane traffic actually flows through.
  - job_name: 'router'
    static_configs:
      - targets: ['gateway-runtime:9901']
    metrics_path: /stats/prometheus
