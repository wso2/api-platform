apiVersion: gateway.api-platform.wso2.com/v1
kind: LlmProxy
metadata:
  name: assistant-proxy
spec:
  displayName: Assistant Proxy
  version: v1.0
  context: /assistant
  provider:
    id: mock-openai-provider
  policies:
    - name: api-key-auth
      version: v1
      paths:
        - path: /chat/completions
          methods: [POST]
          params:
            key: api_key
            in: header
