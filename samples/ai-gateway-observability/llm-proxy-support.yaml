apiVersion: gateway.api-platform.wso2.com/v1
kind: LlmProxy
metadata:
  name: support-proxy
spec:
  displayName: Support Proxy
  version: v1.0
  context: /support
  provider:
    # The budgeted provider — this proxy runs out of tokens under load.
    id: mock-openai-provider-budgeted
  policies:
    - name: api-key-auth
      version: v1
      paths:
        - path: /chat/completions
          methods: [POST]
          params:
            key: api_key
            in: header
