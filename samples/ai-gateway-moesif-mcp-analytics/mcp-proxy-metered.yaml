apiVersion: gateway.api-platform.wso2.com/v1
kind: Mcp
metadata:
  name: metered-mcp
spec:
  displayName: Metered MCP
  version: v1.0
  context: /metered
  specVersion: "2025-06-18"
  upstream:
    # The path of the MCP endpoint is part of this URL.
    url: http://mcp-everything:3001/mcp
  policies:
    - name: mcp-auth
      version: v1
      params:
        # Trust tokens signed by the sample's own key. In a real deployment
        # this names a key manager pointed at your identity provider.
        issuers:
          - sample-key-manager
        # The claim that becomes the consumer name in analytics.
        userIdClaim: sub
    # A narrower allowlist than the toolbox proxy: two tools instead of four.
    - name: mcp-acl-list
      version: v1
      params:
        tools:
          mode: deny
          exceptions:
            - echo
            - get-sum
    # Fifteen calls per tool per minute. Each tool gets its own counter, and
    # calls over the limit come back as HTTP 429 with a JSON-RPC error body.
    - name: mcp-ratelimit
      version: v1
      params:
        tools:
          - name: "*"
            limits:
              - limit: 15
                duration: 1m
