events {}

http {
  default_type application/json;

  server {
    listen 8443 ssl;
    server_name mtls-backend-b;

    ssl_certificate     /etc/mtls-pki/backend-server-b.crt;
    ssl_certificate_key /etc/mtls-pki/backend-server-b.key;

    ssl_client_certificate /etc/mtls-pki/ca-b.crt;
    ssl_verify_client on;
    ssl_verify_depth 3;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      add_header X-Client-Subject $ssl_client_s_dn always;
      return 200 '{"backend":"b","client":"$ssl_client_s_dn"}';
    }
  }
}
