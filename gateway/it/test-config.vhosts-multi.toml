# Integration Test Configuration — VHost profile: multi-domain

# =============================================================================
# ROOT-LEVEL POLICY CONFIGURATIONS (accessed via ${config.xxx})
# =============================================================================

# AWS Bedrock Guardrail Policy Configuration
awsbedrock_guardrail_region = "us-east-1"
awsbedrock_guardrail_id = "test-guardrail-id"
awsbedrock_guardrail_version = "DRAFT"
awsbedrock_access_key_id = "test-access-key"
awsbedrock_secret_access_key = "test-secret-key"
awsbedrock_session_token = ""
awsbedrock_role_arn = ""
awsbedrock_role_region = ""
awsbedrock_role_external_id = ""

# Azure Content Safety Policy Configuration
azurecontentsafety_endpoint = "http://mock-azure-content-safety:8080"
azurecontentsafety_key = "test-subscription-key"

# Embedding Provider Configuration (for semantic-cache and semantic-prompt-guard)
embedding_provider = "OPENAI"
embedding_provider_endpoint = "http://mock-embedding-provider:8080/v1/embeddings"
embedding_provider_model = "text-embedding-ada-002"
embedding_provider_dimension = 1536
embedding_provider_api_key = "test-api-key"

# Redis Configuration (for semantic-cache)
redis_host = "redis"
redis_port = 6379
redis_password = "redis"
redis_db = 0

# Vector DB Provider Configuration (for semantic-cache)
vector_db_provider = "REDIS"
vector_db_provider_host = "redis"
vector_db_provider_port = 6379
vector_db_provider_username = "default"
vector_db_provider_password = "redis"
vector_db_provider_database = "0"
vector_db_provider_ttl = 3600  # 1 hour in seconds

# =============================================================================
# GATEWAY CONTROLLER CONFIGURATION
# =============================================================================

[controller.server.xds_tls]
# mTLS on the main xDS server (serves Envoy), using the shared dev CA/certs in
# ../gateway-controller/listener-certs (provisioned by scripts/setup.sh, mounted at
# /app/xds-certs below). Enabled by default via XDS_TLS_ENABLED (set in the compose
# file); see gateway/configs/config.toml for the full explanation of this pattern.
enabled = '{{ env "XDS_TLS_ENABLED" "true" }}'
allowed_client_identities = ["spiffe://api-platform/gateway-runtime/envoy"]

[controller.policy_server.tls]
# Same setup as server.xds_tls above, for the policy xDS server (serves the
# policy-engine). Distinct client identity -- the policy-engine presents its own cert.
enabled = '{{ env "XDS_TLS_ENABLED" "true" }}'
allowed_client_identities = ["spiffe://api-platform/gateway-runtime/policy-engine"]

[controller.storage]
type = '{{ env "APIP_GW_CONTROLLER_STORAGE_TYPE" "sqlite" }}'

[controller.storage.sqlite]
path = '{{ env "APIP_GW_CONTROLLER_STORAGE_SQLITE_PATH" "./data/gateway.db" }}'

[controller.event_hub]
# Faster poll interval for test responsiveness (default: 3s)
poll_interval = "200ms"

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username = "admin"
password = "admin"
password_hashed = false
roles = ["admin"]

[controller.logging]
level = '{{ env "APIP_GW_CONTROLLER_LOGGING_LEVEL" "debug" }}'

[controller.metrics]
enabled = true

[controller.admin_server.config_dump]
# config_dump is off by default in production; enabled here for the IT suite.
enabled = true

# =============================================================================
# ROUTER CONFIGURATION
# =============================================================================

[router.access_logs]
enabled = true
format = "text"

[router.vhosts.main]
domains = ["*.wso2.com", "*.foo.com"]
default = "*.wso2.com"

[router.vhosts.sandbox]
domains = ["*-sandbox.wso2.com", "*-sandbox.foo.com"]
default = "*-sandbox.wso2.com"

# =============================================================================
# POLICY ENGINE CONFIGURATION
# =============================================================================

[policy_engine.logging]
level = "debug"

[policy_engine.xds.tls]
# Client-side counterpart to controller.policy_server.tls above -- this policy-engine
# subprocess presents its own client identity, distinct from Envoy's, since
# controller.policy_server.tls.allowed_client_identities only allows the
# policy-engine identity. Cert paths come from POLICY_ENGINE_XDS_CLIENT_*_PATH env
# vars (set in the compose file), same fallback pattern as gateway/configs/config.toml.
enabled = '{{ env "POLICY_ENGINE_XDS_TLS_ENABLED" (env "XDS_TLS_ENABLED" "true") }}'
cert_path = '{{ env "POLICY_ENGINE_XDS_CLIENT_CERT_PATH" (env "XDS_CLIENT_CERT_PATH" "") }}'
key_path = '{{ env "POLICY_ENGINE_XDS_CLIENT_KEY_PATH" (env "XDS_CLIENT_KEY_PATH" "") }}'
ca_path = '{{ env "POLICY_ENGINE_XDS_CLIENT_CA_PATH" (env "XDS_CLIENT_CA_PATH" "") }}'

[policy_engine.admin.config_dump]
# config_dump is off by default in production; enabled here for the IT suite.
enabled = true

[policy_engine.metrics]
enabled = true

# =============================================================================
# POLICY CONFIGURATIONS
# =============================================================================

[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://mock-jwks:8080/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://mock-jwks:8080/jwks"

[[policy_configurations.jwtauth_v1.keymanagers]]
name = "wrong-issuer-km"
issuer = "http://expected-issuer.com"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://mock-jwks:8080/jwks"

[policy_configurations.ratelimit_v1]
algorithm = "fixed-window"

[policy_configurations.llm_cost_v1]
pricing_file = "/home/wso2/conf/llm-pricing/model_prices.json"

# =============================================================================
# ANALYTICS CONFIGURATION
# =============================================================================

[analytics]
enabled = true
allow_payloads = false
send_request_body = false
send_response_body = false
enabled_publishers = ["moesif"]

[analytics.publishers.moesif]
application_id = "test-application-id"
moesif_base_url = "http://mock-analytics-collector:8080"
publish_interval = 2
timer_wakeup_seconds = 1
