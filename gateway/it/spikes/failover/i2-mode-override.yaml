# PROBE E — ext_proc at the UPSTREAM position.
#
# Probe D used Lua, which proved the position runs per attempt but could not
# prove the policy engine can live there. The platform is introducing upstream
# and downstream policy types, so the upstream position must host ext_proc, not
# a failover-specific filter. This probe asks:
#
#   E1. Is ext_proc invoked once per RETRY ATTEMPT (Lua was; ext_proc is a
#       different filter with a gRPC round trip)?
#   E2. Do request_attributes carry PER-ATTEMPT target identity, or the first
#       attempt's? Lua exposed neither upstreamClusterName() nor upstreamHost(),
#       which forced an attempt-index workaround. If xds.cluster_name is correct
#       per attempt, that workaround can be deleted and every upstream policy
#       gets target identity for free.
#   E3. What does the extra gRPC round trip cost per attempt? This now sits in
#       the path of every request carrying an upstream policy, not just retries.
#
# NOTE mutation_rules.allow_all_routing below. ext_proc REFUSES to mutate :path,
# :method, :authority, :scheme or host unless it is set -- the mutation is
# silently dropped otherwise. Any upstream policy that re-points a request needs
# this, so it is a platform-level config decision, not a failover one.
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 9901 } } }
static_resources:
  listeners:
  - name: main
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: probe
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "ACCESSLOG cluster=%UPSTREAM_CLUSTER% attempts=%UPSTREAM_REQUEST_ATTEMPT_COUNT% status=%RESPONSE_CODE% total=%DURATION%ms\n"
          route_config:
            name: rc
            cluster_specifier_plugins:
            - extension:
                name: failover-groups
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.priority_group.v3.PriorityGroupClusterSpecifier
                  override_metadata_namespace: wso2.failover
                  priority_groups:
                  - name: rank-1
                    clusters: [ { cluster_name: provider_a, weight: 1 } ]
                  - name: rank-2
                    clusters: [ { cluster_name: provider_b, weight: 1 } ]
            virtual_hosts:
            - name: vh
              domains: ["*"]
              include_attempt_count_in_response: true
              include_request_attempt_count: true
              routes:
              - match: { prefix: "/" }
                route:
                  cluster_specifier_plugin: failover-groups
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset,retriable-status-codes"
                    retriable_status_codes: [429, 500, 503]
                    num_retries: 1
                    per_try_timeout: 5s
                    refresh_cluster_on_retry: true
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              upstream_http_filters:
              - name: envoy.filters.http.ext_proc
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                  grpc_service:
                    envoy_grpc: { cluster_name: extproc }
                  failure_mode_allow: false
                  allow_mode_override: true
                  processing_mode:
                    request_header_mode: SEND
                    response_header_mode: SKIP

                    response_body_mode: NONE
                    request_trailer_mode: SKIP
                    response_trailer_mode: SKIP
                  mutation_rules:
                    allow_all_routing: true
                  request_attributes:
                  - xds.cluster_name
                  - xds.route_name
                  - upstream.address
                  - request.path
              - name: envoy.filters.http.upstream_codec
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
  clusters:
  - name: extproc
    connect_timeout: 2s
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: extproc
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.20, port_value: 9000 } } } } ] } ]
  - name: provider_a
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_a
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.11, port_value: 8080 } } } } ] } ]
  - name: provider_b
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_b
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.12, port_value: 8080 } } } } ] } ]
