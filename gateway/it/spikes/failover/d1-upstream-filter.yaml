# PROBE D1 — does an UPSTREAM-position HTTP filter run once per retry attempt,
# and can it rewrite :path for that attempt?
#
# This is the question the IT run left open. The control plane already switches
# clusters correctly on retry, but every LlmProxy provider cluster is a loopback
# to the same socket: what actually selects a provider is the route's path
# rewrite, which is fixed per route and identical on every attempt. If a filter
# at the upstream position can re-point the path per attempt, the design holds.
# If it cannot, T021-T023 need a different approach entirely.
#
# Setup: provider_a always fails, provider_b is healthy. The downstream Lua
# filter stamps a marker so we can tell downstream invocations (expect 1) from
# upstream ones (expect 2). The upstream Lua filter rewrites :path to a
# per-cluster context, mimicking the provider-context rewrite the real gateway
# needs. The backend echoes the path it received, so the response proves which
# context each attempt actually used.
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 9901 } } }
static_resources:
  listeners:
  - name: main
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: probe
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "ACCESSLOG cluster=%UPSTREAM_CLUSTER% attempts=%UPSTREAM_REQUEST_ATTEMPT_COUNT% status=%RESPONSE_CODE%\n"
          route_config:
            name: rc
            cluster_specifier_plugins:
            - extension:
                name: failover-groups
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.priority_group.v3.PriorityGroupClusterSpecifier
                  override_metadata_namespace: wso2.failover
                  priority_groups:
                  - name: rank-1
                    clusters: [ { cluster_name: provider_a, weight: 1 } ]
                  - name: rank-2
                    clusters: [ { cluster_name: provider_b, weight: 1 } ]
            virtual_hosts:
            - name: vh
              domains: ["*"]
              include_attempt_count_in_response: true
              routes:
              - match: { prefix: "/" }
                route:
                  cluster_specifier_plugin: failover-groups
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset,retriable-status-codes"
                    retriable_status_codes: [429, 500, 503]
                    num_retries: 1
                    per_try_timeout: 5s
                    refresh_cluster_on_retry: true
          http_filters:
          # DOWNSTREAM position. Runs once per client request. Proves the
          # contrast: whatever this does cannot vary between attempts.
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(handle)
                    handle:logWarn("PROBE downstream-filter ran path=" .. handle:headers():get(":path"))
                    handle:headers():add("x-probe-downstream-ran", "1")
                  end
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              # UPSTREAM position. The whole point of the probe: Envoy is
              # documented to re-run this chain per retry attempt.
              upstream_http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      -- Q2: does a :path mutation from the upstream position take
                      -- effect for THIS attempt? Rewrite unconditionally and let the
                      -- backend echo prove it. Also probe which StreamInfo accessors
                      -- exist, since the real filter must learn the selected cluster.
                      local function try(name, fn)
                        local ok, res = pcall(fn)
                        handle:logWarn("PROBE api " .. name .. " ok=" .. tostring(ok) .. " val=" .. tostring(res))
                      end
                      function envoy_on_request(handle)
                        local path = handle:headers():get(":path")
                        local info = handle:streamInfo()
                        local ok1, v1 = pcall(function() return info:upstreamClusterName() end)
                        handle:logWarn("PROBE upstreamClusterName ok=" .. tostring(ok1) .. " val=" .. tostring(v1))
                        local ok2, v2 = pcall(function() return info:upstreamHost() end)
                        handle:logWarn("PROBE upstreamHost ok=" .. tostring(ok2) .. " val=" .. tostring(v2))
                        local ok3, v3 = pcall(function() return info:dynamicMetadata():get("envoy.lb") end)
                        handle:logWarn("PROBE dynamicMetadata ok=" .. tostring(ok3) .. " val=" .. tostring(v3))
                        -- Unconditional rewrite: a marker the backend will echo back.
                        local attempt = handle:headers():get("x-probe-attempt")
                        local n = 1
                        if attempt ~= nil then n = tonumber(attempt) + 1 end
                        handle:headers():replace("x-probe-attempt", tostring(n))
                        handle:headers():replace(":path", "/ctx-attempt-" .. tostring(n) .. path)
                        handle:logWarn("PROBE upstream-filter rewrote path -> /ctx-attempt-" .. tostring(n) .. path)
                      end
              - name: envoy.filters.http.upstream_codec
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
  clusters:
  - name: provider_a
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_a
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.11, port_value: 8080 } } } } ] } ]
  - name: provider_b
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_b
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.12, port_value: 8080 } } } } ] } ]
