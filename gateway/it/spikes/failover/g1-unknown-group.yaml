# PROBE B1/B2/B3 — priority_group cluster specifier (Envoy 1.40.0+).
# Providers keep their OWN clusters. A Lua filter plays the part of our policy:
# it reads x-failover-groups ("c,a,b") and writes the per-request group order
# into dynamic metadata namespace wso2.failover.
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 9901 } } }
static_resources:
  listeners:
  - name: main
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: probe
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "ACCESSLOG cluster=%UPSTREAM_CLUSTER% attempts=%UPSTREAM_REQUEST_ATTEMPT_COUNT% md=%DYNAMIC_METADATA(wso2.failover)%\n"
          route_config:
            name: rc
            cluster_specifier_plugins:
            - extension:
                name: failover-groups
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.priority_group.v3.PriorityGroupClusterSpecifier
                  override_metadata_namespace: wso2.failover
                  priority_groups:
                  - name: rank-1
                    clusters: [ { cluster_name: provider_a, weight: 1 } ]
                  - name: rank-2
                    clusters: [ { cluster_name: provider_b, weight: 1 } ]
                  - name: rank-3
                    clusters: [ { cluster_name: provider_c, weight: 1 } ]
            virtual_hosts:
            - name: vh
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster_specifier_plugin: failover-groups
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset,retriable-status-codes"
                    retriable_status_codes: [429, 500, 503]
                    num_retries: 2
                    per_try_timeout: 5s
                    refresh_cluster_on_retry: true
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  -- PROBE G: publish group NAMES verbatim, exactly as the real policy does.
                  -- The header may name a group the route never configured, which is what
                  -- happens when a routing policy ranks a target model-failover does not list.
                  function envoy_on_request(handle)
                    local hdr = handle:headers():get("x-failover-groups")
                    if hdr == nil or hdr == "" then return end
                    local groups = {}
                    local rank = 0
                    for name in string.gmatch(hdr, "[^,]+") do
                      rank = rank + 1
                      groups[rank] = { name = name }
                    end
                    if rank > 0 then
                      handle:streamInfo():dynamicMetadata():set(
                        "wso2.failover", "priority_groups", groups)
                      handle:clearRouteCache()
                      handle:logWarn("PROBE published " .. tostring(rank) .. " group names: " .. hdr)
                    end
                  end
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: provider_a
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_a
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.11, port_value: 8080 } } } } ] } ]
  - name: provider_b
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_b
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.12, port_value: 8080 } } } } ] } ]
  - name: provider_c
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_c
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.13, port_value: 8080 } } } } ] } ]
