# PROBE D2 — the real pattern, not just the mechanism.
#
# D1 proved the upstream filter runs per attempt and can rewrite :path. It also
# exposed two constraints that shape the implementation:
#
#   1. Header/path mutations ACCUMULATE across attempts. The upstream filter does
#      not see a pristine copy of the original request; it sees whatever the
#      previous attempt left behind. D1's naive prefix produced
#      "/ctx-attempt-2/ctx-attempt-1/chat/completions". So the rewrite must be
#      computed from an IMMUTABLE source, never from the current :path.
#   2. StreamInfo at the upstream position exposes neither upstreamClusterName()
#      nor upstreamHost(), so the filter cannot ask which cluster was selected.
#      It must derive the target from the attempt NUMBER plus the chain the
#      downstream filter already published.
#
# This probe implements the resulting pattern: the downstream filter stashes the
# original path and the ordered chain in dynamic metadata; the upstream filter
# reads x-envoy-attempt-count (via include_attempt_count_in_request), indexes the
# chain, and REPLACES the path built from the stashed original.
admin: { address: { socket_address: { address: 0.0.0.0, port_value: 9901 } } }
static_resources:
  listeners:
  - name: main
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: probe
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "ACCESSLOG cluster=%UPSTREAM_CLUSTER% attempts=%UPSTREAM_REQUEST_ATTEMPT_COUNT% status=%RESPONSE_CODE%\n"
          route_config:
            name: rc
            cluster_specifier_plugins:
            - extension:
                name: failover-groups
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.priority_group.v3.PriorityGroupClusterSpecifier
                  override_metadata_namespace: wso2.failover
                  priority_groups:
                  - name: rank-1
                    clusters: [ { cluster_name: provider_a, weight: 1 } ]
                  - name: rank-2
                    clusters: [ { cluster_name: provider_b, weight: 1 } ]
            virtual_hosts:
            - name: vh
              domains: ["*"]
              include_attempt_count_in_response: true
              # Makes x-envoy-attempt-count visible to the UPSTREAM filter, which
              # is the only way it can tell which attempt it is serving.
              include_request_attempt_count: true
              routes:
              - match: { prefix: "/" }
                route:
                  cluster_specifier_plugin: failover-groups
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset,retriable-status-codes"
                    retriable_status_codes: [429, 500, 503]
                    num_retries: 1
                    per_try_timeout: 5s
                    refresh_cluster_on_retry: true
          http_filters:
          # Stands in for the model-failover policy: runs ONCE, publishes the
          # chain and stashes the original path for the per-attempt filter.
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(handle)
                    local path = handle:headers():get(":path")
                    handle:streamInfo():dynamicMetadata():set(
                      "wso2.failover", "original_path", path)
                    handle:streamInfo():dynamicMetadata():set(
                      "wso2.failover", "contexts", { "/ctx-a", "/ctx-b" })
                    handle:streamInfo():dynamicMetadata():set(
                      "wso2.failover", "priority_groups", {
                        { name = "rank-1", clusters = { { cluster_name = "provider_a", weight = 1 } } },
                        { name = "rank-2", clusters = { { cluster_name = "provider_b", weight = 1 } } },
                      })
                    handle:clearRouteCache()
                    handle:logWarn("PROBE downstream published chain, original_path=" .. path)
                  end
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              upstream_http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(handle)
                        local md = handle:streamInfo():dynamicMetadata():get("wso2.failover")
                        if md == nil or md["original_path"] == nil then
                          handle:logWarn("PROBE upstream: no chain published, leaving request alone")
                          return
                        end
                        -- Envoy's own attempt counter: 1 on the first try.
                        local attempt = tonumber(handle:headers():get("x-envoy-attempt-count")) or 1
                        local ctx = md["contexts"][attempt]
                        if ctx == nil then
                          handle:logWarn("PROBE upstream: attempt " .. attempt .. " beyond chain, leaving path")
                          return
                        end
                        -- Built from the STASHED original, never from the current
                        -- :path, which already carries the previous attempt's edit.
                        local rewritten = ctx .. md["original_path"]
                        handle:headers():replace(":path", rewritten)
                        handle:logWarn("PROBE upstream attempt=" .. attempt .. " -> " .. rewritten)
                      end
              - name: envoy.filters.http.upstream_codec
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
  clusters:
  - name: provider_a
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_a
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.11, port_value: 8080 } } } } ] } ]
  - name: provider_b
    connect_timeout: 2s
    type: STATIC
    load_assignment:
      cluster_name: provider_b
      endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: 172.28.0.12, port_value: 8080 } } } } ] } ]
