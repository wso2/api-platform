package: management
output: pkg/api/management/generated.go
generate:
  std-http-server: true
  models: true
  embedded-spec: true
  strict-server: false
output-options:
  yaml-tags: true
  # The health and readiness operations are documented in the spec but served by
  # the controller's health handler in front of authentication (cmd/controller), so
  # the generated router must not register them behind the management middlewares.
  exclude-operation-ids:
    - getManagementHealth
    - getManagementReady
