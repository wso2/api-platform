apiVersion: gateway.api-platform.wso2.com/v1
kind: LlmProviderTemplate
metadata:
  name: typesafe
spec:
  displayName: TypeSafe
  groupId: wso2-typesafe
  managedBy: wso2
  version: v1.0
  # TypeSafe's /v1/systemone endpoint returns usage.input_tokens and
  # usage.output_tokens only; there is no total and no rate-limit header, so
  # totalTokens and remainingTokens are intentionally omitted.
  promptTokens:
    location: payload
    identifier: $.usage.input_tokens
  completionTokens:
    location: payload
    identifier: $.usage.output_tokens
  requestModel:
    location: payload
    identifier: $.model
  # The response reports the versioned model ID (e.g. jev-1.13.0) even when the
  # request used an alias such as jev-latest.
  responseModel:
    location: payload
    identifier: $.model
