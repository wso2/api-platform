apiVersion: gateway.api-platform.wso2.com/v1
kind: LlmProviderTemplate
metadata:
  name: azureai-foundry
spec:
  displayName: Azure AI Foundry
  groupId: wso2-azureai-foundry
  managedBy: wso2
  version: v1.0
  promptTokens:
    location: payload
    identifier: $.usage.prompt_tokens
  completionTokens:
    location: payload
    identifier: $.usage.completion_tokens
  totalTokens:
    location: payload
    identifier: $.usage.total_tokens
    fallbackIdentifiers:
      - $.response.usage.total_tokens
  remainingTokens:
    location: header
    identifier: x-ratelimit-remaining-tokens
  requestModel:
    location: payload
    identifier: $.model
  responseModel:
    location: payload
    identifier: $.model
    fallbackIdentifiers:
      - $.response.model
  cachedTokens:
    location: payload
    identifier: $.usage.prompt_tokens_details.cached_tokens
    fallbackIdentifiers:
      # Assistants thread runs spell it singular.
      - $.usage.prompt_token_details.cached_tokens
  # GPT-5.6 and later report cache writes inside prompt_tokens, billed above input.
  cacheWriteTokens:
    location: payload
    identifier: $.usage.prompt_tokens_details.cache_write_tokens
  reasoningTokens:
    location: payload
    identifier: $.usage.completion_tokens_details.reasoning_tokens
  audioInputTokens:
    location: payload
    identifier: $.usage.prompt_tokens_details.audio_tokens
  audioOutputTokens:
    location: payload
    identifier: $.usage.completion_tokens_details.audio_tokens
  serviceTier:
    location: payload
    identifier: $.service_tier
    fallbackIdentifiers:
      - $.response.service_tier
    valueMap:
      priority: priority
  cacheAccounting: inclusive
  resourceMappings:
    resources:
      # A streamed response nests the whole document under "response".
      - resource: /responses
        promptTokens:
          location: payload
          identifier: $.usage.input_tokens
          fallbackIdentifiers:
            - $.response.usage.input_tokens
        completionTokens:
          location: payload
          identifier: $.usage.output_tokens
          fallbackIdentifiers:
            - $.response.usage.output_tokens
        cachedTokens:
          location: payload
          identifier: $.usage.input_tokens_details.cached_tokens
          fallbackIdentifiers:
            - $.response.usage.input_tokens_details.cached_tokens
        cacheWriteTokens:
          location: payload
          identifier: $.usage.input_tokens_details.cache_write_tokens
          fallbackIdentifiers:
            - $.response.usage.input_tokens_details.cache_write_tokens
        reasoningTokens:
          location: payload
          identifier: $.usage.output_tokens_details.reasoning_tokens
          fallbackIdentifiers:
            - $.response.usage.output_tokens_details.reasoning_tokens
      # The same API reached with the resource root as the upstream, which a
      # provider serving Claude needs.
      - resource: /openai/v1/responses
        promptTokens:
          location: payload
          identifier: $.usage.input_tokens
          fallbackIdentifiers:
            - $.response.usage.input_tokens
        completionTokens:
          location: payload
          identifier: $.usage.output_tokens
          fallbackIdentifiers:
            - $.response.usage.output_tokens
        cachedTokens:
          location: payload
          identifier: $.usage.input_tokens_details.cached_tokens
          fallbackIdentifiers:
            - $.response.usage.input_tokens_details.cached_tokens
        cacheWriteTokens:
          location: payload
          identifier: $.usage.input_tokens_details.cache_write_tokens
          fallbackIdentifiers:
            - $.response.usage.input_tokens_details.cache_write_tokens
        reasoningTokens:
          location: payload
          identifier: $.usage.output_tokens_details.reasoning_tokens
          fallbackIdentifiers:
            - $.response.usage.output_tokens_details.reasoning_tokens
      # Claude is served only on the Anthropic Messages API, whose input_tokens
      # exclude cache reads and writes; a stream nests usage under "message".
      - resource: /anthropic/v1/messages
        promptTokens:
          location: payload
          identifier: $.usage.input_tokens
          fallbackIdentifiers:
            - $.message.usage.input_tokens
        completionTokens:
          location: payload
          identifier: $.usage.output_tokens
          fallbackIdentifiers:
            - $.message.usage.output_tokens
        responseModel:
          location: payload
          identifier: $.model
          fallbackIdentifiers:
            - $.message.model
        cachedTokens:
          location: payload
          identifier: $.usage.cache_read_input_tokens
          fallbackIdentifiers:
            - $.message.usage.cache_read_input_tokens
        cacheWriteTokens:
          location: payload
          identifier: $.usage.cache_creation.ephemeral_5m_input_tokens
          fallbackIdentifiers:
            - $.message.usage.cache_creation.ephemeral_5m_input_tokens
            # The TTL breakdown is optional; the flat total keeps the tokens billed.
            - $.usage.cache_creation_input_tokens
            - $.message.usage.cache_creation_input_tokens
        cacheWrite1hTokens:
          location: payload
          identifier: $.usage.cache_creation.ephemeral_1h_input_tokens
          fallbackIdentifiers:
            - $.message.usage.cache_creation.ephemeral_1h_input_tokens
        reasoningTokens:
          location: payload
          identifier: $.usage.output_tokens_details.thinking_tokens
          fallbackIdentifiers:
            - $.message.usage.output_tokens_details.thinking_tokens
        serviceTier:
          location: payload
          identifier: $.usage.service_tier
          fallbackIdentifiers:
            - $.message.usage.service_tier
          valueMap:
            priority: priority
        cacheAccounting: additive
