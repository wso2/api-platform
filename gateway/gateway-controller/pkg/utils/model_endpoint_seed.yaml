# The transformer entries the provisioned default model endpoint ("wso2", an OpenAI
# endpoint) is created with. Written once, when the endpoint is first created; from
# then on they are the operator's configuration and an upgrade never rewrites them.
# OpenAI providers need no entry: they already speak the endpoint's format.
#
# No entry names a version: the provisioner writes the major version of the policy
# this gateway build has loaded, and leaves out an entry whose policy is not loaded.
transformers:
  - template: azure-openai
    type: openai-to-azure-openai-transformer
    params:
      apiVersion: "{apiVersion}"
      pathSuffix: /chat/completions
    upstreamPaths:
      - "/openai/deployments/{upstreamModel}/chat/completions"
  - template: anthropic
    type: openai-to-anthropic-transformer
    params:
      anthropicVersion: "{apiVersion:2023-06-01}"
    upstreamPaths:
      - /v1/messages
  - template: gemini
    type: openai-to-gemini-transformer
    params:
      apiVersion: "{apiVersion:v1beta}"
    upstreamPaths:
      - "/{apiVersion:v1beta}/models/{upstreamModel}:generateContent"
      - "/{apiVersion:v1beta}/models/{upstreamModel}:streamGenerateContent"
  - template: awsbedrock
    type: openai-to-bedrock-transformer
    upstreamPaths:
      - "/model/{upstreamModel}/converse"
      - "/model/{upstreamModel}/converse-stream"
  - template: mistralai
    type: openai-to-mistral-transformer
    upstreamPaths:
      - /v1/chat/completions
