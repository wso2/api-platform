openapi: 3.0.3
info:
  title: Gateway Controller Admin API
  description: |
    Admin/debug API for Gateway Controller.

    These endpoints are served on the dedicated admin server port (default: 9092).

    All endpoints except the health probe require HTTP Basic authentication using
    the same credentials configured for the management API (`controller.auth.basic`),
    and the authenticated user must additionally hold the `admin` role. Both the
    versioned `/api/admin/v1/health` path and its legacy `/health` alias are
    intentionally left unauthenticated
  version: 1.0.0
  contact:
    name: WSO2 API Platform Team
servers:
  - url: http://localhost:9092/api/admin/v1
    description: Local development admin server
  - url: http://gateway-controller:9092/api/admin/v1
    description: Docker/Kubernetes admin server

paths:
  /config_dump:
    get:
      summary: Dump current configuration state
      description: |
        Retrieve the complete current state of the Gateway Controller including:
        - All deployed API configurations
        - All loaded policy definitions
        - All registered certificates
        - System status and metadata
      operationId: getConfigDump
      tags:
        - System
      security:
        - basicAuth: []
      responses:
        "200":
          description: Complete configuration dump
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDumpResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "403":
          description: Authenticated user lacks the required admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      summary: Health check
      description: |
        Returns the health status of the gateway controller, including whether its
        database is reachable. Each dependency is reported under `checks`; a failing
        check carries only a generic reason. The result is cached for a few seconds.
        This endpoint is exempt from both authentication and the IP whitelist so
        that Docker and Kubernetes health probes can reach it. The exemption
        applies to both this versioned path and the legacy `/health` alias.
      operationId: getHealth
      tags:
        - System
      security: []
      responses:
        "200":
          description: Gateway controller is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Gateway controller is unhealthy; at least one check is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /xds_sync_status:
    get:
      summary: Get xDS policy sync status
      description: |
        Returns the current policy chain xDS version produced by the gateway controller.
      operationId: getXDSSyncStatus
      tags:
        - System
      security:
        - basicAuth: []
      responses:
        "200":
          description: Current controller xDS policy sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XDSSyncStatusResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "403":
          description: Authenticated user lacks the required admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

security:
  - basicAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication using the credentials configured under
        `controller.auth.basic`. The authenticated user must also hold the
        `admin` role. Applies to every admin endpoint except the health probe.
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
        message:
          type: string

    UnauthorizedResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 'Error code, e.g. "authentication_failed".'
        message:
          type: string
      example:
        code: authentication_failed
        message: authentication failed

    ForbiddenResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 'Error code, e.g. "forbidden".'
        message:
          type: string
      example:
        code: forbidden
        message: forbidden

    CertificateResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        issuer:
          type: string
        notAfter:
          type: string
          format: date-time
        count:
          type: integer
        status:
          type: string

    ConfigDumpAPIItem:
      type: object
      description: API item in config dump response
      properties:
        id:
          type: string
          format: uuid
        configuration:
          type: object
          additionalProperties: true
        metadata:
          $ref: "#/components/schemas/ConfigDumpAPIMetadata"

    ConfigDumpAPIMetadata:
      type: object
      description: Metadata for API in config dump
      properties:
        status:
          type: string
          enum:
            - pending
            - deployed
            - failed
            - undeployed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deployedAt:
          type: string
          format: date-time

    ConfigDumpXDSSync:
      type: object
      description: xDS sync metadata included in config dump
      properties:
        policy_chain_version:
          type: string
          description: Latest policy chain version published by the controller

    ConfigDumpResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        apis:
          type: array
          items:
            $ref: "#/components/schemas/ConfigDumpAPIItem"
        policies:
          type: array
          items:
            type: object
            additionalProperties: true
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/CertificateResponse"
        statistics:
          type: object
          properties:
            totalApis:
              type: integer
            totalPolicies:
              type: integer
            totalCertificates:
              type: integer
            totalCertificateBytes:
              type: integer
        xds_sync:
          $ref: "#/components/schemas/ConfigDumpXDSSync"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Health status ("healthy" when every check is up, otherwise "unhealthy")
        component:
          type: string
          description: The reporting component
          example: gateway-controller
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
        checks:
          type: object
          description: Result of each dependency check, keyed by check name (for example `database`)
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"

    HealthCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [up, down]
          description: Whether the dependency is usable
        error:
          type: string
          description: Generic reason the check is down; present only when down
        since:
          type: string
          format: date-time
          description: When the check started failing; present only when down

    XDSSyncStatusResponse:
      type: object
      properties:
        component:
          type: string
        timestamp:
          type: string
          format: date-time
        policy_chain_version:
          type: string
          description: Latest policy chain version published by the controller

tags:
  - name: System
    description: System health and status endpoints
