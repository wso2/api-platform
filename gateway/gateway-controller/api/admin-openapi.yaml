openapi: 3.0.3
info:
  title: Gateway Controller Admin API
  description: |
    Admin/debug API for Gateway Controller.

    These endpoints are served on the dedicated admin server port (default: 9092).

    All endpoints except the health probe require HTTP Basic authentication using
    the same credentials configured for the management API (`controller.auth.basic`),
    and the authenticated user must additionally hold the `admin` role. Both the
    versioned `/api/admin/v1/health` path and its legacy `/health` alias are
    intentionally left unauthenticated
  version: 1.0.0
  contact:
    name: WSO2 API Platform Team
servers:
  - url: http://localhost:9092/api/admin/v1
    description: Local development admin server
  - url: http://gateway-controller:9092/api/admin/v1
    description: Docker/Kubernetes admin server

paths:
  /mcp:
    post:
      summary: Administrative Model Context Protocol endpoint
      description: |
        Single MCP endpoint (Streamable HTTP, MCP 2026-07-28) exposing read-only
        gateway status and configuration-dump tools to MCP clients.
      operationId: handleAdminMcp
      tags:
        - MCP
      security:
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        description: A single JSON-RPC 2.0 message.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Body was not a single JSON-RPC message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            Missing or invalid credentials. Carries a `WWW-Authenticate: Bearer`
            challenge naming the protected resource metadata document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "403":
          description: |
            The caller lacks the required role, or lacks a scope required by the
            requested tool. Carries an RFC 6750 `insufficient_scope` challenge so
            a client can step up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenResponse"
        "404":
          description: The MCP endpoint is not enabled on this gateway.
        "413":
          description: Request body exceeds the configured maximum size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /config_dump:
    get:
      summary: Dump current configuration state
      description: |
        Retrieve the complete current state of the Gateway Controller including:
        - All deployed API configurations
        - All loaded policy definitions
        - All registered certificates
        - System status and metadata
      operationId: getConfigDump
      tags:
        - System
      security:
        - basicAuth: []
      responses:
        "200":
          description: Complete configuration dump
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigDumpResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "403":
          description: Authenticated user lacks the required admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      summary: Health check
      description: |
        Returns the health status of the gateway controller.
        This endpoint is exempt from both authentication and the IP whitelist so
        that Docker and Kubernetes health probes can reach it. The exemption
        applies to both this versioned path and the legacy `/health` alias.
      operationId: getHealth
      tags:
        - System
      security: []
      responses:
        "200":
          description: Gateway controller is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /xds_sync_status:
    get:
      summary: Get xDS policy sync status
      description: |
        Returns the current policy chain xDS version produced by the gateway controller.
      operationId: getXDSSyncStatus
      tags:
        - System
      security:
        - basicAuth: []
      responses:
        "200":
          description: Current controller xDS policy sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XDSSyncStatusResponse"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "403":
          description: Authenticated user lacks the required admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

security:
  - basicAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth 2.0 bearer token validated against `controller.auth.idp`. The admin
        server shares the management API's authentication middleware, so a JWT is
        accepted on every admin endpoint; it is named explicitly here because the
        MCP endpoint is an OAuth protected resource and its challenges assume it.
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication using the credentials configured under
        `controller.auth.basic`. The authenticated user must also hold the
        `admin` role. Applies to every admin endpoint except the health probe.
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
        message:
          type: string

    UnauthorizedResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 'Error code, e.g. "authentication_failed".'
        message:
          type: string
      example:
        code: authentication_failed
        message: authentication failed

    ForbiddenResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 'Error code, e.g. "forbidden".'
        message:
          type: string
      example:
        code: forbidden
        message: forbidden

    CertificateResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subject:
          type: string
        issuer:
          type: string
        notAfter:
          type: string
          format: date-time
        count:
          type: integer
        status:
          type: string

    ConfigDumpAPIItem:
      type: object
      description: API item in config dump response
      properties:
        id:
          type: string
          format: uuid
        configuration:
          type: object
          additionalProperties: true
        metadata:
          $ref: "#/components/schemas/ConfigDumpAPIMetadata"

    ConfigDumpAPIMetadata:
      type: object
      description: Metadata for API in config dump
      properties:
        status:
          type: string
          enum:
            - pending
            - deployed
            - failed
            - undeployed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deployedAt:
          type: string
          format: date-time

    ConfigDumpXDSSync:
      type: object
      description: xDS sync metadata included in config dump
      properties:
        policy_chain_version:
          type: string
          description: Latest policy chain version published by the controller

    ConfigDumpResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        apis:
          type: array
          items:
            $ref: "#/components/schemas/ConfigDumpAPIItem"
        policies:
          type: array
          items:
            type: object
            additionalProperties: true
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/CertificateResponse"
        statistics:
          type: object
          properties:
            totalApis:
              type: integer
            totalPolicies:
              type: integer
            totalCertificates:
              type: integer
            totalCertificateBytes:
              type: integer
        xds_sync:
          $ref: "#/components/schemas/ConfigDumpXDSSync"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Health status ("healthy")
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check

    XDSSyncStatusResponse:
      type: object
      properties:
        component:
          type: string
        timestamp:
          type: string
          format: date-time
        policy_chain_version:
          type: string
          description: Latest policy chain version published by the controller

tags:
  - name: System
    description: System health and status endpoints
