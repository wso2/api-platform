name: wso2_apip_sys_budget
version: v1.0.0
description: |
  Enforces budgets: spend limits on LLM traffic. Placed by the gateway controller, never by
  an API author, the way llm-cost-based-ratelimit sits: after authentication and just
  before the policy that prices the response. It runs on every LLM provider route and on
  every LLM proxy route with one provider, the first hop a request enters, so it sees the
  caller; the controller adds llm-cost to these routes when they do not price responses.

  The active budgets reach the policy engine as lazy resources of type Budget. For each
  request the policy finds the budgets that cover it (every filter, no exemption) and the
  usage each one charges (one per value of its limit.splitBy). A filter or split is an
  LLM provider, an attribute (a CEL expression), a project, an agent (with its project) or
  an API key: the project of an
  agent's hidden LLM proxy route is the route's project ID, its agent this policy's agent
  parameter, and the API key's
  name from the key the request authenticated with. In the request-header phase it refuses
  with 429, a throttling fault (code 900806), when a Block budget's usage has spent its block point
  (amount x blockAt %). Allow budgets never refuse. It never reads a body.

  When the response ends it charges the cost llm-cost published (x-llm-cost) to every
  usage it matched, in the period the request was admitted in; a request without a
  calculated cost is charged $0 and counted as unpriced. A request an LLM proxy route
  evaluated is stamped with the controller's admitted token, and the provider route it is
  forwarded to skips it and removes the stamp, so it is counted once.

parameters:
  type: object
  additionalProperties: false
  properties:
    agent:
      type: string
      description: The agent whose hidden LLM proxy route this is.
    role:
      type: string
      enum: [proxy, provider]
      description: proxy on an LLM proxy route, provider on an LLM provider route.
    admittedToken:
      type: string
      description: The controller's secret a proxy route stamps a request with and a provider route checks.

systemParameters:
  type: object
  properties: {}
