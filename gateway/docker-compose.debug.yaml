# NOTE: gateway-controller and gateway-runtime here duplicate docker-compose.yaml — keep in sync.

services:
  gateway-controller:
    image: ghcr.io/wso2/api-platform/gateway-controller-debug:latest
    command: ["-config", "/etc/gateway-controller/config.toml"]
    ports:
      - "9090:9090"   # REST API
      - "9094:9092"   # Admin API
      - "18000:18000" # xDS gRPC (Router)
      - "18001:18001" # xDS gRPC (Policy Engine)
      - "9011:9091"   # Metrics
      - "2345:2345"   # dlv remote debug port
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    volumes:
      - controller-data:/app/data
      - ./configs/config.toml:/etc/gateway-controller/config.toml:ro
      - ./gateway-controller/certificates:/app/certificates
      - ./gateway-controller/listener-certs:/app/listener-certs:ro
      - ./gateway-controller/xds-certs:/app/xds-certs:ro  # Read-only mTLS dev CA/server cert for the two xDS servers (server.xds_tls, policy_server.tls)
      - ./gateway-controller/aesgcm-keys/default-aesgcm256-v1.bin:/app/data/aesgcm-keys/default-aesgcm256-v1.bin:ro  # AES-256 at-rest encryption key (generated by scripts/setup.sh)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-network
    cap_add:
      - SYS_PTRACE    # required by dlv for process introspection
    security_opt:
      - seccomp:unconfined   # dlv uses syscalls blocked by the default seccomp profile

  gateway-runtime:
    image: ghcr.io/wso2/api-platform/gateway-runtime-debug:latest
    command: ["--pol.config", "/etc/policy-engine/config.toml"]
    ports:
      # Router (Envoy)
      - "8080:8080"   # HTTP ingress
      - "8443:8443"   # HTTPS ingress
      - "8081:8081"   # xDS-managed API listener
      - "8082:8082"   # WebSub Hub dynamic forward proxy
      - "8083:8083"   # WebSub Hub internal listener
      - "9901:9901"   # Envoy admin
      # Policy Engine
      - "9002:9002"   # Admin API
      - "9003:9003"   # Metrics
      - "2346:2346"   # dlv remote debug port
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    environment:
      - GATEWAY_CONTROLLER_HOST=gateway-controller
      - LOG_LEVEL=info
      # Envoy admin is disabled by default in the image; enabled here for local
      # dev convenience since the port is already mapped to the host above.
      - ROUTER_ADMIN_ENABLED=true
      # Mutual TLS for the Router's (Envoy's) connection to gateway-controller's
      # main xDS server -- must match controller.server.xds_tls.enabled in
      # configs/config.toml (shared with gateway-controller above). Entirely
      # self-contained to this container: gateway-controller never needs to
      # know these paths -- SDS/secret delivery rides the same ADS stream
      # this bootstrap cluster already opens, so there's no second,
      # controller-side copy of this TLS material to keep in sync.
      - XDS_TLS_ENABLED=true
      - XDS_CLIENT_CERT_PATH=/etc/xds-certs/envoy-client.crt
      - XDS_CLIENT_KEY_PATH=/etc/xds-certs/envoy-client.key
      - XDS_CLIENT_CA_PATH=/etc/xds-certs/ca.crt
      - XDS_CLIENT_TLS_MIN_VERSION=TLS1_2
      - XDS_CLIENT_TLS_MAX_VERSION=TLS1_3
      # TLS 1.2 fallback suites only (BoringSSL/Envoy naming) -- forward-secret
      # (ECDHE) + AEAD (AES-GCM/ChaCha20-Poly1305) only, 256-bit and
      # ChaCha20 ordered ahead of AES-128 per post-quantum-cryptography.md
      # directive 1. X25519MLKEM768 itself is a TLS 1.3 key-share group
      # negotiated via XDS_CLIENT_TLS_ECDH_CURVES below regardless of this
      # list -- TLS 1.3's own cipher suites are fixed and not configurable.
      - XDS_CLIENT_TLS_CIPHERS=ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-ECDSA-CHACHA20-POLY1305,ECDHE-RSA-CHACHA20-POLY1305,ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256
      - XDS_CLIENT_TLS_ECDH_CURVES=X25519,P-256,X25519MLKEM768
      # Mutual TLS for the Policy Engine's (a subprocess of this same
      # container's entrypoint) connection to gateway-controller's policy
      # xDS server -- matches controller.policy_server.tls.enabled in
      # configs/config.toml. Read by that file's [policy_engine.xds.tls] via
      # {{ env }} interpolation, not by docker-entrypoint.sh -- distinct
      # POLICY_ENGINE_XDS_CLIENT_* names because this leg presents a
      # different client identity than Envoy's XDS_CLIENT_* cert above.
      # No POLICY_ENGINE_XDS_TLS_ENABLED here: unset, it inherits
      # XDS_TLS_ENABLED above (=true), which is what we want since both legs
      # run mTLS in this profile -- set it explicitly only to diverge from
      # Envoy's setting (see distribution/docker-compose.yaml).
      - POLICY_ENGINE_XDS_CLIENT_CERT_PATH=/etc/policy-engine/xds-certs/policy-engine-client.crt
      - POLICY_ENGINE_XDS_CLIENT_KEY_PATH=/etc/policy-engine/xds-certs/policy-engine-client.key
      - POLICY_ENGINE_XDS_CLIENT_CA_PATH=/etc/policy-engine/xds-certs/ca.crt
      - POLICY_ENGINE_XDS_CLIENT_TLS_ECDH_CURVES=X25519MLKEM768
    volumes:
      - ./configs/config.toml:/etc/policy-engine/config.toml:ro
      - ./gateway-controller/xds-certs:/etc/xds-certs:ro  # Envoy's xDS mTLS client cert/key + CA (env vars above)
      - ./gateway-controller/xds-certs:/etc/policy-engine/xds-certs:ro  # Policy-engine's xDS mTLS client cert/key + CA (POLICY_ENGINE_XDS_CLIENT_* env vars above)
    networks:
      - gateway-network
    cap_add:
      - SYS_PTRACE    # required by dlv for process introspection
    security_opt:
      - seccomp:unconfined   # dlv uses syscalls blocked by the default seccomp profile

volumes:
  controller-data:
    driver: local

networks:
  gateway-network:
    driver: bridge
