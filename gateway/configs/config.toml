[analytics]
enabled = true
enabled_publishers = ["moesif"]

[analytics.publishers.moesif]
application_id = '{{ env "APIP_GW_ANALYTICS_PUBLISHERS_MOESIF_APPLICATION_ID" "<your-moesif-application-id>" }}'

[router]
gateway_host = "*"

# Gateway-wide shared Redis client (sdk/core/utils/redisclient.Shared()) —
# deliberately a top-level section, not nested under [policy_configurations],
# since it's shared infrastructure any policy can fall back to, not a
# per-policy setting. Backs oauth2-generator's cacheStrategy: redis when a
# provider doesn't set its own systemParameters.redis.host override (see
# dev-policies/oauth2-generator/policy-definition.yaml and e2e/TESTING.md
# Part C / E.10 / E.14 / E.29 / E.30). Only takes effect when the stack is
# started with `docker compose --profile redis up -d ... redis`
# (docker-compose.yaml) — harmless if that service isn't running and no
# policy on this gateway ever resolves a Redis client.
[redis]
host = "redis"

# advanced-ratelimit's systemParameters — operator/gateway-wide, resolved via
# ${config.policy_configurations.ratelimit_v1.*} in
# dev-policies/advanced-ratelimit/policy-definition.yaml, uniform across
# every advanced-ratelimit instance (not something a policy attachment's
# params can override per-API). backend defaults to "memory" (no Redis
# involved at all) so this section is a no-op until explicitly opted into.
# redis.host has no default here either — unset means "use the gateway-wide
# [redis] section above", never a silent policy-level connection. Overridden
# per-phase by dev-policies/advanced-ratelimit/e2e/run-e2e.sh via
# gateway/api-platform.env to prove override precedence against the
# redis-override-test service (docker-compose.yaml).
[policy_configurations.ratelimit_v1]
backend = '{{ env "APIP_GW_RATELIMIT_V1_BACKEND" "memory" }}'

[policy_configurations.ratelimit_v1.redis]
host = '{{ env "APIP_GW_RATELIMIT_V1_REDIS_HOST" "" }}'
port = '{{ env "APIP_GW_RATELIMIT_V1_REDIS_PORT" "6379" }}'
failure_mode = '{{ env "APIP_GW_RATELIMIT_V1_REDIS_FAILURE_MODE" "open" }}'

[router.access_logs]
enabled = true

[controller.server]
gateway_id = '{{ env "APIP_GW_CONTROLLER_SERVER_GATEWAY_ID" "platform-gateway-id" }}'

[controller.storage]
type = '{{ env "APIP_GW_CONTROLLER_STORAGE_TYPE" "sqlite" }}'

[controller.storage.sqlite]
path = '{{ env "APIP_GW_CONTROLLER_STORAGE_SQLITE_PATH" "./data/gateway.db" }}'

[policy_engine.logging]
level = "info"

[controller.logging]
level = '{{ env "APIP_GW_CONTROLLER_LOGGING_LEVEL" "info" }}'

[controller.controlplane]
host = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_HOST" "" }}'
token = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_TOKEN" "" }}'
insecure_skip_verify = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_INSECURE_SKIP_VERIFY" "true" }}'
gateway_name = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_GATEWAY_NAME" "default" }}'
apim_oauth2_client_id = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_APIM_OAUTH2_CLIENT_ID" "" }}'
apim_oauth2_client_secret = '{{ env "APIP_GW_CONTROLLER_CONTROLPLANE_APIM_OAUTH2_CLIENT_SECRET" "" }}'

[controller.policies]
definitions_path = '{{ env "APIP_GW_CONTROLLER_POLICIES_DEFINITIONS_PATH" "./default-policies" }}'

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username        = '{{ env "APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_USERNAME" "" }}'
password        = '{{ env "APIP_GW_CONTROLLER_AUTH_BASIC_ADMIN_PASSWORD_HASH" "" }}'
password_hashed = true
roles           = ["admin"]
