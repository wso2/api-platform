services:
  gateway-controller:
    image: ghcr.io/wso2/api-platform/gateway-controller:1.2.0-SNAPSHOT
    mem_limit: 60m
    mem_reservation: 60m
    cpus: 0.025
    command: ["-config", "/etc/gateway-controller/config.toml"]
    ports:
      - "9090:9090"   # REST API
      - "9094:9092"   # Admin API
      - "9011:9091"   # Metrics
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    volumes:
      - controller-data:/app/data
      - ./configs/config.toml:/etc/gateway-controller/config.toml:ro
      - ./resources/certificates:/app/certificates
      - ./resources/listener-certs:/app/listener-certs:ro
      - ./resources/xds-certs:/app/xds-certs:ro  # Read-only mTLS dev CA/server cert for the two xDS servers (server.xds_tls, policy_server.tls)
      - ./resources/aesgcm-keys/default-aesgcm256-v1.bin:/app/data/aesgcm-keys/default-aesgcm256-v1.bin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-network

  gateway-runtime:
    image: ghcr.io/wso2/api-platform/gateway-runtime:1.2.0-SNAPSHOT
    mem_limit: 180m
    mem_reservation: 180m
    cpus: 0.175
    command: ["--pol.config", "/etc/policy-engine/config.toml"]
    ports:
      # Router (Envoy)
      - "8080:8080"   # HTTP ingress
      - "8443:8443"   # HTTPS ingress
      - "8081:8081"   # xDS-managed API listener
      - "9901:9901"   # Envoy admin
      # Policy Engine
      - "9002:9002"   # Admin API
      - "9003:9003"   # Metrics
    env_file:
      - path: api-platform.env
        required: true
        format: raw
    environment:
      - GATEWAY_CONTROLLER_HOST=gateway-controller
      # Envoy admin is disabled by default in the image; enabled here for local
      # dev convenience since the port is already mapped to the host above.
      - ROUTER_ADMIN_ENABLED=true
      # Mutual TLS for the Router's (Envoy's) connection to gateway-controller's
      # main xDS server -- off by default (plaintext), matching
      # controller.server.xds_tls.enabled=false in configs/config.toml.
      - XDS_TLS_ENABLED=false
      - XDS_CLIENT_CERT_PATH=/etc/xds-certs/envoy-client.crt
      - XDS_CLIENT_KEY_PATH=/etc/xds-certs/envoy-client.key
      - XDS_CLIENT_CA_PATH=/etc/xds-certs/ca.crt
      # Classical curves only by default -- prepend "X25519MLKEM768" (FIPS 203
      # ML-KEM-768 + X25519) once gateway-controller's server.xds_tls.ecdh_curves
      # is updated to match, confirming the deployed Envoy/BoringSSL build
      # supports the group.
      - XDS_CLIENT_TLS_MIN_VERSION=TLS1_2
      - XDS_CLIENT_TLS_MAX_VERSION=TLS1_3
      - XDS_CLIENT_TLS_CIPHERS=
      - XDS_CLIENT_TLS_ECDH_CURVES=X25519,P-256
      # Mutual TLS for the Policy Engine's (a subprocess of this same
      # container's entrypoint) connection to gateway-controller's policy
      # xDS server -- matches controller.policy_server.tls.enabled in
      # configs/config.toml. Read by that file's [policy_engine.xds.tls] via
      # {{ env }} interpolation, not by docker-entrypoint.sh -- distinct
      # POLICY_ENGINE_XDS_CLIENT_* names because this leg presents a
      # different client identity than Envoy's XDS_CLIENT_* cert above.
      # Left unset, this would inherit XDS_TLS_ENABLED (=false above) --
      # explicit here because, unlike the other two compose files, this
      # profile wants the two legs to diverge: Envoy plaintext, policy-engine
      # mTLS (matching controller.policy_server.tls.enabled=true, which is
      # unconditional in configs/config.toml regardless of profile).
      - POLICY_ENGINE_XDS_TLS_ENABLED=true
      - POLICY_ENGINE_XDS_CLIENT_CERT_PATH=/etc/policy-engine/xds-certs/policy-engine-client.crt
      - POLICY_ENGINE_XDS_CLIENT_KEY_PATH=/etc/policy-engine/xds-certs/policy-engine-client.key
      - POLICY_ENGINE_XDS_CLIENT_CA_PATH=/etc/policy-engine/xds-certs/ca.crt
      - POLICY_ENGINE_XDS_CLIENT_TLS_ECDH_CURVES=X25519MLKEM768
    volumes:
      - ./configs/config.toml:/etc/policy-engine/config.toml:ro
      - ./configs/llm-pricing/model_prices.json:/etc/policy-engine/llm-pricing/model_prices.json:ro
      - ./resources/xds-certs:/etc/xds-certs:ro  # Envoy's xDS mTLS client cert/key + CA (env vars above)
      - ./resources/xds-certs:/etc/policy-engine/xds-certs:ro  # Policy-engine's xDS mTLS client cert/key + CA (POLICY_ENGINE_XDS_CLIENT_* env vars above)
    networks:
      - gateway-network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"     # Jaeger UI
      - "14268:14268"     # Jaeger collector HTTP
    networks:
      - gateway-network
    profiles: ["tracing"]

  otel-collector:
    image: otel/opentelemetry-collector:0.112.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - gateway-network
    depends_on:
      - jaeger
    profiles: ["tracing"]

  opensearch:
    image: opensearchproject/opensearch:3.4.0
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - gateway-network
    profiles: ["logging"]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    networks:
      - gateway-network
    depends_on:
      - opensearch
    profiles: ["logging"]

  fluent-bit:
    image: fluent/fluent-bit:4.2.1
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./observability/fluent-bit/add_component.lua:/fluent-bit/scripts/add_component.lua
    command: /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.conf
    networks:
      - gateway-network
    depends_on:
      - opensearch
    profiles: ["logging"]

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9092:9090"   # Prometheus UI (9092 to avoid conflict with gateway-controller)
    networks:
      - gateway-network
    profiles: ["metrics"]

  grafana:
    image: "grafana/grafana:latest"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/infrastructure-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"   # Grafana UI
    networks:
      - gateway-network
    depends_on:
      - prometheus
    profiles: ["metrics"]

volumes:
  controller-data:
    driver: local
  opensearch-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  gateway-network:
    driver: bridge
