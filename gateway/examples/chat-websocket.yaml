# This example proxies a WebSocket echo backend through the gateway.
# Start the testbench echo service (tests/framework: go run ./testbench/cmd/testbench),
# deploy this file, then connect with:
#   websocat ws://localhost:8080/chat/v1.0/rooms/general
# host.docker.internal lets the gateway-runtime container reach the testbench on the host.

apiVersion: gateway.api-platform.wso2.com/v1
kind: WebSocketApi
metadata:
  name: chat-websocket-v1.0
spec:
  displayName: Chat
  version: v1.0
  context: /chat/$version
  upstream:
    main:
      url: ws://host.docker.internal:3024/ws
  channels:
    - path: /rooms/general
