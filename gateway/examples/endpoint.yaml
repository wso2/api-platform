# A gateway-wide Endpoint: a backend any API on the gateway can route to
# through the dynamic-endpoint policy, with no API redeploy when it is added
# or changed. Create it with:
#
#   curl -u admin:<password> -H 'Content-Type: application/yaml' \
#     --data-binary @endpoint.yaml http://localhost:9090/api/management/v1/endpoints
#
# or: ap gateway apply -f endpoint.yaml
apiVersion: gateway.api-platform.wso2.com/v1
kind: Endpoint
metadata:
  # Lowercase letters and digits in hyphen-separated segments, 3-40 characters.
  name: tenant-a
  labels:
    # A policy's endpointSelector matches these to decide which Endpoints an
    # API may reach.
    team: orders
spec:
  displayName: Orders backend for tenant A
  # Prefixed to every request sent to this Endpoint. Omit for root.
  basePath: /v1
  upstreams:
    # Host and port only; the path comes from basePath.
    - url: http://orders-tenant-a:9080
      weight: 80
    - url: http://orders-tenant-a-standby:9080
      weight: 20
  timeout:
    connect: 2s
