# This example secures the chat WebSocket API with API key authentication.
# Policies only see the handshake; the data frames that follow are opaque to them.
# Policies under spec.policies apply to every channel; a channel's own
# policies list applies to that channel only.
#
# After deploying, create a key and connect with it:
#   curl -s -u admin:<password> -X POST \
#     http://localhost:9090/api/management/v1/websocket-apis/chat-websocket-secure-v1.0/api-keys \
#     -H 'Content-Type: application/json' -d '{"name":"my-key"}'
#   websocat ws://localhost:8080/chat-secure/v1.0/rooms/general -H "X-API-Key: <apiKey>"
# A handshake without the header is rejected before it reaches the backend.

apiVersion: gateway.api-platform.wso2.com/v1
kind: WebSocketApi
metadata:
  name: chat-websocket-secure-v1.0
spec:
  displayName: Chat Secure
  version: v1.0
  context: /chat-secure/$version
  upstream:
    main:
      url: ws://host.docker.internal:3024/ws
  channels:
    - path: /rooms/general
  policies:
    - name: api-key-auth
      version: v1
      params:
        key: X-API-Key
        in: header
