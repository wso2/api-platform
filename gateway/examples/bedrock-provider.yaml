# --------------------------------------------------------------------
# AWS Bedrock LLM Provider Configuration (native Converse API, API key auth)
#
# Uses the built-in `awsbedrock` template and points to the Region-specific
# Bedrock runtime endpoint. Bedrock accepts two upstream auth methods:
#   * an Amazon Bedrock API key, sent as `Authorization: Bearer <key>` (this file)
#   * AWS SigV4 through the `aws-authentication` policy (bedrock-provider-sigv4.yaml)
#
# Key lifetime: a short-term key lasts at most 12 hours and a long-term key until
# its configured expiry. The gateway sends the configured value verbatim and does
# not generate or refresh Bedrock keys, so for a long-running deployment prefer
# SigV4 with the default AWS credential chain. A long-term key works only in the
# Region it was generated in; keep the upstream URL in that Region.
#
# The model id is carried in the URL path (/model/{modelId}/converse), so the
# awsbedrock template extracts request/response model via location: pathParam
# (a RE2 capture group), for both /converse and /converse-stream. Send ARN model
# ids percent-encoded as a single path segment, as the AWS SDKs do.
#
# Auth: upstream.auth is the gateway -> Bedrock vendor auth. The header is
# Authorization and the value is sent verbatim, so the "Bearer " prefix MUST
# be included here (the portal auto-prepends it; raw YAML does not). Prefer a
# managed secret reference over a literal key. Proxies in front of this provider
# inherit this vendor auth automatically.
#
# See llm-provider-specs/awsbedrock/README.md for both auth methods and the
# features the built-in integration does not cover.
# --------------------------------------------------------------------

apiVersion: gateway.api-platform.wso2.com/v1
kind: LlmProvider
metadata:
  name: bedrock-provider
spec:
  displayName: AWS Bedrock Provider
  version: v1.0
  template: awsbedrock
  context: /bedrock
  upstream:
    # Match the region your key/model access is in. For the no-AWS mock
    # (bedrock-mock.py), use: http://host.docker.internal:9010
    url: https://bedrock-runtime.us-east-1.amazonaws.com
    auth:
      type: api-key
      header: Authorization
      # Bedrock expects:  Authorization: Bearer <key>  -- sent verbatim, so the
      # "Bearer " prefix MUST be included here. The mock ignores the value.
      value: Bearer REPLACE_WITH_BEDROCK_API_KEY
  policies:
    - name: api-key-auth
      version: v1
      paths:
        - path: /model/{modelId}/converse
          methods: [POST]
          params:
            key: Authorization
            in: header
            valuePrefix: "Bearer "
        - path: /model/{modelId}/converse-stream
          methods: [POST]
          params:
            key: Authorization
            in: header
            valuePrefix: "Bearer "
  accessControl:
    mode: deny_all
    exceptions:
      - path: /model/{modelId}/converse
        methods: [POST]
      - path: /model/{modelId}/converse-stream
        methods: [POST]

# The proxy in front of this provider authenticates over the internal loopback
# route with an API key issued for this LlmProvider. Set the issued value as the
# proxy's provider.auth.value.
